<style>
:root {
  --void: #010104;
  --space: #04050c;
  --glass: rgba(12, 16, 36, .78);

  --danger: #F74447;
  --good: #0CE430;
  --accent: #8ff3ff;
  --head: "Kelly Slab", Georgia, serif;
  --text: "Alegreya Sans", system-ui, sans-serif;
  --ui: "Exo 2", system-ui, sans-serif;
  --rune: "Noto Sans Runic", serif;
  color-scheme: dark;
}
body.in-realm { --edge: color-mix(in srgb, var(--accent) 32%, transparent); --edge-strong: color-mix(in srgb, var(--accent) 62%, transparent); --glass: color-mix(in srgb, var(--accent) 7%, rgba(6, 6, 12, .84)); --glass-strong: color-mix(in srgb, var(--accent) 6%, rgba(4, 4, 9, .95)); --cyan: color-mix(in srgb, var(--accent) 70%, #fff); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--fg); font-family: var(--text); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.card, .card *, #lore article, #lore article * { -webkit-user-select: text; user-select: text; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
button { font: inherit; color: inherit; }

#cosmos { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

#viewport { position: fixed; inset: 0; z-index: 1; cursor: grab; touch-action: none; opacity: 0; transition: opacity .7s ease; }
#viewport.shown { opacity: 1; }
#viewport.dragging { cursor: grabbing; }
#viewport.shake { animation: shake var(--dur, .6s) linear 1; }
@keyframes shake {
  10% { transform: translate(calc(var(--amp) * -1px), calc(var(--amp) * .6px)); }
  20% { transform: translate(calc(var(--amp) * .9px), calc(var(--amp) * -.8px)); }
  30% { transform: translate(calc(var(--amp) * -.7px), calc(var(--amp) * -.5px)); }
  45% { transform: translate(calc(var(--amp) * .6px), calc(var(--amp) * .7px)); }
  60% { transform: translate(calc(var(--amp) * -.4px), calc(var(--amp) * .3px)); }
  80% { transform: translate(calc(var(--amp) * .2px), calc(var(--amp) * -.2px)); }
}
.amb { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world canvas { position: absolute; left: 0; top: 0; pointer-events: none; }

.node {
  position: absolute;
  width: var(--s);
  height: var(--s);
  margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--rc);
  background: rgba(6, 9, 26, .9);
  color: var(--c);
  font: calc(var(--s) * .56) / 1 var(--rune);
  display: grid;
  place-items: center;
  cursor: pointer;
  outline: none;
  transition: background .4s ease, box-shadow .4s ease, transform .3s ease, color .3s ease, border-color .4s ease;
}
.node::after { content: ""; position: absolute; pointer-events: none; border-radius: 50%; opacity: 0; transition: opacity .5s ease; }
.node.lit::after { opacity: 1; }
.node:not(.lit)::after { animation: none !important; }
.node.locked { background: rgba(4, 6, 16, .55); border-color: rgba(220, 240, 255, .26); border-width: 1px; color: rgba(230, 245, 255, .36); transform: scale(.82); }
.node.open { box-shadow: 0 0 6px var(--rc); animation: breathe 2.8s ease-in-out infinite; }
.node.lit { background: color-mix(in srgb, var(--c) 62%, #05060f); border-color: color-mix(in srgb, var(--rc) 50%, #fff); color: #fff; text-shadow: 0 0 6px #fff; box-shadow: 0 0 8px var(--c), 0 0 22px var(--c); }
.node.flash { animation: flash .9s ease-out 1; }
#trans { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 12; pointer-events: none; }
.world { transition: filter .4s linear; }
.world.igniting .node { animation: appear .8s ease-out both; animation-delay: var(--d); }

.realm-bra .node { background: radial-gradient(circle at 45% 40%, #2c1d17, #0b0604); border-color: #5c3a2a; color: #9a6a50; }
.realm-bra .node.open { border-color: #ff6b2c; color: #ffb070; box-shadow: 0 0 6px #ff6b2c, inset 0 0 6px rgba(255, 90, 20, .5); animation: smolder 2.2s ease-in-out infinite; }
.realm-bra .node.lit { background: radial-gradient(circle at 45% 40%, #fff6c2 0, #ffb53b 20%, #e2470f 45%, #6a1404 75%, #1c0402 100%); border-color: #ffd27a; color: #3a0800; text-shadow: 0 0 5px #fff1b0; box-shadow: 0 0 10px #ff6b2c, 0 0 30px #ff3d00; animation: coal 2.6s ease-in-out infinite alternate; }
.realm-bra .node::after { inset: -55%; background: repeating-conic-gradient(from 0deg, rgba(255, 170, 40, .95) 0 7deg, rgba(255, 70, 0, .5) 7deg 11deg, transparent 11deg 24deg); -webkit-mask: radial-gradient(circle, transparent 40%, #000 47%, transparent 72%); mask: radial-gradient(circle, transparent 40%, #000 47%, transparent 72%); filter: blur(1.4px); animation: spin 6s linear infinite, flicker 2.4s ease-in-out infinite; }
@keyframes smolder { 50% { box-shadow: 0 0 12px #ff6b2c, inset 0 0 10px rgba(255, 90, 20, .8); } }
@keyframes coal { from { filter: brightness(.88) saturate(1.1); } to { filter: brightness(1.25) saturate(1.3); } }

.realm-is .node { background: radial-gradient(circle at 40% 35%, #23394a, #08121c); border-color: rgba(190, 235, 255, .45); color: #a8dcf0; }
.realm-is .node.locked { background: rgba(20, 34, 46, .6); border-color: rgba(200, 235, 255, .22); color: rgba(200, 235, 255, .35); }
.realm-is .node.open { border-color: #bff3ff; box-shadow: 0 0 8px #8fe3ff, inset 0 0 8px rgba(200, 245, 255, .45); }
.realm-is .node.lit { background: linear-gradient(140deg, #ffffff 0, #dff8ff 28%, #8fe3ff 58%, #2c78b8 100%); border-color: #fff; color: #0b2c48; text-shadow: 0 0 4px #fff; box-shadow: 0 0 10px #8fe3ff, 0 0 26px #4fb8ff, inset 0 0 8px #fff; }
.realm-is .node::after { inset: -45%; background: repeating-conic-gradient(from 0deg, rgba(235, 252, 255, .95) 0 3deg, transparent 3deg 60deg); -webkit-mask: radial-gradient(circle, transparent 42%, #000 46%, transparent 72%); mask: radial-gradient(circle, transparent 42%, #000 46%, transparent 72%); animation: spin 14s linear infinite; }

.realm-vind .node { background: radial-gradient(circle at 40% 35%, #283048, #0b0e18); border-color: rgba(210, 220, 255, .4); color: #b8c4ea; }
.realm-vind .node.open { box-shadow: 0 0 8px #d2dcff; }
.realm-vind .node.lit { background: radial-gradient(circle, #ffffff 0, #e6ecff 40%, #7c8ac4 100%); border-color: #fff; color: #1a2240; text-shadow: 0 0 4px #fff; box-shadow: 0 0 12px #d2dcff, 0 0 26px #9aa8ff; }
.realm-vind .node::after { inset: -40%; background: conic-gradient(from 0deg, transparent 0 10%, rgba(255, 255, 255, .85) 24%, transparent 26% 43%, rgba(255, 255, 255, .85) 57%, transparent 59% 76%, rgba(255, 255, 255, .85) 90%, transparent 92%); -webkit-mask: radial-gradient(circle, transparent 46%, #000 50%, transparent 70%); mask: radial-gradient(circle, transparent 46%, #000 50%, transparent 70%); animation: spin 3s linear infinite; }

.realm-elding .node { background: radial-gradient(circle at 40% 35%, #2e2a14, #0c0b06); border-color: rgba(255, 225, 74, .4); color: #c9b45a; }
.realm-elding .node.open { box-shadow: 0 0 8px #ffe14a; }
.realm-elding .node.lit { background: radial-gradient(circle, #fffef0 0, #fff27a 30%, #ffc800 60%, #7a5a00 100%); border-color: #fffbe0; color: #3a2a00; text-shadow: 0 0 4px #fff; animation: zap 3.2s ease-in-out infinite; }
.realm-elding .node::after { inset: -50%; background: repeating-conic-gradient(from 10deg, rgba(255, 250, 190, .95) 0 2deg, transparent 2deg 47deg); -webkit-mask: radial-gradient(circle, transparent 40%, #000 44%, transparent 74%); mask: radial-gradient(circle, transparent 40%, #000 44%, transparent 74%); animation: spin 4s linear infinite, arc 2.2s ease-in-out infinite; }
@keyframes zap { 0%, 100% { box-shadow: 0 0 10px #ffe14a, 0 0 26px #ffd000; } 50% { box-shadow: 0 0 16px #fff6a0, 0 0 36px #ffe14a; } }
@keyframes arc { 50% { opacity: .55; } }

.realm-and .node { background: radial-gradient(circle at 40% 35%, #16302c, #04100e); border-color: rgba(79, 240, 200, .38); color: #6cc8b2; }
.realm-and .node.open { box-shadow: 0 0 8px #4ff0c8; }
.realm-and .node.lit { background: radial-gradient(circle, rgba(230, 255, 248, .95) 0, rgba(79, 240, 200, .75) 45%, rgba(10, 70, 60, .45) 100%); border-color: rgba(220, 255, 245, .9); color: #fff; text-shadow: 0 0 8px #4ff0c8; box-shadow: 0 0 12px #4ff0c8, 0 0 30px rgba(79, 240, 200, .6); animation: haunt 3.4s ease-in-out infinite; }
.realm-and .node::after { inset: -30%; border: 1px solid rgba(160, 255, 230, .6); box-shadow: 0 0 10px rgba(79, 240, 200, .6); animation: ripple 2.6s ease-out infinite; }

.realm-vag .node { background: radial-gradient(circle at 40% 35%, #10304c, #030c16); border-color: rgba(47, 166, 240, .45); color: #6aaee0; }
.realm-vag .node.open { box-shadow: 0 0 8px #2fa6f0; }
.realm-vag .node.lit { background: linear-gradient(180deg, #e6fbff 0, #7fd2ff 28%, #2fa6f0 55%, #0a3a6a 100%); border-color: #d6f4ff; color: #04223c; text-shadow: 0 0 4px #fff; box-shadow: 0 0 10px #2fa6f0, 0 0 26px #1a7ad0; }
.realm-vag .node::after { inset: -12%; border: 2px solid rgba(170, 230, 255, .8); animation: ripple 2s ease-out infinite; }
@keyframes ripple { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }

.realm-jord .node { background: radial-gradient(circle at 40% 35%, #3a3628, #12100a); border-color: rgba(155, 197, 61, .45); color: #a7b56a; }
.realm-jord .node.open { box-shadow: 0 0 8px #9bc53d; }
.realm-jord .node.lit { background: radial-gradient(circle at 40% 35%, #fff2b0 0, #ffc23a 25%, #c07a12 50%, #4a3a12 80%, #1c1a0a 100%); border-color: #d8f08a; color: #2a1a00; text-shadow: 0 0 4px #ffe8a0; box-shadow: 0 0 10px #ffb43a, 0 0 24px #9bc53d; }
.realm-jord .node::after { inset: -30%; background: repeating-conic-gradient(from 0deg, rgba(155, 197, 61, .9) 0 10deg, transparent 10deg 45deg); -webkit-mask: radial-gradient(circle, transparent 54%, #000 58%, transparent 70%); mask: radial-gradient(circle, transparent 54%, #000 58%, transparent 70%); }

.realm-morkai .node { background: linear-gradient(180deg, #3a2328, #170b0f); border-color: #d9c8b4; color: #f3e8d6; box-shadow: 0 2px 6px rgba(0, 0, 0, .8); }
.realm-morkai .node.open { box-shadow: 0 0 8px #e5485f, 0 2px 6px rgba(0, 0, 0, .8); }
.realm-morkai .node.locked { background: #140a0d; border-color: rgba(217, 200, 180, .35); color: rgba(243, 232, 214, .4); }
.realm-morkai .node.lit { background: radial-gradient(circle at 50% 40%, #e8d8c0 0, #b59a80 35%, #6a0d18 70%, #2a0308 100%); border-color: #ff6b82; color: #3a0008; text-shadow: 0 0 6px #ff6b82; box-shadow: 0 0 10px #e5485f, 0 0 30px #a01a30; }
.realm-morkai .node::after { inset: -40%; background: radial-gradient(circle, transparent 45%, rgba(200, 20, 40, .55) 55%, transparent 72%); filter: blur(2px); animation: pulse-red 2.4s ease-in-out infinite; }
@keyframes pulse-red { 50% { transform: scale(1.15); opacity: .5; } }

.realm-void .node { border: 0; background: transparent; color: transparent; }
.realm-void .node::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--c) 28%, transparent 62%); transform: scale(.5); opacity: .7; transition: transform .4s ease, opacity .4s ease; }
.realm-void .node.locked::before { transform: scale(.5); opacity: .6; }
.realm-void .node.open::before { transform: scale(.6); opacity: .95; }
.realm-void .node.open { box-shadow: none; animation: twinkle 4s ease-in-out infinite; }
.realm-void .node.lit { background: transparent; box-shadow: none; color: #fff; text-shadow: 0 0 8px #fff, 0 0 18px var(--c); }
.realm-void .node.lit::before { transform: scale(1.25); opacity: 1; background: radial-gradient(circle, #fff 0, #fff 14%, var(--c) 34%, transparent 64%); }
.realm-void .node::after { inset: -70%; background: conic-gradient(from 0deg, transparent 0 23%, rgba(220, 214, 255, .7) 24% 26%, transparent 27% 48%, rgba(220, 214, 255, .7) 49% 51%, transparent 52% 73%, rgba(220, 214, 255, .7) 74% 76%, transparent 77% 98%, rgba(220, 214, 255, .7) 99%); -webkit-mask: radial-gradient(circle, #000 0, transparent 60%); mask: radial-gradient(circle, #000 0, transparent 60%); animation: spin 9s linear infinite; }
@keyframes twinkle { 50% { filter: brightness(1.25); } }

.realm-elgr .node { background: linear-gradient(180deg, #e9dcc2, #a88f68); border-color: #6e5638; color: #4a3218; box-shadow: 0 2px 5px rgba(0, 0, 0, .7); }
.realm-elgr .node.locked { background: linear-gradient(180deg, #8a7a60, #4a3c28); border-color: rgba(40, 26, 12, .7); color: rgba(40, 26, 12, .7); }
.realm-elgr .node.open { box-shadow: 0 0 8px #ffd27a, 0 2px 5px rgba(0, 0, 0, .7); }
.realm-elgr .node.lit { background: radial-gradient(circle at 50% 40%, #fff6d8 0, #ffc35a 35%, #d0602a 70%, #6a1a20 100%); border-color: #fff0c0; color: #4a1400; text-shadow: 0 0 4px #fff; box-shadow: 0 0 10px #ffb84a, 0 0 26px #ff7ab6; }
.realm-elgr .node::after { left: 30%; right: 30%; top: -75%; height: 80%; border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%; background: radial-gradient(ellipse at 50% 80%, #fff8d0 0, #ffcf5a 30%, rgba(255, 110, 30, .8) 60%, transparent 75%); filter: blur(.6px); transform-origin: 50% 100%; animation: candle 1.6s ease-in-out infinite alternate; }
@keyframes candle { from { transform: scaleY(.9) rotate(-3deg); } to { transform: scaleY(1.12) rotate(3deg); } }

.seal-btn { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; }
.seal-btn:hover, .seal-btn:focus-visible { box-shadow: 0 0 0 2px var(--c), 0 0 24px var(--c); outline: none; }

.portal { position: absolute; width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--c) 55%, #000) 0%, rgba(2, 2, 6, .95) 48%, transparent 70%); transition: transform .3s ease; }
.portal::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 18%, var(--c) 32%, transparent 46% 66%, var(--c) 82%, transparent 96%); -webkit-mask: radial-gradient(circle, transparent 56%, #000 60%, #000 76%, transparent 80%); mask: radial-gradient(circle, transparent 56%, #000 60%, #000 76%, transparent 80%); animation: spin 7s linear infinite; filter: drop-shadow(0 0 8px var(--c)); }
.portal::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); box-shadow: inset 0 0 18px color-mix(in srgb, var(--c) 50%, transparent); animation: spin 11s linear infinite reverse; }
.portal .ring { position: absolute; inset: -9px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p, 0) * 360deg), rgba(255, 255, 255, .1) 0); -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%, #000 70%, transparent 72%); mask: radial-gradient(circle, transparent 64%, #000 66%, #000 70%, transparent 72%); filter: drop-shadow(0 0 4px var(--c)); }
.portal img { width: 44px; height: 44px; position: relative; filter: drop-shadow(0 0 8px var(--c)); }
.portal:hover, .portal:focus-visible { transform: scale(1.12); outline: none; }
.portal.sleeping { filter: saturate(.3) brightness(.6); }
.portal.sleeping::before, .portal.sleeping::after { animation: none; opacity: .35; }
.portal.back { width: 96px; height: 96px; margin: -48px 0 0 -48px; }
.portal.back img { width: 52px; height: 52px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { box-shadow: 0 0 12px var(--rc), 0 0 2px var(--rc); } }
@keyframes flash { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.5); box-shadow: 0 0 18px var(--c); } }
@keyframes appear { from { opacity: 0; transform: scale(.2); } }

.hud {
  position: fixed;
  z-index: 5;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  opacity: 0;
  transition: opacity .6s ease .3s;
  font-family: var(--ui);
}
.hud.shown { opacity: 1; }
.hud > * { pointer-events: auto; }
.brand { font-family: var(--head); font-size: 24px; line-height: 1; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent); margin-right: auto; letter-spacing: .02em; transition: color .6s ease; }
.brand small { display: block; font-family: var(--ui); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); text-shadow: none; margin-top: 6px; }
.counter { font-size: 14px; color: var(--cyan); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px color-mix(in srgb, var(--cyan) 50%, transparent); padding-inline: 4px; }
.btn {
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1;
  padding: 9px 13px;
  border-radius: 10px;
  border: 1px solid var(--edge);
  background: var(--glass);
  color: var(--fg);
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: border-color .2s ease, box-shadow .2s ease, background .6s ease;
}
.btn:hover, .btn:focus-visible { border-color: var(--edge-strong); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 30%, transparent); outline: none; }
.btn.danger { color: #ff8b8d; border-color: rgba(247, 68, 71, .4); }
.btn.danger:hover { border-color: var(--danger); box-shadow: 0 0 14px rgba(247, 68, 71, .3); }
.btn.go { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: var(--edge-strong); color: #fff; }
.btn[aria-expanded="true"] { border-color: var(--edge-strong); background: color-mix(in srgb, var(--accent) 16%, var(--glass)); }

.paths {
  position: fixed;
  z-index: 6;
  top: calc(66px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: min(330px, calc(100% - 32px));
  max-height: calc(100% - 100px);
  overflow-y: auto;
  display: grid;
  gap: 3px;
  padding: 10px;
  border-radius: 14px;
  background: var(--glass-strong);
  border: 1px solid var(--edge);
  backdrop-filter: blur(10px);
  font-family: var(--ui);
  animation: drop .3s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
.paths h4 { margin: 8px 8px 4px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 4px; }
.chip { flex: 1; display: flex; align-items: center; gap: 9px; font-size: 14px; padding: 6px 10px 6px 6px; border-radius: 10px; background: transparent; border: 1px solid transparent; cursor: pointer; text-align: left; transition: background .2s ease, border-color .2s ease; }
.chip:hover, .chip:focus-visible { background: color-mix(in srgb, var(--c) 14%, transparent); border-color: color-mix(in srgb, var(--c) 40%, transparent); outline: none; }
.chip img { width: 26px; height: 26px; filter: drop-shadow(0 0 5px var(--c)); flex: none; }
.chip b { font-weight: 600; color: var(--c); font-variant-numeric: tabular-nums; margin-left: auto; font-size: 13px; }
.chip.sleeping { opacity: .55; }
.info { width: 34px; height: 34px; flex: none; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); font-family: var(--rune); font-size: 16px; cursor: pointer; }
.info:hover, .info:focus-visible { color: var(--c); border-color: color-mix(in srgb, var(--c) 40%, transparent); outline: none; }

.card {
  position: fixed;
  z-index: 6;
  top: calc(76px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 340px;
  max-height: calc(100% - 160px);
  overflow-y: auto;
  padding: 20px 20px 18px;
  border-radius: 16px;

  position: fixed;

const iconUrls = new Map();
function iconUrl(p, sleeping) { const k = p.key + sleeping; if (!iconUrls.has(k)) iconUrls.set(k, RUNESTONE.url(p.icon, p.color, { sleeping, px: 96 })); return iconUrls.get(k); }
function loadImage(src) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
function strokeGlyph(g, name, x, y, scale, color, width, alpha) {
  g.save(); g.translate(x, y); g.scale(scale, scale); g.translate(-50, -50);
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = color; g.globalAlpha = alpha;
  for (const q of RUNESTONE.glyph(name)) { g.lineWidth = q.w * width; g.stroke(new Path2D(q.d)); }
  g.restore();
}

таются в ней, как трусы, бросившие весло.","Этт Ваг|Морские девы":"Из пены выходят три морские девы с волосами из водорослей и хлещут врагов, как шторм хлещет борт.","Этт Ваг|Подводное течение":"Невидимое течение тянет врагов к ваг-годи, как тянет на глубину неосторожного пловца.","Этт Ваг|Котёл Ранны":"Ваг-годи ставит котёл из подводного чертога Ранны, где пируют храбро утонувшие: братьям он даёт силу, а врагов обваривает.","Этт Ваг|Гнев моря":"Море поднимается стеной и смывает врагов, как смывает с берега рыбацкие лодки.","Этт Ваг|Водоворот":"Ваг-годи раскручивает воду воронкой, и враги идут в неё, как щепки в омут.","Этт Ваг|Щупальца бездны":"Из земли вырываются щупальца тех, кто живёт на дне, куда не доходит свет.","Этт Ваг|Приливная броня":"Вода ложится на ваг-годи бронёй, а когда её разбивают, она уходит волной во все стороны.","Этт Ваг|Отлив Ранны":"Ранна забирает воду к себе на дно, враги вязнут в иле, а потом море возвращается, как всегда возвращается за своей долей.","Этт Ваг|Чёрная вода":"Из-под земли поднимается чёрная вода глубин, и враги тонут в ней, стоя на суше.","Этт Ваг|Гребни Морского Волка":"Морской Волк бежит по гребням волн перед бурей, и три гребня уносят врагов, как прибой уносит щепки.","Этт Ваг|Острога Ранны":"Ваг-годи мечет острогу, которой Ранна бьёт рыбу на дне, и она пробивает строй, как кит пробивает лёд.","Этт Ваг|Хватка Хавгуфы":"Остров, которого вчера не было, моргает, и из-под ног врага поднимается пасть Хавгуфы.","Этт Ваг|Девятая волна":"Моряки Фенриса знают: девятая волна самая страшная. Ваг-годи посылает все девять.","Этт Ваг|Кольцо морского змея":"Ваг-годи зовёт морского змея, и тот смыкает кольцо вокруг поля так, что врагам внутри некуда бежать.","Этт Ваг|Золото Ранны":"Со дна поднимается золото, которым кормчие веками платили Ранне за место за её столом, и каждый удар братьев лечит их раны.","Этт Ваг|Драккар утонувших":"Из волн выходит драккар тех, кто утонул, не бросив весла, и несёт годи с братьями сквозь врагов, как сквозь шторм.","Этт Ваг|Слёзы Ранны":"Ранна плачет над полем солёным ливнем по тем, кто не дошёл до её стола, и её слёзы ослабляют врагов.","Этт Ваг|Единство с Ваг":"Ваг-годи растворяется в воде своего этта и становится духом моря, текучим и неуловимым.","Этт Ваг|Гнев Океана":"Океан Фенриса поднимается валом и затапливает всё, а из воды поднимается левиафан.","Этт Ваг|Гнев кракена":"Кракен пробуждается под землёй, и его щупальца вырываются наружу, круша всё вокруг.","Этт Ваг|Девять морских дев":"Девять морских дев поднимаются исполинскими волнами вокруг ваг-годи и одна за другой разбиваются о врагов.","Этт Ваг|Утонувший мир":"Поле боя уходит на дно моря: братья плывут, как рыбы, а враги задыхаются без воздуха.","Этт Ваг|Пробуждение Трёхглавого":"Трёхглавый змей ползёт через поле, и каждая из трёх голов хочет съесть врага сама.","Этт Бра|Искра Бра":"Ред-годи высекает искру из пальцев, как кремень из огнива, и враг вспыхивает.","Этт Бра|Огненный шар":"Ред-годи бросает шар огня, тяжёлого и дымного, как пламя смоляного костра.","Этт Бра|Раскалённый удар":"Рука ред-годи раскаляется, как железо в горне, и удар её жжёт до кости.","Этт Бра|Внутренний жар":"Огонь Бра разгорается в груди ред-годи, и ни холод, ни пламя ему не страшны.","Этт Бра|Пламенный клинок":"Ред-годи проводит рукой по лезвию, и оружие вспыхивает, как будто его только вынули из горна.","Этт Бра|Дымный занавес":"Ред-годи выпускает дым горящего торфа, густой и едкий, и враги слепнут в нём.","Этт Бра|Огненное копьё":"Ред-годи мечет копьё из пламени, и оно пробивает врага насквозь.","Этт Бра|Огненный снаряд":"Ред-годи сжимает пламя в ладони и бросает его во врага.","Этт Бра|Расплавленная лужа":"Ред-годи проливает на землю расплавленный металл, и всякий, кто ступит в него, сгорит.","Этт Бра|Кузнечные клещи":"Раскалённые клещи кузни хватают врага, как кузнец хватает заготовку.","Этт Бра|Раскалённые заклёпки":"Ред-годи бросает раскалённые заклёпки, что ещё не остыли на наковальне.","Этт Бра|Окалина":"Окалина слетает с горячего металла в лицо врагу, ослепляя и обжигая.","Этт Бра|Тёплый очаг":"Ред-годи держит в ладони огонь очага, и в самую лютую стужу Фенриса рядом с ним тепло.","Этт Бра|Удар молотобойца":"Удар ред-годи выбивает сноп искр, как молот выбивает их из раскалённой стали.","Этт Бра|Клеймо Кеназ":"Ред-годи выжигает на враге руну Кеназ, и с каждым ударом клеймо горит сильнее.","Этт Бра|Цепь горна":"Раскалённая цепь стягивает врагов, как кузнец стягивает железные полосы.","Этт Бра|Огненная тропа":"Ред-годи несётся вперёд, и за ним горит земля, как за упавшей звездой.","Этт Бра|Пепельный вихрь":"Вокруг ред-годи кружит горячий пепел пожарищ, и враги задыхаются в нём.","Этт Бра|Искра":"Годи щёлкает пальцами, высекая искру, которая поджигает врага.","Этт Бра|Пожирающее пламя":"Огонь Бра голоден: он перескакивает с врага на врага и не гаснет, пока не насытится.","Этт Бра|Удар наковальни":"С неба падает раскалённая наковальня, на которой куют оружие для ред-годи.","Этт Бра|Взрыв":"Огонь Бра вырывается из ред-годи разом, как пламя из горна, когда открывают заслонку.","Этт Бра|Дыхание дракона":"Ред-годи вдыхает жар горна и выпускает его, как Пламенный дракон, что спит в жерле вулкана.","Этт Бра|Огненный защитник":"Пламя Бра встаёт стеной вокруг ред-годи и сжигает обидчиков.","Этт Бра|Огненная секира":"Ред-годи рубит секирой из пламени, и за её лезвием остаётся огненная дуга.","Этт Бра|Саламандра":"Ред-годи выпускает саламандру, огненную ящерицу из горна, и она бежит, поджигая всё на пути.","Этт Бра|Плавка брони":"Жар Бра плавит доспех врага, как воск, и он остаётся почти голым перед ударами.","Этт Бра|Литые клинки":"Ред-годи отливает клинки из огня, и они кружат вокруг него, ожидая врага.","Этт Бра|Огненный дождь":"Ред-годи раскрывает небо, и Бра проливается вниз раскалёнными искрами.","Этт Бра|Гнев Бра":"Огонь Бра расходится от ред-годи кольцом, как пламя от брошенного в костёр жира.","Этт Бра|Зов Огненного Волка":"Из пламени встаёт Огненный Волк, что горит и не сгорает, и бьётся рядом с ред-годи, пока у того есть силы держаться.","Этт Бра|Выжигание":"Огонь Бра выжигает из братьев хворь и яд, как кузнец выжигает примеси из руды.","Этт Бра|Сан страйк":"Ред-годи призывает луч солнца, что бьёт в землю, как молот в наковальню.","Этт Бра|Горнило":"Ред-годи ставит горн, и рядом с ним оружие братьев горит, а удары становятся тяжелее.","Этт Бра|Кольцо ярла":"Ред-годи бросает раскалённое кольцо, какие ярлы дарят верным людям, и из него рождаются новые, чтобы взорваться.","Этт Бра|Горящий драккар":"Пылающий погребальный драккар несётся по суше и взрывается, забирая с собой врагов.","Этт Бра|Пора Огня":"Ред-годи зовёт Пору Огня, когда Волчье Око подходит близко и острова горят, и в этом пламени раны не затягиваются.","Этт Бра|Огненный змей":"Огненный змей-дракон проносится по полю, оставляя за собой пожар.","Этт Бра|Клинок Огнедышащего":"Огнедышащий рычит в жерле, и ред-годи рассекает землю клинком из его лавы, не разбирая своих и чужих.","Этт Бра|Молот Железных Мастеров":"Молот Железных Мастеров трижды бьёт по огненной руне, и каждая волна жарче предыдущей, как жар в горне под мехами.","Этт Бра|Взгляд Волчьего Ока":"Волчье Око на миг всматривается в поле пристальнее, чем следует, и там, куда упал его взгляд, горит земля.","Этт Бра|Кровь горна":"Огонь горна вливается в братьев: оружие их горит, а каждый удар лечит.","Этт Бра|Единство с Бра":"Ред-годи становится огненным аватаром с крыльями из пламени, и всё вокруг него горит.","Этт Бра|Пробуждение Огнедышащего":"Огнедышащий просыпается: небо краснеет от пепла, из жерла летят камни, а из горна вырывается Пламенный дракон.","Этт Бра|Метеор":"С неба падает пылающий метеорит и катится вперёд, сжигая всё на пути.","Этт Бра|Неугасимый Уголь":"Ред-годи раздувает искру от Неугасимого Угля, что горит с тех пор, как люди пришли на Фенрис: свои в его свете не горят, а чужие вспыхивают.","Этт Бра|Последний горн":"Из земли поднимается кузня над веной Железного Волка, её молоты бьют по полю, а горн плюётся раскалёнными слитками.","Этт Бра|Гнев Волчьего Ока":"Когда Волчье Око злится, по Фенрису бежит пылающий волк, и всё на его пути горит, как в Пору Огня.","Этт Винд|Порыв Винд":"Винд-годи выдыхает, и ветер Асахейма бьёт вперёд, как ладонь великана.","Этт Винд|Воздушный клинок":"Винд-годи рассекает рукой воздух, и серп ветра летит, острее любой стали.","Этт Винд|Ветряной шаг":"Ветер подхватывает винд-годи под ноги, и он ступает по воздуху, как по ступени.","Этт Винд|Лёгкость пера":"Винд-годи становится лёгким, как перо полярной совы, и земля мягко принимает его.","Этт Винд|Щит из перьев":"Вихрь перьев окружает винд-годи, и стрелы вязнут в нём, как в метели.","Этт Винд|Дыхание бури":"Винд-годи дышит бурей, и враги летят прочь вместе со своими стрелами.","Этт Винд|Удушье":"Винд-годи отнимает у врага воздух, и тот хватает ртом пустоту, как рыба на льду.","Этт Винд|Магическая стрела":"Ветер несёт стрелу винд-годи, и она не знает промаха, пока не найдёт свою цель.","Этт Винд|Поток вверх":"Восходящий поток, что держит орлов над фьордами, поднимает винд-годи к небу.","Этт Винд|Воздушный капкан":"Ветер свивается в кокон вокруг врага, и тот замирает, как пойманная в паутину муха.","Этт Винд|Слух ветра":"Ветер приносит винд-годи шаги каждого, кто крадётся рядом, и ничто не укроется от его слуха.","Этт Винд|Пыльный вихорь":"Маленький смерч пыли кружит врагов, пока те не забудут, где небо, а где земля.","Этт Винд|Попутный ветер":"Винд-годи зовёт попутный ветер, тот, что гонит драккары к чужим берегам, и братья летят вперёд.","Этт Винд|Перья-ножи":"Перья винд-годи остры, как сталь, и он мечет их, как охотник мечет ножи.","Этт Винд|Воздушный молот":"Воздух сжимается над врагом в молот и бьёт его сверху, как удар грома без звука.","Этт Винд|Воздушный аркан":"Петля ветра ловит врага, как аркан ловит оленя, и бросает его за спину винд-годи.","Этт Винд|Отскок":"Ветер толкает винд-годи прочь из схватки, и враги рядом валятся с ног.","Этт Винд|Режущий бриз":"Вокруг винд-годи дует бриз с острыми краями, и каждый, кто подошёл близко, истекает кровью.","Этт Винд|Крылья Винд":"За спиной винд-годи раскрываются крылья из ветра, и он летит над полем, как сокол.","Этт Винд|Шквал":"От винд-годи разлетается кольцо воздушных клинков, и шквал режет всех вокруг.","Этт Винд|Ураганное пике":"Винд-годи взмывает вверх и падает на врагов, как сокол на добычу, с громом удара.","Этт Винд|Рассеивание":"Ветер Винд сдувает щиты, чары и тени, и враг остаётся открытым, как поле в бурю.","Этт Винд|Телекинез":"Винд-годи поднимает врага ветром и бросает о землю так, что дрожат все вокруг.","Этт Винд|Секира Шквала":"Две секиры из ветра кружат вокруг винд-годи и рубят всякого, кто подойдёт.","Этт Винд|Кольцо вихрей":"Шесть смерчей встают кольцом вокруг винд-годи, и ни один враг не вырвется из этого хоровода.","Этт Винд|Буревестник":"Над винд-годи кружит птица бури и бросается на всякого, кто поднимет на него руку.","Этт Винд|Ветряной столп":"Столб ветра поднимает врагов в воздух, и они висят в нём, беспомощные, как сухие листья.","Этт Винд|Клыки Торнаруса":"Годи обрушивает на врагов небольшой торнадо, который закручивает всё на пути.","Этт Винд|Гнев Винд":"Ветер Винд сбивает всех вокруг с ног, как буря валит сосны на склоне.","Этт Винд|Копьё бури":"Винд-годи мечет копьё из сжатой бури, и оно пробивает всё на тридцать шагов.","Этт Винд|Вихрь перьев":"Перья-ножи кружат вокруг винд-годи и режут всякого, кто окажется рядом.","Этт Винд|Бич Бури":"Винд-годи хлещет бичом из ветра и затягивает врагов, как буря затягивает лодки в водоворот.","Этт Винд|Крик грифона":"Над скалами Асахейма бьёт крыльями грифон, и поднятый им ураган сносит врагов, как сухую траву.","Этт Винд|Небесные копья":"С неба падают копья из ветра, и скальды говорят, что их бросают Небесные Воины, выбирая, кому сегодня не жить.","Этт Винд|Безветрие":"Винд-годи останавливает ветер, и в мёртвой тишине стрелы падают, а враги задыхаются.","Этт Винд|Крылья Бури":"Винд-годи сливается с ветром, и тело на миг обретает лёгкость крыльев перелётной птицы.","Этт Винд|Отбрасывание":"Годи выпускает мощную звуковую волну, которая откидывает всех на большое расстояние.","Этт Винд|Око бури":"Вокруг винд-годи ревёт ураган, а внутри, в оке бури, братья стоят в тишине.","Этт Винд|Орёл Винд":"Исполинский орёл хватает врага когтями, поднимает к облакам и роняет на скалы.","Этт Винд|Колесо Бури":"По земле катится колесо вихря и подбрасывает в небо всех, кто встанет на пути.","Этт Винд|Бег Буревого Волка":"Винд-годи мчится на Буревом Волке, что воет в ледяном ветре, и ветер не поспевает за ними.","Этт Винд|Четыре ветра Фенриса":"Винд-годи зовёт четыре ветра Фенриса, с ледников, с моря, с вулканов и с пустошей, и они сжимают врагов.","Этт Винд|Паруса Морского Волка":"Морской Волк дует в невидимые паруса, как дует в паруса драккара, что ведёт сквозь шторм, и братья мчатся быстрее бури.","Этт Винд|Единство с Винд":"Винд-годи растворяется в ветре своего этта и становится вихрем с лезвиями из перьев.","Этт Винд|Буря Тысячи Перьев":"Поднимается циклон из тысячи перьев-лезвий и обрушивает на землю всех, кого поднял.","Этт Винд|Пробуждение Буревого дракона":"Летит Буревой дракон, и ветер бежит за ним, как пёс за хозяином, разбрасывая врагов по всему полю.","Этт Винд|Северное сияние":"Винд-годи стелет по ветру полосу сияния, что горит над Фенрисом в долгую ночь: братья мчатся по ней, а враги падают.","Этт Винд|Тишина перед бурей":"Всё замирает, как перед ударом бури, а потом ветер взрывается и бросает врагов в небо.","Этт Ис|Дыхание холода":"Годи выдыхает вперед поток воздуха, который покрывает врага ледяной коркой.","Этт Ис|Морозный укол":"Фрост-годи вонзает в врага иглу льда, и холод медленно ползёт по его жилам.","Этт Ис|Скользкий путь":"Земля под врагами становится льдом озера Фенриса, и они скользят, не в силах остановиться.","Этт Ис|Ледяная корка":"Лёд ложится на фрост-годи тонкой коркой, и руки бьющих его немеют от холода.","Этт Ис|Ледяные шипы":"Фрост-годи ведёт рукой над землёй, и из инея вырастают ледяные иглы.","Этт Ис|Ледяной клык":"Из льда вырастает клык, длинный, как у Белоклыка, и пробивает всех, кто стоит на его пути.","Этт Ис|Иней Скадды":"Там, где прошла Белая Волчица, на земле остаётся иней, и враги мёрзнут до костей.","Этт Ис|Заморозка":"Фрост-годи сковывает врага льдом, и тот стоит, как идол из инея.","Этт Ис|Холодный снаряд":"Фрост-годи бросает сосульку, и холод от неё сковывает врага.","Этт Ис|Обморожение":"Лёд заковывает врага, жжёт его холодом и не даёт поднять оружие.","Этт Ис|Ледяная стена":"Перед фрост-годи встаёт стена из льда ледников, толстая и прозрачная, как вечность.","Этт Ис|Иней на оружии":"Иней ложится на оружие фрост-годи, и каждый его удар несёт холод зимы.","Этт Ис|Ледяной капкан":"Под ногами врага смыкается капкан из ледяных шипов, как смыкается полынья.","Этт Ис|Снежный ком":"Снежный ком катится с горы и растёт, сбивая всех, кто встанет на пути.","Этт Ис|Морозный пар":"Фрост-годи выдыхает морозный пар, и рука врага немеет и медлит.","Этт Ис|Ледяные коньки":"Под ногами фрост-годи вода и снег становятся льдом, и он мчится, как на коньках.","Этт Ис|Иней на ресницах":"Иней на ресницах фрост-годи видит каждого, кто ступает по снегу и льду.","Этт Ис|Брошенная ледяная секира":"Фрост-годи бросает секиру изо льда, и при ударе она раскалывается на острые осколки.","Этт Ис|Лавинный крик":"Крик фрост-годи будит лавину, и снег погребает врагов по колено.","Этт Ис|Ледяной склон":"Перед фрост-годи вырастает ледяная горка, и он скатывается по ней, сбивая врагов.","Этт Ис|Хрупкость":"Холод делает врага хрупким, как тонкий лёд, и следующий удар раскалывает его.","Этт Ис|Ледяной снаряд":"Годи выстреливает ледяной шип, который замораживает противника при попадании.","Этт Ис|Снежная буря":"Фрост-годи зовёт метель с ледников Фенриса, и враги теряются в белой мгле, не видя ни неба, ни земли.","Этт Ис|Осколочный залп":"Фрост-годи бросает веер ледяных осколков, острых, как зубы ледяного волка.","Этт Ис|Замерзание крови":"Кровь врага замерзает в жилах, и с каждым шагом лёд режет его изнутри.","Этт Ис|Холодное сердце":"Сердце фрост-годи становится льдом, и в нём нет ни боли, ни страха.","Этт Ис|Вьюга":"Над врагами поднимается вьюга Фенриса, ранит и замедляет их.","Этт Ис|Морозная цепь":"Морозный шар прыгает с врага на врага, и с каждым скачком холод его злее.","Этт Ис|Падающие сосульки":"С неба падают сосульки, длинные, как копья, и пронзают всех внизу.","Этт Ис|Морозный туман":"С ледников сползает туман, в котором теряются ледоходы, и враги в нём медленно становятся льдом.","Этт Ис|Ледяной лабиринт":"Вокруг фрост-годи вырастает лабиринт из ледяных стен, и враги блуждают в нём.","Этт Ис|Ключ Хвергельмира":"Фрост-годи открывает путь к Хвергельмиру, источнику всех холодных рек, и стужа бьёт из-под земли.","Этт Ис|Ледяная тюрьма":"Купол льда накрывает врагов, и они ждут внутри, пока тюрьма не растает.","Этт Ис|Гнев Ис":"Фрост-годи выпускает на волю гнев Ис, и всё живое рядом застывает, как звери во льдах Фенриса.","Этт Ис|Копьё зимы":"С неба падает копьё зимы, гигантское и ледяное, как сосулька с крыши мира.","Этт Ис|Ледяное зеркало":"Фрост-годи ставит зеркало изо льда, и снаряды врага летят обратно.","Этт Ис|Стужа":"Вокруг фрост-годи стоит стужа: вода замерзает, а враги цепенеют.","Этт Ис|Стрелы Скадды":"Белая Волчица Скадда отдаёт фрост-годи первые стрелы охоты, и они находят тех, кого он пометил.","Этт Ис|Ледяной трон":"Фрост-годи садится на трон изо льда, и от трона волнами расходится холод.","Этт Ис|Йольский волк":"Йольский волк заглядывает в окна в середине зимы, и всё, чего он коснулся, трескается от мороза.","Этт Ис|Белый Клык":"Ледяной волк Белый Клык прыгает на врага и вмораживает его в землю.","Этт Ис|Дыхание зимы":"Фрост-годи выдыхает саму зиму, и вода, земля и враги застывают льдом.","Этт Ис|Ледяной великан":"Из ледника встаёт ётун, древний, как сам лёд, и бьётся рядом с фрост-годи, замораживая врагов.","Этт Ис|Сердце ледника":"В центр поля падает ледяное сердце ледника, тянет врагов к себе и взрывается.","Этт Ис|Тропа ётунов":"Фрост-годи прокладывает ледяную тропу ётунов, и всякий, кто задержится на ней, вмерзает.","Этт Ис|Ледяная гробница":"Фрост-годи хоронит раненого врага во льду. Брат, что разобьёт гробницу, заберёт его последнее тепло.","Этт Ис|Единство с Ис":"Фрост-годи становится ледяным колоссом, и за ним по земле растут ледяные шипы.","Этт Ис|Зима Скадды":"Фрост-годи зовёт зиму, какой не было с тех пор, как Скадда уговорила Волчье Око уйти подальше, и из-под снега встают ледяные шпили.","Этт Ис|Шторм вечного льда":"Вокруг фрост-годи поднимается буря вечного льда, что стоит над Фенрисом с начала времён.","Этт Ис|Белая тишина":"Над полем боя смолкает всё: ветер, сталь и дыхание. В этой тишине лёд берёт каждого, кто пришёл на Фенрис врагом.","Этт Ис|Рождение ледника":"От фрост-годи ползёт ледник, медленный и неумолимый, и давит всех на своём пути.","Этт Ис|Упавшая звезда":"С неба падает звезда, вырвавшаяся из Алчущей Пасти, ледяная, как небо в долгую ночь, и земля под ней покрывается льдом.","Этт Элдинг|Искра Небес":"Элдинг-годи щёлкает пальцами, и искра небес бьёт врага, как укус молнии.","Этт Элдинг|Разряд":"Годи выпускает шаровую молнию, летящий вперёд сквозь врагов и стены.","Этт Элдинг|Скорость Разряда":"Элдинг-годи становится разрядом и бьёт вперёд, оставляя за собой след молнии.","Этт Элдинг|Громовой хлопок":"Элдинг-годи хлопает в ладони, и гром оглушает всех рядом.","Этт Элдинг|Электрическая броня":"Вокруг элдинг-годи трещат разряды и бьют всякого, кто поднимет на него руку.","Этт Элдинг|Громовой удар":"Элдинг-годи бьёт громом и молнией, и враги впереди падают оглушённые.","Этт Элдинг|Паралич":"Разряд проходит через врага, и его мышцы каменеют, как у оленя, застигнутого грозой.","Этт Элдинг|Искровой шар":"Медленный шар искр плывёт к врагам и бьёт их разрядами, пока не взорвётся.","Этт Элдинг|Призыв молнии":"Элдинг-годи поднимает руку к небу, и молния бьёт туда, куда он укажет.","Этт Элдинг|Громовая поступь":"Каждый шаг элдинг-годи бьёт в землю разрядом, как гром бьёт в горы.","Этт Элдинг|Статика":"Молния оставляет в враге статику, и с каждым ударом она копится, пока не свалит его.","Этт Элдинг|Заряженный удар":"Элдинг-годи вкладывает в удар силу грозы, и сталь поёт голосом бури.","Этт Элдинг|Слепящая вспышка":"Элдинг-годи вспыхивает, как молния в ночи, и враги рядом слепнут.","Этт Элдинг|Гудящий воздух":"Воздух вокруг элдинг-годи гудит, и руки братьев бьют быстрее, как будто в них течёт ток.","Этт Элдинг|Грозовая метка":"Элдинг-годи метит врага знаком грозы, и молния любого элдинг-годи найдёт его первым.","Этт Элдинг|Громовые волки":"Громовые волки, огромные, как драккар на берегу, спускаются с гребня и бьют врагов разрядами.","Этт Элдинг|Восходящая молния":"Гроза бьёт не только с небес. Элдинг-годи зовёт её из-под ног врага.","Этт Элдинг|Хлыст молний":"Элдинг-годи свивает молнию в хлыст и тянет врага к себе, как рыбак тянет сеть.","Этт Элдинг|Немота грома":"Гром раскатывается в голове врага, и тот забывает слова своих чар.","Этт Элдинг|Цепная молния":"Молния элдинг-годи перескакивает с врага на врага, как огонь по сухой траве.","Этт Элдинг|Клетка Молний":"Четыре столба молнии смыкаются вокруг врага, и он заперт в клетке из разрядов.","Этт Элдинг|Громоотвод":"Элдинг-годи ставит шпиль, и он ловит молнии и бьёт ими всех вокруг.","Этт Элдинг|Волна молний":"Элдинг-годи посылает вперёд шквал молний, и они идут по земле волной.","Этт Элдинг|Молниеносный удар":"От элдинг-годи во все стороны расходятся молнии, как трещины по льду.","Этт Элдинг|Громовой топор":"Элдинг-годи бросает топор с молнией, и тот возвращается в руку, как эхо грома возвращается с Громовой Горы.","Этт Элдинг|Пояс грозы":"Элдинг-годи опоясывается грозой, как ярл мечом, и каждый его удар несёт гром.","Этт Элдинг|Громовые рукавицы":"Железные Мастера куют рукавицы, что держат молнию, и через них гроза бьёт в схваченного врага.","Этт Элдинг|Гроза над головой":"Над врагом собирается туча и бьёт его молнией раз за разом, куда бы он ни бежал.","Этт Элдинг|Прыжок молнии":"Элдинг-годи становится молнией и падает с неба там, куда смотрел.","Этт Элдинг|Молния":"Годи призывает молнию с небес, сокрушая врага, невзирая на его броню.","Этт Элдинг|Шквал молний":"Годи призывает с небес шквал молний, испепеляющих землю.","Этт Элдинг|Гнев Элдинг":"Молнии вырываются из элдинг-годи во все стороны, как буря над морем.","Этт Элдинг|Молот грома":"Молот из искр обрушивается на землю, и кольца молний расходятся от удара.","Этт Элдинг|Гнев Громовой Горы":"С вершины Громовой Горы бьёт луч, раскалывая камень и пробивая щиты, как молния раскалывает дуб.","Этт Элдинг|Грозовая туча":"Над полем стоит грозовая туча и бьёт молнией всех, кто окажется под ней.","Этт Элдинг|Упряжка громовых волков":"Громовые волки несут сани элдинг-годи по полю, и под ними трещат разряды, а враги летят в снег.","Этт Элдинг|Ловец молний":"Элдинг-годи ловит гнев врагов и возвращает его громом.","Этт Элдинг|Сплетение туч":"Тучи сплетаются над полем, и каждый удар врага бьёт током его самого.","Этт Элдинг|Зов Громовой Горы":"Элдинг-годи поднимает молот к небу, и молния Громовой Горы бьёт в него и расходится по полю.","Этт Элдинг|Пляска молний":"Элдинг-годи пляшет по полю боя, и гром идёт по его следам.","Этт Элдинг|Ночь Вспышек":"Ночь озаряется дюжиной молний, и враги слепнут в их вспышках.","Этт Элдинг|Молот бури":"В руке элдинг-годи сверкает молот, полный бури, бьёт серией и летит вперёд, чтобы вернуться.","Этт Элдинг|Дождь молотов":"С неба падают малые молоты, полные грозы, и бьют разрядами.","Этт Элдинг|Сердце скального тролля":"Над врагом раскалывается каменное сердце скального тролля, и осколки с молниями разлетаются во все стороны.","Этт Элдинг|Кров грозы":"Элдинг-годи накрывает братьев грозой, как кровлей длинного дома, и молнии бьют только чужих.","Этт Элдинг|Громовая леска":"Элдинг-годи закидывает громовую леску, как островитяне закидывают её за морским змеем, и вытягивает врага.","Этт Элдинг|Единство с Элдинг":"Элдинг-годи становится молнией и трижды бьёт по врагам, оставляя за собой дуги грозы.","Этт Элдинг|Праздник Разряда":"Небо раскалывается, и колонна молнии бьёт в землю, разбрасывая цепи разрядов по всему полю.","Этт Элдинг|Шаровая молния":"Элдинг-годи становится шаровой молнией и мечется по полю, сжигая всякого, кого коснётся.","Этт Элдинг|Девять шагов грозы":"Девять раз ступает элдинг-годи, и с каждым шагом гроза над ним тяжелее, пока на девятом она не разрывается.","Этт Элдинг|Вознесение молота":"Над полем повисает исполинский молот из грозовых туч и бьёт молниями в сильнейших, пока не упадёт сам.","Этт Элдинг|Гроза над Фенрисом":"Небо над Фенрисом чернеет от грозы, и молнии бьют во врагов, а братья полны грома.","Этт Духов|Волчий укус":"Анд-годи отпускает с поводка духа волка, и тот рвёт врага так, как рвут добычу в стае.","Этт Духов|Кабаний натиск":"Дух кабана не знает ни страха, ни поворотов, только прямой путь сквозь врага.","Этт Духов|Лисий шаг":"Дух лисы ведёт анд-годи, и снег не помнит его шагов, а ветер не слышит его бега.","Этт Духов|Орлиный глаз":"Анд-годи смотрит глазами орла, что парит над фьордом, и видит врага за много полётов стрелы.","Этт Духов|Змеиный укус":"Дух змеи скользит по траве и жалит врага, и яд его холоден, как вода подо льдом.","Этт Духов|Вороний вестник":"Призрачный ворон летит впереди анд-годи и кричит о каждом враге, что прячется на пути.","Этт Духов|Олений бег":"Дух оленя несёт анд-годи вперёд, и рога его сбивают с ног всякого, кто встанет на пути.","Этт Духов|Призрачная рука":"Невидимая рука духа хватает врага за ворот и тащит туда, куда велит анд-годи.","Этт Духов|Взор волка":"Волк не забывает запах добычи, и враг, отмеченный взором волка, не скроется от стаи.","Этт Духов|Громовой вой":"Анд-годи воет голосом духов-волков, и гром отбрасывает врагов.","Этт Духов|Призыв воронов":"Тени предков обращаются вороньим крылом, чтобы атаковать врагов годи.","Этт Духов|Призыв волков":"Анд-годи зовёт духов волков, что бегали по Фенрису задолго до людей, и они встают рядом с ним.","Этт Духов|Танец с бубном":"Анд-годи пляшет под бубен, уходя в транс, и духи отводят от него вражеские удары.","Этт Духов|Дикий тотем":"Анд-годи вбивает в землю тотем с головами зверей, и духи в нём бросаются на чужаков.","Этт Духов|Заячья тропа":"Дух зайца петляет за анд-годи, и враги не могут уследить, куда он прыгнет.","Этт Духов|Вестник Рататоск":"Белка-дух Рататоск бежит по стволу и громко выдаёт всех, кто прячется рядом.","Этт Духов|Шкура зверя":"Анд-годи накидывает на плечи шкуру духа волка, и удары врагов вязнут в густом меху.","Этт Духов|Совиный крик":"Дух совы кричит из темноты, и враг бежит в ужасе, не понимая, что его напугало.","Этт Духов|Рысь из тени":"Дух рыси выпрыгивает из тени за спиной врага, как рысь с ветки, и рвёт его когтями.","Этт Духов|Хватка росомахи":"Дух росомахи вцепляется во врага и не отпускает, потому что росомаха не знает слова «хватит».","Этт Духов|Мухоморный круг":"Анд-годи сажает круг мухоморов, и враги внутри видят то, чего нет, и бредут, куда не знают.","Этт Духов|Домовик у очага":"Домовик садится у огня, и раны братьев рядом с ним затягиваются, как дома, если не забыть оставить ему каши.","Этт Духов|Волчья голова":"Годи призывает и направляет вперёд голову волка, которая вгрызается в противника.","Этт Духов|Призрачный вепрь":"Анд-годи зовёт вепря из священной рощи предков, и тот несёт его в бой, топча врагов.","Этт Духов|Медвежья мощь":"За спиной анд-годи встаёт медведь-дух, и одним взмахом лапы разметает строй врагов.","Этт Духов|Совиная ночь":"Анд-годи накрывает поле ночью совы: враги слепнут, а братья видят, как совы во тьме.","Этт Духов|Лебединая песнь":"Дух лебедя поёт над братьями, и в его песне раны затягиваются.","Этт Духов|Призыв медведя":"Анд-годи будит духа медведя, хозяина лесов Фенриса, и тот выходит драться рядом с ним.","Этт Духов|Дикие топоры":"Анд-годи бросает два призрачных топора, и духи несут их по дуге обратно в его руки.","Этт Духов|Дух предка":"Анд-годи зовёт павших братьев легиона, и их тени встают рядом с ним в полный рост.","Этт Духов|Золотая щетина":"Дух золотого вепря укрывает братьев светом своей щетины, и он светит, как костёр в метель.","Этт Духов|Лесной тролль":"Анд-годи будит лесного тролля, неуклюжего и злого, который не любит солнца.","Этт Духов|Тотем вожака":"Анд-годи ставит тотем с головой волка-вожака, и духи рядом с ним бьются, как стая за вожаком.","Этт Духов|Ловчие соколы":"Три сокола-духа по очереди падают на врага с неба, как на зайца в поле.","Этт Духов|Медвежья ярость":"За спиной анд-годи встаёт тень медведя, и сила зверя вливается в его руки.","Этт Духов|Дикая охота":"Сквозь поле мчатся духи волка, кабана и оленя, и никто не устоит на их пути.","Этт Духов|Рёв предков":"Череп древнего зверя ревёт голосом предков, и враги в страхе отступают.","Этт Духов|Змеиное кольцо":"Дух исполинской змеи обвивает поле и сжимает кольцо, пока враги не задохнутся.","Этт Духов|Два ворона":"Два ворона-духа, что знают всех павших на поле, летят вперёд: один метит врагов, другой клюёт их.","Этт Духов|Белый лось":"Белый лось, которого лесной народ никогда не убивает, мчится по полю и сбивает врагов рогами.","Этт Духов|Пряжа Трёх Прях":"Три Пряхи у корней мира тянут нить врага: первая возвращает его назад, вторая держит, третья примеряет ножницы.","Этт Духов|Ульфхеднар":"Анд-годи надевает волчью шкуру, и в нём просыпается зверь, что помнит Фенрис до людей.","Этт Духов|Дух-покровитель":"Исполинский медведь, дух-покровитель рода анд-годи, выходит из леса и бьётся рядом.","Этт Духов|Пасть Черногривого":"Пасть Черногривого Провожатого, что стережёт врата мёртвых, смыкается над полем и не выпускает недостойных.","Этт Духов|Пастырь зверей":"Анд-годи говорит со зверями на их языке, и всё, что живёт в лесу, встаёт за него.","Этт Духов|Зверь-двойник":"У каждого анд-годи есть зверь-двойник, что незримо ходит за ним, и однажды он примет за годи смертельный удар.","Этт Духов|Сплетни Рататоска":"Белка Рататоск разносит обидные сплетни, и враги кидаются друг на друга.","Этт Духов|Единство с духами":"Анд-годи сливается со всеми духами Фенриса, и волк, медведь, орёл, змея и олень бьют по очереди.","Этт Духов|Великая охота Фенрис":"Сквозь мир проносится Дикая Охота предков, и ведёт её исполинский волк.","Этт Духов|Гнев предков":"Из тумана встаёт исполинская тень астартес-предка, бьёт топором по земле и уходит.","Этт Духов|Магический лес":"Анд-годи просит землю, и вокруг поднимается лес, где каждое дерево бьёт чужаков.","Этт Духов|Древо Прях":"Анд-годи зовёт древо, у корней которого сидят Три Пряхи: корни бьют врагов, листья лечат братьев, а с вершины кричит орёл.","Этт Духов|Пробуждение двойников":"Звери-двойники всех братьев просыпаются разом, и рядом с каждым встаёт его дух.","Этт Духов|Гери и Фреки":"Духи волков-братьев, что росли вместе с Руссом, выходят на поле: Фреки бросается первым, а Гери ждёт и добивает раненых.","Хов Моркая|Костяной шип":"Кость отзывается на зов Моркаи, Двуглавого и из праха встаёт белый клык помнящий вкус первой крови.","Хов Моркая|Касание тлена":"Драуг-годи касается врага, и плоть его начинает гнить, как туша, брошенная в оттепель.","Хов Моркая|Шёпот мёртвых":"Мёртвые шепчут драуг-годи о тех, кто уже ранен, и тени показывают их.","Хов Моркая|Кровавая метка":"Драуг-годи чертит на враге руну Моркая, и смерть уже знает его имя.","Хов Моркая|Череп-снаряд":"Драуг-годи бросает череп двуглавого волка, и тот летит, скалясь обеими пастями.","Хов Моркая|Костяной панцирь":"Кости растут поверх брони драуг-годи, а когда их ломают, они разлетаются осколками.","Хов Моркая|Проклятие трусости":"Драуг-годи шепчет врагу о смерти, и тот бежит, забыв о своём оружии.","Хов Моркая|Пожирание духа":"Нити Моркая тянут силу из врага, и она перетекает в раны драуг-годи.","Хов Моркая|Слово тьмы":"Драуг-годи шепчет слово, которое не говорят вслух, и оно ранит всех вокруг врага.","Хов Моркая|Тотем смерти":"Драуг-годи ставит тотем из костей, и смерть стоит рядом с ним, ожидая чужаков.","Хов Моркая|Шёпот костей":"Кости в земле шепчутся с драуг-годи и вылетают из земли острыми осколками.","Хов Моркая|Саван тьмы":"Драуг-годи кутается в саван из тьмы, и удары тонут в нём, как камни в болоте.","Хов Моркая|Кровопускание":"Драуг-годи режет врага ритуальным ножом, и кровь его течёт для Моркая.","Хов Моркая|Могильная земля":"Драуг-годи бросает в лицо врагу горсть могильной земли, и раны его не затягиваются.","Хов Моркая|Свеча по мёртвым":"Драуг-годи зажигает чёрную свечу по мёртвым, и в её свете видно всё, что прячется.","Хов Моркая|Жребий кости":"Драуг-годи бросает игральную кость, и Моркай сам решает, сколько крови пролить.","Хов Моркая|Хват драугра":"Из земли высовывается рука драугра, хватает врага за ногу и тянет в могилу.","Хов Моркая|Трупный рой":"Над врагом вьются трупные мухи, и он чует свою смерть раньше, чем она придёт.","Хов Моркая|Кровь на снегу":"Кровь на снегу питает драуг-годи, и каждая смерть рядом с ним затягивает его раны.","Хов Моркая|Плакальщица":"Призрачная плакальщица рыдает над врагами, и в её плаче их силы уходят.","Хов Моркая|Костяной Венец":"Годи выпускает во все стороны кости и Моркаи пронзает каждого врага на его пути.","Хов Моркая|Ослепление":"Тьма Моркаи окутывает врагов культа, не жалея никого.","Хов Моркая|Кровавая десятина":"Драуг-годи вырезает имя врага на кости и сжигает её, и Моркай забирает свою десятину.","Хов Моркая|Пир теней":"Три тени пируют на врагах драуг-годи и приносят ему часть добычи.","Хов Моркая|Цепь душ":"Цепь Моркая приковывает душу врага к земле, и тело не может уйти без неё.","Хов Моркая|Дыхание тьмы":"Драуг-годи выдыхает тьму, и огни гаснут, а враги слепнут.","Хов Моркая|Теневое уничтожение":"Тьма Моркая падает на землю перед драуг-годи и оставляет её пустой и мёртвой.","Хов Моркая|Кровавый ритуал":"Драуг-годи окропляет землю кровью, и через миг Моркай отвечает на подношение.","Хов Моркая|Кровавый гнев":"Драуг-годи отдаёт свою кровь Моркаю, а взамен получает ярость и силу.","Хов Моркая|Магические путы":"Путы Моркая обвивают врага и пьют его жизнь, пока драуг-годи держит их.","Хов Моркая|Двуликая секира":"Двулезвийная секира Моркая: одно лезвие рубит врага, второе приносит годи его силу.","Хов Моркая|Чёрная кровь":"Драуг-годи выплёвывает чёрную кровь, и враги чахнут от неё, как трава от яда.","Хов Моркая|Поднятие павшего":"Драуг-годи поднимает убитого врага, и тот встаёт драугром, чтобы драться против своих.","Хов Моркая|Двоеглав у врат":"Двоеглав, пёс Моркаи, сшитый по образу хозяина, стережёт место, куда его поставил драуг-годи, и обе головы следят за врагами.","Хов Моркая|Врата Пастей":"Драуг-годи чертит руну и земля разверзается сагой о двух головах — знаком Моркаи, что пожирает живых.","Хов Моркая|Погребальный вой":"Драуг-годи воет погребальную песнь, и даже мёртвые и призванные боятся её.","Хов Моркая|Клык Моркая":"Драуг-годи бросает двухконечный клык Моркая, и он ранит врагов и возвращается в руку.","Хов Моркая|Рой воронов":"Из тени вылетают вороны и клюют врага в глаза, как клюют павших после битвы.","Хов Моркая|Погребальный курган":"Курган раскрывается, и драугры выходят из него на зов драуг-годи.","Хов Моркая|Пир Красной Луны":"Волк Красной Луны, скелет с горящими глазницами, выходит из преисподней и грызёт недостойных, не становясь сытее.","Хов Моркая|Лик Двуглавого":"Одна голова Моркаи смотрит на живых, другая на мёртвых, и половина врага уже принадлежит второй.","Хов Моркая|Чучело Двуглавого":"Драуг-годи сжигает чучело из двух чёрных волков, и враги рядом с ним в ужасе.","Хов Моркая|Гнев Моркая":"Из земли вырывается тень двуглавого волка, и обе пасти кусают по очереди.","Хов Моркая|Сделка с Двуглавым":"Драуг-годи заключает сделку с Моркаем, и сила его велика, но расплата приходит быстро.","Хов Моркая|Реквием душ":"Двадцать душ летят волной по зову драуг-годи, и их не остановит никакая броня.","Хов Моркая|Тропа Костей":"Драуг-годи прокладывает тропу из костей тех, кто не дошёл до врат Моркаи, и враги на ней чахнут.","Хов Моркая|Кровавый орёл":"Драуг-годи совершает казнь кровавого орла над поверженным врагом, и все вокруг дрожат от ужаса.","Хов Моркая|Девять костей":"Драуг-годи бросает девять костей-жребиев, и на кого выпал жребий, в того бьёт багровый свет.","Хов Моркая|Жертва культиста":"Культист отдаётся Моркаю по своей воле, и его жизнь становится силой драуг-годи.","Хов Моркая|Аватар Двуглавого":"Драуг-годи становится двуглавым волком смерти, и вокруг него земля мертвеет.","Хов Моркая|День Двух Пастей":"Из земли и неба раскрываются две пасти Моркая и смыкаются, оставляя кладбище теней.","Хов Моркая|Предложение Моркаи":"Из земли выходит двуглавый волк Моркая, и каждый его укус высасывает жизнь.","Хов Моркая|Гнев нагльфара":"Призрачный драккар Нагльфар, построенный из ногтей мертвецов, несётся по полю.","Хов Моркая|Двуглавый костёр":"Драуг-годи поджигает тушу из двух чёрных волков, и из чёрного пламени выходят тени.","Хов Моркая|Свита Двуглавого":"Двуглавый на миг выглядывает из-за врат, и девять драугров идут за его тенью.","Хов Моркая|Девятая Тризна":"Погребальный колокол бьёт девять раз, и на девятом ударе Врата забирают ослабленных.","Хов Эльгра|Струна гнева":"Струна рвётся в руках годи Эльгры, и звук хлещет по врагам, как кнут.","Хов Эльгра|Звон рога":"Годи Эльгры трубит в рог, и звук его бьёт врагов, как порыв ветра.","Хов Эльгра|Медовый стих":"Годи Эльгры читает стих, сладкий, как мёд, и братья рядом становятся сильнее.","Хов Эльгра|Песня-стрела":"Годи Эльгры поёт ноту, и она летит стрелой прямо в сердце врага.","Хов Эльгра|Череп-скальд":"Череп старого скальда усиливает голос годи Эльгры, и следующая его песнь бьёт дальше.","Хов Эльгра|Струнный оберег":"Струна, натянутая песней, звенит громче стали и не подпускает врага к своим.","Хов Эльгра|Диссонанс":"Годи Эльгры берёт фальшивый лад, и враги сбиваются с шага и с прицела.","Хов Эльгра|Боевой клич":"Годи Эльгры кричит боевой клич, и братья рвутся в бой, а враги дрожат.","Хов Эльгра|Самолечение":"Годи напевает песнь Эльгра, и раны затягиваются, как полынья ледком в зимнюю ночь.","Хов Эльгра|Лечение":"Годи выпускает поток мелодий Эльгра, которые вылечивают раны союзника.","Хов Эльгра|Пир":"Стол Эльгры всегда накрыт для своих и для гостя, и ни один брат не уйдёт от него голодным.","Хов Эльгра|Барабанная дробь":"Барабан годи бьёт чаще сердца, и враг глохнет раньше, чем успевает поднять щит.","Хов Эльгра|Песнь войны":"Годи Эльгры заводит песнь войны, и руки братьев бьют в её ритм всё быстрее.","Хов Эльгра|Плясовой рывок":"Годи пускается в пляс, и никто не устоит у него на пути, пока играет музыка.","Хов Эльгра|Удар тальхарпы":"Смычок рвёт струны тальхарпы, и звук бьёт врага, как удар щитом.","Хов Эльгра|Застольная песня":"Годи заводит песню, которую в длинном доме поют всей общиной, и кружки сами стучат о стол.","Хов Эльгра|Нота-эхо":"Одна нота Эльгра не гаснет, пока не обойдёт всех, кто встал против песни.","Хов Эльгра|Боевой бубен":"Под удары бубна сердца бьются в один такт, и руки сами поднимают оружие.","Хов Эльгра|Свисток пастуха":"Годи Эльгры свистит, как пастух на выгоне, и зверь врага замирает на месте.","Хов Эльгра|Звон чаши":"Годи Эльгры бьёт по чаше, и её звон останавливает руки врагов.","Хов Эльгра|Скальдова насмешка":"Годи Эльгры слагает обидную вису о враге, и тот, забыв обо всём, бросается на него.","Хов Эльгра|Колыбельная арфа":"Годи Эльгры играет колыбельную, какую поют у очага в долгую ночь, и звери засыпают, а враги вязнут в звуке.","Хов Эльгра|Хмельной напев":"От этой песни голова кружится сильнее, чем от третьего рога мёда.","Хов Эльгра|Сага о подвиге":"Годи Эльгры поёт сагу о подвиге брата, и тот бьётся так, чтобы сага стала правдой.","Хов Эльгра|Сон":"Годи с помощью своего волшебного голоса приказывает цели лечь спать.","Хов Эльгра|Исцеляющая песнь":"Годи Эльгры играет на арфе, и ноты-руны над полем лечат раны братьев.","Хов Эльгра|Рога Эльгра":"Годи Эльгры трубит в рога, и звуковая волна сбивает и оглушает врагов.","Хов Эльгра|Струны скальда":"Нити звука тянутся между струнами годи Эльгры и вселяют во врагов страх.","Хов Эльгра|Напев забвения":"Враг забывает, зачем поднял оружи   'Этт Ис': { bg: 'linear-gradient(170deg, #0a1826, #040810 60%, #02040a)', epigraph: ['Утром иней на нём не тает даже у костра, а рядом вырастает ледоцвет.', 'знак пути'], force: 'Фрост-годи берут у Матери Фенрис её самую долгую пору: хельскую зиму. Их гальдр вымораживает воздух, растит ледяные стены, сковывает врага и держит стаю на ногах там, где лёд трещит под ногами. Вместе с Железными Жрецами фрост-годи вкладывают стужу в ледяные клинки.', trial: 'Ночь на Льду. Скальд снимает шкуру и проводит ночь на льду ледника без огня. Если Мать приняла его, утром иней на нём не тает даже у костра, а рядом вырастает ледоцвет. Не выдержавшего отогревают медленно, как велит обычай, и мажут «Тёплой Шкурой».', custom: 'Оружие ушедшего фрост-годи опускают в трещину ледника, чтобы стужа забрала своё. Годи Ис молчаливы и терпеливы, как зима: они знают, что лёд всегда дождётся.' },
  'Этт Винд': { bg: 'linear-gradient(170deg, #161a30, #080a16 60%, #03040a)', epigraph: ['На рассвете ветер стихает вокруг него одного, а у его ног лежит перо, которого там не было.', 'знак пути'], force: 'Винд-годи говорят с ветром и бурей. Их гальдр швыряет врага, несёт стаю через пропасти, рвёт паруса чужих кораблей и глушит чужие голоса воем вьюги. Ветер не держит ничего, и винд-годи самые лёгкие на подъём из всех годи.', trial: 'Восхождение в Бурю. Скальд поднимается на вершину Асахейма в бурю, один, без верёвки, и стоит там до рассвета. На рассвете ветер стихает вокруг него одного, а у его ног лежит перо. Не выдержавшего ветер сбрасывает со склона, и винд-годи ловят его гальдром, если успевают.', custom: 'Оружие ушедшего винд-годи пускают по ветру с вершины. Годи Винд первыми приносят вести и первыми уходят: ветер нигде не задерживается надолго.' },
  'Этт Элдинг': { bg: 'linear-gradient(170deg, #1c1a08, #0a0904 60%, #040402)', epigraph: ['Молния бьёт в посох, а скальд остаётся стоять. По его броне с этого дня ветвится первый шрам от молнии.', 'знак пути'], force: 'Элдинг-годи носят в крови грозу. Их гальдр бьёт молнией с ясного неба, слепит и оглушает, заряжает оружие стаи и гонит годи по полю боя быстрее любого бегуна. Вместе с Железными Жрецами элдинг-годи куют громовые молоты.', trial: 'Под Грозой. Скальд поднимается на вершину в грозу, встаёт там с медным посохом в руке и ждёт. Молния бьёт в посох, а скальд остаётся стоять. Если молния сбила его с ног, его не зовут на испытание снова: гроза уже ответила.', custom: 'Оружие ушедшего элдинг-годи относят на вершину, куда чаще всего бьёт молния. Шрамы от молний на броне у годи Элдинг растут год от года, и по ним стая узнаёт, сколько гроз он пережил.' },
  'Этт Духов': { bg: 'linear-gradient(170deg, #06211e, #03100f 60%, #020707)', epigraph: ['Предок отвечает и называет то, чего скальд знать не мог. Утром его голос узнают старшие годи.', 'знак пути'], force: 'Анд-годи слышат духов Фенриса и предков. Их гальдр зовёт призрачных астартес, укрывает стаю от чужого колдовства, показывает скрытое и лечит то, что не лечит плоть. Перед боем Волчий Жрец отдаёт анд-годи бирки с именами павших братьев, и на каждое имя рядом со стаей встаёт предок.', trial: 'Разговор на Кургане. Скальд проводит ночь на кургане и зовёт предка своего рода. Если предок ответил и назвал то, чего скальд знать не мог, утром его голос узнают старшие годи. Если предок не пришёл, звать рано, и скальд возвращается на курган через год.', custom: 'Оружие ушедшего анд-годи вкладывают в тотем рода. Анд-годи никогда не бывают одни: за спиной у каждого стоят все, кто ушёл до него.' },
  'Этт Ваг': { bg: 'linear-gradient(170deg, #061a30, #03101e 60%, #020710)', epigraph: ['Утром море само приносит лодку к берегу, а скальд держит в руках то, что отдало ему море.', 'знак пути'], force: 'Ваг-годи берут силу у моря, воды и шторма. Их гальдр поднимает волну, топит и тащит на дно, лечит солёной водой и зовёт тварей глубин. На драккарах легиона ваг-годи стоят у рулевого весла, и море слушается их, как слушалось бы ярла.', trial: 'Ночь в Шторм. Скальда сажают в лодку без вёсел и отталкивают от берега в начале шторма. Утром море само приносит лодку к берегу, а скальд держит в руках то, что отдало ему море: раковину, зуб кракена или водоросль. За не выдержавшим годи выходят на драккаре, если море оставит, кого вытаскивать.', custom: 'Оружие ушедшего ваг-годи бросают в море во время шторма. Грим-годи считают ваг-годи пустыми, как прибой, а ваг-годи только смеются: прибой приходит каждый день, а камень лежит на месте.' },
  'Этт Йорд': { bg: 'linear-gradient(170deg, #121c08, #080e04 60%, #030502)', epigraph: ['На рассвете камни над ним сдвигаются сами, а в его ладони оказывается камень с янтарной жилой.', 'знак пути'], force: 'Грим-годи говорят с землёй, камнем и глубиной. Их гальдр поднимает стены из скал, трясёт землю под ногами врага, укрывает стаю каменной кожей и слышит, как ворочается под Асахеймом гора. Грим-годи самые упрямые из годи: сдвинуть их с места так же трудно, как скалу.', trial: 'Погребение. Скальда кладут в яму на склоне горы и заваливают камнями, оставив щель для воздуха. Там он лежит всю ночь и слушает землю. На рассвете камни над ним сдвигаются сами, и скальд выходит с камнем, в котором бежит янтарная жила. Если не выдержал, камни разбирают годи, и скальд остаётся скальдом.', custom: 'Оружие ушедшего грим-годи закапывают в землю у подножия Асахейма. Грим-годи считают ваг-годи пустыми, как прибой, и вечно с ними спорят, но на пирах у Эльгры сидят рядом.' },
  'Этт Бра': { bg: 'linear-gradient(170deg, #241006, #100603 60%, #050201)', epigraph: ['Огонь обжигает доспех, но не плоть, а с другой стороны скальд выходит с тлеющим углем в ладони, который не жжёт.', 'знак пути'], force: 'Ред-годи носят в себе огонь вулканов Фенриса. Их гальдр жжёт, плавит и взрывает, гонит врага стеной пламени и согревает стаю в самую лютую стужу. Ред-годи вспыльчивы, как их этт, и первыми рвутся в бой.', trial: 'Сквозь Огонь. Скальд проходит сквозь пламя большого погребального костра, от края до края, не ускоряя шага. Огонь обжигает доспех, но не плоть, и с другой стороны скальд выходит с тлеющим углем в ладони, который не жжёт. Ожоги не выдержавшего лечит Творец плоти, а повторить испытание можно через год.', custom: 'Оружие ушедшего ред-годи бросают в жерло вулкана. Ваг-годи считают ред-годи вспыльчивыми, и те не спорят: огню незачем быть терпеливым.' },
  'Хов Моркая': { bg: 'linear-gradient(170deg, #1a060b, #0a0205 55%, #030102)', epigraph: ['Мертвеца не убить. Я только иду домой, и иду быстрее, чем вы.', 'литания перед боем'], god: 'Моркаи, бог смерти, страж врат, за которыми лежит царство мёртвых. Он является в облике огромного чёрного волка с двумя головами: одна смотрит на живых, другая на мёртвых, и потому скальды зовут его Двуглавым. В его царстве нет ни пира, ни песен, только холод и вечное ожидание, и там же строится Нагльфар, корабль из ногтей мертвецов. Моркаи боятся все, но никто не смеет его отвергать.', force: 'Драуг-годи черпают силу Двуглавого: говорят с мертвецами, упокаивают вставших драугров и, по слухам, умеют поднимать мёртвых сами, хотя делают это только в самом крайнем случае. Они носят маски из черепов своих предшественников, ведь годи Моркаи не умирают окончательно, пока их череп носит кто-то из хова. Драуг-годи хранят чёрный камень культа, ведут Сожжение Двуглавого и держат в руках последний жребий.', trial: 'Ночь Смерти. Скальд выпивает отвар чёрного мака и на одну ночь умирает по-настоящему, а драуг-годи сидят над ним у чёрного камня. На рассвете он встаёт сам, и на лбу у него проступает кровавая руна. С этого дня он считает себя мёртвым. Если не встал, его провожают как воина: он сам выбрал встречу с Моркаи.', custom: 'Каждый моркаец считает себя мертвецом: посвящение для него это собственные похороны, а живых он зовёт «тёплыми». Фенрисийцы обходят моркайцев стороной и не садятся с ними за один стол, но без них не обходятся ни одни похороны. Драуг-годи держатся особняком, и к ним не подходят без нужды.' },
  'Хов Пустотного Волка': { bg: 'linear-gradient(170deg, #0c0a24, #050414 55%, #020208)', epigraph: ['Пусть враг смотрит на мой огонь, а я приду из темноты.', 'литания перед боем'], god: 'Пустотный Волк не бог, а дух, но такой, что многие боги предпочитают с ним не связываться. Он обитает в чёрной пустоте между звёздами, и в долгую ночь его видно на небе как волка из темноты, на месте которого гаснут звёзды. Он рыщет там, куда уходят Небесные Воины, и знает дороги, недоступные ни одному смертному. Он не добр и не зол, он голоден и терпелив.', force: 'Воид-годи совсем мало, и даже другие культисты видят их нечасто. Рядом с ними гаснут огни и становится тише, а сами они умеют исчезать в темноте и появляться там, где их не ждут. Воид-годи помогают кораблям легиона пройти сквозь бури между звёздами и найти путь там, где всё остальное слепнет. Хов хранит Осколок Пустоты, кусок чёрного стекла, упавший с неба, в котором не отражается ничего.', trial: 'Ночь в Пустоте. Скальд выходит на обшивку корабля в открытую пустоту и проводит там ночь корабельного времени, пристёгнутый одной цепью. Вернувшись, он молчит, а по его броне сами проступают серебряные точки первого созвездия. Не выдержавшего втягивают обратно по цепи, и некоторые после этого больше никогда не смотрят в иллюминаторы.', custom: 'Большинство фенрисийцев предпочитают о Пустотном Волке не говорить вовсе, а дети, увидев в небе тёмное пятно без звёзд, бегут домой. Все годи смотрят на воид-годи с опаской, но когда корабль слепнет среди звёзд, зовут именно их.' },
  'Хов Эльгра': { bg: 'linear-gradient(170deg, #2a1408, #140904 55%, #070301)', epigraph: ['Пусть слово ляжет ровно, как лосиный след на свежем снегу. Не дай мне соврать, Эльгра, и не дай забыть.', 'литания перед сагой'], god: 'Эльгра, бог-лось, весёлый и щедрый покровитель пиров, еды, музыки, скальдов и саг. Он выглядит как огромная фигура с лосиным черепом вместо головы, а в руке держит резной посох, увешанный колокольцами, костяными подвесками и лентами. Он хранит гостей и тех, кто их принимает, даёт сытые зимы и хороший мьод, но только тем, кто сам щедр. В ночь пира он посылает в стоянки Рогатого гостя проверить, как люди чтут его закон.', force: 'Годи Эльгры зовут друг друга только по именам, без титулов, потому что на пиру у Эльгры все равны. Они почти никогда не сидят на одном месте: ходят от стоянки к стоянке как гости, приносят новые саги и мирят всех на пирах. Их сила в том, чтобы кормить и веселить: еда под их рукой не портится, мьод не кончается дольше обычного, а песня годи Эльгры снимает усталость с самых измотанных гребцов. Посохи годи Эльгры вырезаны из лосиного рога, и каждый новый посох касается старого, который, говорят, однажды держал сам Эльгра.', trial: 'Сага до Рассвета. На пиру роты скальд встаёт и поёт сагу, и петь он должен до рассвета, не повторяясь и не сбиваясь. Знак пути: никто за столом не прервал его и не уснул, а в ночь пира к огню пришёл незнакомец в плаще и ушёл до утра. Над не выдержавшим смеются весь следующий пир, и петь он может через год.', custom: 'Эльгру любят больше всех богов, ведь он единственный, кто ничего не требует, кроме щедрости и доброй песни. Первый кусок и первый рог на пиру ставят на пустое место во главе стола для самого Эльгры, а утром эту долю отдают самому бедному. Годи Эльгры лучшие из певцов легиона.' },
  'Хов Железного Волка': { bg: 'linear-gradient(170deg, #161a1e, #0a0c10 55%, #030405)', epigraph: ['Железо помнит руку, что его ковала. Не подведи её, как я не подвёл тебя.', 'литания перед боем'], god: 'Железный Волк, бог-волк, колоссальный и древний, что спит под Асахеймом. Горные хребты это шкура на его спине, а залежи руды его железные вены. Он покровительствует всем Железным Жрецам и наблюдает за каждым, кто работает с духами железа, а когда он ворочается во сне, по Фенрису идут землетрясения.', force: 'Ярн-годи самые молчаливые из годи Фенриса: они почти всегда работают в кузнях и штольнях и носят на руках старые ожоги как знаки отличия. Они слышат духов, спящих в каждом клинке, доспехе и механизме, и умеют их будить: оружие в их руках становится крепче, остывший горн разгорается сам. Ярн-годи хранят Сердце Жилы, кусок самородного железа, тёплый даже в самый лютый мороз.', trial: 'Слушание Спящего. Скальд спускается в глубины под Клыком, гасит свет и слушает гору до утра. Гора гудит в ответ, а утром на ладони скальда остаётся пятно ржавчины, которое не смывается.', custom: 'Гальдры этого хова ещё не записаны в саги: корень спит под Асахеймом и ждёт своих ярн-годи. Простые фенрисийцы о Железном Волке знают мало и говорят о нём с опаской, ведь бога, от ворочания которого трясётся земля, не хочется лишний раз будить.' }
};

/* ---------- paths ---------- */
const paths = PATHS.map((meta, index) => {
  const data = GALDRA.find(x => x.name === meta.key);
  return { ...meta, index, tiers: data ? data.tiers : [[], [], [], [], []], nodes: [] };
});
paths.forEach(p => { p.sleeping = !p.tiers.some(l => l.length); });
const ettPaths = paths.filter(p => p.kind === 'ett');
const hovPaths = paths.filter(p => p.kind === 'hov');
const ettW = 222 / ettPaths.length;
ettPaths.forEach((p, i) => { p.center = (-201 + ettW * (i + .5)) * D; p.width = ettW * D; p.portalR = PORTAL_E; });
[128, 102, 78, 52].forEach((a, i) => { hovPaths[i].center = a * D; hovPaths[i].width = 24 * D; hovPaths[i].portalR = PORTAL_R; });
const nodes = [], nodeById = new Map();
function addNode(p, t, i, item, x, y, size) {
  const n = { id: `${p.index}-${t}-${i}`, x, y, tier: t, path: p, name: item[0], type: item[1], desc: item[2], done: !!item[3], size: size || S5[t], children: [], parents: [] };
  nodes.push(n); p.nodes.push(n); nodeById.set(n.id, n);
  return n;
}
function linkParents(p) {
  for (const n of p.nodes) {
    n.parents = [];
    if (!n.tier) continue;
    const d = m => Math.hypot(m.x - n.x, m.y - n.y), prev = p.nodes.filter(m => m.tier === n.tier - 1);
    let pool = n.group == null ? prev : prev.filter(m => m.group === n.group);
    if (!pool.length) pool = prev;
    pool = pool.slice().sort((a, b) => d(a) - d(b));
    if (pool[0]) n.parents.push(pool[0]);
    if (pool[1] && d(pool[1]) <= d(pool[0]) * 1.4) n.parents.push(pool[1]);
    n.parents.forEach(q => q.children.push(n));
  }
}
function flat(p) { const out = []; p.tiers.forEach((list, t) => list.forEach((item, i) => out.push([t, i, item]))); return out; }
function rowLayout(p, tiers, y0, hw, opt = {}) {
  let y = y0;
  const step = opt.step || 40, tgap = opt.tgap || 50, zig = opt.zig || 0;
  for (const t of tiers) {
    const list = p.tiers[t], size = S5[t];
    let i = 0;
    while (i < list.length) {
      const w = hw(y, t), cap = Math.max(1, Math.floor(2 * w / (size + 16))), n = Math.min(cap, list.length - i), sp = Math.min(opt.maxSp || 74, 2 * w / n);
      for (let k = 0; k < n; k++) addNode(p, t, i + k, list[i + k], (k - (n - 1) / 2) * sp, y + (zig && n > 1 ? (k % 2 ? zig : -zig) : 0));
      i += n; y -= size + step;
    }
    y -= tgap;
  }
  return y;
}
function arcLayout(p, t, cx, cy, r0, a0, a1, step, sign = 1) {
  const list = p.tiers[t], size = S5[t]; let i = 0, r = r0;
  while (i < list.length) {
    const cap = Math.max(1, Math.floor(r * Math.abs(a1 - a0) / (size + 12))), n = Math.min(cap, list.length - i);
    for (let k = 0; k < n; k++) { const a = a0 + (a1 - a0) * (k + .5) / n; addNode(p, t, i + k, list[i + k], cx + Math.cos(a) * r * sign, cy + Math.sin(a) * r); }
    i += n; r += size + (step || 16);
  }
  return r;
}

const LAYOUTS = {
  is(p) {
    const R = [105, 190, 275, 358, 440];
    p.tiers.forEach((list, t) => list.forEach((item, j) => {
      const arm = j % 6, k = Math.floor(j / 6), th = (-90 + 60 * arm) * D;
      if (k === 0) { addNode(p, t, j, item, Math.cos(th) * R[t], Math.sin(th) * R[t]).group = arm; return; }
      const step = Math.ceil(k / 2), side = k % 2 ? -1 : 1, r = R[t] + step * 24, a = th + side * step * 36 / R[t];
      addNode(p, t, j, item, Math.cos(a) * r, Math.sin(a) * r).group = arm;
    }));
  },
  vind(p) {
    const arms = [[], [], []];
    flat(p).forEach((x, j) => arms[j % 3].push(x));

function stopBed(fade = .8) { if (!bed) return; const b = bed; bed = null; try { const now = b.a.currentTime; b.g.gain.cancelScheduledValues(now); b.g.gain.setTargetAtTime(0, now, fade / 3); setTimeout(() => b.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), fade * 1000 + 200); } catch (e) {} }
function startBed(kind) {
  const a = audio(); if (!a) return;
  if (bed && bed.kind === kind) return;
  stopBed();
  const g = a.createGain(); g.gain.value = 0; g.connect(a.destination);
  const s = a.createGain(); s.gain.value = .35; g.connect(s); s.connect(reverb);
  const nodes = [];
  for (const L of BEDS[kind] || BEDS.tree) {
    const lg = a.createGain(), lfo = a.createOscillator(), lfg = a.createGain();
    lg.gain.value = L[3]; lfo.frequency.value = L[4]; lfg.gain.value = L[3] * .6; lfo.connect(lfg); lfg.connect(lg.gain); lfo.start(); nodes.push(lfo);
    let src;
    if (L[0] === 'n') { src = a.createBufferSource(); src.buffer = noiseBuf(a); src.loop = true; const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = L[1]; bp.Q.value = L[2]; src.connect(bp); bp.connect(lg); }
    else { src = a.createOscillator(); src.type = L[2]; src.frequency.value = L[1]; if (L[5]) { const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = L[5]; src.connect(lp); lp.connect(lg); } else src.connect(lg); }
    lg.connect(g); src.start(); nodes.push(src);
  }
  bed = { a, g, nodes, kind, level: 0 };
  bedLevel(kind === 'tree' ? .6 : .3, 1);
}
function bedLevel(v, ramp = .6) { if (!bed) return; if (Math.abs(v - bed.level) < .01 && ramp >= .6) return; bed.level = v; try { bed.g.gain.setTargetAtTime(v * 1.4, bed.a.currentTime, ramp); } catch (e) {} }
function setSound(on) {
  soundOn = on;
  try { localStorage.setItem('yggdrasil-sound', on ? 'on' : 'off'); } catch (e) {}
  const b = $('#sound'); b.textContent = on ? 'Звук' : 'Без звука'; b.setAttribute('aria-pressed', String(on));
  if (!on) { stopBed(.2); if (actx) setTimeout(() => { if (!soundOn) actx.suspend(); }, 300); }
  else if (viewport.classList.contains('shown')) startBed(active.path ? active.key : 'tree');
}
$('#sound').addEventListener('click', () => setSound(!soundOn));
setSound(soundOn);

/* ---------- intro ---------- */
function enterTree() {
  const intro = $('#intro');
  if (intro.classList.contains('opening')) return;
  intro.classList.add('opening');
  soundHorn();
  startBed('tree');
  veilFlash('#8ff3ff', false);
  setTimeout(() => {
    intro.classList.add('gone');
    viewport.classList.add('shown');
    $('#hud').classList.add('shown');
    fitAll(false);
    const target = { ...view }, k = 2.2;
    fitAll(true, { s: target.s * k, x: innerWidth / 2 - (innerWidth / 2 - target.x) * k, y: innerHeight / 2 - (innerHeight / 2 - target.y) * k });
  }, reduceMotion ? 0 : 280);
  setTimeout(() => { intro.hidden = true; intro.classList.remove('opening'); }, 1000);
}
function reopen() {
  closeCard(); closePaths(); closeLore();
  const intro = $('#intro');
  intro.hidden = false;
  intro.classList.remove('opening');
  requestAnimationFrame(() => intro.classList.remove('gone'));
}
$('#scroll').addEventListener('click', enterTree);
$('#reopen').addEventListener('click', reopen);

/* ---------- start ---------- */
async function start() {
  try { await Promise.all([document.fonts.load('20px "Noto Sans Runic"', 'ᚠᛟ'), document.fonts.load('20px "Kelly Slab"', 'Иг')]); } catch (e) {}
  sizeCosmos();
  sizeFx();
  sizeAmb();
  sizeTrans();
  resetAmb();
  makeFloaters();
  requestAnimationFrame(frame);
  addEventListener('resize', () => { sizeCosmos(); sizeFx(); sizeAmb(); sizeTrans(); if (reduceMotion) requestAnimationFrame(frame); });
  makeNodes();
  makePaths();
  paint();
  fitAll(false);
  await tick();
  scenes.tree.rendered = true;
  await renderTree();
}
start();
</script>
