шмары. По поверью, отгоняет хима от тех, кто вернулся с виной на душе.<\/li><li><b>Перевод:<\/b> Асах-Ват — талая вода ледников Асахейма. Скадд-Цвет — ледоцвет. Винтер-Омел — сок ягод хельвинтерской омелы.<\/li><\/ul><h3 id=\"wolf2-21\">Краска «Кровавый Знак»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Блод-Лишай, Сэл-Жир, Двахкарр<\/li><li><b>Рецепт:<\/b> Блод-Лишай вываривают до густой краски и растирают с Сэл-Жир. Для метки позора в краску добавляют щепоть Двахкарр, и она темнеет до цвета запёкшейся крови.<\/li><li><b>Действие:<\/b> Боевая раскраска и знак суда. Перед боем жрец чертит ею руны на лицах и доспехах стаи. Тёмной краской с пеплом он метит опозоренных, чьи имена вычеркнуты из саг. Её не смывает ни море, ни дождь.<\/li><li><b>Перевод:<\/b> Блод-Лишай — кровавый лишайник. Сэл-Жир — топлёный тюлений жир. Двахкарр — чёрный пепел корней пепельной розы.<\/li><\/ul><h3 id=\"wolf2-22\">Отвар «Зов Зверя»<\/h3><ul><li><b>Редкость:<\/b> ○ Редкий<\/li><li><b>Ингредиенты:<\/b> Бьорн-Гриб, Багуль-Лист, Гулл-Кор, Тролль-Кров<\/li><li><b>Рецепт:<\/b> Бьорн-Гриб сушат особым способом, который знают только Старшие жрецы, и варят с Багуль-Лист. В остывший отвар вмешивают тёртый Гулл-Кор и свежую Тролль-Кров, пока она не перестанет шевелиться.<\/li><li><b>Действие:<\/b> Боевое безумие. Воин не чувствует ни боли, ни страха, а раны на нём затягиваются прямо в бою, как на ледяном тролле. Цена страшна: отвар будит в Астартес зверя, и каждый глоток приближает Проклятие Вульфена. Даётся только с позволения Старшего жреца, а Волчий Поцелуй держат наготове.<\/li><li><b>Перевод:<\/b> Бьорн-Гриб — высушенный берсерков гриб. Багуль-Лист — сушёный багульник. Гулл-Кор — корень золотого корня. Тролль-Кров — кровь ледяного тролля.<\/li><\/ul><h3 id=\"wolf2-23\">Отвар «Взор Моркаи»<\/h3><ul><li><b>Редкость:<\/b> ○ Редкий<\/li><li><b>Ингредиенты:<\/b> Морк-Роза, Свефн-Трав, Курган-Гриб, Уггла-Глаз<\/li><li><b>Рецепт:<\/b> Морк-Роза и Свефн-Трав томятся ночь у погребального костра. На рассвете в отвар крошат Курган-Гриб с кургана беспокойного мертвеца и опускают Уггла-Глаз. Пьёт сам жрец, сидя у тела павшего.<\/li><li><b>Действие:<\/b> Состав Говорящих с мёртвыми. Погружает жреца в сон на грани смерти, где он видит павших и может говорить с ними: узнать последние слова, имя убийцы, неисполненную клятву. За это платят: после каждого приёма кожа жреца холодеет на несколько дней, а совы садятся на крышу его жилища.<\/li><li><b>Перевод:<\/b> Морк-Роза — лепестки пепельной розы. Свефн-Трав — сон-трава. Курган-Гриб — курганник. Уггла-Глаз — высушенный глаз полярной совы.<\/li><\/ul><h3 id=\"wolf2-24\">Таинство «Кубок Вульфена»<\/h3><ul><li><b>Редкость:<\/b> ⓪ Абсолютный<\/li><li><b>Ингредиенты:<\/b> Канис Хеликс, Ульф-Кров, третий ингредиент знают только Старшие жрецы<\/li><li><b>Рецепт:<\/b> Не записывается. Говорят, Канис Хеликс растворяют в Ульф-Кров и подают аспиранту в Кубке, из которого пили первые воины Русса.<\/li><li><b>Действие:<\/b> Первое и главное таинство легиона. Хеликс входит в тело аспиранта: кости трещат, тело обрастает шерстью, разум скатывается в звериный. Начинается Испытание Моркаи, и аспирант должен сам вернуться к Клыку через дикость Фенриса. Вернувшемуся вживляют остальные органы, а кто не вернулся, становится Вульфеном.<\/li><li><b>Перевод:<\/b> Канис Хеликс — первый и главный компонент генного семени легиона, кровь Русса. Ульф-Кров — кровь черногривого волка.<\/li><\/ul><h2 id=\"wolf2-25\">Язык жрецов-лекарей<\/h2><p>Все ингредиенты из этого свитка с расшифровкой. Травы взяты из травника Фенриса, твари из бестиария.<\/p><h3 id=\"wolf2-26\">Травы, мхи и грибы<\/h3><div class=\"tbl\"><table><thead><tr><th>Название<\/th><th>Что это<\/th><th>Где используется<\/th><\/tr><\/thead><tbody><tr><td>Багуль-Лист<\/td><td>Сушёный багульник<\/td><td>Тризна, Зов Зверя<\/td><\/tr><tr><td>Блод-Лишай<\/td><td>Кровавый лишайник<\/td><td>Кровавый Знак<\/td><\/tr><tr><td>Бьорн-Гриб<\/td><td>Высушенный берсерков гриб<\/td><td>Зов Зверя<\/td><\/tr><tr><td>Винтер-Омел<\/td><td>Ягоды хельвинтерской омелы<\/td><td>Волчий Поцелуй, Антитварин, Ледяная Купель<\/td><\/tr><tr><td>Гулл-Кор<\/td><td>Корень золотого корня<\/td><td>Одинокий Волк, Зов Зверя<\/td><\/tr><tr><td>Двахкарр<\/td><td>Чёрный пепел корней пепельной розы с погребального костра<\/td><td>Чистая Кровь, Кровавый Знак<\/td><\/tr><tr><td>Игг-Желез<\/td><td>Вытяжка из коры железного дерева<\/td><td>Чистая Кровь, Ответный Укус<\/td><\/tr><tr><td>Игг-Смол<\/td><td>Смола тысячелетнего железного дерева<\/td><td>Дар Всеотца<\/td><\/tr><tr><td>Курган-Гриб<\/td><td>Курганник<\/td><td>Взор Моркаи<\/td><\/tr><tr><td>Мирт-Лист<\/td><td>Листья болотного мирта<\/td><td>Тризна<\/td><\/tr><tr><td>Морк-Роза<\/td><td>Лепестки пепельной розы<\/td><td>Одинокий Волк, Взор Моркаи<\/td><\/tr><tr><td>Облеп-Масло<\/td><td>Облепиховое масло<\/td><td>Болотный Покров, Тёплая Шкура<\/td><\/tr><tr><td>Один-Кор<\/td><td>Корень морозного папоротника<\/td><td>Второе Дыхание, Антитварин<\/td><\/tr><tr><td>Плакун-Кор<\/td><td>Корень плакун-травы<\/td><td>Сокрытие Следов<\/td><\/tr><tr><td>Рамс-Сок<\/td><td>Сок дикого чеснока<\/td><td>Болотный Покров<\/td><\/tr><tr><td>Свефн-Трав<\/td><td>Сон-трава<\/td><td>Взор Моркаи<\/td><\/tr><tr><td>Скадд-Цвет<\/td><td>Ледоцвет<\/td><td>Ледяная Купель<\/td><\/tr><tr><td>Сфаг-Мох<\/td><td>Высушенный сфагнум<\/td><td>Болотный Покров<\/td><\/tr><tr><td>Фрейя-Ягод<\/td><td>Сок морозной морошки<\/td><td>Узы Стужи<\/td><\/tr><tr><td>Фьорд-Мох<\/td><td>Порошок фьордового мха<\/td><td>Жгучий Клык, Болотный Покров<\/td><\/tr><tr><td>Хел-Мак<\/td><td>Вытяжка чёрного мака<\/td><td>Железный Сон, Одинокий Волк<\/td><\/tr><tr><td>Эйнир-Пепел<\/td><td>Пепел можжевельника, сожжённого на остывшей лаве<\/td><td>Сокрытие Следов<\/td><\/tr><tr><td>Эйнир-Ягод<\/td><td>Ягоды можжевельника<\/td><td>Тризна<\/td><\/tr><tr><td>Эльгра-Мьод<\/td><td>Тёмный вересковый мьод<\/td><td>Одинокий Волк, Тризна<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf2-27\">Твари Фенриса<\/h3><div class=\"tbl\"><table><thead><tr><th>Название<\/th><th>Что это<\/th><th>Где используется<\/th><\/tr><\/thead><tbody><tr><td>Аракс-Кров<\/td><td>Кровь старого аракаса<\/td><td>Ответный Укус<\/td><\/tr><tr><td>Асгард-Плазм<\/td><td>Кровь королевского грифона<\/td><td>Дар Всеотца<\/td><\/tr><tr><td>Валлах-Пыль<\/td><td>Толчёные кристаллы с костей ледяного кракена<\/td><td>Дар Всеотца<\/td><\/tr><tr><td>Валь-Гриф<\/td><td>Кровь из предсердия грифона<\/td><td>Второе Дыхание<\/td><\/tr><tr><td>Вивер-Яд<\/td><td>Ослабленный яд из жала виверны<\/td><td>Ответный Укус<\/td><\/tr><tr><td>Гев-Гормон<\/td><td>Гормон из желёз новорождённых волчат<\/td><td>Волчий Поцелуй<\/td><\/tr><tr><td>Драуг-Шелк<\/td><td>Паутина ледяного паука<\/td><td>Ледяной Замок<\/td><\/tr><tr><td>Йотун-Крак<\/td><td>Вытяжка из глубинных желёз кракена<\/td><td>Холод Фенриса<\/td><\/tr><tr><td>Кротахк<\/td><td>Высушенный язык термального ящера<\/td><td>Холод Фенриса<\/td><\/tr><tr><td>Локи-Кож<\/td><td>Чернильный концентрат кожи перевертня<\/td><td>Узы Стужи<\/td><\/tr><tr><td>Нидхёгг-Яд<\/td><td>Сонный яд из клыков нетопыря<\/td><td>Железный Сон<\/td><\/tr><tr><td>Нифль-Прах<\/td><td>Прах туманника, убитого вне тумана<\/td><td>Сокрытие Следов<\/td><\/tr><tr><td>Рев-Шерсть<\/td><td>Опалённая шерсть пепельной лисы<\/td><td>Сокрытие Следов<\/td><\/tr><tr><td>Рекк-Паук<\/td><td>Кислота из жвал кикиморы<\/td><td>Жгучий Клык<\/td><\/tr><tr><td>Ррим-Жир<\/td><td>Подкожный жир ётуна<\/td><td>Ледяной Замок<\/td><\/tr><tr><td>Руни-Кость<\/td><td>Костный мозг хищника<\/td><td>Волчий Поцелуй<\/td><\/tr><tr><td>Сэл-Жир<\/td><td>Топлёный тюлений жир<\/td><td>Тёплая Шкура, Кровавый Знак<\/td><\/tr><tr><td>Тандер-Карр<\/td><td>Перемолотые каменные наросты круглорога<\/td><td>Второе Дыхание<\/td><\/tr><tr><td>Тандер-Коготь<\/td><td>Порошок из когтя громового волка<\/td><td>Антитварин<\/td><\/tr><tr><td>Телиф-Сок<\/td><td>Едкий секрет хвостовых желёз телифона<\/td><td>Жгучий Клык<\/td><\/tr><tr><td>Тролль-Кров<\/td><td>Кровь ледяного тролля<\/td><td>Зов Зверя<\/td><\/tr><tr><td>Уггла-Глаз<\/td><td>Высушенный глаз полярной совы<\/td><td>Взор Моркаи<\/td><\/tr><tr><td>Ульф-Кров<\/td><td>Кровь черногривого волка<\/td><td>Кубок Вульфена<\/td><\/tr><tr><td>Ульф-Мозг<\/td><td>Мозг фенрисийского волка<\/td><td>Железный Сон<\/td><\/tr><tr><td>Ундин-Слизь<\/td><td>Слизь со щупалец ледяного кракена<\/td><td>Узы Стужи<\/td><\/tr><tr><td>Фен-Желч<\/td><td>Желчь болотожора, лучше всего полярного<\/td><td>Чистая Кровь, Антитварин<\/td><\/tr><tr><td>Фен-Слизь<\/td><td>Слизь полярного болотожора<\/td><td>Тёплая Шкура<\/td><\/tr><tr><td>Фенрир-Лимф<\/td><td>Лимфа громового волка<\/td><td>Чистая Кровь<\/td><\/tr><tr><td>Хаз-Так<\/td><td>Стружка лёгочных хрящей громового волка<\/td><td>Второе Дыхание<\/td><\/tr><tr><td>Хейм-Глаз<\/td><td>Глаз бессмертного Великана-пустошника<\/td><td>Дар Всеотца<\/td><\/tr><tr><td>Хранд-Лось<\/td><td>Очищенный жир фенрисийского лося<\/td><td>Холод Фенриса<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf2-28\">Прочее<\/h3><div class=\"tbl\"><table><thead><tr><th>Название<\/th><th>Что это<\/th><th>Где используется<\/th><\/tr><\/thead><tbody><tr><td>Асах-Ват<\/td><td>Перегнанная талая вода ледников Асахейма<\/td><td>Холод Фенриса, Ледяная Купель<\/td><\/tr><tr><td>Ис-Крош<\/td><td>Толчёный лёд с ледника<\/td><td>Ледяной Замок<\/td><\/tr><tr><td>Канис Хеликс<\/td><td>Первый компонент генного семени легиона<\/td><td>Кубок Вульфена<\/td><\/tr><tr><td>Орф-Антак<\/td><td>Костяная мука<\/td><td>Жгучий Клык<\/td><\/tr><tr><td>Пром-Огн<\/td><td>Освящённый прометий<\/td><td>Дар Всеотца<\/td><\/tr><tr><td>Скальд-Кров<\/td><td>Кровь сильного годи<\/td><td>Антитварин<\/td><\/tr><\/tbody><\/table><\/div>","toc":[{"id":"wolf2-1","title":"О чём этот свиток?","level":2},{"id":"wolf2-2","title":"Препараты","level":2},{"id":"wolf2-3","title":"Мазь «Холод Фенриса»","level":3},{"id":"wolf2-4","title":"Мазь «Жгучий Клык»","level":3},{"id":"wolf2-5","title":"Катализатор «Второе Дыхание»","level":3},{"id":"wolf2-6","title":"Мазь «Ледяной Замок»","level":3},{"id":"wolf2-7","title":"Мазь «Узы Стужи»","level":3},{"id":"wolf2-8","title":"Сыворотка «Чистая Кровь»","level":3},{"id":"wolf2-9","title":"Бальзам «Железный Сон»","level":3},{"id":"wolf2-10","title":"Препарат «Волчий Поцелуй»","level":3},{"id":"wolf2-11","title":"Мазь «Дар Всеотца»","level":3},{"id":"wolf2-12","title":"Препарат «Антитварин»","level":3},{"id":"wolf2-13","title":"Обрядовые и полевые составы","level":2},{"id":"wolf2-14","title":"Повязка «Болотный Покров»","level":3},{"id":"wolf2-15","title":"Мазь «Тёплая Шкура»","level":3},{"id":"wolf2-16","title":"Сыворотка «Ответный Укус»","level":3},{"id":"wolf2-17","title":"Пепел «Сокрытие Следов»","level":3},{"id":"wolf2-18","title":"Бальзам «Одинокий Волк»","level":3},{"id":"wolf2-19","title":"Мьод «Тризна»","level":3},{"id":"wolf2-20","title":"Взвар «Ледяная Купель»","level":3},{"id":"wolf2-21","title":"Краска «Кровавый Знак»","level":3},{"id":"wolf2-22","title":"Отвар «Зов Зверя»","level":3},{"id":"wolf2-23","title":"Отвар «Взор Моркаи»","level":3},{"id":"wolf2-24","title":"Таинство «Кубок Вульфена»","level":3},{"id":"wolf2-25","title":"Язык жрецов-лекарей","level":2},{"id":"wolf2-26","title":"Травы, мхи и грибы","level":3},{"id":"wolf2-27","title":"Твари Фенриса","level":3},{"id":"wolf2-28","title":"Прочее","level":3}]},{"id":"wolf3","title":"Операции Волчьих Жрецов","short":"Операции","rune":"ᛏ","html":"<h2 id=\"wolf3-1\">О чём этот свиток?<\/h2><p>Тело Волка выдержит то, что убьёт сотню смертных, но и ломается оно так, как не ломается ни одно другое. Волчьи Жрецы режут, сшивают, сращивают и заменяют, а работу ножа сопровождают словом и обрядом. Здесь собраны операции, которые они проводят, от перевязки на поле боя до вживления генного семени. Список пополняется.<\/p><p><b>Как читать операцию:<\/b><\/p><ul><li><b>Проводит<\/b> — какой ранг вправе её проводить<\/li><li><b>Показания<\/b> — когда она нужна<\/li><li><b>Что нужно<\/b> — препараты и инструменты<\/li><li><b>Ход операции<\/b> — как она проходит<\/li><li><b>Последствия<\/b> — восстановление и риски<\/li><\/ul><p>Препараты описаны в документе «Препараты Волчьих Жрецов», обряды в документе «Обряды Волчьих Жрецов».<\/p><h3 id=\"wolf3-2\">Инструменты жреца<\/h3><div class=\"tbl\"><table><thead><tr><th>Инструмент<\/th><th>Что это<\/th><\/tr><\/thead><tbody><tr><td>Нартециум<\/td><td>Наруч жреца с инъекторами, резаками, сшивателем и диагностом. Без него жрец не выходит в бой.<\/td><\/tr><tr><td>Клык Моркаи<\/td><td>Священный редуктор для извлечения генного семени павших<\/td><\/tr><tr><td>Сшиватель<\/td><td>Скобы и нити из жил лося, которые не рвутся даже на мышцах Астартес<\/td><\/tr><tr><td>Костяные клинки<\/td><td>Ритуальные ножи из кости громового волка. Ими режут то, чего не должно касаться железо: омелу, прогеноиды, плоть тронутого порчей.<\/td><\/tr><tr><td>Лазерный резак<\/td><td>Для брони, костей и ран, которые надо прижечь сразу<\/td><\/tr><tr><td>Керамитовые шины<\/td><td>Держат раздробленные кости, пока оссмодула не срастит их<\/td><\/tr><tr><td>Апотекарион<\/td><td>Операционный зал в Клыке или на корабле роты, где проходят тяжёлые операции<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf3-3\">Органы Астартес, о которых идёт речь<\/h3><div class=\"tbl\"><table><thead><tr><th>Орган<\/th><th>Что делает<\/th><\/tr><\/thead><tbody><tr><td>Вторичное сердце<\/td><td>Второе сердце. Воин живёт и с одним, но слабее.<\/td><\/tr><tr><td>Оссмодула<\/td><td>Укрепляет и сращивает кости<\/td><\/tr><tr><td>Орган Ларрамана<\/td><td>Мгновенно сворачивает кровь и запечатывает раны<\/td><\/tr><tr><td>Каталептический узел<\/td><td>Позволяет спать половиной мозга<\/td><\/tr><tr><td>Мультилёгкое<\/td><td>Третье лёгкое, дышит ядом и разреженным воздухом<\/td><\/tr><tr><td>Омофагия<\/td><td>Позволяет узнавать память врага, съев его плоть<\/td><\/tr><tr><td>Оолитовая почка<\/td><td>Очищает кровь от ядов<\/td><\/tr><tr><td>Ухо Лаймана<\/td><td>Слух и равновесие<\/td><\/tr><tr><td>Окулоб<\/td><td>Острое зрение и видение во тьме<\/td><\/tr><tr><td>Сус-ан мембрана<\/td><td>Погружает в мнимую смерть, в которой воин может пролежать годами<\/td><\/tr><tr><td>Чёрный панцирь<\/td><td>Связывает нервы воина с силовым доспехом<\/td><\/tr><tr><td>Прогеноиды<\/td><td>Хранят генное семя, которое жрец забирает у павших<\/td><\/tr><tr><td>Канис Хеликс<\/td><td>Дар и проклятие Волков, будит в них зверя<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"wolf3-4\">Полевая помощь<\/h2><p>Операции, которые жрец проводит прямо на поле боя, часто под огнём.<\/p><h3 id=\"wolf3-5\">Наложение Покрова<\/h3><ul><li><b>Проводит:<\/b> Избранный жрецом и выше<\/li><li><b>Показания:<\/b> Орган Ларрамана не справляется: рана слишком велика, оружие ксеносов не даёт крови свернуться или воин потерял конечность<\/li><li><b>Что нужно:<\/b> Повязка «Болотный Покров», жгут, нартециум<\/li><li><b>Ход операции:<\/b> Жрец пережимает сосуд выше раны жгутом или пальцами прямо в ране. Нартециумом он вводит стимулятор свёртывания, затем набивает рану Болотным Покровом и стягивает её. Жгут ослабляют каждые полчаса, чтобы не умерла конечность.<\/li><li><b>Последствия:<\/b> Это временная мера. Раненого нужно доставить к Творцу плоти за несколько часов.<\/li><\/ul><h3 id=\"wolf3-6\">Выжигание Раны<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, Избранный жрецом под его присмотром<\/li><li><b>Показания:<\/b> Рана заражена ксенозаразой, ядом или гнилью, в ней омертвевшая плоть<\/li><li><b>Что нужно:<\/b> Мазь «Жгучий Клык», костяной клинок, Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Жрец срезает омертвевшую плоть костяным клинком и наносит Жгучий Клык. Мазь шипит и разъедает заразу до здоровых тканей. Когда шипение стихает, рану промывают и закрывают Покровом.<\/li><li><b>Последствия:<\/b> Боль страшная, даже для Астартес. Шрам остаётся навсегда, и Волки носят его с гордостью.<\/li><\/ul><h3 id=\"wolf3-7\">Извлечение Болта<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Масс-реактивный снаряд застрял в теле и не разорвался<\/li><li><b>Что нужно:<\/b> Нартециум, длинные щипцы, лазерный резак, Бальзам «Железный Сон»<\/li><li><b>Ход операции:<\/b> Раненого не двигают. Жрец нащупывает снаряд диагностом и проверяет, жив ли детонатор. Если снаряд у сердца или позвоночника, раненого усыпляют Железным Сном, чтобы он не дрогнул. Жрец расширяет рану резаком, берёт снаряд щипцами за корпус, не касаясь головки, и вынимает одним движением. На это время стая отходит.<\/li><li><b>Последствия:<\/b> Если снаряд взорвётся в руках, погибнут оба. Поэтому руки жреца, вынувшего хотя бы один болт, в стае уважают особо.<\/li><\/ul><h3 id=\"wolf3-8\">Замок на Чреве<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Распоротый живот, органы выпали наружу<\/li><li><b>Что нужно:<\/b> Мазь «Ледяной Замок», талая вода, сшиватель<\/li><li><b>Ход операции:<\/b> Органы промывают талой водой и вправляют на место. Сверху кладут Ледяной Замок, и ткани застывают, а сосуды сжимаются. Края раны схватывают скобами на время переноски, окончательно её зашивают уже в апотекарионе.<\/li><li><b>Последствия:<\/b> Под Замком органы держатся до суток. Если не успеть, ткани начинают умирать от холода.<\/li><\/ul><h3 id=\"wolf3-9\">Охлаждение Ожога<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Ожоги от плазмы, мельты, огнемёта или вулканического огня<\/li><li><b>Что нужно:<\/b> Мазь «Узы Стужи», костяной клинок, нартециум<\/li><li><b>Ход операции:<\/b> Жрец снимает с ожога спёкшийся керамит и обугленную кожу. Узы Стужи наносят толстым слоем до самой кости, и мазь вытягивает жар. Повязку меняют каждые шесть часов, пока не начнёт расти новая кожа.<\/li><li><b>Последствия:<\/b> Рубцов не остаётся, суставы гнутся как прежде. Если ожог дошёл до кости, нужна ещё и хирургия.<\/li><\/ul><h3 id=\"wolf3-10\">Пробуждение Третьего Лёгкого<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Пробита грудная клетка, лёгкие сожжены газом, воин задыхается в ядовитом воздухе или в вакууме<\/li><li><b>Что нужно:<\/b> Катализатор «Второе Дыхание», нартециум<\/li><li><b>Ход операции:<\/b> Жрец вводит катализатор прямо в мультилёгкое через прокол между рёбрами. Имплант разгоняется, и воин снова дышит. Пробитое лёгкое пережимают, чтобы кровь не заливала грудь.<\/li><li><b>Последствия:<\/b> На пределе мультилёгкое работает не дольше получаса. Потом воину нужен апотекарион, иначе выгорит и третье лёгкое.<\/li><\/ul><h3 id=\"wolf3-11\">Запуск Сердец<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Остановились оба сердца<\/li><li><b>Что нужно:<\/b> Мазь «Холод Фенриса», разрядник нартециума<\/li><li><b>Ход операции:<\/b> Жрец срывает нагрудник и втирает Холод Фенриса в кожу над сердцами. Первый разряд он даёт во вторичное сердце: оно меньше, запускается легче и тянет за собой главное. Если после трёх разрядов сердца молчат, жрец достаёт Клык Моркаи.<\/li><li><b>Последствия:<\/b> Если сердца стояли дольше нескольких минут, мог пострадать мозг. После запуска воина проверяют, не нужна ли трепанация.<\/li><\/ul><h3 id=\"wolf3-12\">Мнимая Смерть<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Раненого не спасти на месте, но можно довезти до апотекариона<\/li><li><b>Что нужно:<\/b> Бальзам «Железный Сон», нартециум<\/li><li><b>Ход операции:<\/b> Если воин в сознании, жрец велит ему самому уйти в сус-ан, этому учится каждый Волк. Если нет, жрец будит мембрану уколом в основание черепа и закрепляет сон Железным Сном. Сердца замедляются до одного удара в минуту, кровь почти останавливается.<\/li><li><b>Последствия:<\/b> В мнимой смерти воин может пролежать годами. Выводить из неё должен жрец: проснувшийся сам часто просыпается зверем.<\/li><\/ul><h2 id=\"wolf3-13\">Хирургия плоти и кости<\/h2><p>Операции, которые проводят в апотекарионе или в укрытии, когда бой стих.<\/p><h3 id=\"wolf3-14\">Сращивание Костей<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Кость раздроблена, а осколки смещены так, что оссмодула не срастит их сама<\/li><li><b>Что нужно:<\/b> Керамитовые шины, сшиватель, костяная мука Орф-Антак, смола смоляной ели<\/li><li><b>Ход операции:<\/b> Жрец вскрывает конечность и собирает осколки. Места, где кости не хватает, заполняет Орф-Антак, замешанной на смоле. Осколки скрепляют скобами, рану зашивают, конечность заключают в шину.<\/li><li><b>Последствия:<\/b> Оссмодула сращивает кость за несколько недель. Сросшаяся кость становится толще и крепче прежней.<\/li><\/ul><h3 id=\"wolf3-15\">Отсечение<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Конечность раздроблена так, что не спасти, или заражение и порча уже не останавливаются<\/li><li><b>Что нужно:<\/b> Лазерный резак, костяной клинок при порче, Мазь «Жгучий Клык», Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Жрец режет на ладонь выше границы гнили или порчи. Сосуды прижигает резаком, культю обрабатывает Жгучим Клыком и закрывает Покровом. На конце кости оставляют место для крепления, чтобы потом поставить бионику. Отсечённую конечность сжигают на огне, как павшего.<\/li><li><b>Последствия:<\/b> Новую руку или ногу делают Железные жрецы. Волки говорят про такого брата: «Часть его уже пирует у Моркаи».<\/li><\/ul><h3 id=\"wolf3-16\">Трепанация<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, а если задет мозг, то вместе с Волчьим жрецом<\/li><li><b>Показания:<\/b> Тяжёлый удар по голове, осколок в мозге, кровь давит на мозг изнутри черепа<\/li><li><b>Что нужно:<\/b> Бальзам «Железный Сон», лазерный резак, нартециум<\/li><li><b>Ход операции:<\/b> Раненого погружают в каталептический сон Железным Сном. Жрец снимает кусок черепа, убирает кровь и осколки, возвращает кость на место и скрепляет её.<\/li><li><b>Последствия:<\/b> Воин может потерять часть памяти. Когда он просыпается, жрец просит его спеть сагу стаи. По тому, какие строки он забыл, жрец понимает, что задето.<\/li><\/ul><h3 id=\"wolf3-17\">Возвращение Лица<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Снесена челюсть, лицо сожжено или разорвано<\/li><li><b>Что нужно:<\/b> Мазь «Узы Стужи», сшиватель, а если челюсть не спасти, проводят Железную Пасть<\/li><li><b>Ход операции:<\/b> Жрец восстанавливает кость лица своей костью или керамитом и натягивает уцелевшую кожу. Остальное покрывают Узами Стужи, и новая кожа принимает облик прежней.<\/li><li><b>Последствия:<\/b> Волки ценят шрамы, поэтому по просьбе воина жрец может оставить шрам на память.<\/li><\/ul><h3 id=\"wolf3-18\">Сращивание Хребта<\/h3><ul><li><b>Проводит:<\/b> Творец плоти. Мазь «Дар Всеотца» применяют только с позволения Старшего жреца.<\/li><li><b>Показания:<\/b> Перебит позвоночник, ноги не слушаются<\/li><li><b>Что нужно:<\/b> Бальзам «Железный Сон», керамитовые штифты, сшиватель, в крайнем случае Мазь «Дар Всеотца»<\/li><li><b>Ход операции:<\/b> Раненого обездвиживают и усыпляют. Жрец совмещает позвонки, скрепляет их штифтами и сшивает разорванные нервы.<\/li><li><b>Последствия:<\/b> Месяц неподвижности, и воин может навсегда остаться хромым. Дар Всеотца сращивает хребет за секунды, но его так мало, что решает Старший жрец.<\/li><\/ul><h3 id=\"wolf3-19\">Замена Глаза<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Глаз выбит, выжжен или разъеден кислотой<\/li><li><b>Что нужно:<\/b> Аугметический глаз работы Железных жрецов, нартециум, талая вода<\/li><li><b>Ход операции:<\/b> Жрец удаляет остатки глаза и промывает глазницу. Железный жрец вживляет аугметический глаз, а Творец плоти соединяет его с окулобом и нервами.<\/li><li><b>Последствия:<\/b> Новый глаз видит не хуже прежнего, а порой и лучше. Некоторые Волки отказываются от него и носят пустую глазницу как память о бое.<\/li><\/ul><h2 id=\"wolf3-20\">Органы и аугметика<\/h2><p>Операции, после которых в Волке становится меньше плоти и больше стали. Многие из них жрец проводит вместе с Железным жрецом, и каждый раз они спорят, кому принадлежит тело воина.<\/p><h3 id=\"wolf3-21\">Железная Рука<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Воин лишился руки или ноги, культя зажила<\/li><li><b>Что нужно:<\/b> Бионическая конечность работы Железных жрецов, сшиватель, Сыворотка «Чистая Кровь»<\/li><li><b>Ход операции:<\/b> Творец плоти вскрывает культю и выводит нервы и кость к креплению. Железный жрец соединяет их с бионикой и будит её машинный дух. Затем Творец плоти зашивает плоть вокруг стали.<\/li><li><b>Последствия:<\/b> Плоть может отторгнуть сталь, тогда начинается жар и гниль вокруг крепления. В этом случае жрец вводит Чистую Кровь. Железные жрецы говорят, что сталь — продолжение плоти, а Волчьи жрецы отвечают, что только если плоть с этим согласна.<\/li><\/ul><h3 id=\"wolf3-22\">Замена Сердца<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Одно из сердец разорвано или сожжено<\/li><li><b>Что нужно:<\/b> Аугметическое сердце, Бальзам «Железный Сон», лазерный резак, сшиватель<\/li><li><b>Ход операции:<\/b> Пока бьётся второе сердце, торопиться некуда: воин живёт и сражается с одним. В апотекарионе его усыпляют, вскрывают грудь, удаляют мёртвое сердце и вживляют на его место аугметическое.<\/li><li><b>Последствия:<\/b> Волк с одним сердцем слабее в долгом бою и быстрее устаёт. Некоторые отказываются от стального сердца и так и живут с одним сердцем до конца.<\/li><\/ul><h3 id=\"wolf3-23\">Замена Лёгкого<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Лёгкое сожжено газом, огнём или выгорело после «Второго Дыхания»<\/li><li><b>Что нужно:<\/b> Аугметическое лёгкое, Бальзам «Железный Сон», сшиватель<\/li><li><b>Ход операции:<\/b> Воина усыпляют, вскрывают грудь, удаляют мёртвое лёгкое и ставят на его место аугметическое. Мультилёгкое проверяют отдельно, ведь оно могло выгореть вместе с ним.<\/li><li><b>Последствия:<\/b> Стальное лёгкое не чувствует ядов в воздухе, поэтому воин может не заметить отравленной атмосферы, пока не станет поздно.<\/li><\/ul><h3 id=\"wolf3-24\">Очищение Крови<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Яд или биотоксин, с которым не справилась оолитовая почка. Кровь темнеет, воин слабеет, раны не закрываются.<\/li><li><b>Что нужно:<\/b> Сыворотка «Чистая Кровь», при ядах тварей Сыворотка «Ответный Укус», нартециум<\/li><li><b>Ход операции:<\/b> Жрец вводит Чистую Кровь в лимфатическую систему против тока. Затем он пускает кровь из жилы, пока она не посветлеет. Выпущенную кровь сжигают.<\/li><li><b>Последствия:<\/b> Воин слаб несколько дней, пока гемастамен не восполнит кровь. Почку после этого проверяют, не отказала ли она.<\/li><\/ul><h3 id=\"wolf3-25\">Извлечение Паразита<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> В теле воина поселилась тварь ксеносов: личинки, черви, споры или чужой имплант<\/li><li><b>Что нужно:<\/b> Костяной клинок, Мазь «Жгучий Клык», нартециум<\/li><li><b>Ход операции:<\/b> Жрец находит паразита диагностом и вскрывает тело над ним. Тварь вырезают целиком вместе с плотью вокруг, ведь оставленный кусок вырастет снова. Рану выжигают Жгучим Клыком.<\/li><li><b>Последствия:<\/b> Вырезанного паразита жрец сохраняет, чтобы изучить и узнать, как защитить от него стаю.<\/li><\/ul><h3 id=\"wolf3-26\">Пробуждение от Мнимой Смерти<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Показания:<\/b> Воина довезли до апотекариона в сус-ан, и его раны залечены<\/li><li><b>Что нужно:<\/b> Мазь «Холод Фенриса», Препарат «Волчий Поцелуй», цепи<\/li><li><b>Ход операции:<\/b> Воина на всякий случай приковывают. Жрец втирает Холод Фенриса над сердцами и зовёт воина по имени, пока тот не откроет глаза. Первое слово, которое скажет проснувшийся, жрец слушает внимательно: если вместо слова рык, сразу даётся Волчий Поцелуй.<\/li><li><b>Последствия:<\/b> Чем дольше длилась мнимая смерть, тем ближе зверь к поверхности после пробуждения.<\/li><\/ul><h2 id=\"wolf3-27\">Аугметика<\/h2><p>Сталь ставят только туда, где плоть уже не вернуть. Аугметику куёт Железный жрец, а вживляют её вместе: Волчий жрец или Творец плоти готовит плоть, Железный жрец соединяет сталь с нервами и будит её дух. Здоровое тело сталью не заменяют никогда, даже по просьбе воина.<\/p><p><b>Смертным<\/b> аугметику ставят так же, как Астартес, но осторожнее. «Железный Сон» дают им лишь малой долей, иначе Нидхёгг-Яд остановит сердце. Раны у них заживают медленнее, а плоть чаще отторгает сталь.<\/p><div class=\"tbl\"><table><thead><tr><th>Аугметика<\/th><th>Когда<\/th><th>Кому<\/th><th>Операция<\/th><\/tr><\/thead><tbody><tr><td>Аугметическая челюсть<\/td><td>Снесена нижняя челюсть<\/td><td>Астартес и смертным<\/td><td>Железная Пасть<\/td><\/tr><tr><td>Вокс-горло<\/td><td>Разорвана или сожжена гортань<\/td><td>Астартес и смертным<\/td><td>Вокс-горло<\/td><\/tr><tr><td>Аугметическое ухо<\/td><td>Погибло ухо или Ухо Лаймана<\/td><td>Астартес и смертным<\/td><td>Железное Ухо<\/td><\/tr><tr><td>Нюхач<\/td><td>Снесён нос<\/td><td>Почти только Астартес<\/td><td>Стальной Нюх<\/td><\/tr><tr><td>Черепная пластина<\/td><td>Утрачена часть черепа<\/td><td>Астартес и смертным<\/td><td>Черепная Пластина<\/td><\/tr><tr><td>Аугметический глаз<\/td><td>Выбит или выжжен глаз<\/td><td>Астартес и смертным<\/td><td>Замена Глаза<\/td><\/tr><tr><td>Стальные рёбра<\/td><td>Раздроблена грудная клетка<\/td><td>Астартес и смертным<\/td><td>Стальные Рёбра<\/td><\/tr><tr><td>Стальные позвонки<\/td><td>Раздроблен хребет<\/td><td>Астартес, смертным редко<\/td><td>Железный Хребет<\/td><\/tr><tr><td>Аугметическое чрево<\/td><td>Разорван желудок или кишки<\/td><td>Почти только смертным<\/td><td>Железное Чрево<\/td><\/tr><tr><td>Аугметическое сердце<\/td><td>Погибло сердце<\/td><td>Астартес<\/td><td>Замена Сердца<\/td><\/tr><tr><td>Аугметическое лёгкое<\/td><td>Погибло лёгкое<\/td><td>Астартес<\/td><td>Замена Лёгкого<\/td><\/tr><tr><td>Бионическая кисть<\/td><td>Отрублены кисть или пальцы<\/td><td>Астартес и смертным<\/td><td>Железная Кисть<\/td><\/tr><tr><td>Бионическая рука или нога<\/td><td>Утрачена конечность<\/td><td>Астартес и смертным<\/td><td>Железная Рука<\/td><\/tr><tr><td>Аугметический сустав<\/td><td>Раздроблены колено, бедро или плечо<\/td><td>Астартес и смертным<\/td><td>Железный Сустав<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf3-28\">Железная Пасть<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец или Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Снесена нижняя челюсть, и Возвращение Лица уже не поможет. Часто вместе с ней утрачен язык.<\/li><li><b>Что нужно:<\/b> Аугметическая челюсть, при утрате языка с вокс-решёткой; Бальзам «Железный Сон»; лазерный резак; сшиватель; Мазь «Узы Стужи» или Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Железный жрец снимает мерку с черепа и верхних зубов и куёт челюсть так, чтобы она смыкалась с верхним рядом. Раненого усыпляют. Если рана старая, жрец срезает рубец и снимает криво сросшуюся кость до живой. Железный жрец вводит шарниры в суставные ямки черепа, крепит челюсть к скулам и соединяет её с нервами, а вокс-решётку с нервами горла. Затем он будит дух челюсти Литанией Сбора, и жрец зашивает кожу вокруг стали.<\/li><li><b>Последствия:<\/b> Без языка воин говорит через вокс-решётку ровным металлическим голосом и первое время ест только жидкое. Астартес скоро учатся рвать мясо и стальной пастью. Если вокруг шарниров начался жар, вводят Чистую Кровь.<\/li><\/ul><h3 id=\"wolf3-29\">Вокс-горло<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Гортань разорвана клинком или когтем, сожжена газом или кислотой. Воин дышит, но не может говорить.<\/li><li><b>Что нужно:<\/b> Вокс-горло, Мазь «Жгучий Клык», сшиватель, при ожоге Мазь «Узы Стужи»<\/li><li><b>Ход операции:<\/b> Творец плоти вычищает горло Жгучим Клыком до здоровой плоти и укрепляет трахею, чтобы она не схлопнулась. Железный жрец вживляет вокс-горло на место гортани и подключает его к нервам. Воина будят и велят говорить, а Железный жрец подстраивает голос, пока тот не станет похож на прежний.<\/li><li><b>Последствия:<\/b> Голос остаётся хриплым, с металлическим звоном. Волки говорят, что такой голос хорош для боевого клича. Вой воина стая узнаёт по-прежнему, хоть он и звучит чужим.<\/li><\/ul><h3 id=\"wolf3-30\">Железное Ухо<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Ухо разорвано взрывом или выжжено. У Астартес погибло Ухо Лаймана, и воин теряет слух и равновесие.<\/li><li><b>Что нужно:<\/b> Аугметическое ухо, лазерный резак, сшиватель<\/li><li><b>Ход операции:<\/b> Творец плоти убирает остатки уха и раскрывает канал до кости. Железный жрец вживляет аугметическое ухо и соединяет его со слуховым нервом и с органом равновесия. Затем воина ставят на ноги с закрытыми глазами, и Железный жрец правит настройку, пока тот не устоит.<\/li><li><b>Последствия:<\/b> Первые дни звук слишком громкий и плоский, воин путает, откуда он идёт. Стальное ухо ловит вокс-сигналы, но не слышит, как шуршит снег под лапой волка. Многие Волки ворчат на это до конца жизни.<\/li><\/ul><h3 id=\"wolf3-31\">Стальной Нюх<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец вместе с Мастером Кузни<\/li><li><b>Показания:<\/b> Нос и носовые ходы снесены или выжжены. Для Волка это тяжелее потери глаза: он больше не чует ни врага, ни следа, ни брата.<\/li><li><b>Что нужно:<\/b> Нюхач работы Мастера Кузни, Мазь «Узы Стужи», сшиватель<\/li><li><b>Ход операции:<\/b> Волчий жрец восстанавливает кость носа и раскрывает ходы до обонятельных нервов. Мастер Кузни вживляет нюхач и соединяет его тонкие провода с нервами по одному. Пока он работает, жрец подносит к раненому кровь, дым, волчью шерсть и прометий и спрашивает, что тот чует.<\/li><li><b>Последствия:<\/b> Ни один нюхач не чует так, как Волк, ведь его нюх дан Канис Хеликс. Сталь чует яд, прометий и кровь, но не страх и не ложь. Поэтому Волк со стальным нюхом редко идёт первым по следу.<\/li><\/ul><h3 id=\"wolf3-32\">Черепная Пластина<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, пластину куёт Кователь<\/li><li><b>Показания:<\/b> После Трепанации или удара часть черепа не вернуть<\/li><li><b>Что нужно:<\/b> Пластина из керамита или стали Фенриса, Бальзам «Железный Сон», сшиватель<\/li><li><b>Ход операции:<\/b> Раненого погружают в Железный Сон. Творец плоти выравнивает края кости, кладёт пластину на место утраченного и крепит её заклёпками к живой кости. Кожу натягивают поверх, если её хватает, а если нет, пластина остаётся открытой.<\/li><li><b>Последствия:<\/b> Открытую пластину Волки покрывают рунами, как щит. Удар по ней воин держит не хуже, чем костью, но в лютый мороз сталь холодит голову.<\/li><\/ul><h3 id=\"wolf3-33\">Стальные Рёбра<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Грудная клетка Астартес раздроблена так, что оссмодула её не срастит. У смертного сломано столько рёбер, что грудь не держит дыхание.<\/li><li><b>Что нужно:<\/b> Стальные рёбра из стали Фенриса, для Астартес из адамантия; керамитовые шины; Бальзам «Железный Сон»; Сыворотка «Чистая Кровь»<\/li><li><b>Ход операции:<\/b> Грудь вскрывают в апотекарионе. Жрец убирает осколки, которые нельзя спасти, а то, что срастётся, держит шинами. Железный жрец ставит стальные рёбра на место утраченных и крепит их к грудине и хребту. Перед тем как закрыть грудь, жрец проверяет оба сердца и лёгкие.<\/li><li><b>Последствия:<\/b> За год кость и сталь срастаются в одно. До тех пор воину нельзя принимать удары в грудь.<\/li><\/ul><h3 id=\"wolf3-34\">Железный Хребет<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец вместе с Мастером Кузни<\/li><li><b>Показания:<\/b> Позвонки раздроблены, и Сращивание Хребта не помогло. Воин не чувствует ног.<\/li><li><b>Что нужно:<\/b> Стальные позвонки, Бальзам «Железный Сон», керамитовые шины, сшиватель, Сыворотка «Чистая Кровь»<\/li><li><b>Ход операции:<\/b> Самая долгая из операций аугметики, её проводят только в апотекарионе Клыка. Воина погружают в Железный Сон. Жрец вскрывает спину и удаляет мёртвые позвонки, не задевая спинного мозга. Мастер Кузни ставит на их место стальные позвонки и сшивает проводами каждый нерв, что прошёл через рану. Когда работа закончена, жрец будит воина и колет ему стопу.<\/li><li><b>Последствия:<\/b> Если воин почувствовал укол, операция удалась. Если нет, Мастер Кузни ищет оборванный нерв, и это может длиться днями. Ходить заново воин учится месяцами. Смертным эту операцию проводят редко: они чаще умирают на столе, чем встают.<\/li><\/ul><h3 id=\"wolf3-35\">Железное Чрево<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Смертному разорвало или сожгло чрево, и Замок на Чреве лишь удержал его живым. Астартес оно почти не нужно: их тело переварит что угодно и с распоротым чревом.<\/li><li><b>Что нужно:<\/b> Аугметическое чрево, Мазь «Жгучий Клык», сшиватель, Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Творец плоти вскрывает живот, удаляет мёртвую часть желудка или кишок и вычищает рану Жгучим Клыком. Железный жрец вживляет аугметическое чрево и соединяет его с уцелевшей плотью. Рану закрывают, и неделю смертного кормят только бульоном.<\/li><li><b>Последствия:<\/b> Со стальным чревом смертный ест меньше и не болеет от гнилого мяса. Но если чрево встанет, он умрёт за пару дней, поэтому Железные жрецы проверяют его каждый сезон.<\/li><\/ul><h3 id=\"wolf3-36\">Железная Кисть<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Отрублены пальцы или кисть, а рука выше цела<\/li><li><b>Что нужно:<\/b> Бионическая кисть, сшиватель, Сыворотка «Чистая Кровь»<\/li><li><b>Ход операции:<\/b> Как в Железной Руке, но тоньше. Творец плоти выводит к креплению каждое сухожилие запястья. Железный жрец соединяет их с пальцами кисти и будит её дух. Затем воину дают в руку топор и смотрят, как он его держит.<\/li><li><b>Последствия:<\/b> Кисть держит оружие как живая, но не чувствует тепла и холода, только давление. Волки говорят, что такая рука хороша для топора и плоха для мёда: не чуешь, когда рог полон.<\/li><\/ul><h3 id=\"wolf3-37\">Железный Сустав<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, сустав куёт Кователь<\/li><li><b>Показания:<\/b> Колено, бедро или плечо раздроблены, а кость выше и ниже цела<\/li><li><b>Что нужно:<\/b> Аугметический сустав, керамитовые шины, морозная смазка Железных жрецов, сшиватель<\/li><li><b>Ход операции:<\/b> Творец плоти вскрывает сустав, убирает осколки и спиливает концы кости под крепления. Сустав ставят на место и крепят к костям, а перед тем как зашить, смазывают морозной смазкой.<\/li><li><b>Последствия:<\/b> Через месяц воин ходит как прежде. Раз в год смазку меняют через малый порт. Без неё сустав скрипит на морозе так, что слышит вся стая.<\/li><\/ul><h3 id=\"wolf3-38\">Отторжение Стали<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Вокруг аугметики жар, гной и чернота, а Чистая Кровь не помогла<\/li><li><b>Что нужно:<\/b> Сыворотка «Чистая Кровь», Мазь «Жгучий Клык», костяной клинок, Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Железный жрец снимает аугметику и проверяет, не взбесился ли её дух. Жрец вычищает гниль вокруг крепления Жгучим Клыком, а то, что тронуто порчей, срезает костяным клинком. Рану держат открытой под Болотным Покровом, пока плоть не очистится, и только потом сталь ставят заново.<\/li><li><b>Последствия:<\/b> Если плоть отторгнет сталь второй раз, Волчьи жрецы говорят, что тело не согласно. Тогда воин живёт без аугметики, и Железный жрец не спорит.<\/li><\/ul><h3 id=\"wolf3-39\">Снятие Стали<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец вместе с Железным жрецом<\/li><li><b>Показания:<\/b> Пал воин со сталью в теле<\/li><li><b>Что нужно:<\/b> Клык Моркаи, когитаторные провода Железного жреца<\/li><li><b>Ход операции:<\/b> Сначала Волчий жрец забирает генное семя. Затем Железный жрец снимает аугметику и читает её дух: что видела сталь в последнем бою. Аугметику, которую воин назвал по имени, сжигают вместе с ним. Остальную уносят в Кузню, перековывают и отдают другому.<\/li><li><b>Последствия:<\/b> Новый хозяин знает, чья сталь в нём, и поминает прежнего на тризне.<\/li><\/ul><h2 id=\"wolf3-40\">Генное семя<\/h2><p>Самые священные операции жрецов. От них зависит, будет ли у легиона завтра.<\/p><h3 id=\"wolf3-41\">Извлечение Семени<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, слова Обряда Моркаи говорит Волчий жрец<\/li><li><b>Показания:<\/b> Брат пал, и его прогеноиды ещё живы. Счёт идёт на часы.<\/li><li><b>Что нужно:<\/b> Клык Моркаи, ледяной сосуд для семени, костяная бирка<\/li><li><b>Ход операции:<\/b> Прогеноидов два, один в шее, другой в груди. Жрец вскрывает тело Клыком Моркаи и извлекает оба, не повредив их оболочку. Семя кладут в ледяной сосуд и запечатывают, а на сосуде вырезают имя павшего.<\/li><li><b>Последствия:<\/b> Если тело сгорело или жрец опоздал, семя погибло вместе с братом. Семя того, кто умер зверем, хранят отдельно и проверяют особо.<\/li><\/ul><h3 id=\"wolf3-42\">Чтение Семени<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Показания:<\/b> Каждое извлечённое семя перед тем, как отдать его аспиранту<\/li><li><b>Что нужно:<\/b> Диагност нартециума, корень плакун-травы, пепел Двахкарр<\/li><li><b>Ход операции:<\/b> Жрец проверяет семя на мутации, порчу и следы Проклятия Вульфена. Пока идёт проверка, он держит в руке корень плакун-травы: если корень заныл, в семени есть порча, даже если диагност молчит.<\/li><li><b>Последствия:<\/b> Порченое семя сжигают с пеплом Двахкарр, а его имя всё равно остаётся в сагах. Чистое семя ждёт своего аспиранта.<\/li><\/ul><h3 id=\"wolf3-43\">Вкушение Хеликса<\/h3><ul><li><b>Проводит:<\/b> Старший жрец<\/li><li><b>Показания:<\/b> Аспирант готов к Испытанию Моркаи<\/li><li><b>Что нужно:<\/b> Таинство «Кубок Вульфена», Препарат «Волчий Поцелуй», нартециум<\/li><li><b>Ход операции:<\/b> Хеликс входит в тело аспиранта с напитком из Кубка, как описано в обряде Кубка Вульфена. Перед этим жрец осматривает аспиранта: сердце, кости, кровь. Слабого к Кубку не допускают, ведь Хеликс его просто убьёт.<\/li><li><b>Последствия:<\/b> Тело аспиранта ломается и перестраивается. Выживет ли он, решают его воля и дорога домой.<\/li><\/ul><h3 id=\"wolf3-44\">Становление<\/h3><ul><li><b>Проводит:<\/b> Творцы плоти под надзором Волчьего жреца<\/li><li><b>Показания:<\/b> Аспирант вернулся из Испытания Моркаи человеком<\/li><li><b>Что нужно:<\/b> Органы, выращенные из чистого семени, Бальзам «Железный Сон», апотекарион<\/li><li><b>Ход операции:<\/b> Органы вживляют не сразу, а ступенями, и между ними проходят месяцы.<ol><li><b>Ступень крови и кости.<\/b> Вторичное сердце, оссмодула, бископея для мышц, гемастамен и орган Ларрамана.<\/li><li><b>Ступень зверя.<\/b> Каталептический узел, преомнор, омофагия, мультилёгкое, окулоб и ухо Лаймана.<\/li><li><b>Ступень шкуры.<\/b> Сус-ан мембрана, меланохром, оолитовая почка, нейроглоттис, мукраноид и железа Бетчера.<\/li><li><b>Ступень наследия.<\/b> Прогеноиды, которые однажды заберёт у воина другой жрец.<\/li><\/ol><\/li><li><b>Последствия:<\/b> После каждой ступени аспиранта проверяют на отторжение и пробуждение зверя. Каждый новый орган будит Хеликс, поэтому Волчий Поцелуй держат наготове.<\/li><\/ul><h3 id=\"wolf3-45\">Чёрный Панцирь<\/h3><ul><li><b>Проводит:<\/b> Творец плоти вместе с Железным жрецом, слова говорит Волчий жрец<\/li><li><b>Показания:<\/b> Последний орган, после которого воин получает силовой доспех<\/li><li><b>Что нужно:<\/b> Чёрный панцирь, Бальзам «Железный Сон», сшиватель<\/li><li><b>Ход операции:<\/b> Панцирь вживляют под кожу груди и спины. Жрец соединяет его с нервами, а Железный жрец открывает порты, через которые доспех будет говорить с телом. Когда воин просыпается, ему впервые подают его доспех.<\/li><li><b>Последствия:<\/b> Боль от вживления держится неделями. С этого дня доспех становится второй кожей воина, и жрец говорит ему: «Теперь ты Волк».<\/li><\/ul><h2 id=\"wolf3-46\">Надзор и вскрытие<\/h2><p>Операции, которыми жрец следит за здоровьем стаи и узнаёт, что убивает его братьев.<\/p><h3 id=\"wolf3-47\">Пересчёт Ран<\/h3><ul><li><b>Проводит:<\/b> Творец плоти или Избранный жрецом<\/li><li><b>Показания:<\/b> После каждого боя, для каждого воина, даже если он говорит, что цел<\/li><li><b>Что нужно:<\/b> Нартециум, Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Воин снимает доспех. Жрец осматривает тело, обнюхивает раны, чтобы учуять гниль, проверяет зрачки и слух. Волки из гордости прячут раны, поэтому жрец ищет их сам: под наплечниками, на спине, под старыми шрамами.<\/li><li><b>Последствия:<\/b> Скрытая рана, найденная жрецом, — повод для насмешек стаи над её хозяином. Скрытая рана, которую жрец не нашёл, — повод для Суда Саг над жрецом.<\/li><\/ul><h3 id=\"wolf3-48\">Осмотр на Проклятие<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Показания:<\/b> После тяжёлых боёв, перед возвращением на Фенрис, после отвара «Зов Зверя» или если стая заметила странное<\/li><li><b>Что нужно:<\/b> Сырое мясо, Препарат «Волчий Поцелуй», Взвар «Ледяная Купель»<\/li><li><b>Ход операции:<\/b> Жрец ищет признаки зверя:<ol><li>Смотрит в глаза: не пожелтели ли они.<\/li><li>Проверяет клыки: не выросли ли они с прошлого осмотра.<\/li><li>Даёт сырое мясо и смотрит, как воин ест.<\/li><li>Сидит рядом, пока воин спит половиной мозга, и слушает: не рычит ли он во сне.<\/li><li>Спрашивает о последнем бое: нет ли провалов в памяти.<\/li><\/ol><\/li><li><b>Последствия:<\/b> Ранние признаки снимают Волчьим Поцелуем и Ледяной Купелью. Если зверь уже близко, жрец проводит Укрощение Зверя.<\/li><\/ul><h3 id=\"wolf3-49\">Вскрытие Павшего<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Показания:<\/b> Брат умер, и неясно от чего: невидимое оружие, неизвестный яд, колдовство. Проводится после Извлечения Семени.<\/li><li><b>Что нужно:<\/b> Костяные клинки, нартециум, корень плакун-травы<\/li><li><b>Ход операции:<\/b> Жрец вскрывает тело и ищет причину смерти органа за органом. Если корень плакун-травы заныл, причина в колдовстве, и жрец зовёт рунного жреца. Всё найденное жрец рассказывает стае.<\/li><li><b>Последствия:<\/b> После вскрытия тело сжигают, как положено. Узнанное спасает тех, кто ещё жив.<\/li><\/ul><h3 id=\"wolf3-50\">Вскрытие Врага<\/h3><ul><li><b>Проводит:<\/b> Творец плоти или Волчий жрец<\/li><li><b>Показания:<\/b> Стая встретила неизвестного ксеноса или врага, которого трудно убить<\/li><li><b>Что нужно:<\/b> Лазерный резак, костяные клинки, нартециум<\/li><li><b>Ход операции:<\/b> Жрец разбирает тело врага и ищет, где у него сердце, мозг, слабые места в броне. Он же решает, можно ли воинам есть эту плоть, чтобы омофагия открыла им память врага.<\/li><li><b>Последствия:<\/b> Плоть, отравленную ядом или порчей, есть запрещено. Нарушивший запрет может навсегда принести в себе чужой голос.<\/li><\/ul><h3 id=\"wolf3-51\">Изгнание Порчи<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец, при сильном колдовстве вместе с рунным жрецом<\/li><li><b>Показания:<\/b> Тело воина тронуто колдовством: странные метки, язвы, шёпот в голове, чужие сны<\/li><li><b>Что нужно:<\/b> Препарат «Антитварин», костяной клинок, ветвь хельвинтерской омелы, можжевельник<\/li><li><b>Ход операции:<\/b> Жрец даёт Антитварин и ждёт, пока раствор не выжжет порчу из крови. Отмеченную плоть он вырезает костяным клинком, ведь железо порчу не берёт. Вырезанное сжигают на можжевельнике, а над постелью воина вешают омелу.<\/li><li><b>Последствия:<\/b> Если порча дошла до разума, одного ножа мало. Тогда судьбу воина решают Старший жрец и рунный жрец вместе.<\/li><\/ul><h2 id=\"wolf3-52\">Раны Фенриса<\/h2><p>Твари родного мира ранят даже Астартес, а аспирантов и смертных слуг легиона убивают. Эти раны жрецы знают лучше всего.<\/p><h3 id=\"wolf3-53\">Морозный Ожог<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, для смертных и Избранный жрецом<\/li><li><b>Показания:<\/b> Дыхание ледяного змея или ночь во льдах без укрытия. Кожа белеет, твердеет и начинает отваливаться.<\/li><li><b>Что нужно:<\/b> Мазь «Тёплая Шкура», костяной клинок, тёплая вода<\/li><li><b>Ход операции:<\/b> Обмороженное нельзя растирать снегом и нельзя совать в огонь. Жрец срезает мёртвую белую кожу, отогревает плоть тёплой водой медленно, понемногу, и толсто мажет Тёплой Шкурой.<\/li><li><b>Последствия:<\/b> Астартес восстанавливаются за дни. Смертный может потерять пальцы, нос или уши.<\/li><\/ul><h3 id=\"wolf3-54\">Гнилой Укус<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Укус термального ящера. Хватка мёртвая, а в пасти гниют остатки прошлой добычи, поэтому рана гноится долго и злобно.<\/li><li><b>Что нужно:<\/b> Сок дикого чеснока, Мазь «Жгучий Клык», Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Рану раскрывают и промывают соком дикого чеснока, пока не уйдёт гной. Из раны вынимают всё, что оставил ящер: обломки зубов, грязь, гниль. Затем её выжигают Жгучим Клыком и закрывают Покровом.<\/li><li><b>Последствия:<\/b> Если обломок зуба остался в ране, она откроется снова через неделю.<\/li><\/ul><h3 id=\"wolf3-55\">Кислота в Глазах<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, Избранный жрецом<\/li><li><b>Показания:<\/b> Брызги телифона в лицо. Глаза слезятся, кожа слезает, воин слепнет.<\/li><li><b>Что нужно:<\/b> Талая вода, облепиховое масло, повязка<\/li><li><b>Ход операции:<\/b> Глаза промывают талой водой долго, пока не уйдёт запах прокисшего мьода. Тереть нельзя. Обожжённую кожу вокруг смазывают облепиховым маслом, глаза закрывают повязкой.<\/li><li><b>Последствия:<\/b> Окулоб Астартес восстанавливает зрение за несколько дней. Если глаз выжжен совсем, нужна Замена Глаза.<\/li><\/ul><h3 id=\"wolf3-56\">Яд Жала<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Жало виверны, яд сколопендроморфа, жвала аракаса или эндриаги. Немеют руки и ноги, воин валится с ног.<\/li><li><b>Что нужно:<\/b> Сыворотка «Ответный Укус», при яде королевской виверны и Сыворотка «Чистая Кровь», нартециум<\/li><li><b>Ход операции:<\/b> Жрец находит место укуса, выдавливает или вырезает оттуда яд и вводит Ответный Укус выше раны. Если онемение доходит до груди, он вводит и Чистую Кровь.<\/li><li><b>Последствия:<\/b> Онемение проходит за часы. Яд королевской виверны без Чистой Крови останавливает даже два сердца.<\/li><\/ul><h3 id=\"wolf3-57\">Крик Нетопыря<\/h3><ul><li><b>Проводит:<\/b> Творец плоти<\/li><li><b>Показания:<\/b> Воин попал под визг нетопыря: из ушей течёт кровь, он не держит равновесия и шатается<\/li><li><b>Что нужно:<\/b> Нартециум, сшиватель, Бальзам «Железный Сон»<\/li><li><b>Ход операции:<\/b> Жрец проверяет, задето ли ухо Лаймана. Если разорваны только перепонки, он чистит уши от крови и закрывает их. Если ухо Лаймана повреждено, воина усыпляют и сшивают его заново.<\/li><li><b>Последствия:<\/b> Пока ухо не заживёт, воин сражается без равновесия, и в бой его не пускают.<\/li><\/ul><h3 id=\"wolf3-58\">Огненная Пыль<\/h3><ul><li><b>Проводит:<\/b> Творец плоти, для смертных и Избранный жрецом<\/li><li><b>Показания:<\/b> Воин надышался пыли огненного мха или ядовитых испарений вулкана: кашляет кровью, задыхается<\/li><li><b>Что нужно:<\/b> Отвар корня морозного папоротника, при тяжёлом случае Катализатор «Второе Дыхание»<\/li><li><b>Ход операции:<\/b> Раненого выносят на чистый воздух. Жрец даёт ему отвар корня морозного папоротника, который облегчает дыхание и снимает удушье. Если лёгкие отказывают, жрец будит Третье лёгкое.<\/li><li><b>Последствия:<\/b> Кашель держится несколько дней. Смертные после такого часто остаются с больной грудью на всю жизнь.<\/li><\/ul><h3 id=\"wolf3-59\">Укус Волка<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Показания:<\/b> Воина укусил фенрисийский волк, громовой волк или брат, в котором проснулся зверь<\/li><li><b>Что нужно:<\/b> Мазь «Жгучий Клык», Препарат «Волчий Поцелуй», Повязка «Болотный Покров»<\/li><li><b>Ход операции:<\/b> Сама рана простая, и её обрабатывают как обычную. Опасность в другом: слюна волка будит Канис Хеликс. Поэтому жрец закрывает рану, а потом три ночи подряд проводит Осмотр на Проклятие.<\/li><li><b>Последствия:<\/b> Если за три ночи зверь не показался, воин чист. Если показался, сразу даётся Волчий Поцелуй, а Волки говорят, что брата позвала стая с той стороны.<\/li><\/ul>","toc":[{"id":"wolf3-1","title":"О чём этот свиток?","level":2},{"id":"wolf3-2","title":"Инструменты жреца","level":3},{"id":"wolf3-3","title":"Органы Астартес, о которых идёт речь","level":3},{"id":"wolf3-4","title":"Полевая помощь","level":2},{"id":"wolf3-5","title":"Наложение Покрова","level":3},{"id":"wolf3-6","title":"Выжигание Раны","level":3},{"id":"wolf3-7","title":"Извлечение Болта","level":3},{"id":"wolf3-8","title":"Замок на Чреве","level":3},{"id":"wolf3-9","title":"Охлаждение Ожога","level":3},{"id":"wolf3-10","title":"Пробуждение Третьего Лёгкого","level":3},{"id":"wolf3-11","title":"Запуск Сердец","level":3},{"id":"wolf3-12","title":"Мнимая Смерть","level":3},{"id":"wolf3-13","title":"Хирургия плоти и кости","level":2},{"id":"wolf3-14","title":"Сращивание Костей","level":3},{"id":"wolf3-15","title":"Отсечение","level":3},{"id":"wolf3-16","title":"Трепанация","level":3},{"id":"wolf3-17","title":"Возвращение Лица","level":3},{"id":"wolf3-18","title":"Сращивание Хребта","level":3},{"id":"wolf3-19","title":"Замена Глаза","level":3},{"id":"wolf3-20","title":"Органы и аугметика","level":2},{"id":"wolf3-21","title":"Железная Рука","level":3},{"id":"wolf3-22","title":"Замена Сердца","level":3},{"id":"wolf3-23","title":"Замена Лёгкого","level":3},{"id":"wolf3-24","title":"Очищение Крови","level":3},{"id":"wolf3-25","title":"Извлечение Паразита","level":3},{"id":"wolf3-26","title":"Пробуждение от Мнимой Смерти","level":3},{"id":"wolf3-27","title":"Аугметика","level":2},{"id":"wolf3-28","title":"Железная Пасть","level":3},{"id":"wolf3-29","title":"Вокс-горло","level":3},{"id":"wolf3-30","title":"Железное Ухо","level":3},{"id":"wolf3-31","title":"Стальной Нюх","level":3},{"id":"wolf3-32","title":"Черепная Пластина","level":3},{"id":"wolf3-33","title":"Стальные Рёбра","level":3},{"id":"wolf3-34","title":"Железный Хребет","level":3},{"id":"wolf3-35","title":"Железное Чрево","level":3},{"id":"wolf3-36","title":"Железная Кисть","level":3},{"id":"wolf3-37","title":"Железный Сустав","level":3},{"id":"wolf3-38","title":"Отторжение Стали","level":3},{"id":"wolf3-39","title":"Снятие Стали","level":3},{"id":"wolf3-40","title":"Генное семя","level":2},{"id":"wolf3-41","title":"Извлечение Семени","level":3},{"id":"wolf3-42","title":"Чтение Семени","level":3},{"id":"wolf3-43","title":"Вкушение Хеликса","level":3},{"id":"wolf3-44","title":"Становление","level":3},{"id":"wolf3-45","title":"Чёрный Панцирь","level":3},{"id":"wolf3-46","title":"Надзор и вскрытие","level":2},{"id":"wolf3-47","title":"Пересчёт Ран","level":3},{"id":"wolf3-48","title":"Осмотр на Проклятие","level":3},{"id":"wolf3-49","title":"Вскрытие Павшего","level":3},{"id":"wolf3-50","title":"Вскрытие Врага","level":3},{"id":"wolf3-51","title":"Изгнание Порчи","level":3},{"id":"wolf3-52","title":"Раны Фенриса","level":2},{"id":"wolf3-53","title":"Морозный Ожог","level":3},{"id":"wolf3-54","title":"Гнилой Укус","level":3},{"id":"wolf3-55","title":"Кислота в Глазах","level":3},{"id":"wolf3-56","title":"Яд Жала","level":3},{"id":"wolf3-57","title":"Крик Нетопыря","level":3},{"id":"wolf3-58","title":"Огненная Пыль","level":3},{"id":"wolf3-59","title":"Укус Волка","level":3}]},{"id":"wolf4","title":"Песни и Саги Волчьих Жрецов","short":"Песни и саги","rune":"ᚨ","html":"<h2 id=\"wolf4-1\">О чём этот свиток?<\/h2><p>Сага для Волка — не просто песня у очага. Говорящие с мёртвыми складывают её так, чтобы строки врастали в память и держали воина в бою, в ярости и в стае. Песни звучат на древнем языке Фенриса, ведь на нём говорили первые воины Русса, и на нём же к Волкам обращаются боги.<\/p><p>Здесь собраны обрядовые песни жрецов и саги о них самих. Список пополняется.<\/p><p><b>Как читать древнескандинавский:<\/b><\/p><div class=\"tbl\"><table><thead><tr><th>Буква<\/th><th>Как читать<\/th><th>Пример<\/th><\/tr><\/thead><tbody><tr><td>þ<\/td><td>глухое «с» с языком между зубами, как английское th в think<\/td><td>þú — «сы» → ты<\/td><\/tr><tr><td>ð<\/td><td>звонкое «з» с языком между зубами, как th в this<\/td><td>bróðir — «броузир»<\/td><\/tr><tr><td>á, é, í, ó, ú<\/td><td>долгие гласные: а, е, и, о, у тянутся<\/td><td>úlfr — «уульвр»<\/td><\/tr><tr><td>æ<\/td><td>широкое «э»<\/td><td>þvæ — «свээ»<\/td><\/tr><tr><td>ö, ø<\/td><td>«ё» без «й» в начале, как в «мёд»<\/td><td>öx — «ёкс»<\/td><\/tr><tr><td>y<\/td><td>«ю» без «й», губы трубочкой<\/td><td>flytja<\/td><\/tr><tr><td>r в конце слова<\/td><td>отчётливое раскатистое «р»<\/td><td>úlfr, snjór<\/td><\/tr><tr><td>f между гласными<\/td><td>«в»<\/td><td>Ulfar — «ульвар»<\/td><\/tr><\/tbody><\/table><\/div><p>Ударение всегда падает на первый слог. Над каждой песней сказано, когда её поют, а рядом с текстом дан перевод.<\/p><h2 id=\"wolf4-2\">Песни<\/h2><h3 id=\"wolf4-3\">Heitstrenging — Злая Клятва<\/h3><p><b>Когда поют:<\/b> Перед битвой, в обряде Злой Клятвы. Жрец поёт, стая отвечает рёвом после каждого имени павшего.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Heyr, Morkai, hér stöndum vér,<\/td><td>Слушай, Моркаи, здесь стоим мы,<\/td><\/tr><tr><td>gráir úlfar, járni klæddir.<\/td><td>серые волки, в железо одетые.<\/td><\/tr><tr><td>Eigi komum vér at deyja,<\/td><td>Не пришли мы, чтобы умереть,<\/td><\/tr><tr><td>heldr at drepa.<\/td><td>но чтобы убивать.<\/td><\/tr><tr><td>Nefni ek nöfn fallinna<\/td><td>Называю я имена павших<\/td><\/tr><tr><td>bræðra várra, er blóð gáfu:<\/td><td>братьев наших, что отдали кровь:<\/td><\/tr><tr><td><i>Стая:<\/i> Hann lifir í oss!<\/td><td><i>Стая:<\/i> Он живёт в нас!<\/td><\/tr><tr><td>Svá skulu óvinir falla<\/td><td>Так падут враги,<\/td><\/tr><tr><td>sem fellr snjór á Fenri.<\/td><td>как падает снег на Фенрис.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-4\">Einfaraljóð — Песнь Одинокого Волка<\/h3><p><b>Когда поют:<\/b> В обряде Омовения Одинокого Волка, тихо, над умирающим.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Þvæ ek blóð af enni þínu,<\/td><td>Смываю кровь с твоего лба,<\/td><\/tr><tr><td>at Morkai sjái andlit þitt.<\/td><td>чтобы Моркаи увидел твоё лицо.<\/td><\/tr><tr><td>Tak øxi þína í hönd,<\/td><td>Возьми в руку свой топор,<\/td><\/tr><tr><td>statt upp, bróðir.<\/td><td>встань, брат.<\/td><\/tr><tr><td>Eigi skaltu liggja<\/td><td>Не лежать тебе,<\/td><\/tr><tr><td>er hann kemr at sækja þik.<\/td><td>когда он придёт за тобой.<\/td><\/tr><tr><td>Ek geng á braut<\/td><td>Я ухожу<\/td><\/tr><tr><td>ok lít eigi aptr.<\/td><td>и не оглядываюсь.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-5\">Bálfararkvæði — Песнь Огненных Проводов<\/h3><p><b>Когда поют:<\/b> У погребального костра. Последние строки жрец поёт, уже стоя к огню спиной.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Brenn þú, bróðir, á báli háu,<\/td><td>Гори, брат, на высоком костре,<\/td><\/tr><tr><td>far þú til Morkai með höfuð hátt.<\/td><td>иди к Моркаи с поднятой головой.<\/td><\/tr><tr><td>Nagla þína skerum vér,<\/td><td>Ногти твои мы срезаем,<\/td><\/tr><tr><td>at Naglfar smíðisk seint.<\/td><td>чтоб Нагльфар строился медленно.<\/td><\/tr><tr><td>Baki snúum vér við eldi,<\/td><td>Спиной мы встаём к огню,<\/td><\/tr><tr><td>at vér kallim þik eigi aptr.<\/td><td>чтобы не позвать тебя назад.<\/td><\/tr><tr><td>Vér fylgðum þér.<\/td><td>Мы тебя проводили.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-6\">Erfikvæði — Песнь Тризны<\/h3><p><b>Когда поют:<\/b> В начале и в конце Тризны Павших. Последние две строки — старое изречение, которое знает каждый фенрисиец.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Fyllum horn, fyllum horn<\/td><td>Наполним рога, наполним рога<\/td><\/tr><tr><td>fyrir þá er fóru.<\/td><td>за тех, кто ушёл.<\/td><\/tr><tr><td>Nefn hann ok drekk,<\/td><td>Назови его и пей,<\/td><\/tr><tr><td>nefn hinn næsta ok drekk.<\/td><td>назови следующего и пей.<\/td><\/tr><tr><td>Meðan vér munum,<\/td><td>Пока мы помним,<\/td><\/tr><tr><td>eru þeir í flokki.<\/td><td>они в стае.<\/td><\/tr><tr><td>Deyr fé, deyja frændr,<\/td><td>Гибнут стада, умирают родичи,<\/td><\/tr><tr><td>en orðstírr deyr aldregi.<\/td><td>но слава не умрёт никогда.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-7\">Kalksljóð — Песнь Кубка<\/h3><p><b>Когда поют:<\/b> Когда аспирант пьёт из Кубка Вульфена. Поёт Старший жрец, стая молчит.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Drekk þú, sveinn, af dreyra Russ,<\/td><td>Пей, юноша, кровь Русса,<\/td><\/tr><tr><td>vakir úlfr í brjósti þér.<\/td><td>в груди твоей просыпается волк.<\/td><\/tr><tr><td>Bein þín bresta,<\/td><td>Трещат твои кости,<\/td><\/tr><tr><td>hár þitt vex.<\/td><td>растёт твоя шерсть.<\/td><\/tr><tr><td>Rata þú heim, ef þú ratar,<\/td><td>Найди дорогу домой, если сможешь,<\/td><\/tr><tr><td>eða ver með vörgum.<\/td><td>или останься с волками.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-8\">Spekjuljóð — Песнь Укрощения<\/h3><p><b>Когда поют:<\/b> В обряде Укрощения Зверя, снова и снова, пока брат не затихнет. По саге, её сложил Ульфхам Чернорукий.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Heyr nafn þitt, heyr nafn þitt,<\/td><td>Слушай своё имя, слушай своё имя,<\/td><\/tr><tr><td>eigi ertu dýr.<\/td><td>ты не зверь.<\/td><\/tr><tr><td>Sonr flokks ertu,<\/td><td>Ты сын стаи,<\/td><\/tr><tr><td>snú þú aptr til þín.<\/td><td>вернись к себе.<\/td><\/tr><tr><td>Saga þín bíðr,<\/td><td>Твоя сага ждёт,<\/td><\/tr><tr><td>bræðr þínir bíða.<\/td><td>твои братья ждут.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-9\">Hornkveðja — Приветствие Рога<\/h3><p><b>Когда поют:<\/b> В обряде Рог и Сага, когда вернувшемуся подают рог.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Drekk með oss,<\/td><td>Выпей с нами,<\/td><\/tr><tr><td>kveð með oss,<\/td><td>спой с нами,<\/td><\/tr><tr><td>þá ertu með oss.<\/td><td>тогда ты с нами.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-10\">Huldarorð — Слова Сокрытия<\/h3><p><b>Когда говорят:<\/b> Шёпотом, в обряде Сокрытия Следов, пока жрец чертит полосы пеплом.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Enginn þefr. Ekki spor. Engir vér.<\/td><td>Нет запаха. Нет следа. Нет нас.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-11\">Saumljóð — Песнь Сшивания<\/h3><p><b>Когда поют:<\/b> Творец плоти напевает её, пока сшивает рану или сращивает кость. По ритму песни руки держат шаг стежков.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Saum ek sár þitt, bróðir,<\/td><td>Сшиваю рану твою, брат,<\/td><\/tr><tr><td>bein við bein,<\/td><td>кость к кости,<\/td><\/tr><tr><td>blóð við blóð,<\/td><td>кровь к крови,<\/td><\/tr><tr><td>hold við hold,<\/td><td>плоть к плоти,<\/td><\/tr><tr><td>sem heilt væri.<\/td><td>будто цело и было.<\/td><\/tr><tr><td>Bít á jaxl ok þegi.<\/td><td>Стисни зубы и молчи.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-12\">Sárataljóð — Счёт Ран<\/h3><p><b>Когда поют:<\/b> Во время Пересчёта Ран после боя. Жрец считает раны вслух, а последней строкой поддевает воина, если подозревает, что тот что-то прячет.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Eitt sár, tvau sár, þrjú sár.<\/td><td>Одна рана, две раны, три раны.<\/td><\/tr><tr><td>Hvar leyndir þú it fjórða?<\/td><td>Где ты спрятал четвёртую?<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-13\">Dauðasvefn — Песнь Мнимой Смерти<\/h3><p><b>Когда поют:<\/b> Когда жрец погружает раненого в сус-ан. Поётся тихо и медленно, в такт замедляющимся сердцам.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Sof þú, úlfr, sof þú djúpt,<\/td><td>Спи, волк, спи глубоко,<\/td><\/tr><tr><td>hjörtu þín hægja á sér.<\/td><td>сердца твои затихают.<\/td><\/tr><tr><td>Morkai sér þik, en tekr eigi.<\/td><td>Моркаи видит тебя, но не берёт.<\/td><\/tr><tr><td>Ek vek þik, þá er tími kemr.<\/td><td>Я разбужу тебя, когда придёт время.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-14\">Vakningarljóð — Песнь Пробуждения<\/h3><p><b>Когда поют:<\/b> При Пробуждении от Мнимой Смерти. Последней строкой жрец требует от проснувшегося слова, а не рыка.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Vakna þú, bróðir,<\/td><td>Проснись, брат,<\/td><\/tr><tr><td>heyr nafn þitt.<\/td><td>услышь своё имя.<\/td><\/tr><tr><td>Mæl þú orð, sem maðr.<\/td><td>Скажи слово, как человек.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-15\">Holdsmíð — Песнь Становления<\/h3><p><b>Когда поют:<\/b> Над аспирантом после каждой ступени Становления, когда в него вживлён новый орган.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Nýtt hjarta, ný bein,<\/td><td>Новое сердце, новые кости,<\/td><\/tr><tr><td>nýtt blóð í æðum þínum.<\/td><td>новая кровь в твоих жилах.<\/td><\/tr><tr><td>Þú vart sveinn,<\/td><td>Ты был юношей,<\/td><\/tr><tr><td>nú verðr þú úlfr.<\/td><td>теперь становишься волком.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"wolf4-16\">Brynjuljóð — Песнь Доспеха<\/h3><p><b>Когда поют:<\/b> Когда воину после вживления Чёрного панциря впервые подают его доспех.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Járn er nú skinn þitt,<\/td><td>Железо теперь твоя кожа,<\/td><\/tr><tr><td>brynja er hold þitt.<\/td><td>доспех теперь твоя плоть.<\/td><\/tr><tr><td>Nú ertu úlfr.<\/td><td>Теперь ты Волк.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"wolf4-17\">Саги<\/h2><h3 id=\"wolf4-18\">Úlfhams saga — Сага об Ульфхаме Черноруком<\/h3><p>Ульфхам был знахарем племени Русс ещё до того, как Всеотец спустился на Фенрис. Он умел вправлять кости и знал травы, но в бою стоял позади, и над ним смеялись.<\/p><p>Когда Русс дал первым своим воинам испить из Кубка, многие ушли в дикость Асахейма и не вернулись. На третий день ярлы сказали: «Кто не вернулся, тот выбрал волков». Ульфхам ничего не ответил, взял сумку с травами и ушёл в горы.<\/p><p>Первого брата он нашёл мёртвым в снегу. Ульфхам сложил ему костёр, остриг ногти и сжёг их отдельно, а пока горел огонь, стоял к нему спиной. Второго он нашёл на туше лося: тот рвал мясо зубами, и в глазах его не было ничего человеческого. Ульфхам сел напротив и всю ночь пел ему его же имя и его сагу. К утру зверь уснул, но проснулся зверем, и Ульфхам отпустил его в лес. Третьего он нашёл на полпути к Клыку: тот полз, забыв своё имя. Ульфхам взвалил его на плечи и пел всю дорогу, и у ворот Клыка брат назвал себя сам.<\/p><p>Когда Ульфхам вернулся, руки его были черны по локоть от пепла и сажи. Русс спросил, где он был. Ульфхам ответил: «Ходил за теми, кого вы оставили». Тогда Русс сказал при всём Эйнхерьяре: «Кто ходит за мёртвыми, тот и будет говорить за них».<\/p><p>С тех пор у Творцов плоти руки черны по локоть, а у ворот Клыка аспирантов встречает жрец. Песнь, которую Ульфхам пел зверю, поют до сих пор. Говорят, отпущенный им волк каждую зиму приходит к воротам Клыка и ждёт, что его позовут по имени.<\/p><h3 id=\"wolf4-19\">Saga þriggja spurninga — Сага о Трёх Вопросах<\/h3><p>Храфнкель Сизобородый был Волчьим жрецом. На мире, имя которого скальды уже забыли, пал хускарл ярла по имени Торгейр, и с ним пропала весть о том, кто открыл врагу ворота. Храфнкель остался с телом на ночь и выпил «Взор Моркаи».<\/p><p>Первым он спросил: «Кто открыл ворота?» Мёртвый назвал имя смертного слуги, и стая потом нашла его. Вторым он спросил: «Что ты не успел сказать?» Мёртвый передал слово для своего побратима, и Храфнкель отнёс его.<\/p><p>Тогда мёртвый спросил сам: «Когда ты дал мне Омовение, можно ли было меня спасти?» И Храфнкель, как велит обычай, ответил правду: «Можно было. Я не дослушал твоё второе сердце».<\/p><p>На рассвете он пришёл к стае, рассказал всё, не утаив ни слова, и сам потребовал Суда Саг над собой. Старший жрец спросил, чего он просит. Храфнкель ответил: «Метки». Но стая не дала её начертить, ведь Торгейр в разговоре его не проклял. Старший жрец решил так: Храфнкель понесёт бирку Торгейра до конца жизни рядом со своей первой биркой, а его вина будет вписана в сагу, чтобы её помнил каждый жрец.<\/p><p>С тех пор жрец, прежде чем дать Омовение, кладёт ладонь на грудь раненого дважды, слева и справа, и слушает оба сердца. А на вопрос мёртвого жрецы отвечают правду до сих пор, хотя знают, чего она может стоить.<\/p><h3 id=\"wolf4-20\">Saga jarls er eigi vék — Сага о Ярле, что не уступил дороги<\/h3><p>Был в легионе молодой ярл, скорый и на топор, и на слово. Однажды в залах Клыка навстречу ему шёл старый Волчий жрец Гейррод Тихий. Свита ярла, как велит обычай, отступила к стенам, а сам ярл остался посреди прохода и сказал: «Я ярл, а ты лекарь. Обойдёшь». Жрец посмотрел на него, ничего не сказал и обошёл. Свита ждала беды, но ничего не случилось, и ярл решил, что победил.<\/p><p>Через год, на чужой луне, ярла разрубили почти надвое, и стая сочла его мёртвым. Первым к нему подошёл Гейррод. Ярл узнал его и прохрипел: «Ну вот, теперь уступлю тебе дорогу». Жрец ответил: «Мне не нужна была твоя дорога. Мне нужно было, чтобы ты дожил до дня, когда поймёшь, зачем её уступают». Он не дал ярлу Омовения, а три дня держал его на этом свете Ледяным Замком и своими руками.<\/p><p>Ярл выжил. Говорят, с того дня он первым отходил к стене, завидев любого жреца, даже Избранного, и требовал того же от своих людей. Когда его спрашивали почему, он отвечал: «Однажды я уже стоял у него на дороге. Больше не хочу».<\/p><h3 id=\"wolf4-21\">Saga Þorvalds er tvisvar kom heim — Сага о Торвальде, что вернулся дважды<\/h3><p>Брат Торвальд из Кровавых Когтей пропал на мире смерти, поросшем ядовитым лесом. Стая сочла его павшим и сожгла его бирку. Через год к лагерю стаи вышел Торвальд: худой, израненный, но живой. Братья кинулись к нему, но дорогу загородил молодой Избранный жрецом по имени Эйвар.<\/p><p>Эйвар подал вернувшемуся рог, как учил наставник. Торвальд выпил и не поморщился. Тогда Эйвар попросил спеть строку из саги стаи. Торвальд спел, и спел верно. Стая уже смеялась над осторожным учеником, но тут Торвальд вернул Эйвару пустой рог и сказал: «Спасибо, брат».<\/p><p>Эйвар тут же схватился за нож. За всю жизнь Торвальд ни разу никому не сказал спасибо, и вся стая это знала. Тварь в чужой шкуре поняла, что её раскрыли, и бросилась на ученика. Её зарубили вшестером.<\/p><p>Через три дня к лагерю выполз настоящий Торвальд, без руки и в лихорадке. Он выпил рог, спел свою строку, а когда ему стали перевязывать культю, обругал Творца плоти последними словами. Тогда стая наконец его обняла.<\/p><p>С тех пор обряд Рог и Сага проводят над каждым вернувшимся, будь то простой воин или ярл. А на Фенрисе с тех пор говорят: «Если брат стал вежлив, проверь его дважды».<\/p><h3 id=\"wolf4-22\">Kolbeins saga — Сага о Кольбейне Беспалом<\/h3><p>Кольбейн был Творцом плоти всего одну зиму, когда в грудь его ярлу вошёл болт и не разорвался. Снаряд застрял между двумя сердцами, и детонатор его ещё щёлкал. Кольбейн велел стае отойти, но ярл засмеялся и сказал: «Если мне суждено взорваться, пусть хоть кто-нибудь это увидит».<\/p><p>Кольбейн не стал спорить. Он усыпил ярла, раскрыл ему грудь и взял болт щипцами за корпус. Когда он тянул его наружу, детонатор щёлкнул в последний раз. Кольбейн не стал бросать снаряд на землю, ведь рядом лежал ярл. Он сжал болт в кулаке и отвёл руку так далеко, как мог.<\/p><p>Взрыв унёс ему три пальца и половину ладони. Другой рукой Кольбейн закончил операцию и зашил ярлу грудь, а уже потом позволил перевязать себя.<\/p><p>Железные жрецы сделали ему новую руку. Когда его спрашивали, не жалеет ли он о пальцах, Кольбейн отвечал: «Стальные пальцы не дрожат. Жаль, что я не потерял их раньше». С тех пор, когда жрец вынимает болт, стая отходит, и не спорит даже ярл.<\/p><h3 id=\"wolf4-23\">Saga þess er svaf — Сага о Том, Кто Спал<\/h3><p>На брошенном корабле, дрейфовавшем в пустоте сорок зим, стая нашла Волка в мнимой смерти. Доспех его был цел, а сердца били раз в минуту. Никто в стае не знал его имени, а жрец, который когда-то его усыпил, давно ушёл к Моркаи.<\/p><p>Молодой Волчий жрец Асбьёрн понимал: разбуди воина без имени, и проснётся зверь. Тогда он пошёл к старым жрецам и стал перебирать бирки памяти, которые остались после его давно умершего предшественника. На одной бирке было вырезано имя Хьяльти, а рядом руна «спит».<\/p><p>Асбьёрн приковал воина и стал звать его: «Хьяльти!» Тот открыл глаза и зарычал. Тогда Асбьёрн запел Песнь Укрощения и пел её, пока не охрип. Наконец рык смолк, и проснувшийся сказал первое слово. Это было не его имя, а имя жреца, который его усыпил.<\/p><p>Асбьёрн рассказал ему, что того жреца давно нет. Хьяльти долго молчал, потом попросил отвести его на Тризну и сам назвал своего жреца среди павших. С тех пор жрецы, усыпляя брата, вырезают его имя на своей бирке, чтобы тот, кто придёт после, знал, кого будить.<\/p><h3 id=\"wolf4-24\">Hjartadeilu saga — Сага о Споре за Сердце<\/h3><p>В бою с ксеносами Свейну Рыжему разорвало одно сердце. На корабле над ним сошлись Творец плоти Торд и Железный жрец Хальвард. Хальвард держал стальное сердце и говорил: «Сталь не устаёт и не болеет. Ставь её». Торд держал руку на груди Свейна и отвечал: «Он и с одним сердцем Волк. Не тебе решать, чем он будет жить».<\/p><p>Спорили они так долго и так громко, что Свейн очнулся от каталептического сна. Он послушал их и сказал: «Сердце ставьте стальное, мне ещё воевать. А петь на Тризне я буду своим горлом, его не трогайте».<\/p><p>Торд и Хальвард переглянулись и рассмеялись, и с тех пор работали вместе. Говорят, на Тризне Свейн всегда стучал кулаком по груди, где звенела сталь, и говорил: «Это за Торда, а это за Хальварда». С тех пор, если жрецы спорят о теле брата, последнее слово остаётся за самим братом, если он может его сказать.<\/p><h3 id=\"wolf4-25\">Saga etinnar minningar — Сага о Съеденной Памяти<\/h3><p>На мире, где враг прятался в норах под землёй, Кровавый Коготь Ульв съел плоть убитого вождя ксеносов, хотя Волчий жрец Гест запретил это делать. Омофагия открыла Ульву память врага, но вместе с ней в его голову вошёл чужой голос.<\/p><p>Ночью Ульв проснулся и заговорил на языке, которого никто не знал. Гест приковал его, дал Антитварин и начал Изгнание Порчи. Тогда голос из Ульва сказал на понятном языке: «Отпусти меня, и я покажу, где лежит гнездо. Иначе твоя стая найдёт его, когда будет поздно».<\/p><p>Гест долго молчал. Потом он позвал ярла, и голос показал путь. Стая нашла гнездо и выжгла его до последней твари. Когда она вернулась, Гест взял костяной клинок и закончил Изгнание. Голос кричал, что его обманули, но Гест ответил: «Я обещал выслушать тебя, а не отпустить».<\/p><p>Ульв выжил, но до конца жизни иногда видел во сне чужие норы. Гест сам потребовал над собой Суда Саг за то, что торговался с порчей. Стая вписала в сагу и его вину, и спасённые жизни, а решение оставили самому Руссу. Говорят, Русс выслушал, посмеялся и сказал: «Обмануть порчу — тоже ремесло».<\/p>","toc":[{"id":"wolf4-1","title":"О чём этот свиток?","level":2},{"id":"wolf4-2","title":"Песни","level":2},{"id":"wolf4-3","title":"Heitstrenging — Злая Клятва","level":3},{"id":"wolf4-4","title":"Einfaraljóð — Песнь Одинокого Волка","level":3},{"id":"wolf4-5","title":"Bálfararkvæði — Песнь Огненных Проводов","level":3},{"id":"wolf4-6","title":"Erfikvæði — Песнь Тризны","level":3},{"id":"wolf4-7","title":"Kalksljóð — Песнь Кубка","level":3},{"id":"wolf4-8","title":"Spekjuljóð — Песнь Укрощения","level":3},{"id":"wolf4-9","title":"Hornkveðja — Приветствие Рога","level":3},{"id":"wolf4-10","title":"Huldarorð — Слова Сокрытия","level":3},{"id":"wolf4-11","title":"Saumljóð — Песнь Сшивания","level":3},{"id":"wolf4-12","title":"Sárataljóð — Счёт Ран","level":3},{"id":"wolf4-13","title":"Dauðasvefn — Песнь Мнимой Смерти","level":3},{"id":"wolf4-14","title":"Vakningarljóð — Песнь Пробуждения","level":3},{"id":"wolf4-15","title":"Holdsmíð — Песнь Становления","level":3},{"id":"wolf4-16","title":"Brynjuljóð — Песнь Доспеха","level":3},{"id":"wolf4-17","title":"Саги","level":2},{"id":"wolf4-18","title":"Úlfhams saga — Сага об Ульфхаме Черноруком","level":3},{"id":"wolf4-19","title":"Saga þriggja spurninga — Сага о Трёх Вопросах","level":3},{"id":"wolf4-20","title":"Saga jarls er eigi vék — Сага о Ярле, что не уступил дороги","level":3},{"id":"wolf4-21","title":"Saga Þorvalds er tvisvar kom heim — Сага о Торвальде, что вернулся дважды","level":3},{"id":"wolf4-22","title":"Kolbeins saga — Сага о Кольбейне Беспалом","level":3},{"id":"wolf4-23","title":"Saga þess er svaf — Сага о Том, Кто Спал","level":3},{"id":"wolf4-24","title":"Hjartadeilu saga — Сага о Споре за Сердце","level":3},{"id":"wolf4-25","title":"Saga etinnar minningar — Сага о Съеденной Памяти","level":3}]}],"recipes":[{"kind":"Мазь","name":"Холод Фенриса","rarity":2,"rarityName":"◦ Продвинутый","ingredients":["Кротахк","Йотун-Крак","Хранд-Лось","Асах-Ват"],"ground":[1,1,1,1],"recipe":"В костяной чаше холодный Йотун-Крак растирают с густым Хранд-Лось. В массу всыпают истолчённый в порошок Кротахк и заливают ледяной Асах-Ват, пока смесь не начнёт яростно пениться.","effect":"Криогенный нейростимулятор. Резко расширяет сосуды, разгоняет обмен веществ Астартес, не даёт впасть в шок и ускоряет доставку кислорода к органам.","translation":"Кротахк — высушенный язык термального ящера. Йотун-Крак — вытяжка из глубинных желёз кракена. Хранд-Лось — очищенный жир фенрисийского лося. Асах-Ват — перегнанная талая вода ледников Асахейма."},{"kind":"Мазь","name":"Жгучий Клык","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Рекк-Паук","Телиф-Сок","Орф-Антак","Фьорд-Мох"],"ground":[0,0,0,0],"recipe":"В каменной чаше соединяют агрессивный Рекк-Паук и едкий Телиф-Сок. Когда бурная реакция стихает, состав гасят Орф-Антак, чтобы кислота не проела здоровую плоть, и засыпают вяжущим порошком Фьорд-Мох.","effect":"Выжигает и растворяет ксенозаразу и омертвевшую плоть кислотой фенрисийских членистоногих, со свистом стерилизуя рану до здоровых тканей. Фьорд-Мох держит мазь на ране и останавливает кровь.","translation":"Рекк-Паук — концентрированная кислота из жвал кикиморы. Телиф-Сок — едкий секрет из хвостовых желёз телифона. Орф-Антак — костяная мука. Фьорд-Мох — порошок фьордового мха."},{"kind":"Катализатор","name":"Второе Дыхание","rarity":2,"rarityName":"◦ Продвинутый","ingredients":["Валь-Гриф","Хаз-Так","Тандер-Карр","Один-Кор"],"ground":[1,0,1,1],"recipe":"Свежую Валь-Гриф соединяют в тигле с истолчённым Тандер-Карр и вытяжкой Один-Кор. В эссенцию всыпают стружку Хаз-Так, и она запускает химический микровзрыв.","effect":"Форсирует работу Третьего лёгкого. Применяется при тяжёлых ранениях грудной клетки или отравлении газами, сжёгшими основные лёгкие. Разгоняет имплант на 300% и позволяет дышать даже чистым хлором или до получаса держаться в вакууме без шлема.","translation":"Валь-Гриф — насыщенная кислородом кровь из предсердия грифона. Хаз-Так — стружка лёгочных хрящей громового волка. Тандер-Карр — перем
