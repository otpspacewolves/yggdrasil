<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Иггдрасиль гальдров</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kelly+Slab&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Exo+2:wght@400;600&family=Noto+Sans+Runic&display=swap">
<style>
:root {
  --void: #010104;
  --space: #04050c;
  --glass: rgba(12, 16, 36, .78);
  --glass-strong: rgba(9, 12, 28, .94);
  --edge: rgba(143, 243, 255, .26);
  --edge-strong: rgba(143, 243, 255, .55);
  --fg: #e8ecff;
  --muted: #929ac4;
  --faint: #5b6288;
  --cyan: #8ff3ff;
  --gold: #e3c27a;
  --danger: #F74447;
  --good: #0CE430;
  --accent: #8ff3ff;
  --head: "Kelly Slab", Georgia, serif;
  --text: "Alegreya Sans", system-ui, sans-serif;
  --ui: "Exo 2", system-ui, sans-serif;
  --rune: "Noto Sans Runic", serif;
  color-scheme: dark;
}
body.in-realm { --edge: color-mix(in srgb, var(--accent) 32%, transparent); --edge-strong: color-mix(in srgb, var(--accent) 62%, transparent); --glass: color-mix(in srgb, var(--accent) 7%, rgba(6, 6, 12, .84)); --glass-strong: color-mix(in srgb, var(--accent) 6%, rgba(4, 4, 9, .95)); --cyan: color-mix(in srgb, var(--accent) 70%, #fff); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--fg); font-family: var(--text); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.card, .card *, #lore article, #lore article * { -webkit-user-select: text; user-select: text; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
button { font: inherit; color: inherit; }

#cosmos { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

#viewport { position: fixed; inset: 0; z-index: 1; cursor: grab; touch-action: none; opacity: 0; transition: opacity .7s ease; }
#viewport.shown { opacity: 1; }
#viewport.dragging { cursor: grabbing; }
#viewport.shake { animation: shake var(--dur, .6s) linear 1; }
@keyframes shake {
  10% { transform: translate(calc(var(--amp) * -1px), calc(var(--amp) * .6px)); }
  20% { transform: translate(calc(var(--amp) * .9px), calc(var(--amp) * -.8px)); }
  30% { transform: translate(calc(var(--amp) * -.7px), calc(var(--amp) * -.5px)); }
  45% { transform: translate(calc(var(--amp) * .6px), calc(var(--amp) * .7px)); }
  60% { transform: translate(calc(var(--amp) * -.4px), calc(var(--amp) * .3px)); }
  80% { transform: translate(calc(var(--amp) * .2px), calc(var(--amp) * -.2px)); }
}
.amb { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world canvas { position: absolute; left: 0; top: 0; pointer-events: none; }

.node {
  position: absolute;
  width: var(--s);
  height: var(--s);
  margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--rc);
  background: rgba(6, 9, 26, .9);
  color: var(--c);
  font: calc(var(--s) * .56) / 1 var(--rune);
  display: grid;
  place-items: center;
  cursor: pointer;
  outline: none;
  transition: background .4s ease, box-shadow .4s ease, transform .3s ease, color .3s ease, border-color .4s ease;
}
.node::after { content: ""; position: absolute; pointer-events: none; border-radius: 50%; opacity: 0; transition: opacity .5s ease; }
.node.lit::after { opacity: 1; }
.node.locked { background: rgba(4, 6, 16, .55); border-color: rgba(220, 240, 255, .26); border-width: 1px; color: rgba(230, 245, 255, .36); transform: scale(.82); }
.node.open { box-shadow: 0 0 6px var(--rc); animation: breathe 2.8s ease-in-out infinite; }
.node.lit { background: color-mix(in srgb, var(--c) 62%, #05060f); border-color: color-mix(in srgb, var(--rc) 50%, #fff); color: #fff; text-shadow: 0 0 6px #fff; box-shadow: 0 0 8px var(--c), 0 0 22px var(--c); }
.node.flash { animation: flash .9s ease-out 1; }
#trans { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 12; pointer-events: none; }
.world { transition: filter .4s linear; }
.world.igniting .node { animation: appear .8s ease-out both; animation-delay: var(--d); }

.realm-bra .node { background: radial-gradient(circle at 45% 40%, #2c1d17, #0b0604); border-color: #5c3a2a; color: #9a6a50; }
.realm-bra .node.open { border-color: #ff6b2c; color: #ffb070; box-shadow: 0 0 6px #ff6b2c, inset 0 0 6px rgba(255, 90, 20, .5); animation: smolder 2.2s ease-in-out infinite; }
.realm-bra .node.lit { background: radial-gradient(circle at 45% 40%, #fff6c2 0, #ffb53b 20%, #e2470f 45%, #6a1404 75%, #1c0402 100%); border-color: #ffd27a; color: #3a0800; text-shadow: 0 0 5px #fff1b0; box-shadow: 0 0 10px #ff6b2c, 0 0 30px #ff3d00; animation: coal 2.6s ease-in-out infinite alternate; }
.realm-bra .node::after { inset: -55%; background: repeating-conic-gradient(from 0deg, rgba(255, 170, 40, .95) 0 7deg, rgba(255, 70, 0, .5) 7deg 11deg, transparent 11deg 24deg); -webkit-mask: radial-gradient(circle, transparent 40%, #000 47%, transparent 72%); mask: radial-gradient(circle, transparent 40%, #000 47%, transparent 72%); filter: blur(1.4px); animation: spin 6s linear infinite, flicker 2.4s ease-in-out infinite; }
@keyframes smolder { 50% { box-shadow: 0 0 12px #ff6b2c, inset 0 0 10px rgba(255, 90, 20, .8); } }
@keyframes coal { from { filter: brightness(.88) saturate(1.1); } to { filter: brightness(1.25) saturate(1.3); } }
@keyframes flicker { 50% { opacity: .8; transform: scale(1.04) rotate(6deg); } }

.realm-is .node { background: radial-gradient(circle at 40% 35%, #23394a, #08121c); border-color: rgba(190, 235, 255, .45); color: #a8dcf0; }
.realm-is .node.locked { background: rgba(20, 34, 46, .6); border-color: rgba(200, 235, 255, .22); color: rgba(200, 235, 255, .35); }
.realm-is .node.open { border-color: #bff3ff; box-shadow: 0 0 8px #8fe3ff, inset 0 0 8px rgba(200, 245, 255, .45); }
.realm-is .node.lit { background: linear-gradient(140deg, #ffffff 0, #dff8ff 28%, #8fe3ff 58%, #2c78b8 100%); border-color: #fff; color: #0b2c48; text-shadow: 0 0 4px #fff; box-shadow: 0 0 10px #8fe3ff, 0 0 26px #4fb8ff, inset 0 0 8px #fff; }
.realm-is .node::after { inset: -45%; background: repeating-conic-gradient(from 0deg, rgba(235, 252, 255, .95) 0 3deg, transparent 3deg 60deg); -webkit-mask: radial-gradient(circle, transparent 42%, #000 46%, transparent 72%); mask: radial-gradient(circle, transparent 42%, #000 46%, transparent 72%); animation: spin 14s linear infinite; }

.realm-vind .node { background: radial-gradient(circle at 40% 35%, #283048, #0b0e18); border-color: rgba(210, 220, 255, .4); color: #b8c4ea; }
.realm-vind .node.open { box-shadow: 0 0 8px #d2dcff; }
.realm-vind .node.lit { background: radial-gradient(circle, #ffffff 0, #e6ecff 40%, #7c8ac4 100%); border-color: #fff; color: #1a2240; text-shadow: 0 0 4px #fff; box-shadow: 0 0 12px #d2dcff, 0 0 26px #9aa8ff; }
.realm-vind .node::after { inset: -40%; background: conic-gradient(from 0deg, transparent 0 10%, rgba(255, 255, 255, .85) 24%, transparent 26% 43%, rgba(255, 255, 255, .85) 57%, transparent 59% 76%, rgba(255, 255, 255, .85) 90%, transparent 92%); -webkit-mask: radial-gradient(circle, transparent 46%, #000 50%, transparent 70%); mask: radial-gradient(circle, transparent 46%, #000 50%, transparent 70%); animation: spin 3s linear infinite; }

.realm-elding .node { background: radial-gradient(circle at 40% 35%, #2e2a14, #0c0b06); border-color: rgba(255, 225, 74, .4); color: #c9b45a; }
.realm-elding .node.open { box-shadow: 0 0 8px #ffe14a; }
.realm-elding .node.lit { background: radial-gradient(circle, #fffef0 0, #fff27a 30%, #ffc800 60%, #7a5a00 100%); border-color: #fffbe0; color: #3a2a00; text-shadow: 0 0 4px #fff; animation: zap 3.2s ease-in-out infinite; }
.realm-elding .node::after { inset: -50%; background: repeating-conic-gradient(from 10deg, rgba(255, 250, 190, .95) 0 2deg, transparent 2deg 47deg); -webkit-mask: radial-gradient(circle, transparent 40%, #000 44%, transparent 74%); mask: radial-gradient(circle, transparent 40%, #000 44%, transparent 74%); animation: spin 4s linear infinite, arc 2.2s ease-in-out infinite; }
@keyframes zap { 0%, 100% { box-shadow: 0 0 10px #ffe14a, 0 0 26px #ffd000; } 50% { box-shadow: 0 0 16px #fff6a0, 0 0 36px #ffe14a; } }
@keyframes arc { 50% { opacity: .55; } }

.realm-and .node { background: radial-gradient(circle at 40% 35%, #16302c, #04100e); border-color: rgba(79, 240, 200, .38); color: #6cc8b2; }
.realm-and .node.open { box-shadow: 0 0 8px #4ff0c8; }
.realm-and .node.lit { background: radial-gradient(circle, rgba(230, 255, 248, .95) 0, rgba(79, 240, 200, .75) 45%, rgba(10, 70, 60, .45) 100%); border-color: rgba(220, 255, 245, .9); color: #fff; text-shadow: 0 0 8px #4ff0c8; box-shadow: 0 0 12px #4ff0c8, 0 0 30px rgba(79, 240, 200, .6); animation: haunt 3.4s ease-in-out infinite; }
.realm-and .node::after { inset: -30%; border: 1px solid rgba(160, 255, 230, .6); box-shadow: 0 0 10px rgba(79, 240, 200, .6); animation: ripple 2.6s ease-out infinite; }
@keyframes haunt { 50% { transform: translateY(-3px); filter: brightness(1.2); } }

.realm-vag .node { background: radial-gradient(circle at 40% 35%, #10304c, #030c16); border-color: rgba(47, 166, 240, .45); color: #6aaee0; }
.realm-vag .node.open { box-shadow: 0 0 8px #2fa6f0; }
.realm-vag .node.lit { background: linear-gradient(180deg, #e6fbff 0, #7fd2ff 28%, #2fa6f0 55%, #0a3a6a 100%); border-color: #d6f4ff; color: #04223c; text-shadow: 0 0 4px #fff; box-shadow: 0 0 10px #2fa6f0, 0 0 26px #1a7ad0; }
.realm-vag .node::after { inset: -12%; border: 2px solid rgba(170, 230, 255, .8); animation: ripple 2s ease-out infinite; }
@keyframes ripple { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }

.realm-jord .node { background: radial-gradient(circle at 40% 35%, #3a3628, #12100a); border-color: rgba(155, 197, 61, .45); color: #a7b56a; }
.realm-jord .node.open { box-shadow: 0 0 8px #9bc53d; }
.realm-jord .node.lit { background: radial-gradient(circle at 40% 35%, #fff2b0 0, #ffc23a 25%, #c07a12 50%, #4a3a12 80%, #1c1a0a 100%); border-color: #d8f08a; color: #2a1a00; text-shadow: 0 0 4px #ffe8a0; box-shadow: 0 0 10px #ffb43a, 0 0 24px #9bc53d; }
.realm-jord .node::after { inset: -30%; background: repeating-conic-gradient(from 0deg, rgba(155, 197, 61, .9) 0 10deg, transparent 10deg 45deg); -webkit-mask: radial-gradient(circle, transparent 54%, #000 58%, transparent 70%); mask: radial-gradient(circle, transparent 54%, #000 58%, transparent 70%); }

.realm-morkai .node { background: linear-gradient(180deg, #3a2328, #170b0f); border-color: #d9c8b4; color: #f3e8d6; box-shadow: 0 2px 6px rgba(0, 0, 0, .8); }
.realm-morkai .node.open { box-shadow: 0 0 8px #e5485f, 0 2px 6px rgba(0, 0, 0, .8); }
.realm-morkai .node.locked { background: #140a0d; border-color: rgba(217, 200, 180, .35); color: rgba(243, 232, 214, .4); }
.realm-morkai .node.lit { background: radial-gradient(circle at 50% 40%, #e8d8c0 0, #b59a80 35%, #6a0d18 70%, #2a0308 100%); border-color: #ff6b82; color: #3a0008; text-shadow: 0 0 6px #ff6b82; box-shadow: 0 0 10px #e5485f, 0 0 30px #a01a30; }
.realm-morkai .node::after { inset: -40%; background: radial-gradient(circle, transparent 45%, rgba(200, 20, 40, .55) 55%, transparent 72%); filter: blur(2px); animation: pulse-red 2.4s ease-in-out infinite; }
@keyframes pulse-red { 50% { transform: scale(1.15); opacity: .5; } }

.realm-void .node { border: 0; background: transparent; color: transparent; }
.realm-void .node::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--c) 28%, transparent 62%); transform: scale(.5); opacity: .7; transition: transform .4s ease, opacity .4s ease; }
.realm-void .node.locked::before { transform: scale(.5); opacity: .6; }
.realm-void .node.open::before { transform: scale(.6); opacity: .95; }
.realm-void .node.open { box-shadow: none; animation: twinkle 4s ease-in-out infinite; }
.realm-void .node.lit { background: transparent; box-shadow: none; color: #fff; text-shadow: 0 0 8px #fff, 0 0 18px var(--c); }
.realm-void .node.lit::before { transform: scale(1.25); opacity: 1; background: radial-gradient(circle, #fff 0, #fff 14%, var(--c) 34%, transparent 64%); }
.realm-void .node::after { inset: -70%; background: conic-gradient(from 0deg, transparent 0 23%, rgba(220, 214, 255, .7) 24% 26%, transparent 27% 48%, rgba(220, 214, 255, .7) 49% 51%, transparent 52% 73%, rgba(220, 214, 255, .7) 74% 76%, transparent 77% 98%, rgba(220, 214, 255, .7) 99%); -webkit-mask: radial-gradient(circle, #000 0, transparent 60%); mask: radial-gradient(circle, #000 0, transparent 60%); animation: spin 9s linear infinite; }
@keyframes twinkle { 50% { filter: brightness(1.25); } }

.realm-elgr .node { background: linear-gradient(180deg, #e9dcc2, #a88f68); border-color: #6e5638; color: #4a3218; box-shadow: 0 2px 5px rgba(0, 0, 0, .7); }
.realm-elgr .node.locked { background: linear-gradient(180deg, #8a7a60, #4a3c28); border-color: rgba(40, 26, 12, .7); color: rgba(40, 26, 12, .7); }
.realm-elgr .node.open { box-shadow: 0 0 8px #ffd27a, 0 2px 5px rgba(0, 0, 0, .7); }
.realm-elgr .node.lit { background: radial-gradient(circle at 50% 40%, #fff6d8 0, #ffc35a 35%, #d0602a 70%, #6a1a20 100%); border-color: #fff0c0; color: #4a1400; text-shadow: 0 0 4px #fff; box-shadow: 0 0 10px #ffb84a, 0 0 26px #ff7ab6; }
.realm-elgr .node::after { left: 30%; right: 30%; top: -75%; height: 80%; border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%; background: radial-gradient(ellipse at 50% 80%, #fff8d0 0, #ffcf5a 30%, rgba(255, 110, 30, .8) 60%, transparent 75%); filter: blur(.6px); transform-origin: 50% 100%; animation: candle 1.6s ease-in-out infinite alternate; }
@keyframes candle { from { transform: scaleY(.9) rotate(-3deg); } to { transform: scaleY(1.12) rotate(3deg); } }

.seal-btn { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; }
.seal-btn:hover, .seal-btn:focus-visible { box-shadow: 0 0 0 2px var(--c), 0 0 24px var(--c); outline: none; }

.portal { position: absolute; width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--c) 55%, #000) 0%, rgba(2, 2, 6, .95) 48%, transparent 70%); transition: transform .3s ease; }
.portal::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 18%, var(--c) 32%, transparent 46% 66%, var(--c) 82%, transparent 96%); -webkit-mask: radial-gradient(circle, transparent 56%, #000 60%, #000 76%, transparent 80%); mask: radial-gradient(circle, transparent 56%, #000 60%, #000 76%, transparent 80%); animation: spin 7s linear infinite; filter: drop-shadow(0 0 8px var(--c)); }
.portal::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); box-shadow: inset 0 0 18px color-mix(in srgb, var(--c) 50%, transparent); animation: spin 11s linear infinite reverse; }
.portal .ring { position: absolute; inset: -9px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p, 0) * 360deg), rgba(255, 255, 255, .1) 0); -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%, #000 70%, transparent 72%); mask: radial-gradient(circle, transparent 64%, #000 66%, #000 70%, transparent 72%); filter: drop-shadow(0 0 4px var(--c)); }
.portal img { width: 44px; height: 44px; position: relative; filter: drop-shadow(0 0 8px var(--c)); }
.portal:hover, .portal:focus-visible { transform: scale(1.12); outline: none; }
.portal.sleeping { filter: saturate(.3) brightness(.6); }
.portal.sleeping::before, .portal.sleeping::after { animation: none; opacity: .35; }
.portal.back { width: 96px; height: 96px; margin: -48px 0 0 -48px; }
.portal.back img { width: 52px; height: 52px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { box-shadow: 0 0 12px var(--rc), 0 0 2px var(--rc); } }
@keyframes flash { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.5); box-shadow: 0 0 18px var(--c); } }
@keyframes appear { from { opacity: 0; transform: scale(.2); } }

.hud {
  position: fixed;
  z-index: 5;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  opacity: 0;
  transition: opacity .6s ease .3s;
  font-family: var(--ui);
}
.hud.shown { opacity: 1; }
.hud > * { pointer-events: auto; }
.brand { font-family: var(--head); font-size: 24px; line-height: 1; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent); margin-right: auto; letter-spacing: .02em; transition: color .6s ease; }
.brand small { display: block; font-family: var(--ui); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); text-shadow: none; margin-top: 6px; }
.counter { font-size: 14px; color: var(--cyan); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px color-mix(in srgb, var(--cyan) 50%, transparent); padding-inline: 4px; }
.btn {
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1;
  padding: 9px 13px;
  border-radius: 10px;
  border: 1px solid var(--edge);
  background: var(--glass);
  color: var(--fg);
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: border-color .2s ease, box-shadow .2s ease, background .6s ease;
}
.btn:hover, .btn:focus-visible { border-color: var(--edge-strong); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 30%, transparent); outline: none; }
.btn.danger { color: #ff8b8d; border-color: rgba(247, 68, 71, .4); }
.btn.danger:hover { border-color: var(--danger); box-shadow: 0 0 14px rgba(247, 68, 71, .3); }
.btn.go { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: var(--edge-strong); color: #fff; }
.btn[aria-expanded="true"] { border-color: var(--edge-strong); background: color-mix(in srgb, var(--accent) 16%, var(--glass)); }

.paths {
  position: fixed;
  z-index: 6;
  top: calc(66px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: min(330px, calc(100% - 32px));
  max-height: calc(100% - 100px);
  overflow-y: auto;
  display: grid;
  gap: 3px;
  padding: 10px;
  border-radius: 14px;
  background: var(--glass-strong);
  border: 1px solid var(--edge);
  backdrop-filter: blur(10px);
  font-family: var(--ui);
  animation: drop .3s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
.paths h4 { margin: 8px 8px 4px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 4px; }
.chip { flex: 1; display: flex; align-items: center; gap: 9px; font-size: 14px; padding: 6px 10px 6px 6px; border-radius: 10px; background: transparent; border: 1px solid transparent; cursor: pointer; text-align: left; transition: background .2s ease, border-color .2s ease; }
.chip:hover, .chip:focus-visible { background: color-mix(in srgb, var(--c) 14%, transparent); border-color: color-mix(in srgb, var(--c) 40%, transparent); outline: none; }
.chip img { width: 26px; height: 26px; filter: drop-shadow(0 0 5px var(--c)); flex: none; }
.chip b { font-weight: 600; color: var(--c); font-variant-numeric: tabular-nums; margin-left: auto; font-size: 13px; }
.chip.sleeping { opacity: .55; }
.info { width: 34px; height: 34px; flex: none; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); font-family: var(--rune); font-size: 16px; cursor: pointer; }
.info:hover, .info:focus-visible { color: var(--c); border-color: color-mix(in srgb, var(--c) 40%, transparent); outline: none; }

.card {
  position: fixed;
  z-index: 6;
  top: calc(76px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 340px;
  max-height: calc(100% - 160px);
  overflow-y: auto;
  padding: 20px 20px 18px;
  border-radius: 16px;
  background: var(--glass-strong);
  border: 1px solid color-mix(in srgb, var(--c, #8ff3ff) 45%, transparent);
  box-shadow: 0 0 40px color-mix(in srgb, var(--c, #8ff3ff) 18%, transparent), inset 0 0 0 4px rgba(4, 5, 12, .6);
  backdrop-filter: blur(10px);
  font-size: 18px;
  line-height: 1.45;

<script>
const GALDRA = [{"name":"Этт Йорд","tiers":[[["Каменный кулак","Атака","Рука одевается камнем: следующий удар отбрасывает цель.",1],["Метание валуна","Атака","Годи отрывает валун от земли и бросает по дуге, при падении разлетаются осколки.",1],["Каменная кожа","Защита","На 6 секунд кожа твердеет: меньше урона и отбрасывания.",0],["Зов руды","Обзор","Волна по земле подсвечивает руды и пустоты в радиусе.",0],["Каменный плен","Контроль","Каменные кандалы оплетают ноги цели, их можно сломать ударами.",0],["Корень горы","Атака","Под целью вырастают каменные шипы, подбрасывают её и стоят 6 секунд.",1],["Каменный шип","Атака","По земле бежит линия шипов и колет всех на пути.",1],["Каменное дыхание","Атака","Конус песка и гравия ранит и слепит.",0],["Корни","Контроль","Лозы оплетают врага, ранят и не дают двигаться.",1],["Эхо камня","Атака","Удар о землю: три кольца с нарастающей силой отбрасывают врагов.",1],["Рунный жернов","Атака","Каменный жернов с руной катится вперёд, давит врагов и отбрасывает.",1],["Камень-оберег","Защита","Под ногами годи ложится камень с руной: союзники в радиусе 2 блоков получают Сопротивление I, пока стоят рядом, 8 секунд.",0],["Тяжёлый шаг","Атака","Три следующих приземления годи бьют по земле: 3 урона и отброс в радиусе 2 блоков.",0],["Зыбучая земля","Контроль","Пятно рыхлой земли радиусом 3 блока на 5 секунд: враги вязнут (Замедление III) и не могут прыгать.",1],["Мох исцеления","Поддержка","У ног годи разрастается тёмно-зелёный мох радиусом 3 блока: 6 секунд лечит союзников по 1 здоровью в секунду.",1],["Щит курганов","Защита","Перед годи встаёт круглый каменный щит с умбоном: 6 секунд поворачивается вслед за взглядом и останавливает стрелы и снаряды.",0],["Каменный кистень","Атака","Годи раскручивает на цепи каменную гирю: два оборота по кругу радиусом 3 блока, по 5 урона и отброс.",0],["Жила руды","Контроль","В выбранную точку падает магнитный самородок: 2 секунды тянет к себе всех врагов в радиусе 6 блоков.",0],["Сланцевые диски","Атака","Три плоских диска из сланца летят веером, по 4 урона, каждый один раз рикошетит от стены.",0]],[["Обвал","Атака","С высоты на область падают камни, остаётся замедляющий щебень.",1],["Каменный щит","Защита","Вокруг годи вращаются четыре осколка и отбивают снаряды.",1],["Крепость предков","Защита","Три каменные плиты 10 секунд отталкивают подошедших и останавливают стрелы, союзники рядом с годи получают небольшой щит.",1],["Землетрясение","Атака","После короткого каста вокруг годи трясётся земля, урон и обездвиживание.",1],["Шипы","Атака","Годи выращивает иглы и выпускает их во все стороны несколькими волнами.",1],["Каменный страж","Призыв","Каменный голем 10 секунд встаёт из земли и служит, пока его не убьют: следует за годи, хватает и швыряет врагов, сковывает ударами, топотом раскидывает всех вокруг.",1],["Рунный менгир","Поддержка","На 15 секунд встаёт стоячий камень с руной Йорд: союзники рядом не отлетают от ударов, приблизившихся врагов отбрасывает.",1],["Пасть ущелья","Контроль","Земля под целью расходится, она проваливается на 2 блока, края смыкаются: 6 урона и 3 секунды без движения.",0],["Каменный волк","Призыв","Волк из валунов на 30 секунд: медленный, очень прочный, его прыжок сбивает с ног.",0]],[["Тяжесть гор","Контроль","Давящий круг: враги внутри тяжелеют, не прыгают и медленно ходят.",0],["Окаменение","Контроль","Цель на 3 секунды становится каменной статуей, затем скорлупа раскалывается.",0],["Подземный ход","Движение","Годи на 3 секунды уходит под землю и бежит под ней невидимым, затем вырывается наверх, расталкивая врагов.",1],["Раскол","Атака","Рассекает землю, оставляя перед собой непроходимую каменную борозду, оглушает и ранит всех на линии.",0],["Топор Горы","Атака","Гигантский каменный топор падает и рассекает землю дугой, оглушает всех на линии.",0],["Ландветтиры-копатели","Призыв","Двое призрачных ландветтиров 10 секунд роют под врагами: где они вынырнут, земля подбрасывает всех вверх.",0],["Кости ётуна","Контроль","Вокруг выбранной точки из земли встают каменные рёбра великана и смыкаются куполом: враги внутри заперты 4 секунды и получают 8 урона.",0],["Лавина валунов","Атака","По линии 20 блоков катятся пять валунов: каждый 6 урона и сбивает с ног.",1]],[["Кулак Горы","Атака","Исполинский каменный кулак пробивает землю под целью и бьёт сверху вниз.",0],["Рождение горы","Атака","Вокруг годи вырастает кольцо пиков, ранит и отбрасывает, затем рассыпается.",1],["Хранитель Фенрис","Призыв","Огромный рунный голем на 20 секунд: шаги трясут землю, удары разбрасывают врагов, на плечах светятся руны предков.",0],["Земля предков","Поддержка","Зона 10 блоков на 15 секунд: союзники регенерируют и не отлетают, враги замедлены.",0],["Поступь ётуна","Атака","Невидимый великан делает три шага по линии 20 блоков: каждый шаг оставляет кратер радиусом 3 блока, 10 урона и подброс.",0],["Сердце горы","Защита","Годи уходит в каменный кокон на 4 секунды и неуязвим, затем кокон взрывается осколками: 8 урона в радиусе 5 блоков.",1]],[["Лоно Фенрис","Атака","Годи становится каменным колоссом на 15 секунд: огромный рост, удары с ударной волной, иммунитет к отбросу.",0],["Падение хребта","Атака","На 25 блоков с неба рушатся исполинские обломки гор, земля трескается светящимися рунами.",0],["Хребты Асахейма","Атака","На 20 секунд поле боя становится горами: вырастают пять шпилей, каждые 3 секунды от них расходятся каменные волны, годи не сдвинуть.",0],["Курган конунгов","Призыв","Из земли поднимается курган, из него выходят три каменных конунга с секирами и бьются 25 секунд.",0],["Крестовый разлом","Атака","Земля раскалывается крестом на 25 блоков, из трещин бьёт свет руны Йорд: враги проваливаются и вылетают вверх.",0]]]},{"name":"Этт Ваг","tiers":[[["Волна Ваг","Атака","Поток воды сбивает цель и отталкивает.",0],["Водяной хлыст","Атака","Плеть из воды хлещет по дуге перед годи.",0],["Капли прилива","Атака","Веер из пяти водяных пуль.",0],["Дыхание глубины","Поддержка","Годи дышит под водой и быстрее плавает.",0],["Водяной пле   'Этт Духов': { bg: 'linear-gradient(170deg, #06211e, #03100f 60%, #020707)', epigraph: ['Предок отвечает и называет то, чего скальд знать не мог. Утром его голос узнают старшие годи.', 'знак пути'], force: 'Анд-годи слышат духов Фенриса и предков. Их гальдр зовёт призрачных астартес, укрывает стаю от чужого колдовства, показывает скрытое и лечит то, что не лечит плоть. Перед боем Волчий Жрец отдаёт анд-годи бирки с именами павших братьев, и на каждое имя рядом со стаей встаёт предок.', trial: 'Разговор на Кургане. Скальд проводит ночь на кургане и зовёт предка своего рода. Если предок ответил и назвал то, чего скальд знать не мог, утром его голос узнают старшие годи. Если предок не пришёл, звать рано, и скальд возвращается на курган через год.', custom: 'Оружие ушедшего анд-годи вкладывают в тотем рода. Анд-годи никогда не бывают одни: за спиной у каждого стоят все, кто ушёл до него.' },
  'Этт Ваг': { bg: 'linear-gradient(170deg, #061a30, #03101e 60%, #020710)', epigraph: ['Утром море само приносит лодку к берегу, а скальд держит в руках то, что отдало ему море.', 'знак пути'], force: 'Ваг-годи берут силу у моря, воды и шторма. Их гальдр поднимает волну, топит и тащит на дно, лечит солёной водой и зовёт тварей глубин. На драккарах легиона ваг-годи стоят у рулевого весла, и море слушается их, как слушалось бы ярла.', trial: 'Ночь в Шторм. Скальда сажают в лодку без вёсел и отталкивают от берега в начале шторма. Утром море само приносит лодку к берегу, а скальд держит в руках то, что отдало ему море: раковину, зуб кракена или водоросль. За не выдержавшим годи выходят на драккаре, если море оставит, кого вытаскивать.', custom: 'Оружие ушедшего ваг-годи бросают в море во время шторма. Грим-годи считают ваг-годи пустыми, как прибой, а ваг-годи только смеются: прибой приходит каждый день, а камень лежит на месте.' },
  'Этт Йорд': { bg: 'linear-gradient(170deg, #121c08, #080e04 60%, #030502)', epigraph: ['На рассвете камни над ним сдвигаются сами, а в его ладони оказывается камень с янтарной жилой.', 'знак пути'], force: 'Грим-годи говорят с землёй, камнем и глубиной. Их гальдр поднимает стены из скал, трясёт землю под ногами врага, укрывает стаю каменной кожей и слышит, как ворочается под Асахеймом гора. Грим-годи самые упрямые из годи: сдвинуть их с места так же трудно, как скалу.', trial: 'Погребение. Скальда кладут в яму на склоне горы и заваливают камнями, оставив щель для воздуха. Там он лежит всю ночь и слушает землю. На рассвете камни над ним сдвигаются сами, и скальд выходит с камнем, в котором бежит янтарная жила. Если не выдержал, камни разбирают годи, и скальд остаётся скальдом.', custom: 'Оружие ушедшего грим-годи закапывают в землю у подножия Асахейма. Грим-годи считают ваг-годи пустыми, как прибой, и вечно с ними спорят, но на пирах у Эльгра сидят рядом.' },
  'Этт Бра': { bg: 'linear-gradient(170deg, #241006, #100603 60%, #050201)', epigraph: ['Огонь обжигает доспех, но не плоть, а с другой стороны скальд выходит с тлеющим углем в ладони, который не жжёт.', 'знак пути'], force: 'Ред-годи носят в себе огонь вулканов Фенриса. Их гальдр жжёт, плавит и взрывает, гонит врага стеной пламени и согревает стаю в самую лютую стужу. Ред-годи вспыльчивы, как их этт, и первыми рвутся в бой.', trial: 'Сквозь Огонь. Скальд проходит сквозь пламя большого погребального костра, от края до края, не ускоряя шага. Огонь обжигает доспех, но не плоть, и с другой стороны скальд выходит с тлеющим углем в ладони, который не жжёт. Ожоги не выдержавшего лечит Творец плоти, а повторить испытание можно через год.', custom: 'Оружие ушедшего ред-годи бросают в жерло вулкана. Ваг-годи считают ред-годи вспыльчивыми, и те не спорят: огню незачем быть терпеливым.' },
  'Хов Моркая': { bg: 'linear-gradient(170deg, #1a060b, #0a0205 55%, #030102)', epigraph: ['Мертвеца не убить. Я только иду домой, и иду быстрее, чем вы.', 'литания перед боем'], god: 'Моркаи, бог смерти, страж врат, за которыми лежит царство мёртвых. Он является в облике огромного чёрного волка с двумя головами: одна смотрит на живых, другая на мёртвых, и потому скальды зовут его Двуглавым. В его царстве нет ни пира, ни песен, только холод и вечное ожидание, и там же строится Нагльфар, корабль из ногтей мертвецов. Моркаи боятся все, но никто не смеет его отвергать.', force: 'Драуг-годи черпают силу Двуглавого: говорят с мертвецами, упокаивают вставших драугров и, по слухам, умеют поднимать мёртвых сами, хотя делают это только в самом крайнем случае. Они носят маски из черепов своих предшественников, ведь годи Моркаи не умирают окончательно, пока их череп носит кто-то из хова. Драуг-годи хранят чёрный камень культа, ведут Сожжение Двуглавого и держат в руках последний жребий.', trial: 'Ночь Смерти. Скальд выпивает отвар чёрного мака и на одну ночь умирает по-настоящему, а драуг-годи сидят над ним у чёрного камня. На рассвете он встаёт сам, и на лбу у него проступает кровавая руна. С этого дня он считает себя мёртвым. Если не встал, его провожают как воина: он сам выбрал встречу с Моркаи.', custom: 'Каждый моркаец считает себя мертвецом: посвящение для него это собственные похороны, а живых он зовёт «тёплыми». Фенрисийцы обходят моркайцев стороной и не садятся с ними за один стол, но без них не обходятся ни одни похороны. Драуг-годи держатся особняком, и к ним не подходят без нужды.' },
  'Хов Пустотного Волка': { bg: 'linear-gradient(170deg, #0c0a24, #050414 55%, #020208)', epigraph: ['Пусть враг смотрит на мой огонь, а я приду из темноты.', 'литания перед боем'], god: 'Пустотный Волк не бог, а дух, но такой, что многие боги предпочитают с ним не связываться. Он обитает в чёрной пустоте между звёздами, и в долгую ночь его видно на небе как волка из темноты, на месте которого гаснут звёзды. Он рыщет там, куда уходят Небесные Воины, и знает дороги, недоступные ни одному смертному. Он не добр и не зол, он голоден и терпелив.', force: 'Воид-годи совсем мало, и даже другие культисты видят их нечасто. Рядом с ними гаснут огни и становится тише, а сами они умеют исчезать в темноте и появляться там, где их не ждут. Воид-годи помогают кораблям легиона пройти сквозь бури между звёздами и найти путь там, где всё остальное слепнет. Хов хранит Осколок Пустоты, кусок чёрного стекла, упавший с неба, в котором не отражается ничего.', trial: 'Ночь в Пустоте. Скальд выходит на обшивку корабля в открытую пустоту и проводит там ночь корабельного времени, пристёгнутый одной цепью. Вернувшись, он молчит, а по его броне сами проступают серебряные точки первого созвездия. Не выдержавшего втягивают обратно по цепи, и некоторые после этого больше никогда не смотрят в иллюминаторы.', custom: 'Большинство фенрисийцев предпочитают о Пустотном Волке не говорить вовсе, а дети, увидев в небе тёмное пятно без звёзд, бегут домой. Все годи смотрят на воид-годи с опаской, но когда корабль слепнет среди звёзд, зовут именно их.' },
  'Хов Эльгра': { bg: 'linear-gradient(170deg, #2a1408, #140904 55%, #070301)', epigraph: ['Пусть слово ляжет ровно, как лосиный след на свежем снегу. Не дай мне соврать, Эльгра, и не дай забыть.', 'литания перед сагой'], god: 'Эльгра, бог-лось, весёлый и щедрый покровитель пиров, еды, музыки, скальдов и саг. Он выглядит как огромная фигура с лосиным черепом вместо головы, а в руке держит резной посох, увешанный колокольцами, костяными подвесками и лентами. Он хранит гостей и тех, кто их принимает, даёт сытые зимы и хороший мьод, но только тем, кто сам щедр. В ночь пира он посылает в стоянки Рогатого гостя проверить, как люди чтут его закон.', force: 'Годи-эльгра обходятся на пиру без титулов, потому что за столом Эльгра все равны. Они почти никогда не сидят на одном месте: ходят от стоянки к стоянке как гости, приносят новые саги и мирят всех на пирах. Их сила в том, чтобы кормить и веселить: еда под их рукой не портится, мьод не кончается дольше обычного, а песня годи-эльгра снимает усталость с самых измотанных гребцов. Посохи годи-эльгра вырезаны из лосиного рога, и каждый новый посох касается старого, который, говорят, однажды держал сам Эльгра.', trial: 'Сага до Рассвета. На пиру роты скальд встаёт и поёт сагу, и петь он должен до рассвета, не повторяясь и не сбиваясь. Знак пути: никто за столом не прервал его и не уснул, а в ночь пира к огню пришёл незнакомец в плаще и ушёл до утра. Над не выдержавшим смеются весь следующий пир, и петь он может через год.', custom: 'Эльгра любят больше всех богов, ведь он единственный, кто ничего не требует, кроме щедрости и доброй песни. Первый кусок и первый рог на пиру ставят на пустое место во главе стола для самого Эльгра, а утром эту долю отдают самому бедному. Годи-эльгра лучшие из певцов легиона.' },
  'Хов Железного Волка': { bg: 'linear-gradient(170deg, #161a1e, #0a0c10 55%, #030405)', epigraph: ['Железо помнит руку, что его ковала. Не подведи её, как я не подвёл тебя.', 'литания перед боем'], god: 'Железный Волк, бог-волк, колоссальный и древний, что спит под Асахеймом. Горные хребты это шкура на его спине, а залежи руды его железные вены. Он покровительствует всем Железным Жрецам и наблюдает за каждым, кто работает с духами железа, а когда он ворочается во сне, по Фенрису идут землетрясения.', force: 'Ярн-годи самые молчаливые из годи Фенриса: они почти всегда работают в кузнях и штольнях и носят на руках старые ожоги как знаки отличия. Они слышат духов, спящих в каждом клинке, доспехе и механизме, и умеют их будить: оружие в их руках становится крепче, остывший горн разгорается сам. Ярн-годи хранят Сердце Жилы, кусок самородного железа, тёплый даже в самый лютый мороз.', trial: 'Слушание Спящего. Скальд спускается в глубины под Клыком, гасит свет и слушает гору до утра. Гора гудит в ответ, а утром на ладони скальда остаётся пятно ржавчины, которое не смывается.', custom: 'Гальдры этого хова ещё не записаны в саги: корень спит под Асахеймом и ждёт своих ярн-годи. Простые фенрисийцы о Железном Волке знают мало и говорят о нём с опаской, ведь бога, от ворочания которого трясётся земля, не хочется лишний раз будить.' }

const PRIESTS = {"wolf":{"docs":[{"id":"wolf0","title":"Волчьи Жрецы","short":"Орден","rune":"ᛉ","html":"<h2 id=\"wolf0-1\">О чём этот свиток?<\/h2><p>Волчьи Жрецы — лекари, судьи и хранители памяти VI легиона. Они ведут воина от первого вдоха в легионе до последнего: лечат его плоть, следят за зверем в его крови, хранят его имя в сагах и провожают его к Моркаи. Только они вправе говорить от имени богов Фенриса с любым культом легиона.<\/p><p>У Волчьих Жрецов три прозвища, и каждое называет одну грань их ремесла:<\/p><ul><li><b>Творцы плоти<\/b> — потому что они режут, сшивают и перестраивают тело Волка;<\/li><li><b>Избирающие павших<\/b> — потому что они решают, кто из смертных достоин легиона, а кто из раненых будет жить;<\/li><li><b>Говорящие с мёртвыми<\/b> — потому что они хранят память павших, провожают их и говорят с ними.<\/li><\/ul><p>В этом свитке описано, кто такие Волчьи Жрецы, как они выглядят, чем заняты и как становятся жрецами. Их препараты, обряды, операции, песни и саги описаны в отдельных свитках.<\/p><h2 id=\"wolf0-2\">Место в легионе<\/h2><p>Волчьи Жрецы — один из трёх орденов Жрецов Фенриса. Вместе с Рунными и Железными Жрецами они заботятся о теле, духе и стали легиона. Там, где у других легионов апотекарии и капелланы, у Волков есть Волчьи Жрецы, которые соединяют в себе и то и другое.<\/p><p>Старшие жрецы всех трёх орденов сидят на почётных местах в Эйнхерьяре, военном совете Русса, где собираются его ярлы и тэны. Волчьи Жрецы подчиняются только самому Руссу. Ярлы с ними советуются, но приказывать им не могут.<\/p><p>Жрецы не прячут своей веры. В легионе живут культы богов Фенриса, и каждый культ чтит своего бога. Волчий Жрец надзирает за всеми культами и вправе говорить с любым из них от имени его бога: рассудить, если культы враждуют, и остановить, если культ зашёл слишком далеко. Ближе всех к жрецам стоит Моркаи Двуглавый, бог смерти, ведь у его врат они встречают каждого павшего брата.<\/p><p>Гальдром Волчьи Жрецы не владеют. Их сила в крови, обряде и праве суда, а не в колдовстве. Этим они отличаются от годи и рунных жрецов, и потому стоят рядом с ними, а не над ними и не под ними.<\/p><h2 id=\"wolf0-3\">Образ и облик<\/h2><h3 id=\"wolf0-4\">Образ<\/h3><p>Жрецов отбирают из самых волевых и хладнокровных братьев, а в легионе, где ярость считается добродетелью, это редкость. Посреди пира, где все орут и бьются на кулаках, жрец сидит, пьёт наравне со всеми и смотрит. Он помнит, кто сегодня сорвался, у кого дрожали руки и кто слишком долго смотрел на кровь.<\/p><p>Воины относятся к жрецу двояко. Без него не обойтись: он залатает, проводит, вспомнит твоё имя после смерти. Но его взгляд может оказаться приговором, ведь если жрец заметил в брате зверя, решать будет он. Поэтому жрец говорит мало, не спешит и не повышает голоса. В бою он идёт впереди стаи, а не позади неё.<\/p><h3 id=\"wolf0-5\">Облик<\/h3><p><b>Доспех.<\/b> Серая броня легиона, которая темнеет с годами. Обряды проходят у погребальных костров, и броню натирают их пеплом. У Избранного жрецом на доспехе лишь первые метки пепла, у Творца плоти черны руки по локоть, а Волчий жрец носит уже полностью тёмную броню.<\/p><p><b>Шлем-череп.<\/b> Волчий жрец носит череп фенрисийского волка поверх шлема или вместо лицевой пластины, чаще всего череп волка, убитого им самим на испытании. В отличие от моркайцев, чьи маски из черепов людей и зверей залиты кровью, череп жреца чистый и выбеленный. Это знак того, кто стоит у врат, а не того, кто через них прошёл.<\/p><p><b>Плащ из волчьей шкуры.<\/b> В шкуру вплетены руны богов, ведь жрец говорит от их лица.<\/p><p><b>Бирки памяти.<\/b> С пояса свисают костяные пластинки с именами павших, которых жрец проводил сам. У старых жрецов их сотни, и при ходьбе они стучат. По этому звуку жреца узнают в темноте.<\/p><p><b>Клыки избранных.<\/b> На шее висит ожерелье: по клыку за каждого аспиранта, которого жрец избрал и который выжил.<\/p><p><b>Инструменты.<\/b> Клык Моркаи для извлечения генного семени, нартециум на руке, костяные клинки, сумка со снадобьями и посох или топор, увенчанный черепом.<\/p><h2 id=\"wolf0-6\">Ремесло<\/h2><h3 id=\"wolf0-7\">Творцы плоти<\/h3><p>Волчьи Жрецы сведущи в хирургии, биомеханике и сложной биогенной алхимии. Их снадобья высокотехнологичны по сути, но применяются как обряд. Жрец знает и науку, и обряд, и считает, что одно без другого не работает: мазь, нанесённая с нужными словами, лечит лучше, потому что воин в неё верит. Жрецы лечат раны в поле и в апотекарионе, ставят импланты вместе с Железными Жрецами, хранят генное семя легиона и Канис Хеликс, а Хеликс входит в тело аспиранта через Кубок Вульфена.<\/p><h3 id=\"wolf0-8\">Избирающие павших<\/h3><p>Жрец ищет среди племён Фенриса тех, кто умирает достойно, и забирает их у смерти. Он ведёт испытание аспирантов, тренирует новых воинов и прочёсывает ряды легиона в поисках нестабильности, ментальной или телесной: следов Проклятия Вульфена, безумия, мутаций. Он держит дисциплину и решает, кому из смертельно раненых бороться за жизнь, а кого отпустить с честью через Омовение Одинокого Волка.<\/p><h3 id=\"wolf0-9\">Говорящие с мёртвыми<\/h3><p>Жрецы хранят память легиона: его саги, имена и клятвы. Они распространяют традиции Фенриса среди всех, кто вошёл в стаю, судят деяния живых и мёртвых, вписывая достойных в саги и вычёркивая опозоренных. Они проводят обряды для живых, от Тризны Павших до Очищения Ледяной Водой, и для мёртвых, от Обряда Моркаи до Огненных Проводов. Самые опытные умеют говорить с павшими и узнавать у них то, что те не успели сказать.<\/p><h2 id=\"wolf0-10\">Ранги и путь<\/h2><p>Волчьим Жрецом можно стать с любой позиции в легионе. Путь жреца повторяет его ремесло: сначала он учится плоти, потом духу и голосу мёртвых, и только в конце получает право избирать.<\/p><h3 id=\"wolf0-11\">Избранный жрецом<\/h3><p>Ученик. Чтобы встать на ученичество, нужно одобрение жрецов. Избранный учится лекарскому делу, носит инструменты наставника и помогает на обрядах, но сам их не ведёт.<\/p><p><b>Требование:<\/b> быть выбранным жрецом.<\/p><h3 id=\"wolf0-12\">Творец плоти<\/h3><p>Полноценный лекарь и хирург стаи. Латает раны в поле, готовит мази и снадобья, ставит импланты, извлекает и хранит генное семя павших. За тело воина он отвечает целиком, но к духу ещё не допущен: не ведёт обряды для мёртвых, не говорит от лица богов и не надзирает за культами. Часть Творцов плоти остаётся на этой ступени навсегда, и в этом нет позора.<\/p><p><b>Требование:<\/b> пройти ученичество и обучение лекарскому делу, получить одобрение Волчьего жреца.<\/p><h3 id=\"wolf0-13\">Волчий жрец<\/h3><p>Ветераны и мудрые наставники. Они заботятся о духовных и физических потребностях воинов и следят за всеми культами. Сведущи в биомеханике и хирургии.<\/p><p><b>Требование:<\/b> быть Творцом плоти и пройти обучение на наставника.<\/p><h3 id=\"wolf0-14\">Старший жрец<\/h3><p>Мастера своего дела. Они заботятся о духовных и физических потребностях воинов, дают советы ярлу и отбирают неофитов. Духовная и медицинская опора легиона.<\/p><p><b>Требование:<\/b> даётся за полное понимание и заслуги в делах Волчьих Жрецов.<\/p><h3 id=\"wolf0-15\">Облик по ступеням<\/h3><div class=\"tbl\"><table><thead><tr><th>Ступень<\/th><th>Броня<\/th><th>Знаки<\/th><\/tr><\/thead><tbody><tr><td>Избранный жрецом<\/td><td>Серая, первые метки пепла<\/td><td>Инструменты наставника<\/td><\/tr><tr><td>Творец плоти<\/td><td>Серая, руки черны по локоть<\/td><td>Клык Моркаи, сумка снадобий, без черепа<\/td><\/tr><tr><td>Волчий жрец<\/td><td>Полностью тёмная<\/td><td>Шлем-череп волка, бирки памяти, руны богов на плаще<\/td><\/tr><tr><td>Старший жрец<\/td><td>Полностью тёмная<\/td><td>Череп легендарного зверя, посох власти, ожерелье клыков избранных<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"wolf0-16\">Обычаи и власть<\/h2><p>Первое и последнее лицо, которое Волк видит за свою службу, — это волчья маска-череп жреца. Жрец избирает его среди племён, и жрец же проводит его к Моркаи, когда тот истечёт кровью.<\/p><p>Власть жреца держится не на приказах, а на уважении и страхе. Драку пьяных Волков жрец может остановить одним словом. Даже самые гордые ярлы уступают ему дорогу, а тот, кто однажды не уступил, остался в саге как пример того, чего делать не стоит.<\/p><p>Хотя бы один Волчий жрец всегда бродит по Фенрису в поисках кандидатов. Для племён он чаще всего единственный Небесный Воин, которого они видят своими глазами, и они считают его богоподобным: тем, кто забирает лучших мёртвых и уводит их на небо.<\/p><p>С Железными Жрецами у Волчьих особые отношения. Над телом воина они работают вместе и вечно спорят, чем ему жить, плотью или сталью. Последнее слово в этом споре остаётся за самим воином, если он может его сказать.<\/p>","toc":[{"id":"wolf0-1","title":"О чём этот свиток?","level":2},{"id":"wolf0-2","title":"Место в легионе","level":2},{"id":"wolf0-3","title":"Образ и облик","level":2},{"id":"wolf0-4","title":"Образ","level":3},{"id":"wolf0-5","title":"Облик","level":3},{"id":"wolf0-6","title":"Ремесло","level":2},{"id":"wolf0-7","title":"Творцы плоти","level":3},{"id":"wolf0-8","title":"Избирающие павших","level":3},{"id":"wolf0-9","title":"Говорящие с мёртвыми","level":3},{"id":"wolf0-10","title":"Ранги и путь","level":2},{"id":"wolf0-11","title":"Избранный жрецом","level":3},{"id":"wolf0-12","title":"Творец плоти","level":3},{"id":"wolf0-13","title":"Волчий жрец","level":3},{"id":"wolf0-14","title":"Старший жрец","level":3},{"id":"wolf0-15","title":"Облик по ступеням","level":3},{"id":"wolf0-16","title":"Обычаи и власть","level":2}]},{"id":"wolf1","title":"Обряды Волчьих Жрецов","short":"Обряды","rune":"ᛟ","html":"<h2 id=\"wolf1-1\">О чём этот свиток?<\/h2><p>Волчий жрец ведёт воина от первого вдоха в легионе до последнего. Его лицо Волк видит первым, когда его избирают, и последним, когда Моркаи приходит за ним. Между этими двумя встречами жрец лечит, судит, хранит память и говорит с богами от имени стаи.<\/p><p>Здесь собраны обряды, которые проводят Волчьи Жрецы. Список пополняется.<\/p><p><b>Как читать обряд:<\/b><\/p><ul><li><b>Проводит<\/b> — какой ранг жреца вправе вести обряд<\/li><li><b>Когда<\/b> — повод и время<\/li><li><b>Что нужно<\/b> — препараты, предметы и место<\/li><li><b>Ход обряда<\/b> — как он проходит<\/li><li><b>Слова<\/b> — что говорит жрец<\/li><li><b>Смысл<\/b> — зачем это нужно стае<\/li><\/ul><p><b>Ранги:<\/b> Избранный жрецом → Творец плоти → Волчий жрец → Старший жрец. Младший ранг может помогать на обряде старшего, но не вести его.<\/p><p>Препараты, названные в обрядах, описаны в документе «Препараты Волчьих Жрецов».<\/p><h2 id=\"wolf1-2\">Обряды пути<\/h2><p>Обряды, которые делают из смертного Волка, а из Волка жреца.<\/p><h3 id=\"wolf1-3\">Обряд Избрания<\/h3><ul><li><b>Проводит:<\/b> Старший жрец или Волчий жрец по его слову<\/li><li><b>Когда:<\/b> Во время войн племён, набегов и бурь, там, где юноши Фенриса умирают в бою<\/li><li><b>Что нужно:<\/b> Шкура волка, Повязка «Болотный Покров», Бальзам «Железный Сон»<\/li><li><b>Ход обряда:<\/b> Жрец ходит среди племён Фенриса, иногда годами, и не вмешивается в их войны. Он смотрит, как бьются и как умирают. Того, кто пал с оружием в руке и не звал на помощь, жрец забирает с поля: перевязывает, погружает в сон и укрывает волчьей шкурой. Для своего рода юноша умер, и скальды поют о нём как о павшем.<\/li><li><b>Слова:<\/b> «Ты умер для своего рода. Теперь ты принадлежишь стае.»<\/li><li><b>Смысл:<\/b> Легион берёт только тех, кто уже встретил смерть и не дрогнул. Поэтому для племён Небесные Воины и есть те, кто забирает лучших мёртвых.<\/li><\/ul><h3 id=\"wolf1-4\">Кубок Вульфена и Испытание Моркаи<\/h3><ul><li><b>Проводит:<\/b> Старший жрец, Волчьи жрецы следят за аспирантами<\/li><li><b>Когда:<\/b> Когда аспирант прошёл обучение и стоит на пороге легиона. Проводится в Клыке.<\/li><li><b>Что нужно:<\/b> Таинство «Кубок Вульфена», сам Кубок, Препарат «Волчий Поцелуй»<\/li><li><b>Ход обряда:<\/b><ol><li>Аспирант пьёт из Кубка на глазах у всей стаи.<\/li><li>Когда начинается превращение, его уносят в дикость Асахейма, далеко от Клыка, без еды и оружия.<\/li><li>Аспирант должен сам вернуться к Клыку. Жрец идёт следом незримо, не помогает, только смотрит.<\/li><li>Вернувшегося человеком жрец встречает у ворот и даёт ему Волчий Поцелуй. Творцы плоти вживляют ему остальные органы.<\/li><li>Кто остался зверем, становится Вульфеном. Жрец отпускает его в дикость, а если тот выйдет к людям, убивает сам.<\/li><\/ol><\/li><li><b>Слова:<\/b> «Испей крови Русса. Найди дорогу домой или останься с волками.»<\/li><li><b>Смысл:<\/b> Хеликс будит зверя в каждом. Легион нужен тот, кто сумел вернуться от зверя к себе.<\/li><\/ul><h3 id=\"wolf1-5\">Посвящение в ранги жрецов<\/h3><ul><li><b>Проводит:<\/b> Жрец рангом выше посвящаемого<\/li><li><b>Когда:<\/b> Когда наставник решит, что ученик готов<\/li><li><b>Что нужно:<\/b> Пепел погребального костра, Клык Моркаи, шлем-череп, Отвар «Взор Моркаи»<\/li><li><b>Ход обряда:<\/b><ol><li><b>Избранный жрецом.<\/b> Брат приносит Волчьему жрецу клык волка, убитого своими руками. Жрец принимает его в ученики и наносит на доспех первые метки пеплом погребального костра.<\/li><li><b>Творец плоти.<\/b> Ученик сам вытаскивает из пасти Моркаи брата, которого наставник уже считал потерянным. Тогда ему чернят руки пеплом по локоть и вручают собственный Клык Моркаи.<\/li><li><b>Волчий жрец.<\/b> Творец плоти проводит ночь у погребального костра, выпив «Взор Моркаи». Он должен вернуться с тем, что знал только мёртвый: последним словом, тайной, именем. Тогда наставник надевает на него шлем-череп волка с его собственного испытания и даёт право говорить от имени богов. Ему вешают первую бирку памяти.<\/li><li><b>Старший жрец.<\/b> Ранг даётся за заслуги, по слову Старших жрецов и с согласия ярла. Посвящаемый получает череп легендарного зверя и посох власти. Свою первую клятву он приносит перед Эйнхерьяром.<\/li><\/ol><\/li><li><b>Слова:<\/b> «Ты знал плоть. Теперь узнай тех, кто её покинул.» (при посвящении в Волчьи жрецы)<\/li><li><b>Смысл:<\/b> Жрец идёт тем же путём, что и его ремесло: сначала тело, потом дух, потом право выбирать.<\/li><\/ul><h2 id=\"wolf1-6\">Обряды войны<\/h2><p>Обряды, которые жрец проводит перед боем и в походе.<\/p><h3 id=\"wolf1-7\">Злая Клятва<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Когда:<\/b> Перед битвой<\/li><li><b>Что нужно:<\/b> Посох или топор жреца, рог с мьодом<\/li><li><b>Ход обряда:<\/b> Стая встаёт кругом, жрец выходит в середину и называет врага. Он даёт клятву от имени всей стаи: чего она добьётся в этом бою или чем за это заплатит. Каждый воин режет ладонь и прикладывает её к древку жреческого оружия. Затем жрец выкрикивает имена павших братьев стаи, и стая отвечает ему одним рёвом после каждого имени. Ритм этого песнопения воины потом слышат в голове посреди боя.<\/li><li><b>Слова:<\/b> «Пусть Моркаи смотрит. Мы пришли не умирать. Мы пришли, чтобы умирали они.»<\/li><li><b>Смысл:<\/b> Клятва связывает стаю одной кровью. Песнопение укореняется в разуме и держит воинов в ярости и строю. Тот, кто нарушил Злую Клятву, отвечает на суде саг.<\/li><\/ul><h3 id=\"wolf1-8\">Обряд Сокрытия Следов<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец, пепел может готовить Творец плоти<\/li><li><b>Когда:<\/b> Перед скрытными операциями, засадами и разведкой<\/li><li><b>Что нужно:<\/b> Пепел «Сокрытие Следов», свежий корень плакун-травы<\/li><li><b>Ход обряда:<\/b> Жрец ломает корень плакун-травы и слушает руку. Если корень заныл, рядом чужое колдовство, и обряд проводят дважды. Затем жрец чертит пеплом по три полосы на доспехе каждого воина, от плеча к поясу, и одну полосу через глаза. С этого момента и до первой крови стая не говорит вслух, только жестами.<\/li><li><b>Слова:<\/b> Шёпотом: «Нет запаха. Нет следа. Нет нас.»<\/li><li><b>Смысл:<\/b> Пепел глушит запах и сбивает чутьё зверей. Волки верят, что он прячет ауру стаи от вражеских псайкеров.<\/li><\/ul><h3 id=\"wolf1-9\">Кровавая Раскраска<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец, в малой стае Творец плоти<\/li><li><b>Когда:<\/b> Перед большой битвой, особенно с врагом, против которого дана Злая Клятва<\/li><li><b>Что нужно:<\/b> Краска «Кровавый Знак»<\/li><li><b>Ход обряда:<\/b> Жрец чертит на лице и доспехе каждого воина две руны: руну стаи и руну бога, которому воин посвящает этот бой. Первым краску принимает вожак стаи, последним самый молодой. Если воин падёт, жрец по руне узнает, кому из богов его провожать.<\/li><li><b>Слова:<\/b> «Пусть враг думает, что ты уже в крови. Пусть потом узнает, что в его.»<\/li><li><b>Смысл:<\/b> Раскраска пугает врага и напоминает воину, кому он отдаёт свой бой и, может быть, свою смерть.<\/li><\/ul><h2 id=\"wolf1-10\">Обряды смерти<\/h2><p>Обряды, которыми жрец провожает братьев к Моркаи и забирает у смерти то, что принадлежит стае.<\/p><h3 id=\"wolf1-11\">Омовение Одинокого Волка<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Когда:<\/b> Брат смертельно ранен, и спасти его нельзя<\/li><li><b>Что нужно:<\/b> Бальзам «Одинокий Волк», снег или талая вода, оружие раненого<\/li><li><b>Ход обряда:<\/b> Жрец смывает кровь с лица раненого снегом или водой, чтобы Моркаи увидел его лицо. Он даёт бальзам из своего рога и вкладывает в руки воина его оружие. Если пальцы уже не держат, привязывает оружие к руке ремнём. Жрец спрашивает последнее слово и запоминает его для саги. Потом уходит, не оглядываясь, и уводит стаю. Когда всё кончено, жрец возвращается с Клыком Моркаи.<\/li><li><b>Слова:<\/b> «Ты не умрёшь лёжа. Встреть его стоя.»<\/li><li><b>Смысл:<\/b> На Фенрисе страшнее всего умереть не в бою: к таким приходит двоеглав. Омовение даёт умирающему последний бой и честную смерть.<\/li><\/ul><h3 id=\"wolf1-12\">Обряд Моркаи<\/h3><ul><li><b>Проводит:<\/b> Творец плоти извлекает семя, Волчий жрец говорит слова<\/li><li><b>Когда:<\/b> Сразу после смерти брата, пока прогеноиды живы<\/li><li><b>Что нужно:<\/b> Клык Моркаи, сосуд для генного семени, костяная бирка, нож<\/li><li><b>Ход обряда:<\/b> Жрец закрывает павшему глаза, кладёт ладонь ему на грудь и трижды называет его имя, чтобы Моркаи не спутал его с другим. Клыком Моркаи он извлекает прогеноиды. Затем вырезает имя павшего на костяной бирке и вешает её себе на пояс. Последним делом жрец срезает павшему ногти, чтобы сжечь их отдельно на проводах.<\/li><li><b>Слова:<\/b> «Твоё тело Моркаи. Твоя кровь стае. Твоё имя мне.»<\/li><li><b>Смысл:<\/b> Семя павшего станет новым Волком, а его имя будет звучать, пока бирка висит на поясе жреца.<\/li><\/ul><h3 id=\"wolf1-13\">Огненные Проводы<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Когда:<\/b> После битвы, когда тела павших вынесены с поля<\/li><li><b>Что нужно:<\/b> Погребальный костёр, можжевельник, венок дикого чеснока, срезанные ногти павших<\/li><li><b>Ход обряда:<\/b><ol><li>Павших кладут на костёр. Волки никогда не хоронят своих в земле, ведь из непогребённых встают драугры, а на курганах растёт курганник.<\/li><li>Жрец окуривает костёр можжевельником и бросает в огонь венок дикого чеснока.<\/li><li>Ногти павших сжигают отдельно, в малом огне. Каждая остриженная рука отодвигает постройку Нагльфара на один день.<\/li><li>Пока горит костёр, жрец стоит к нему спиной. Смотреть на уходящих значит звать их обратно.<\/li><li>Пепел собирают. Им метят доспехи жрецов и посвящаемых.<\/li><\/ol><\/li><li><b>Слова:<\/b> «Иди к нему с поднятой головой. Мы тебя проводили.»<\/li><li><b>Смысл:<\/b> Правильные проводы не дают павшему стать нежитью и не дают Моркаи взять его как труса. Если тело вернуть нельзя, жрец сжигает хотя бы бирку с его именем.<\/li><\/ul><h3 id=\"wolf1-14\">Разговор с Мёртвыми<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец или Старший жрец<\/li><li><b>Когда:<\/b> Павший унёс с собой важное: последние слова, тайну врага, имя убийцы. Также перед судом саг, если нужно свидетельство мёртвого.<\/li><li><b>Что нужно:<\/b> Отвар «Взор Моркаи», тело павшего или его пепел, погребальный огонь<\/li><li><b>Ход обряда:<\/b> Жрец остаётся с телом один на всю ночь и пьёт отвар. Мёртвому можно задать три вопроса, не больше. На третий раз мёртвый вправе спросить сам, и жрец обязан ответить правду, какой бы она ни была. На рассвете жрец возвращается к стае и говорит только то, что нужно стае.<\/li><li><b>Слова:<\/b> «Я знаю твоё имя. Скажи то, что не успел.»<\/li><li><b>Смысл:<\/b> Это главное ремесло Говорящих с мёртвыми. Мёртвые не лгут, но и живым не всё стоит слышать.<\/li><\/ul><h2 id=\"wolf1-15\">Обряды памяти и суда<\/h2><p>Обряды, которыми жрец хранит память легиона и решает, кого помнить с честью, а кого с презрением.<\/p><h3 id=\"wolf1-16\">Тризна Павших<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Когда:<\/b> После похода или битвы, в которой стая потеряла братьев, и в середину долгой зимы<\/li><li><b>Что нужно:<\/b> Мьод «Тризна», по пустому рогу для каждого павшего, бирки памяти<\/li><li><b>Ход обряда:<\/b> За столом для каждого павшего ставят пустой рог, а жрец раскладывает перед собой бирки памяти. Он заставляет воинов пить и по очереди вспоминать каждого павшего брата: его имя, как он умер и одно его дело. Пропускать нельзя никого. Кто сбился или забыл имя, пьёт снова и начинает с начала. Последними жрец называет тех, кого кроме него уже никто не помнит. В конце пустые рога наполняют и выливают в огонь.<\/li><li><b>Слова:<\/b> «Пока мы помним, они в стае.»<\/li><li><b>Смысл:<\/b> Волк умирает дважды: когда падает и когда его забывают. Тризна не даёт случиться второй смерти. Если в ночь тризны к огню пришёл незнакомый странник, его сажают за стол и не спрашивают, кто он: это может быть Рогатый гость Эльгра.<\/li><\/ul><h3 id=\"wolf1-17\">Суд Саг<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец, а над вожаком стаи или ярлом Старший жрец<\/li><li><b>Когда:<\/b> После похода, на тризне или на сходе стаи. Поводом может стать подвиг, нарушенная клятва, брошенный брат или трусость.<\/li><li><b>Что нужно:<\/b> Свидетели, при нужде слово мёртвого из Разговора с Мёртвыми<\/li><li><b>Ход обряда:<\/b> Жрец выслушивает свидетелей, затем слово даётся самому воину. Жрец решает, что станет с этим деянием. Достойное он вписывает в сагу стаи: поёт новую строку, и стая повторяет её, пока каждый не запомнит. Недостойное вычёркивается. Виновный может искупить вину кровью или смертельно опасным делом, которое назначит жрец. Если он отказался, жрец выносит Метку Позора.<\/li><li><b>Слова:<\/b> «Сага помнит всё. Решим, что ей помнить о тебе.»<\/li><li><b>Смысл:<\/b> Жрецы записывают и судят деяния живых и мёртвых. Достойных помнят, опозоренных презирают.<\/li><\/ul><h3 id=\"wolf1-18\">Метка Позора<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец, только по приговору Суда Саг<\/li><li><b>Когда:<\/b> Воин опозорил стаю и отказался искупить вину<\/li><li><b>Что нужно:<\/b> Краска «Кровавый Знак» с пеплом Двахкарр<\/li><li><b>Ход обряда:<\/b> Перед всей стаей жрец чертит тёмной краской руну позора на лице и наплечнике воина. С этого дня его имя вычеркнуто из саг, на тризне его не называют, а если он умрёт, его бирку не понесёт ни один жрец. Краску не смывает ни вода, ни время. Снять метку может только жрец, когда воин искупит вину подвигом на глазах у стаи или смертью в бою.<\/li><li><b>Слова:<\/b> «Сага тебя забыла. Докажи, что зря.»<\/li><li><b>Смысл:<\/b> Для Волка нет наказания страшнее забвения. Опозоренного часто начинает преследовать хим, и это тоже часть кары.<\/li><\/ul><h2 id=\"wolf1-19\">Обряды очищения и надзора<\/h2><p>Обряды, которыми жрец снимает с воинов груз войны и ищет в стае тех, в ком проснулся зверь или поселилось чужое.<\/p><h3 id=\"wolf1-20\">Очищение Ледяной Водой<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец<\/li><li><b>Когда:<\/b> Когда стая возвращается на Фенрис из долгой кампании<\/li><li><b>Что нужно:<\/b> Взвар «Ледяная Купель», прорубь в замёрзшем озере, можжевельник<\/li><li><b>Ход обряда:<\/b> Жрец готовит взвар на леднике и выливает его в прорубь, а над ней жгут можжевельник. Воины по одному погружаются в воду с головой трижды. Первый раз смывает кровь кампании, второй смывает ярость, третий смывает вину. Когда воин выныривает, жрец держит его за загривок и смотрит ему в глаза. Если в глазах остался зверь, воина отводят в сторону для Укрощения Зверя.<\/li><li><b>Слова:<\/b> «Оставь войну в воде. Домой иди чистым.»<\/li><li><b>Смысл:<\/b> Обряд снимает с Астартес ментальный груз долгой войны. Заодно это осмотр: в ледяной воде зверь в человеке показывается быстрее.<\/li><\/ul><h3 id=\"wolf1-21\">Рог и Сага<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец, может провести и Избранный жрецом<\/li><li><b>Когда:<\/b> Брат вернулся после долгой отлучки, плена или пропажи без вести, или стая сомневается, тот ли он<\/li><li><b>Что нужно:<\/b> Рог мьода, сага стаи, корень плакун-травы<\/li><li><b>Ход обряда:<\/b> Жрец следует старому обычаю лесных племён: сначала рог, потом сага, потом объятия.<ol><li>Жрец подаёт вернувшемуся рог мьода. Перевертень не выносит мьода и откажется.<\/li><li>Жрец просит спеть строку из саги стаи, которую знал вернувшийся. Перевертень не помнит чужих саг.<\/li><li>Жрец берёт в руку корень плакун-травы. Если корень заныл, на вернувшемся чужое колдовство, и ему дают «Антитварин».<\/li><li>Только после этого стая обнимает брата.<\/li><\/ol><\/li><li><b>Слова:<\/b> «Выпей с нами. Спой с нами. Тогда ты с нами.»<\/li><li><b>Смысл:<\/b> Обряд защищает стаю от перевертней в чужой шкуре и от тех, кого враг испортил в плену.<\/li><\/ul><h3 id=\"wolf1-22\">Укрощение Зверя<\/h3><ul><li><b>Проводит:<\/b> Волчий жрец, а если зверь проснулся в вожаке или ветеране, то Старший жрец<\/li><li><b>Когда:<\/b> В брате проснулось Проклятие Вульфена: пожелтели глаза, растут клыки, приходят приступы слепой ярости и тяга к сырому мясу. Также после отвара «Зов Зверя».<\/li><li><b>Что нужно:<\/b> Препарат «Волчий Поцелуй», цепи, Бальзам «Железный Сон» на крайний случай<\/li><li><b>Ход обряда:<\/b><ol><li>Стая встаёт кругом, жрец входит в него один и без оружия.<\/li><li>Он говорит с братом, называет его по имени и читает строки из его саги, пока тот слушает.<\/li><li>Когда брат затих, жрец даёт ему Волчий Поцелуй.<\/li><li>Если зверь не уходит, брата сковывают цепями и погружают в Железный Сон.<\/li><li>Если и это не помогло, судьбу брата решают Старший жрец и ярл.<\/li><\/ol><\/li><li><b>Слова:<\/b> «Ты не зверь. Ты сын стаи, и у тебя есть имя. Вернись к нему.»<\/li><li><b>Смысл:<\/b> Зверь спит в каждом Волке. Жрец не убивает его, а возвращает брата к самому себе, и сага служит ему поводком.<\/li><\/ul>","toc":[{"id":"wolf1-1","title":"О чём этот свиток?","level":2},{"id":"wolf1-2","title":"Обряды пути","level":2},{"id":"wolf1-3","title":"Обряд Избрания","level":3},{"id":"wolf1-4","title":"Кубок Вульфена и Испытание Моркаи","level":3},{"id":"wolf1-5","title":"Посвящение в ранги жрецов","level":3},{"id":"wolf1-6","title":"Обряды войны","level":2},{"id":"wolf1-7","title":"Злая Клятва","level":3},{"id":"wolf1-8","title":"Обряд Сокрытия Следов","level":3},{"id":"wolf1-9","title":"Кровавая Раскраска","level":3},{"id":"wolf1-10","title":"Обряды смерти","level":2},{"id":"wolf1-11","title":"Омовение Одинокого Волка","level":3},{"id":"wolf1-12","title":"Обряд Моркаи","level":3},{"id":"wolf1-13","title":"Огненные Проводы","level":3},{"id":"wolf1-14","title":"Разговор с Мёртвыми","level":3},{"id":"wolf1-15","title":"Обряды памяти и суда","level":2},{"id":"wolf1-16","title":"Тризна Павших","level":3},{"id":"wolf1-17","title":"Суд Саг","level":3},{"id":"wolf1-18","title":"Метка Позора","level":3},{"id":"wolf1-19","title":"Обряды очищения и надзора","level":2},{"id":"wolf1-20","title":"Очищение Ледяной Водой","level":3},{"id":"wolf1-21","title":"Рог и Сага","level":3},{"id":"wolf1-22","title":"Укрощение Зверя","level":3}]},{"id":"wolf2","title":"Препараты Волчьих Жрецов","short":"Препараты","rune":"ᛚ","html":"<h2 id=\"wolf2-1\">О чём этот свиток?<\/h2><p>Организм Волков устроен иначе, чем у остальных защитников Человечества, и требует особого ухода и постоянного надзора. Канис Хеликс делает их сильнее, но и опаснее для самих себя: в каждом брате дремлет зверь.<\/p><p>Волчьи Жрецы применяют редкую боевую химию и тайные бальзамы, чтобы держать этот организм в равновесии и вытаскивать израненных братьев из пасти Моркаи. Почти всё, что идёт в их составы, добыто на Фенрисе: травы знахарок, кровь и жир его тварей, смолы древних деревьев. Снадобья, сложные по сути, жрецы применяют как обряд, ведь для фенрисийца лечит не только состав, но и слово над ним.<\/p><p>Здесь собраны все доступные препараты. Список пополняется.<\/p><p><b>Шкала редкости:<\/b> ᛫ Обычный → ◦ Продвинутый → ○ Редкий → ⭘ Престижный → ◎ Раритетный → ⓪ Абсолютный, по шкале карточек сервера.<\/p><p><b>Названия ингредиентов<\/b> даны на языке жрецов-лекарей. Расшифровка есть у каждого препарата и в словаре в конце.<\/p><h2 id=\"wolf2-2\">Препараты<\/h2><h3 id=\"wolf2-3\">Мазь «Холод Фенриса»<\/h3><ul><li><b>Редкость:<\/b> ◦ Продвинутый<\/li><li><b>Ингредиенты:<\/b> Кротахк, Йотун-Крак, Хранд-Лось, Асах-Ват<\/li><li><b>Рецепт:<\/b> В костяной чаше холодный Йотун-Крак растирают с густым Хранд-Лось. В массу всыпают истолчённый в порошок Кротахк и заливают ледяной Асах-Ват, пока смесь не начнёт яростно пениться.<\/li><li><b>Действие:<\/b> Криогенный нейростимулятор. Резко расширяет сосуды, разгоняет обмен веществ Астартес, не даёт впасть в шок и ускоряет доставку кислорода к органам.<\/li><li><b>Перевод:<\/b> Кротахк — высушенный язык термального ящера. Йотун-Крак — вытяжка из глубинных желёз кракена. Хранд-Лось — очищенный жир фенрисийского лося. Асах-Ват — перегнанная талая вода ледников Асахейма.<\/li><\/ul><h3 id=\"wolf2-4\">Мазь «Жгучий Клык»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Рекк-Паук, Телиф-Сок, Орф-Антак, Фьорд-Мох<\/li><li><b>Рецепт:<\/b> В каменной чаше соединяют агрессивный Рекк-Паук и едкий Телиф-Сок. Когда бурная реакция стихает, состав гасят Орф-Антак, чтобы кислота не проела здоровую плоть, и засыпают вяжущим порошком Фьорд-Мох.<\/li><li><b>Действие:<\/b> Выжигает и растворяет ксенозаразу и омертвевшую плоть кислотой фенрисийских членистоногих, со свистом стерилизуя рану до здоровых тканей. Фьорд-Мох держит мазь на ране и останавливает кровь.<\/li><li><b>Перевод:<\/b> Рекк-Паук — концентрированная кислота из жвал кикиморы. Телиф-Сок — едкий секрет из хвостовых желёз телифона. Орф-Антак — костяная мука. Фьорд-Мох — порошок фьордового мха.<\/li><\/ul><h3 id=\"wolf2-5\">Катализатор «Второе Дыхание»<\/h3><ul><li><b>Редкость:<\/b> ◦ Продвинутый<\/li><li><b>Ингредиенты:<\/b> Валь-Гриф, Хаз-Так, Тандер-Карр, Один-Кор<\/li><li><b>Рецепт:<\/b> Свежую Валь-Гриф соединяют в тигле с истолчённым Тандер-Карр и вытяжкой Один-Кор. В эссенцию всыпают стружку Хаз-Так, и она запускает химический микровзрыв.<\/li><li><b>Действие:<\/b> Форсирует работу Третьего лёгкого. Применяется при тяжёлых ранениях грудной клетки или отравлении газами, сжёгшими основные лёгкие. Разгоняет имплант на 300% и позволяет дышать даже чистым хлором или до получаса держаться в вакууме без шлема.<\/li><li><b>Перевод:<\/b> Валь-Гриф — насыщенная кислородом кровь из предсердия грифона. Хаз-Так — стружка лёгочных хрящей громового волка. Тандер-Карр — перемолотые каменные наросты круглорога. Один-Кор — корень морозного папоротника.<\/li><\/ul><h3 id=\"wolf2-6\">Мазь «Ледяной Замок»<\/h3><ul><li><b>Редкость:<\/b> ◦ Продвинутый<\/li><li><b>Ингредиенты:<\/b> Драуг-Шелк, Ррим-Жир, Ис-Крош<\/li><li><b>Рецепт:<\/b> Прочный Драуг-Шелк долго перетирают с топлёным Ррим-Жир до плотной мази, после чего вмешивают морозную Ис-Крош.<\/li><li><b>Действие:<\/b> Накладывается на открытые рваные раны живота, когда органы вываливаются наружу. Мгновенно сужает сосуды, замораживает повреждённые ткани и фиксирует органы на месте, не давая заразе попасть в брюшную полость, пока раненого несут к Творцу плоти.<\/li><li><b>Перевод:<\/b> Драуг-Шелк — паутина ледяного паука. Ррим-Жир — подкожный жир ётуна. Ис-Крош — толчёный лёд с ледника.<\/li><\/ul><h3 id=\"wolf2-7\">Мазь «Узы Стужи»<\/h3><ul><li><b>Редкость:<\/b> ○ Редкий<\/li><li><b>Ингредиенты:<\/b> Ундин-Слизь, Фрейя-Ягод, Локи-Кож<\/li><li><b>Рецепт:<\/b> Глубинную Ундин-Слизь тщательно взбивают с кислым Фрейя-Ягод, после чего по капле вводят изменчивый пигмент Локи-Кож.<\/li><li><b>Действие:<\/b> Наносится на ожоги от плазмы и мельты. Мгновенно вытягивает жар из костей, ускоряет рост новой кожи и не даёт появиться рубцам, сковывающим суставы. Локи-Кож заставляет новую кожу принять облик прежней.<\/li><li><b>Перевод:<\/b> Ундин-Слизь — охлаждающая слизь со щупалец ледяного кракена, её соскребают со льда, который он проломил. Фрейя-Ягод — сок морозной морошки. Локи-Кож — чернильный концентрат кожи перевертня.<\/li><\/ul><h3 id=\"wolf2-8\">Сыворотка «Чистая Кровь»<\/h3><ul><li><b>Редкость:<\/b> ○ Редкий<\/li><li><b>Ингредиенты:<\/b> Фен-Желч, Фенрир-Лимф, Игг-Желез, Двахкарр<\/li><li><b>Рецепт:<\/b> Вязкую Фен-Желч и яростную Фенрир-Лимф настаивают на горячей Игг-Желез. Перед запечатыванием ампулы в неё всыпают мелкий чёрный Двахкарр.<\/li><li><b>Действие:<\/b> Антитоксический ударный состав. Вводится ретроградно в лимфатическую систему и очищает организм от сложных биотоксинов. Двахкарр впитывает яд, как пепел впитывает жир.<\/li><li><b>Перевод:<\/b> Фен-Желч — желчь болотожора. Фенрир-Лимф — лимфа громового волка. Игг-Желез — вытяжка из коры железного дерева. Двахкарр — чёрный пепел корней пепельной розы, сожжённых на погребальном костре.<\/li><\/ul><h3 id=\"wolf2-9\">Бальзам «Железный Сон»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Нидхёгг-Яд, Хел-Мак, Ульф-Мозг<\/li><li><b>Рецепт:<\/b> Концентрированный Нидхёгг-Яд очищают через фильтры, смешивают с густым Хел-Мак и связывают ментальным катализатором Ульф-Мозг.<\/li><li><b>Действие:<\/b> Сильное снотворное, погружающее раненого в каталептический сон. Применяется при тяжёлых повреждениях мозга, когда сознание Астартес нужно полностью отключить для трепанации и нейрохирургии.<\/li><li><b>Перевод:<\/b> Нидхёгг-Яд — сонный яд из клыков нетопыря. Хел-Мак — вытяжка чёрного мака. Ульф-Мозг — мозг фенрисийского волка.<\/li><\/ul><h3 id=\"wolf2-10\">Препарат «Волчий Поцелуй»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Винтер-Омел, Руни-Кость, Гев-Гормон<\/li><li><b>Рецепт:<\/b> Свежие ягоды Винтер-Омел перетирают в ступке с топлёным Руни-Кость и насыщают Гев-Гормон. Омелу срезают только костяным ножом, ведь железо убивает её силу.<\/li><li><b>Действие:<\/b> Укрощает ярость Проклятия Вульфена и мягко возвращает бушующий разум Астартес к холодному спокойствию.<\/li><li><b>Перевод:<\/b> Винтер-Омел — ягоды хельвинтерской омелы. Руни-Кость — костный мозг хищника. Гев-Гормон — успокаивающий гормон из желёз новорождённых волчат.<\/li><\/ul><h3 id=\"wolf2-11\">Мазь «Дар Всеотца»<\/h3><ul><li><b>Редкость:<\/b> ◎ Раритетный<\/li><li><b>Ингредиенты:<\/b> Игг-Смол, Асгард-Плазм, Хейм-Глаз, Валлах-Пыль, Пром-Огн<\/li><li><b>Рецепт:<\/b> На пламени Пром-Огн растапливают вязкую Игг-Смол, добавляя Асгард-Плазм и эссенцию Хейм-Глаз. Кипящую массу насыщают сияющей Валлах-Пыль и резко остужают в леднике.<\/li><li><b>Действие:<\/b> Мгновенно перезапускает и форсирует регенерацию Астартес на генетическом уровне. За секунды восстанавливает утраченные внутренние органы, сращивает перебитый позвоночник и буквально поднимает бойца из клинической смерти.<\/li><li><b>Перевод:<\/b> Игг-Смол — смола тысячелетнего железного дерева. Асгард-Плазм — кровь королевского грифона. Хейм-Глаз — глаз бессмертного Великана-пустошника. Валлах-Пыль — толчёные кристаллы с костей ледяного кракена на Кракеновой Шпоре. Пром-Огн — освящённый прометий.<\/li><\/ul><h3 id=\"wolf2-12\">Препарат «Антитварин»<\/h3><ul><li><b>Редкость:<\/b> ⭘ Престижный<\/li><li><b>Ингредиенты:<\/b> Один-Кор, Винтер-Омел, Фен-Желч, Скальд-Кров, Тандер-Коготь<\/li><li><b>Рецепт:<\/b> В серебряной чаше растирают Один-Кор, Винтер-Омел и Фен-Желч. Затем вливают Скальд-Кров, отчего раствор искрится ментальным огнём, и добавляют катализатор Тандер-Коготь.<\/li><li><b>Действие:<\/b> Препарат против малефикарума. Выжигает из тела и разума следы тёмного колдовства и на время защищает принявшего от новых чар.<\/li><li><b>Перевод:<\/b> Один-Кор — корень морозного папоротника. Винтер-Омел — ягоды хельвинтерской омелы. Фен-Желч — желчь болотожора, лучше всего полярного. Скальд-Кров — кровь сильного годи. Тандер-Коготь — порошок из когтя громового волка.<\/li><\/ul><h2 id=\"wolf2-13\">Обрядовые и полевые составы<\/h2><p>Эти составы собраны по бестиарию и травнику Фенриса. Одни служат обрядам жрецов, другие лежат в полевой сумке каждого Творца плоти.<\/p><h3 id=\"wolf2-14\">Повязка «Болотный Покров»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Сфаг-Мох, Рамс-Сок, Фьорд-Мох, Облеп-Масло<\/li><li><b>Рецепт:<\/b> Сухой Сфаг-Мох вымачивают в Рамс-Сок, отжимают и пересыпают Фьорд-Мох. Перед наложением край повязки смазывают Облеп-Масло, чтобы она не прикипала к ране.<\/li><li><b>Действие:<\/b> Полевая повязка, которую носит при себе каждый Творец плоти. Впитывает кровь и гной, не даёт ране гнить и стягивает её края. Для Астартес это временная мера до Жгучего Клыка, а для смертных кэрлов часто единственное лечение.<\/li><li><b>Перевод:<\/b> Сфаг-Мох — высушенный сфагнум. Рамс-Сок — сок дикого чеснока. Фьорд-Мох — порошок фьордового мха. Облеп-Масло — облепиховое масло.<\/li><\/ul><h3 id=\"wolf2-15\">Мазь «Тёплая Шкура»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Сэл-Жир, Облеп-Масло, Фен-Слизь<\/li><li><b>Рецепт:<\/b> Сэл-Жир топят на медленном огне и вмешивают Облеп-Масло. Когда жир остынет до тёплого, его взбивают с Фен-Слизь.<\/li><li><b>Действие:<\/b> Защищает кожу от лютого мороза и лечит обморожения. Астартес она нужна редко, зато ею мажут аспирантов перед испытанием в дикости Асахейма и смертных слуг легиона в долгую зиму. Пахнет так, что лучше уж обморозиться.<\/li><li><b>Перевод:<\/b> Сэл-Жир — топлёный тюлений жир. Облеп-Масло — облепиховое масло. Фен-Слизь — слизь полярного болотожора.<\/li><\/ul><h3 id=\"wolf2-16\">Сыворотка «Ответный Укус»<\/h3><ul><li><b>Редкость:<\/b> ◦ Продвинутый<\/li><li><b>Ингредиенты:<\/b> Вивер-Яд, Аракс-Кров, Игг-Желез<\/li><li><b>Рецепт:<\/b> Вивер-Яд семь раз разбавляют талой водой и выдерживают в холоде, пока он не потеряет силу. Ослабленный яд смешивают с Аракс-Кров и настаивают на Игг-Желез.<\/li><li><b>Действие:<\/b> Противоядие от ядов фенрисийских тварей: виверны, сколопендроморфа, аракаса и эндриаги. Снимает онемение и паралич, не даёт яду дойти до сердец. С большинством ядов оолитовая почка Астартес справляется сама, но не с ядом королевской виверны.<\/li><li><b>Перевод:<\/b> Вивер-Яд — ослабленный яд из жала виверны. Аракс-Кров — кровь старого аракаса, привыкшего к собственному яду. Игг-Желез — вытяжка из коры железного дерева.<\/li><\/ul><h3 id=\"wolf2-17\">Пепел «Сокрытие Следов»<\/h3><ul><li><b>Редкость:<\/b> ◦ Продвинутый<\/li><li><b>Ингредиенты:<\/b> Эйнир-Пепел, Рев-Шерсть, Нифль-Прах, Плакун-Кор<\/li><li><b>Рецепт:<\/b> Эйнир-Пепел перемешивают с опалённой Рев-Шерсть и Нифль-Прах. Над смесью жрец ломает свежий Плакун-Кор. Если корень заныл в руке, рядом чужое колдовство, и обряд проводят дважды.<\/li><li><b>Действие:<\/b> Ритуальный пепел для Обряда Сокрытия Следов перед скрытными операциями. Жрец чертит им полосы на доспехах и лицах стаи. Пепел глушит запах, сбивает чутьё зверей и, по вере Волков, прячет ауру стаи от вражеских псайкеров.<\/li><li><b>Перевод:<\/b> Эйнир-Пепел — пепел можжевельника, сожжённого на остывшей лаве. Рев-Шерсть — опалённая шерсть пепельной лисы. Нифль-Прах — прах туманника, убитого вне тумана. Плакун-Кор — корень плакун-травы.<\/li><\/ul><h3 id=\"wolf2-18\">Бальзам «Одинокий Волк»<\/h3><ul><li><b>Редкость:<\/b> ◦ Продвинутый<\/li><li><b>Ингредиенты:<\/b> Хел-Мак, Эльгра-Мьод, Гулл-Кор, Морк-Роза<\/li><li><b>Рецепт:<\/b> Хел-Мак разводят в Эльгра-Мьод в доле, что убила бы смертного. Туда бросают тёртый Гулл-Кор и три лепестка Морк-Роза. Жрец подаёт бальзам из своего рога и уходит, не оглядываясь.<\/li><li><b>Действие:<\/b> Даётся смертельно раненым, которых уже не спасти, в Обряде Омовения Одинокого Волка. Полностью гасит боль, но не туманит разум: Гулл-Кор держит воина на ногах и даёт силы для последнего боя. Говорят, Морк-Роза показывает ему павших братьев, пришедших за ним. Когда всё кончено, жрец возвращается с Клыком Моркаи.<\/li><li><b>Перевод:<\/b> Хел-Мак — вытяжка чёрного мака. Эльгра-Мьод — тёмный вересковый мьод. Гулл-Кор — корень золотого корня. Морк-Роза — лепестки пепельной розы.<\/li><\/ul><h3 id=\"wolf2-19\">Мьод «Тризна»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Эльгра-Мьод, Мирт-Лист, Эйнир-Ягод, Багуль-Лист<\/li><li><b>Рецепт:<\/b> Эльгра-Мьод варят второй раз с Мирт-Лист и Эйнир-Ягод в можжевеловом бочонке. Перед пиром жрец бросает в каждый котёл щепоть Багуль-Лист.<\/li><li><b>Действие:<\/b> Хмель для Пира памяти. Организм Астартес почти не пьянеет, поэтому жрецы крепят мьод миртом и багульником, пока его не почувствует даже Небесный Воин. Мьод развязывает язык и обостряет память: воины по очереди называют каждого павшего брата стаи, не сбиваясь и не пропуская имён.<\/li><li><b>Перевод:<\/b> Эльгра-Мьод — тёмный вересковый мьод. Мирт-Лист — листья болотного мирта. Эйнир-Ягод — ягоды можжевельника. Багуль-Лист — сушёный багульник.<\/li><\/ul><h3 id=\"wolf2-20\">Взвар «Ледяная Купель»<\/h3><ul><li><b>Редкость:<\/b> ᛫ Обычный<\/li><li><b>Ингредиенты:<\/b> Асах-Ват, Скадд-Цвет, Винтер-Омел<\/li><li><b>Рецепт:<\/b> Скадд-Цвет нельзя сорвать, он тает в руке, поэтому жрец растапливает его во рту прямо на леднике и сплёвывает в чашу с Асах-Ват. Туда добавляют каплю сока Винтер-Омел. Взвар выливают в прорубь, а над ней жгут можжевельник.<\/li><li><b>Действие:<\/b> Применяется в Обряде Очищения Ледяной Водой после долгих кампаний. Воин погружается в прорубь, холод не проникает глубже кожи, а ярость и усталость кампании уходят вместе с водой. Снимает ментальную нагрузку и гасит ко
