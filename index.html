олотые каменные наросты круглорога. Один-Кор — корень морозного папоротника."},{"kind":"Мазь","name":"Ледяной Замок","rarity":2,"rarityName":"◦ Продвинутый","ingredients":["Драуг-Шелк","Ррим-Жир","Ис-Крош"],"ground":[1,1,0],"recipe":"Прочный Драуг-Шелк долго перетирают с топлёным Ррим-Жир до плотной мази, после чего вмешивают морозную Ис-Крош.","effect":"Накладывается на открытые рваные раны живота, когда органы вываливаются наружу. Мгновенно сужает сосуды, замораживает повреждённые ткани и фиксирует органы на месте, не давая заразе попасть в брюшную полость, пока раненого несут к Творцу плоти.","translation":"Драуг-Шелк — паутина ледяного паука. Ррим-Жир — подкожный жир ётуна. Ис-Крош — толчёный лёд с ледника."},{"kind":"Мазь","name":"Узы Стужи","rarity":3,"rarityName":"○ Редкий","ingredients":["Ундин-Слизь","Фрейя-Ягод","Локи-Кож"],"ground":[0,0,0],"recipe":"Глубинную Ундин-Слизь тщательно взбивают с кислым Фрейя-Ягод, после чего по капле вводят изменчивый пигмент Локи-Кож.","effect":"Наносится на ожоги от плазмы и мельты. Мгновенно вытягивает жар из костей, ускоряет рост новой кожи и не даёт появиться рубцам, сковывающим суставы. Локи-Кож заставляет новую кожу принять облик прежней.","translation":"Ундин-Слизь — охлаждающая слизь со щупалец ледяного кракена, её соскребают со льда, который он проломил. Фрейя-Ягод — сок морозной морошки. Локи-Кож — чернильный концентрат кожи перевертня."},{"kind":"Сыворотка","name":"Чистая Кровь","rarity":3,"rarityName":"○ Редкий","ingredients":["Фен-Желч","Фенрир-Лимф","Игг-Желез","Двахкарр"],"ground":[0,0,0,0],"recipe":"Вязкую Фен-Желч и яростную Фенрир-Лимф настаивают на горячей Игг-Желез. Перед запечатыванием ампулы в неё всыпают мелкий чёрный Двахкарр.","effect":"Антитоксический ударный состав. Вводится ретроградно в лимфатическую систему и очищает организм от сложных биотоксинов. Двахкарр впитывает яд, как пепел впитывает жир.","translation":"Фен-Желч — желчь болотожора. Фенрир-Лимф — лимфа громового волка. Игг-Желез — вытяжка из коры железного дерева. Двахкарр — чёрный пепел корней пепельной розы, сожжённых на погребальном костре."},{"kind":"Бальзам","name":"Железный Сон","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Нидхёгг-Яд","Хел-Мак","Ульф-Мозг"],"ground":[0,0,0],"recipe":"Концентрированный Нидхёгг-Яд очищают через фильтры, смешивают с густым Хел-Мак и связывают ментальным катализатором Ульф-Мозг.","effect":"Сильное снотворное, погружающее раненого в каталептический сон. Применяется при тяжёлых повреждениях мозга, когда сознание Астартес нужно полностью отключить для трепанации и нейрохирургии.","translation":"Нидхёгг-Яд — сонный яд из клыков нетопыря. Хел-Мак — вытяжка чёрного мака. Ульф-Мозг — мозг фенрисийского волка."},{"kind":"Препарат","name":"Волчий Поцелуй","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Винтер-Омел","Руни-Кость","Гев-Гормон"],"ground":[1,1,0],"recipe":"Свежие ягоды Винтер-Омел перетирают в ступке с топлёным Руни-Кость и насыщают Гев-Гормон. Омелу срезают только костяным ножом, ведь железо убивает её силу.","effect":"Укрощает ярость Проклятия Вульфена и мягко возвращает бушующий разум Астартес к холодному спокойствию.","translation":"Винтер-Омел — ягоды хельвинтерской омелы. Руни-Кость — костный мозг хищника. Гев-Гормон — успокаивающий гормон из желёз новорождённых волчат."},{"kind":"Мазь","name":"Дар Всеотца","rarity":5,"rarityName":"◎ Раритетный","ingredients":["Игг-Смол","Асгард-Плазм","Хейм-Глаз","Валлах-Пыль","Пром-Огн"],"ground":[0,0,0,0,0],"recipe":"На пламени Пром-Огн растапливают вязкую Игг-Смол, добавляя Асгард-Плазм и эссенцию Хейм-Глаз. Кипящую массу насыщают сияющей Валлах-Пыль и резко остужают в леднике.","effect":"Мгновенно перезапускает и форсирует регенерацию Астартес на генетическом уровне. За секунды восстанавливает утраченные внутренние органы, сращивает перебитый позвоночник и буквально поднимает бойца из клинической смерти.","translation":"Игг-Смол — смола тысячелетнего железного дерева. Асгард-Плазм — кровь королевского грифона. Хейм-Глаз — глаз бессмертного Великана-пустошника. Валлах-Пыль — толчёные кристаллы с костей ледяного кракена на Кракеновой Шпоре. Пром-Огн — освящённый прометий."},{"kind":"Препарат","name":"Антитварин","rarity":4,"rarityName":"⭘ Престижный","ingredients":["Один-Кор","Винтер-Омел","Фен-Желч","Скальд-Кров","Тандер-Коготь"],"ground":[1,1,1,0,0],"recipe":"В серебряной чаше растирают Один-Кор, Винтер-Омел и Фен-Желч. Затем вливают Скальд-Кров, отчего раствор искрится ментальным огнём, и добавляют катализатор Тандер-Коготь.","effect":"Препарат против малефикарума. Выжигает из тела и разума следы тёмного колдовства и на время защищает принявшего от новых чар.","translation":"Один-Кор — корень морозного папоротника. Винтер-Омел — ягоды хельвинтерской омелы. Фен-Желч — желчь болотожора, лучше всего полярного. Скальд-Кров — кровь сильного годи. Тандер-Коготь — порошок из когтя громового волка."},{"kind":"Повязка","name":"Болотный Покров","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Сфаг-Мох","Рамс-Сок","Фьорд-Мох","Облеп-Масло"],"ground":[0,0,0,0],"recipe":"Сухой Сфаг-Мох вымачивают в Рамс-Сок, отжимают и пересыпают Фьорд-Мох. Перед наложением край повязки смазывают Облеп-Масло, чтобы она не прикипала к ране.","effect":"Полевая повязка, которую носит при себе каждый Творец плоти. Впитывает кровь и гной, не даёт ране гнить и стягивает её края. Для Астартес это временная мера до Жгучего Клыка, а для смертных кэрлов часто единственное лечение.","translation":"Сфаг-Мох — высушенный сфагнум. Рамс-Сок — сок дикого чеснока. Фьорд-Мох — порошок фьордового мха. Облеп-Масло — облепиховое масло."},{"kind":"Мазь","name":"Тёплая Шкура","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Сэл-Жир","Облеп-Масло","Фен-Слизь"],"ground":[0,0,0],"recipe":"Сэл-Жир топят на медленном огне и вмешивают Облеп-Масло. Когда жир остынет до тёплого, его взбивают с Фен-Слизь.","effect":"Защищает кожу от лютого мороза и лечит обморожения. Астартес она нужна редко, зато ею мажут аспирантов перед испытанием в дикости Асахейма и смертных слуг легиона в долгую зиму. Пахнет так, что лучше уж обморозиться.","translation":"Сэл-Жир — топлёный тюлений жир. Облеп-Масло — облепиховое масло. Фен-Слизь — слизь полярного болотожора."},{"kind":"Сыворотка","name":"Ответный Укус","rarity":2,"rarityName":"◦ Продвинутый","ingredients":["Вивер-Яд","Аракс-Кров","Игг-Желез"],"ground":[0,0,0],"recipe":"Вивер-Яд семь раз разбавляют талой водой и выдерживают в холоде, пока он не потеряет силу. Ослабленный яд смешивают с Аракс-Кров и настаивают на Игг-Желез.","effect":"Противоядие от ядов фенрисийских тварей: виверны, сколопендроморфа, аракаса и эндриаги. Снимает онемение и паралич, не даёт яду дойти до сердец. С большинством ядов оолитовая почка Астартес справляется сама, но не с ядом королевской виверны.","translation":"Вивер-Яд — ослабленный яд из жала виверны. Аракс-Кров — кровь старого аракаса, привыкшего к собственному яду. Игг-Желез — вытяжка из коры железного дерева."},{"kind":"Пепел","name":"Сокрытие Следов","rarity":2,"rarityName":"◦ Продвинутый","ingredients":["Эйнир-Пепел","Рев-Шерсть","Нифль-Прах","Плакун-Кор"],"ground":[0,0,0,0],"recipe":"Эйнир-Пепел перемешивают с опалённой Рев-Шерсть и Нифль-Прах. Над смесью жрец ломает свежий Плакун-Кор. Если корень заныл в руке, рядом чужое колдовство, и обряд проводят дважды.","effect":"Ритуальный пепел для Обряда Сокрытия Следов перед скрытными операциями. Жрец чертит им полосы на доспехах и лицах стаи. Пепел глушит запах, сбивает чутьё зверей и, по вере Волков, прячет ауру стаи от вражеских псайкеров.","translation":"Эйнир-Пепел — пепел можжевельника, сожжённого на остывшей лаве. Рев-Шерсть — опалённая шерсть пепельной лисы. Нифль-Прах — прах туманника, убитого вне тумана. Плакун-Кор — корень плакун-травы."},{"kind":"Бальзам","name":"Одинокий Волк","rarity":2,"rarityName":"◦ Продвинутый","ingredients":["Хел-Мак","Эльгра-Мьод","Гулл-Кор","Морк-Роза"],"ground":[0,0,1,1],"recipe":"Хел-Мак разводят в Эльгра-Мьод в доле, что убила бы смертного. Туда бросают тёртый Гулл-Кор и три лепестка Морк-Роза. Жрец подаёт бальзам из своего рога и уходит, не оглядываясь.","effect":"Даётся смертельно раненым, которых уже не спасти, в Обряде Омовения Одинокого Волка. Полностью гасит боль, но не туманит разум: Гулл-Кор держит воина на ногах и даёт силы для последнего боя. Говорят, Морк-Роза показывает ему павших братьев, пришедших за ним. Когда всё кончено, жрец возвращается с Клыком Моркаи.","translation":"Хел-Мак — вытяжка чёрного мака. Эльгра-Мьод — тёмный вересковый мьод. Гулл-Кор — корень золотого корня. Морк-Роза — лепестки пепельной розы."},{"kind":"Мьод","name":"Тризна","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Эльгра-Мьод","Мирт-Лист","Эйнир-Ягод","Багуль-Лист"],"ground":[0,0,0,0],"recipe":"Эльгра-Мьод варят второй раз с Мирт-Лист и Эйнир-Ягод в можжевеловом бочонке. Перед пиром жрец бросает в каждый котёл щепоть Багуль-Лист.","effect":"Хмель для Пира памяти. Организм Астартес почти не пьянеет, поэтому жрецы крепят мьод миртом и багульником, пока его не почувствует даже Небесный Воин. Мьод развязывает язык и обостряет память: воины по очереди называют каждого павшего брата стаи, не сбиваясь и не пропуская имён.","translation":"Эльгра-Мьод — тёмный вересковый мьод. Мирт-Лист — листья болотного мирта. Эйнир-Ягод — ягоды можжевельника. Багуль-Лист — сушёный багульник."},{"kind":"Взвар","name":"Ледяная Купель","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Асах-Ват","Скадд-Цвет","Винтер-Омел"],"ground":[0,0,0],"recipe":"Скадд-Цвет нельзя сорвать, он тает в руке, поэтому жрец растапливает его во рту прямо на леднике и сплёвывает в чашу с Асах-Ват. Туда добавляют каплю сока Винтер-Омел. Взвар выливают в прорубь, а над ней жгут можжевельник.","effect":"Применяется в Обряде Очищения Ледяной Водой после долгих кампаний. Воин погружается в прорубь, холод не проникает глубже кожи, а ярость и усталость кампании уходят вместе с водой. Снимает ментальную нагрузку и гасит кошмары. По поверью, отгоняет хима от тех, кто вернулся с виной на душе.","translation":"Асах-Ват — талая вода ледников Асахейма. Скадд-Цвет — ледоцвет. Винтер-Омел — сок ягод хельвинтерской омелы."},{"kind":"Краска","name":"Кровавый Знак","rarity":1,"rarityName":"᛫ Обычный","ingredients":["Блод-Лишай","Сэл-Жир","Двахкарр"],"ground":[1,1,0],"recipe":"Блод-Лишай вываривают до густой краски и растирают с Сэл-Жир. Для метки позора в краску добавляют щепоть Двахкарр, и она темнеет до цвета запёкшейся крови.","effect":"Боевая раскраска и знак суда. Перед боем жрец чертит ею руны на лицах и доспехах стаи. Тёмной краской с пеплом он метит опозоренных, чьи имена вычеркнуты из саг. Её не смывает ни море, ни дождь.","translation":"Блод-Лишай — кровавый лишайник. Сэл-Жир — топлёный тюлений жир. Двахкарр — чёрный пепел корней пепельной розы."},{"kind":"Отвар","name":"Зов Зверя","rarity":3,"rarityName":"○ Редкий","ingredients":["Бьорн-Гриб","Багуль-Лист","Гулл-Кор","Тролль-Кров"],"ground":[0,0,1,1],"recipe":"Бьорн-Гриб сушат особым способом, который знают только Старшие жрецы, и варят с Багуль-Лист. В остывший отвар вмешивают тёртый Гулл-Кор и свежую Тролль-Кров, пока она не перестанет шевелиться.","effect":"Боевое безумие. Воин не чувствует ни боли, ни страха, а раны на нём затягиваются прямо в бою, как на ледяном тролле. Цена страшна: отвар будит в Астартес зверя, и каждый глоток приближает Проклятие Вульфена. Даётся только с позволения Старшего жреца, а Волчий Поцелуй держат наготове.","translation":"Бьорн-Гриб — высушенный берсерков гриб. Багуль-Лист — сушёный багульник. Гулл-Кор — корень золотого корня. Тролль-Кров — кровь ледяного тролля."},{"kind":"Отвар","name":"Взор Моркаи","rarity":3,"rarityName":"○ Редкий","ingredients":["Морк-Роза","Свефн-Трав","Курган-Гриб","Уггла-Глаз"],"ground":[0,0,1,0],"recipe":"Морк-Роза и Свефн-Трав томятся ночь у погребального костра. На рассвете в отвар крошат Курган-Гриб с кургана беспокойного мертвеца и опускают Уггла-Глаз. Пьёт сам жрец, сидя у тела павшего.","effect":"Состав Говорящих с мёртвыми. Погружает жреца в сон на грани смерти, где он видит павших и может говорить с ними: узнать последние слова, имя убийцы, неисполненную клятву. За это платят: после каждого приёма кожа жреца холодеет на несколько дней, а совы садятся на крышу его жилища.","translation":"Морк-Роза — лепестки пепельной розы. Свефн-Трав — сон-трава. Курган-Гриб — курганник. Уггла-Глаз — высушенный глаз полярной совы."},{"kind":"Таинство","name":"Кубок Вульфена","rarity":6,"rarityName":"⓪ Абсолютный","ingredients":["Канис Хеликс","Ульф-Кров","третий ингредиент знают только Старшие жрецы"],"ground":[0,0,0],"recipe":"Не записывается. Говорят, Канис Хеликс растворяют в Ульф-Кров и подают аспиранту в Кубке, из которого пили первые воины Русса.","effect":"Первое и главное таинство легиона. Хеликс входит в тело аспиранта: кости трещат, тело обрастает шерстью, разум скатывается в звериный. Начинается Испытание Моркаи, и аспирант должен сам вернуться к Клыку через дикость Фенриса. Вернувшемуся вживляют остальные органы, а кто не вернулся, становится Вульфеном.","translation":"Канис Хеликс — первый и главный компонент генного семени легиона, кровь Русса. Ульф-Кров — кровь черногривого волка."}],"glossary":{"Багуль-Лист":{"what":"Сушёный багульник","used":"Тризна, Зов Зверя","group":"herb"},"Блод-Лишай":{"what":"Кровавый лишайник","used":"Кровавый Знак","group":"herb"},"Бьорн-Гриб":{"what":"Высушенный берсерков гриб","used":"Зов Зверя","group":"herb"},"Винтер-Омел":{"what":"Ягоды хельвинтерской омелы","used":"Волчий Поцелуй, Антитварин, Ледяная Купель","group":"herb"},"Гулл-Кор":{"what":"Корень золотого корня","used":"Одинокий Волк, Зов Зверя","group":"herb"},"Двахкарр":{"what":"Чёрный пепел корней пепельной розы с погребального костра","used":"Чистая Кровь, Кровавый Знак","group":"herb"},"Игг-Желез":{"what":"Вытяжка из коры железного дерева","used":"Чистая Кровь, Ответный Укус","group":"herb"},"Игг-Смол":{"what":"Смола тысячелетнего железного дерева","used":"Да up":"beast"},"Хаз-Так":{"what":"Стружка лёгочных хрящей громового волка","used":"Второе Дыхание","group":"beast"},"Хейм-Глаз":{"what":"Глаз бессмертного Великана-пустошника","used":"Дар Всеотца","group":"beast"},"Хранд-Лось":{"what":"Очищенный жир фенрисийского лося","used":"Холод Фенриса","group":"beast"},"Асах-Ват":{"what":"Перегнанная талая вода ледников Асахейма","used":"Холод Фенриса, Ледяная Купель","group":"other"},"Ис-Крош":{"what":"Толчёный лёд с ледника","used":"Ледяной Замок","group":"other"},"Канис Хеликс":{"what":"Первый компонент генного семени легиона","used":"Кубок Вульфена","group":"other"},"Орф-Антак":{"what":"Костяная мука","used":"Жгучий Клык","group":"other"},"Пром-Огн":{"what":"Освящённый прометий","used":"Дар Всеотца","group":"other"},"Скальд-Кров":{"what":"Кровь сильного годи","used":"Антитварин","group":"other"}},"songs":[{"orig":"Heitstrenging","title":"Злая Клятва","when":"Перед битвой, в обряде Злой Клятвы. Жрец поёт, стая отвечает рёвом после каждого имени павшего.","lines":[["Heyr, Morkai, hér stöndum vér,","Слушай, Моркаи, здесь стоим мы,"],["gráir úlfar, járni klæddir.","серые волки, в железо одетые."],["Eigi komum vér at deyja,","Не пришли мы, чтобы умереть,"],["heldr at drepa.","но чтобы убивать."],["Nefni ek nöfn fallinna","Называю я имена павших"],["bræðra várra, er blóð gáfu:","братьев наших, что отдали кровь:"],["*Стая:* Hann lifir í oss!","*Стая:* Он живёт в нас!"],["Svá skulu óvinir falla","Так падут враги,"],["sem fellr snjór á Fenri.","как падает снег на Фенрис."]]},{"orig":"Einfaraljóð","title":"Песнь Одинокого Волка","when":"В обряде Омовения Одинокого Волка, тихо, над умирающим.","lines":[["Þvæ ek blóð af enni þínu,","Смываю кровь с твоего лба,"],["at Morkai sjái andlit þitt.","чтобы Моркаи увидел твоё лицо."],["Tak øxi þína í hönd,","Возьми в руку свой топор,"],["statt upp, bróðir.","встань, брат."],["Eigi skaltu liggja","Не лежать тебе,"],["er hann kemr at sækja þik.","когда он придёт за тобой."],["Ek geng á braut","Я ухожу"],["ok lít eigi aptr.","и не оглядываюсь."]]},{"orig":"Bálfararkvæði","title":"Песнь Огненных Проводов","when":"У погребального костра. Последние строки жрец поёт, уже стоя к огню спиной.","lines":[["Brenn þú, bróðir, á báli háu,","Гори, брат, на высоком костре,"],["far þú til Morkai með höfuð hátt.","иди к Моркаи с поднятой головой."],["Nagla þína skerum vér,","Ногти твои мы срезаем,"],["at Naglfar smíðisk seint.","чтоб Нагльфар строился медленно."],["Baki snúum vér við eldi,","Спиной мы встаём к огню,"],["at vér kallim þik eigi aptr.","чтобы не позвать тебя назад."],["Vér fylgðum þér.","Мы тебя проводили."]]},{"orig":"Erfikvæði","title":"Песнь Тризны","when":"В начале и в конце Тризны Павших. Последние две строки — старое изречение, которое знает каждый фенрисиец.","lines":[["Fyllum horn, fyllum horn","Наполним рога, наполним рога"],["fyrir þá er fóru.","за тех, кто ушёл."],["Nefn hann ok drekk,","Назови его и пей,"],["nefn hinn næsta ok drekk.","назови следующего и пей."],["Meðan vér munum,","Пока мы помним,"],["eru þeir í flokki.","они в стае."],["Deyr fé, deyja frændr,","Гибнут стада, умирают родичи,"],["en orðstírr deyr aldregi.","но слава не умрёт никогда."]]},{"orig":"Kalksljóð","title":"Песнь Кубка","when":"Когда аспирант пьёт из Кубка Вульфена. Поёт Старший жрец, стая молчит.","lines":[["Drekk þú, sveinn, af dreyra Russ,","Пей, юноша, кровь Русса,"],["vakir úlfr í brjósti þér.","в груди твоей просыпается волк."],["Bein þín bresta,","Трещат твои кости,"],["hár þitt vex.","растёт твоя шерсть."],["Rata þú heim, ef þú ratar,","Найди дорогу домой, если сможешь,"],["eða ver með vörgum.","или останься с волками."]]},{"orig":"Spekjuljóð","title":"Песнь Укрощения","when":"В обряде Укрощения Зверя, снова и снова, пока брат не затихнет. По саге, её сложил Ульфхам Чернорукий.","lines":[["Heyr nafn þitt, heyr nafn þitt,","Слушай своё имя, слушай своё имя,"],["eigi ertu dýr.","ты не зверь."],["Sonr flokks ertu,","Ты сын стаи,"],["snú þú aptr til þín.","вернись к себе."],["Saga þín bíðr,","Твоя сага ждёт,"],["bræðr þínir bíða.","твои братья ждут."]]},{"orig":"Hornkveðja","title":"Приветствие Рога","when":"В обряде Рог и Сага, когда вернувшемуся подают рог.","lines":[["Drekk með oss,","Выпей с нами,"],["kveð með oss,","спой с нами,"],["þá ertu með oss.","тогда ты с нами."]]},{"orig":"Huldarorð","title":"Слова Сокрытия","when":"","lines":[["Enginn þefr. Ekki spor. Engir vér.","Нет запаха. Нет следа. Нет нас."]]},{"orig":"Saumljóð","title":"Песнь Сшивания","when":"Творец плоти напевает её, пока сшивает рану или сращивает кость. По ритму песни руки держат шаг стежков.","lines":[["Saum ek sár þitt, bróðir,","Сшиваю рану твою, брат,"],["bein við bein,","кость к кости,"],["blóð við blóð,","кровь к крови,"],["hold við hold,","плоть к плоти,"],["sem heilt væri.","будто цело и было."],["Bít á jaxl ok þegi.","Стисни зубы и молчи."]]},{"orig":"Sárataljóð","title":"Счёт Ран","when":"Во время Пересчёта Ран после боя. Жрец считает раны вслух, а последней строкой поддевает воина, если подозревает, что тот что-то прячет.","lines":[["Eitt sár, tvau sár, þrjú sár.","Одна рана, две раны, три раны."],["Hvar leyndir þú it fjórða?","Где ты спрятал четвёртую?"]]},{"orig":"Dauðasvefn","title":"Песнь Мнимой Смерти","when":"Когда жрец погружает раненого в сус-ан. Поётся тихо и медленно, в такт замедляющимся сердцам.","lines":[["Sof þú, úlfr, sof þú djúpt,","Спи, волк, спи глубоко,"],["hjörtu þín hægja á sér.","сердца твои затихают."],["Morkai sér þik, en tekr eigi.","Моркаи видит тебя, но не берёт."],["Ek vek þik, þá er tími kemr.","Я разбужу тебя, когда придёт время."]]},{"orig":"Vakningarljóð","title":"Песнь Пробуждения","when":"При Пробуждении от Мнимой Смерти. Последней строкой жрец требует от проснувшегося слова, а не рыка.","lines":[["Vakna þú, bróðir,","Проснись, брат,"],["heyr nafn þitt.","услышь своё имя."],["Mæl þú orð, sem maðr.","Скажи слово, как человек."]]},{"orig":"Holdsmíð","title":"Песнь Становления","when":"Над аспирантом после каждой ступени Становления, когда в него вживлён новый орган.","lines":[["Nýtt hjarta, ný bein,","Новое сердце, новые кости,"],["nýtt blóð í æðum þínum.","новая кровь в твоих жилах."],["Þú vart sveinn,","Ты был юношей,"],["nú verðr þú úlfr.","теперь становишься волком."]]},{"orig":"Brynjuljóð","title":"Песнь Доспеха","when":"Когда воину после вживления Чёрного панциря впервые подают его доспех.","lines":[["Járn er nú skinn þitt,","Железо теперь твоя кожа,"],["brynja er hold þitt.","доспех теперь твоя плоть."],["Nú ertu úlfr.","Теперь ты Волк."]]}],"sagas":[{"orig":"Úlfhams saga","title":"Сага об Ульфхаме Черноруком","text":["Ульфхам был знахарем племени Русс ещё до того, как Всеотец спустился на Фенрис. Он умел вправлять кости и знал травы, но в бою стоял позади, и над ним смеялись.","Когда Русс дал первым своим воинам испить из Кубка, многие ушли в дикость Асахейма и не вернулись. На третий день ярлы сказали: «Кто не вернулся, тот выбрал волков». Ульфхам ничего не ответил, взял сумку с травами и ушёл в горы.","Первого брата он нашёл мёртвым в снегу. Ульфхам сложил ему костёр, остриг ногти и сжёг их отдельно, а пока горел огонь, стоял к нему спиной. Второго он нашёл на туше лося: тот рвал мясо зубами, и в глазах его не было ничего человеческого. Ульфхам сел напротив и всю ночь пел ему его же имя и его сагу. К утру зверь уснул, но проснулся зверем, и Ульфхам отпустил его в лес. Третьего он нашёл на полпути к Клыку: тот полз, забыв своё имя. Ульфхам взвалил его на плечи и пел всю дорогу, и у ворот Клыка брат назвал себя сам.","Когда Ульфхам вернулся, руки его были черны по локоть от пепла и сажи. Русс спросил, где он был. Ульфхам ответил: «Ходил за теми, кого вы оставили». Тогда Русс сказал при всём Эйнхерьяре: «Кто ходит за мёртвыми, тот и будет говорить за них».","С тех пор у Творцов плоти руки черны по локоть, а у ворот Клыка аспирантов встречает жрец. Песнь, которую Ульфхам пел зверю, поют до сих пор. Говорят, отпущенный им волк каждую зиму приходит к воротам Клыка и ждёт, что его позовут по имени."]},{"orig":"Saga þriggja spurninga","title":"Сага о Трёх Вопросах","text":["Храфнкель Сизобородый был Волчьим жрецом. На мире, имя которого скальды уже забыли, пал хускарл ярла по имени Торгейр, и с ним пропала весть о том, кто открыл врагу ворота. Храфнкель остался с телом на ночь и выпил «Взор Моркаи».","Первым он спросил: «Кто открыл ворота?» Мёртвый назвал имя смертного слуги, и стая потом нашла его. Вторым он спросил: «Что ты не успел сказать?» Мёртвый передал слово для своего побратима, и Храфнкель отнёс его.","Тогда мёртвый спросил сам: «Когда ты дал мне Омовение, можно ли было меня спасти?» И Храфнкель, как велит обычай, ответил правду: «Можно было. Я не дослушал твоё второе сердце».","На рассвете он пришёл к стае, рассказал всё, не утаив ни слова, и сам потребовал Суда Саг над собой. Старший жрец спросил, чего он просит. Храфнкель ответил: «Метки». Но стая не дала её начертить, ведь Торгейр в разговоре его не проклял. Старший жрец решил так: Храфнкель понесёт бирку Торгейра до конца жизни рядом со своей первой биркой, а его вина будет вписана в сагу, чтобы её помнил каждый жрец.","С тех пор жрец, прежде чем дать Омовение, кладёт ладонь на грудь раненого дважды, слева и справа, и слушает оба сердца. А на вопрос мёртвого жрецы отвечают правду до сих пор, хотя знают, чего она может стоить."]},{"orig":"Saga jarls er eigi vék","title":"Сага о Ярле, что не уступил дороги","text":["Был в легионе молодой ярл, скорый и на топор, и на слово. Однажды в залах Клыка навстречу ему шёл старый Волчий жрец Гейррод Тихий. Свита ярла, как велит обычай, отступила к стенам, а сам ярл остался посреди прохода и сказал: «Я ярл, а ты лекарь. Обойдёшь». Жрец посмотрел на него, ничего не сказал и обошёл. Свита ждала беды, но ничего не случилось, и ярл решил, что победил.","Через год, на чужой луне, ярла разрубили почти надвое, и стая сочла его мёртвым. Первым к нему подошёл Гейррод. Ярл узнал его и прохрипел: «Ну вот, теперь уступлю тебе дорогу». Жрец ответил: «Мне не нужна была твоя дорога. Мне нужно было, чтобы ты дожил до дня, когда поймёшь, зачем её уступают». Он не дал ярлу Омовения, а три дня держал его на этом свете Ледяным Замком и своими руками.","Ярл выжил. Говорят, с того дня он первым отходил к стене, завидев любого жреца, даже Избранного, и требовал того же от своих людей. Когда его спрашивали почему, он отвечал: «Однажды я уже стоял у него на дороге. Больше не хочу»."]},{"orig":"Saga Þorvalds er tvisvar kom heim","title":"Сага о Торвальде, что вернулся дважды","text":["Брат Торвальд из Кровавых Когтей пропал на мире смерти, поросшем ядовитым лесом. Стая сочла его павшим и сожгла его бирку. Через год к лагерю стаи вышел Торвальд: худой, израненный, но живой. Братья кинулись к нему, но дорогу загородил молодой Избранный жрецом по имени Эйвар.","Эйвар подал вернувшемуся рог, как учил наставник. Торвальд выпил и не поморщился. Тогда Эйвар попросил спеть строку из саги стаи. Торвальд спел, и спел верно. Стая уже смеялась над осторожным учеником, но тут Торвальд вернул Эйвару пустой рог и сказал: «Спасибо, брат».","Эйвар тут же схватился за нож. За всю жизнь Торвальд ни разу никому не сказал спасибо, и вся стая это знала. Тварь в чужой шкуре поняла, что её раскрыли, и бросилась на ученика. Её зарубили вшестером.","Через три дня к лагерю выполз настоящий Торвальд, без руки и в лихорадке. Он выпил рог, спел свою строку, а когда ему стали перевязывать культю, обругал Творца плоти последними словами. Тогда стая наконец его обняла.","С тех пор обряд Рог и Сага проводят над каждым вернувшимся, будь то простой воин или ярл. А на Фенрисе с тех пор говорят: «Если брат стал вежлив, проверь его дважды»."]},{"orig":"Kolbeins saga","title":"Сага о Кольбейне Беспалом","text":["Кольбейн был Творцом плоти всего одну зиму, когда в грудь его ярлу вошёл болт и не разорвался. Снаряд застрял между двумя сердцами, и детонатор его ещё щёлкал. Кольбейн велел стае отойти, но ярл засмеялся и сказал: «Если мне суждено взорваться, пусть хоть кто-нибудь это увидит».","Кольбейн не стал спорить. Он усыпил ярла, раскрыл ему грудь и взял болт щипцами за корпус. Когда он тянул его наружу, детонатор щёлкнул в последний раз. Кольбейн не стал бросать снаряд на землю, ведь рядом лежал ярл. Он сжал болт в кулаке и отвёл руку так далеко, как мог.","Взрыв унёс ему три пальца и половину ладони. Другой рукой Кольбейн закончил операцию и зашил ярлу грудь, а уже потом позволил перевязать себя.","Железные жрецы сделали ему новую руку. Когда его спрашивали, не жалеет ли он о пальцах, Кольбейн отвечал: «Стальные пальцы не дрожат. Жаль, что я не потерял их раньше». С тех пор, когда жрец вынимает болт, стая отходит, и не спорит даже ярл."]},{"orig":"Saga þess er svaf","title":"Сага о Том, Кто Спал","text":["На брошенном корабле, дрейфовавшем в пустоте сорок зим, стая нашла Волка в мнимой смерти. Доспех его был цел, а сердца били раз в минуту. Никто в стае не знал его имени, а жрец, который когда-то его усыпил, давно ушёл к Моркаи.","Молодой Волчий жрец Асбьёрн понимал: разбуди воина без имени, и проснётся зверь. Тогда он пошёл к старым жрецам и стал перебирать бирки памяти, которые остались после его давно умершего предшественника. На одной бирке было вырезано имя Хьяльти, а рядом руна «спит».","Асбьёрн приковал воина и стал звать его: «Хьяльти!» Тот открыл глаза и зарычал. Тогда Асбьёрн запел Песнь Укрощения и пел её, пока не охрип. Наконец рык смолк, и проснувшийся сказал первое слово. Это было не его имя, а имя жреца, который его усыпил.","Асбьёрн рассказал ему, что того жреца давно нет. Хьяльти долго молчал, потом попросил отвести его на Тризну и сам назвал своего жреца среди павших. С тех пор жрецы, усыпляя брата, вырезают его имя на своей бирке, чтобы тот, кто придёт после, знал, кого будить."]},{"orig":"Hjartadeilu saga","title":"Сага о Споре за Сердце","text":["В бою с ксеносами Свейну Рыжему разорвало одно сердце. На корабле над ним сошлись Творец плоти Торд и Железный жрец Хальвард. Хальвард держал стальное сердце и говорил: «Сталь не устаёт и не болеет. Ставь её». Торд держал руку на груди Свейна и отвечал: «Он и с одним сердцем Волк. Не тебе решать, чем он будет жить».","Спорили они так долго и так громко, что Свейн очнулся от каталептического сна. Он послушал их и сказал: «Сердце ставьте стальное, мне ещё воевать. А петь на Тризне я буду своим горлом, его не трогайте».","Торд и Хальвард переглянулись и рассмеялись, и с тех пор работали вместе. Говорят, на Тризне Свейн всегда стучал кулаком по груди, где звенела сталь, и говорил: «Это за Торда, а это за Хальварда». С тех пор, если жрецы спорят о теле брата, последнее слово остаётся за самим братом, если он может его сказать."]},{"orig":"Saga etinnar minningar","title":"Сага о Съеденной Памяти","text":["На мире, где враг прятался в норах под землёй, Кровавый Коготь Ульв съел плоть убитого вождя ксеносов, хотя Волчий жрец Гест запретил это делать. Омофагия открыла Ульву память врага, но вместе с ней в его голову вошёл чужой голос.","Ночью Ульв проснулся и заговорил на языке, которого никто не знал. Гест приковал его, дал Антитварин и начал Изгнание Порчи. Тогда голос из Ульва сказал на понятном языке: «Отпусти меня, и я покажу, где лежит гнездо. Иначе твоя стая найдёт его, когда будет поздно».","Гест долго молчал. Потом он позвал ярла, и голос показал путь. Стая нашла гнездо и выжгла его до последней твари. Когда она вернулась, Гест взял костяной клинок и закончил Изгнание. Голос кричал, что его обманули, но Гест ответил: «Я обещал выслушать тебя, а не отпустить».","Ульв выжил, но до конца жизни иногда видел во сне чужие норы. Гест сам потребовал над собой Суда Саг за то, что торговался с порчей. Стая вписала в сагу и его вину, и спасённые жизни, а решение оставили самому Руссу. Говорят, Русс выслушал, посмеялся и сказал: «Обмануть порчу — тоже ремесло»."]}],"quotes":[{"text":"Ты умер для своего рода. Теперь ты принадлежишь стае.","source":"Обряд Избрания"},{"text":"Испей крови Русса. Найди дорогу домой или останься с волками.","source":"Кубок Вульфена и Испытание Моркаи"},{"text":"Ты знал плоть. Теперь узнай тех, кто её покинул.» (при посвящении в Волчьи жрецы)","source":"Посвящение в ранги жрецов"},{"text":"Пусть Моркаи смотрит. Мы пришли не умирать. Мы пришли, чтобы умирали они.","source":"Злая Клятва"},{"text":"Шёпотом: «Нет запаха. Нет следа. Нет нас.","source":"Обряд Сокрытия Следов"},{"text":"Пусть враг думает, что ты уже в крови. Пусть потом узнает, что в его.","source":"Кровавая Раскраска"},{"text":"Ты не умрёшь лёжа. Встреть его стоя.","source":"Омовение Одинокого Волка"},{"text":"Твоё тело Моркаи. Твоя кровь стае. Твоё имя мне.","source":"Обряд Моркаи"},{"text":"Иди к нему с поднятой головой. Мы тебя проводили.","source":"Огненные Проводы"},{"text":"Я знаю твоё имя. Скажи то, что не успел.","source":"Разговор с Мёртвыми"},{"text":"Пока мы помним, они в стае.","source":"Тризна Павших"},{"text":"Сага помнит всё. Решим, что ей помнить о тебе.","source":"Суд Саг"},{"text":"Сага тебя забыла. Докажи, что зря.","source":"Метка Позора"},{"text":"Оставь войну в воде. Домой иди чистым.","source":"Очищение Ледяной Водой"},{"text":"Выпей с нами. Спой с нами. Тогда ты с нами.","source":"Рог и Сага"},{"text":"Ты не зверь. Ты сын стаи, и у тебя есть имя. Вернись к нему.","source":"Укрощение Зверя"}]},"iron":{"docs":[{"id":"iron0","title":"Железные Жрецы","short":"Орден","rune":"ᚦ","html":"<h2 id=\"iron0-1\">О чём этот свиток?<\/h2><p>Железные Жрецы — кузнецы, механики и служители Железного Волка в VI легионе. Если Волчий Жрец отвечает за плоть и дух воина, то Железный Жрец отвечает за его сталь: доспех, оружие, боевые машины и бионику. Всё, что Волк держит в руке и носит на теле, прошло через руки Железного Жреца.<\/p><p>У Железных Жрецов три прозвища:<\/p><ul><li><b>Хранители огня и стали<\/b> — потому что кузни легиона в их руках;<\/li><li><b>Слышащие Железо<\/b> — потому что они говорят с машинными духами и слушают металл;<\/li><li><b>Волки Спящего<\/b> — потому что они служат Железному Волку, который спит под Асахеймом.<\/li><\/ul><p>В этом свитке описано, кто такие Железные Жрецы, как они выглядят, чем заняты и как становятся жрецами. Их ремесло, литании и обряды, снаряжение, песни и саги описаны в отдельных свитках.<\/p><h2 id=\"iron0-2\">Вера и место в легионе<\/h2><h3 id=\"iron0-3\">Железный Волк<\/h3><p>Железные Жрецы поклоняются только Железному Волку, колоссальному духу, спящему под Асахеймом. Горные хребты — шкура на его спине, залежи руды — его железные вены. Несмотря на сон, он наблюдает за всеми Жрецами, что работают с духами железа в его обителях. Его учение складывается из трёх заповедей: Сталь — продолжение Плоти, Единство Ярости и Расчёта, Ответственность.<\/p><p>Железные Жрецы верят в машинных духов: каждый механизм для них — малый дух, живущий в жилах Спящего. Омниссию Механикума они считают тем же Железным Волком, увиденным чужими глазами, но не славят её, ведь славы достоин только Спящий.<\/p><h3 id=\"iron0-4\">Кузня под Клыком<\/h3><p>На Марс Железные Жрецы не летают. Они учатся там, где спит их бог, — в Кузне под Клыком, в корнях Асахейма, и слушают железо, а не чужих магосов. Знания Механикума приходят в легион с трофеями и союзниками, но разбираются в них жрецы сами.<\/p><h3 id=\"iron0-5\">Жрецы Фенриса<\/h3><p>Железные Жрецы — один из трёх орденов Жрецов Фенриса вместе с Волчьими и Рунными Жрецами. Там, где у других легионов техмарины и мастера кузни, у Волков есть Железные Жрецы. Мастера Кузни сидят на почётных местах в Эйнхерьяре, военном совете Русса, рядом со Старшими Волчьими жрецами и Рунными жрецами.<\/p><h2 id=\"iron0-6\">Образ и облик<\/h2><h3 id=\"iron0-7\">Образ<\/h3><p>Железный Жрец прожил все три заповеди Спящего руками. Он отвечает за каждый клинок, который дал, поэтому спокоен, придирчив и перепроверяет всё дважды. В стае его считают занудой ровно до первого боя. У горна он холоден и точен, а в бою такой же дикарь, как остальные Волки: в этом и есть единство ярости и расчёта.<\/p><p>Сталь для него — продолжение плоти, а не замена ей. Бионику Железный Жрец ставит только вместо утраченного и сам носит её, только если потерял руку в бою. Тех, кто режет себя ради железа, Волки считают глупцами.<\/p><h3 id=\"iron0-8\">Облик<\/h3><p><b>Доспех.<\/b> Серая броня легиона в следах ковки и окалины, которые никогда не счищают. На ней вырезаны руны Железного Волка, а у Мастеров Кузни и руны Спящего. Поверх брони надет кузнечный фартук из шкуры термального ящера.<\/p><p><b>Механодендриты.<\/b> На ранце закреплены роботизированные руки в виде волчьих голов, которыми жрец управляет через нервы. Их число показывает ранг.<\/p><p><b>Провода и ауспекс.<\/b> С ранца свисает пачка когитаторных проводов, а на левой руке закреплены ауспекс и инфопланшет.<\/p><p><b>Обожжённая ладонь.<\/b> На правой ладони у каждого жреца шрам от Клятвы Горна. При встрече Железные Жрецы не кланяются, а показывают друг другу ладонь.<\/p><p><b>Оружие.<\/b> Громовой молот, который жрец куёт себе сам, и часто топор-молот Смидёкс, древко которого выше Астартес ростом. Для защиты служат волкитное орудие на ранце и хельфрост-пистолет.<\/p><p><b>Спутники.<\/b> Рядом с жрецом ходят кибер-волки, которых он сам собрал, на механодендрите сидит техно-ворон, над плечом парит Летучий Череп, а позади идёт свита техно-треллов из слуг легиона. Рядом с Мастером Кузни в бой выходит Кастелакс.<\/p><h2 id=\"iron0-9\">Ремесло<\/h2><p><b>Кузня.<\/b> Железные Жрецы просят у Спящего руду, выплавляют металл из его жил, куют оружие и доспехи под руку и рост каждого воина, закаляют их во льдах Фенриса и вытравливают на них руны-имена.<\/p><p><b>Силовое и ледяное оружие.<\/b> Они ставят в оружие сердца силового поля и куют громовые молоты. Их гордость — ледяные клинки с кромкой из зубов кракена и хельфрост-оружие, которое вмораживает врага в лёд холоднее пустоты.<\/p><p><b>Машинные духи.<\/b> Жрецы будят духов новых механизмов, усмиряют одичавших, переписывают их команды, чистят металл от порчи и приручают трофеи.<\/p><p><b>Поле боя.<\/b> Под огнём они расклинивают оружие, латают и запечатывают пробитые доспехи, поднимают обездвиженные машины, а если машину не спасти, забирают её сердце и взрывают корпус.<\/p><p><b>Машины и дредноуты.<\/b> Жрецы ухаживают за машинами роты и благословляют их перед боем. Они погребают великих воинов в железе, укладывают дредноуты в Долгий Сон и будят их, когда легиону нужны древние герои.<\/p><p><b>Бионика, кибер-волки и техно-вороны.<\/b> Вместе с Творцами плоти они ставят бионику на место утраченных конечностей, собирают кибер-волков из тяжело раненых зверей, а из воронов, живущих при кузне, делают техно-воронов — разведчиков и вестников.<\/p><p><b>Техно-треллы.<\/b> Из слуг легиона, которые состарились, искалечены или умирают, жрецы делают техно-треллов. Треллы — основа их работы: у каждого Железного Жреца их десятки.<\/p><p><b>Автоматоны.<\/b> Из стали и малых духов Спящего жрецы собирают автоматонов: Летучий Череп из черепа фенрисийского волка, Железного Кабана, который таранит строй и тащит грузы, и боевого Кастелакса, чей образец пришёл от Механикума. Для всех автоматонов действует Запрет Мыслящей Стали: дух автоматона слушает, но не думает, а начавшего решать сам считают порченым.<\/p><p><b>Производство.<\/b> Каждая кузня работает по одной цепочке: сырьё Фенриса и легиона перерабатывают в материалы, из материалов делают заготовки, а из заготовок собирают оружие, доспехи, бионику и автоматонов. Заготовки хранят в Кузне заранее, чтобы в нужный час собрать изделие за дни, а не за месяцы.<\/p><p><b>Техническое оборудование.<\/b> На Железных Жрецах держится всё, чем живут Клык и корабли: Сердце Клыка, генераторы, воздух, обогрев, связь, пустотные щиты и стазис-хранилища генного семени. Кователи каждую смену делают Обход, а за хранилища семени Железные Жрецы отвечают вместе с Волчьими.<\/p><p><b>Связь.<\/b> Железные Жрецы держат вокс-связь роты и шифруют её рунами на фенрисийском.<\/p><h2 id=\"iron0-10\">Ранги и путь<\/h2><p>Железным Жрецом становится Волк, который сам попросился к горну, и чаще всего это выходец из Железных Мастеров. Каждый ранг даётся за работу, которая выдержала проверку боем, а не за годы у наковальни.<\/p><p>Путь начинается с <b>Испытания Железной Рукавицы<\/b>. За одну ночь кандидат в одиночку выплавляет металл и куёт себе боевую рукавицу, а на рассвете Мастер Кузни бьёт по ней молотом прямо на наковальне. Сразу после испытания новый Ученик даёт <b>Клятву Горна<\/b>, держа ладонь над огнём, и шрам от неё остаётся на всю жизнь.<\/p><h3 id=\"iron0-11\">Ученик Горна<\/h3><p>Учится у горна и в Кузне под Клыком, следит за системой подачи мьода у наставника, кормит и чинит треллов.<\/p><p><b>Требование:<\/b> пройти Испытание Железной Рукавицы и дать Клятву Горна.<\/p><h3 id=\"iron0-12\">Кователь<\/h3><p>Чинит и куёт для стаи, читает металл, ухаживает за машинами, работает в поле.<\/p><p><b>Требование:<\/b> в одиночку выковать оружие для воина, которое вернётся с ним из боя.<\/p><h3 id=\"iron0-13\">Железный Жрец<\/h3><p>Служит роте: будит машинных духов, ведёт литании, собирает доспехи, бионику и кибер-волков, делает техно-треллов.<\/p><p><b>Требование:<\/b> разбудить машину, которую не смогли разбудить другие, и пройти Слушание Спящего.<\/p><h3 id=\"iron0-14\">Мастер Кузни<\/h3><p>Хранит Кузню под Клыком, куёт ледяные клинки и сердца хельфроста, погребает героев в железе и будит древних. Советует ярлу и сидит в Эйнхерьяре.<\/p><p><b>Требование:<\/b> великие дела, слово Мастеров Кузни и согласие ярла.<\/p><h3 id=\"iron0-15\">Знаки ранга<\/h3><div class=\"tbl\"><table><thead><tr><th>Ранг<\/th><th>Механодендриты<\/th><th>Оружие<\/th><th>Прочие знаки<\/th><\/tr><\/thead><tbody><tr><td>Ученик Горна<\/td><td>Нет<\/td><td>Оружие воина стаи<\/td><td>Кузнечный фартук, провода, ауспекс, обожжённая ладонь<\/td><\/tr><tr><td>Кователь<\/td><td>Один<\/td><td>Оружие воина стаи<\/td><td>Резец и яд, сумка мастера<\/td><\/tr><tr><td>Железный Жрец<\/td><td>Два<\/td><td>Громовой молот, волкитное орудие, часто хельфрост-пистолет и Смидёкс<\/td><td>Свита треллов, часто кибер-волк<\/td><\/tr><tr><td>Мастер Кузни<\/td><td>Три<\/td><td>Громовой молот, Смидёкс, волкитное орудие<\/td><td>Руны Спящего на доспехе, место в Эйнхерьяре<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"iron0-16\">Обычаи и власть<\/h2><p>Власть Железного Жреца держится на Ответственности. Если оружие подвело в бою, спрашивают с того, кто его вручил. На Суде Наковальни Мастер Кузни читает металл и решает, на ком вина. Виновный жрец перековывает оружие своими руками и снова держит ладонь над горном, а если из-за его ошибки пал брат, идёт на Суд Саг и год не подходит к наковальне. Поэтому Волки доверяют Железным Жрецам свою жизнь не меньше, чем Волчьим.<\/p><p>Раз в год, в первую ночь Поры Огня, Кузня под Клыком отмечает Ночь Молотов. Все горны гасят на сутки и снова зажигают от угля из жерла вулкана. Каждый жрец бьёт по наковальне за каждое оружие, вернувшееся с воином, и беззвучно кладёт молот за каждое, которое подвело.<\/p><p>Стая уважает Железных Жрецов, но любит над ними подшучивать: за занудство, за систему подачи мьода и за механодендриты, которые первые месяцы хватают не то, что нужно. Когда же в бою рвётся связь, стая ищет глазами не ярла, а Железного Жреца.<\/p><p>С Волчьими Жрецами у Железных особые отношения. Над телом воина они работают вместе и вечно спорят, чем ему жить, плотью или сталью. Последнее слово в этом споре остаётся за самим воином, если он может его сказать.<\/p>","toc":[{"id":"iron0-1","title":"О чём этот свиток?","level":2},{"id":"iron0-2","title":"Вера и место в легионе","level":2},{"id":"iron0-3","title":"Железный Волк","level":3},{"id":"iron0-4","title":"Кузня под Клыком","level":3},{"id":"iron0-5","title":"Жрецы Фенриса","level":3},{"id":"iron0-6","title":"Образ и облик","level":2},{"id":"iron0-7","title":"Образ","level":3},{"id":"iron0-8","title":"Облик","level":3},{"id":"iron0-9","title":"Ремесло","level":2},{"id":"iron0-10","title":"Ранги и путь","level":2},{"id":"iron0-11","title":"Ученик Горна","level":3},{"id":"iron0-12","title":"Кователь","level":3},{"id":"iron0-13","title":"Железный Жрец","level":3},{"id":"iron0-14","title":"Мастер Кузни","level":3},{"id":"iron0-15","title":"Знаки ранга","level":3},{"id":"iron0-16","title":"Обычаи и власть","level":2}]},{"id":"iron1","title":"Ремесло Железных Жрецов","short":"Ремесло","rune":"ᚲ","html":"<h2 id=\"iron1-1\">О чём этот свиток?<\/h2><p>Всё, что Волк держит в руке и носит на теле, прошло через руки Железного Жреца. Жрец выплавляет металл из жил Спящего, куёт его, будит в нём духа и отвечает за него, пока оружие служит воину. Здесь собраны работы, которые проводят Железные Жрецы. Список пополняется.<\/p><p><b>Как читать работу:<\/b><\/p><ul><li><b>Проводит<\/b> — какой ранг вправе её выполнять<\/li><li><b>Когда<\/b> — повод для работы<\/li><li><b>Что нужно<\/b> — инструменты и материалы<\/li><li><b>Ход работы<\/b> — как она проходит<\/li><li><b>Литания<\/b> — что читает жрец, по канону литаний Железного Волка<\/li><li><b>Последствия<\/b> — что получится и чем это грозит<\/li><\/ul><p><b>Ранги:<\/b> Ученик Горна → Кователь → Железный Жрец → Мастер Кузни.<\/p><p><b>Редкость:<\/b> · Утиль → ᛫ Обычный → ◦ Продвинутый → ○ Редкий → ⭘ Престижный → ◎ Раритетный → ⓪ Абсолютный, по шкале карточек сервера.<\/p><h3 id=\"iron1-2\">Инструменты жреца<\/h3><div class=\"tbl\"><table><thead><tr><th>Инструмент<\/th><th>Что это<\/th><\/tr><\/thead><tbody><tr><td>Молот<\/td><td>Главное орудие и знак жреца. Им куют в Кузне и бьют в бою.<\/td><\/tr><tr><td>Механодендриты<\/td><td>Роботизированные руки в виде волчьих голов на ранце, управляемые через нервы<\/td><\/tr><tr><td>Когитаторные провода<\/td><td>Подключаются к любому механизму, чтобы прочесть и переписать его код<\/td><\/tr><tr><td>Ауспекс и инфопланшет<\/td><td>На левой руке: диагностика и программирование<\/td><\/tr><tr><td>Резак<\/td><td>Плазменный резак для сварки и резки брони<\/td><\/tr><tr><td>Волкитное орудие<\/td><td>Для защиты себя и брата, пока руки заняты работой<\/td><\/tr><tr><td>Кузня под Клыком<\/td><td>Главная кузня легиона в корнях Асахейма, где спит Железный Волк<\/td><\/tr><tr><td>Походная кузня<\/td><td>Горн и наковальня на корабле роты<\/td><\/tr><tr><td>Нейроглушитель<\/td><td>Отключает сознание через нервный порт. Нужен, чтобы делать техно-треллов без Творцов плоти.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-3\">Сырьё<\/h3><div class=\"tbl\"><table><thead><tr><th>Материал<\/th><th>Редкость<\/th><th>Для чего<\/th><\/tr><\/thead><tbody><tr><td>Руда<\/td><td>᛫ Обычный<\/td><td>Металл для всего. Жилы ищут по пятнам железной травы.<\/td><\/tr><tr><td>Наросты круглорога<\/td><td>◦ Продвинутый<\/td><td>Каменные наросты павших круглорогов, в которых есть руда<\/td><\/tr><tr><td>Шкура термального ящера<\/td><td>◦ Продвинутый<\/td><td>Не горит и не пропускает жар. Из неё шьют кузнечные фартуки и рукавицы.<\/td><\/tr><tr><td>Огненный мох<\/td><td>᛫ Обычный<\/td><td>Трут, который вспыхивает от искры даже в бурю. Собирают только в рукавицах.<\/td><\/tr><tr><td>Смола смоляной ели<\/td><td>᛫ Обычный<\/td><td>Смазка для сочленений и герметик для швов<\/td><\/tr><tr><td>Помёт летучих мышей<\/td><td>᛫ Обычный<\/td><td>Для закалочных солей. Железные Мастера собирают его в пещерах вёдрами.<\/td><\/tr><tr><td>Яд виверны<\/td><td>◦ Продвинутый<\/td><td>Вытравливает руны в металле<\/td><\/tr><tr><td>Ледниковая вода<\/td><td>᛫ Обычный<\/td><td>Закалка клинков и брони<\/td><\/tr><tr><td>Моржовый клык<\/td><td>᛫ Обычный<\/td><td>Рукояти и накладки<\/td><\/tr><tr><td>Прометий<\/td><td>◦ Продвинутый<\/td><td>Огонь для горна, который не гаснет<\/td><\/tr><tr><td>Зубы кракена<\/td><td>○ Редкий<\/td><td>Алмазно-твёрдые зубы для кромки ледяных клинков. Берут только у кракена, убитого будущим владельцем или его стаей.<\/td><\/tr><tr><td>Кости ледяного кракена<\/td><td>◎ Раритетный<\/td><td>Осколки костей с Кракеновой Шпоры. Идут на кромку величайших ледяных клинков.<\/td><\/tr><tr><td>Энергизированный алмаз<\/td><td>⭘ Престижный<\/td><td>Кромка ледяного клинка, когда зубов кракена нет. Выглядит как чистый лёд.<\/td><\/tr><tr><td>Слизь полярного болотожора<\/td><td>○ Редкий<\/td><td>Охладитель для камер хельфроста. Не схватывается на любом морозе.<\/td><\/tr><tr><td>Ледоцвет<\/td><td>⭘ Престижный<\/td><td>Его холод вдыхают в Сердце Хельфроста. Сорвать нельзя, поэтому жрец растапливает его во рту прямо на леднике.<\/td><\/tr><tr><td>Ледниковый лёд<\/td><td>᛫ Обычный<\/td><td>Для криогенных камер и для того, чтобы будить ледяное оружие перед боем<\/td><\/tr><tr><td>Уголь и торф<\/td><td>᛫ Обычный<\/td><td>Топливо для малых горнов, где нет прометия. Торф режут кирпичами на болотах.<\/td><\/tr><tr><td>Небесное железо<\/td><td>⭘ Престижный<\/td><td>Железо, упавшее на Фенрис со звёзд. Самое прочное и самое редкое, идёт на сердца и лучшее оружие.<\/td><\/tr><tr><td>Медь<\/td><td>᛫ Обычный<\/td><td>Проводники, кабели, обмотки и громоотводы. Её добывают у вулканов.<\/td><\/tr><tr><td>Горный хрусталь<\/td><td>◦ Продвинутый<\/td><td>Линзы для ауспексов и глаз автоматонов<\/td><\/tr><tr><td>Кость мамонта и бивни<\/td><td>᛫ Обычный<\/td><td>Рукояти, накладки, лёгкие детали. Бивни идут на рычаги.<\/td><\/tr><tr><td>Кость кита<\/td><td>◦ Продвинутый<\/td><td>Длинные упругие детали: древки, пружины, рёбра крыльев<\/td><\/tr><tr><td>Жилы лося<\/td><td>᛫ Обычный<\/td><td>Нити для сшивания кожи и обмотки рукоятей<\/td><\/tr><tr><td>Шкура морского змея<\/td><td>○ Редкий<\/td><td>Лучшая кожа, какую можно добыть без железа. Идёт на уплотнения и ремни доспехов.<\/td><\/tr><tr><td>Панцирь телифона и хитин аракаса<\/td><td>◦ Продвинутый<\/td><td>Лёгкие пластины и изоляция<\/td><\/tr><tr><td>Китовый и тюлений жир<\/td><td>᛫ Обычный<\/td><td>Смазка, которая не густеет на морозе<\/td><\/tr><tr><td>Волокна пепельника<\/td><td>᛫ Обычный<\/td><td>Грубые верёвки и обмотка<\/td><\/tr><tr><td>Светляк<\/td><td>᛫ Обычный<\/td><td>Грибной свет для штолен и для глаз Летучих Черепов<\/td><\/tr><tr><td>Череп фенрисийского волка<\/td><td>◦ Продвинутый<\/td><td>Основа Летучего Черепа. Берут только у волков, павших своей смертью.<\/td><\/tr><tr><td>Керамит<\/td><td>◦ Продвинутый<\/td><td>Броня доспехов и автоматонов. Приходит со складов легиона и с трофеями.<\/td><\/tr><tr><td>Пласталь<\/td><td>◦ Продвинутый<\/td><td>Корпуса, каркасы и механизмы. Со складов легиона и с трофеев.<\/td><\/tr><tr><td>Адамантий<\/td><td>◎ Раритетный<\/td><td>Редкий металл для сердец поля и лучших клинков. Почти только трофейный.<\/td><\/tr><tr><td>Силовые ячейки<\/td><td>○ Редкий<\/td><td>Сила для силовых узлов. Со складов легиона и с трофеев.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"iron1-4\">Переработка<\/h2><p>Сырьё редко идёт в дело как есть. Сначала его перерабатывают в материалы, из материалов делают заготовки, а уже из заготовок собирают оружие, доспехи и автоматонов. Так работает каждая кузня легиона: от горы к горну, от горна к наковальне, от наковальни к воину.<\/p><div class=\"tbl\"><table><thead><tr><th>Материал<\/th><th>Редкость<\/th><th>Из чего<\/th><th>Кто делает<\/th><th>Для чего<\/th><\/tr><\/thead><tbody><tr><td>Сталь Фенриса<\/td><td>᛫ Обычный<\/td><td>Руда и толчёные наросты круглорога, плавка на прометии<\/td><td>Кователь<\/td><td>Клинки, каркасы, почти всё<\/td><\/tr><tr><td>Небесная сталь<\/td><td>⭘ Престижный<\/td><td>Небесное железо и сталь Фенриса, ковка в Кузне под Клыком<\/td><td>Мастер Кузни<\/td><td>Сердца поля, антигравы, лучшее оружие<\/td><\/tr><tr><td>Медная проволока<\/td><td>᛫ Обычный<\/td><td>Медь, протяжка через фильеру<\/td><td>Ученик Горна<\/td><td>Кабели, обмотки, проводники<\/td><\/tr><tr><td>Керамитовые пластины<\/td><td>◦ Продвинутый<\/td><td>Керамит, литьё и обжиг<\/td><td>Железный Жрец<\/td><td>Броня доспехов и автоматонов<\/td><\/tr><tr><td>Пласталевые листы<\/td><td>◦ Продвинутый<\/td><td>Пласталь, прокат<\/td><td>Кователь<\/td><td>Корпуса и каркасы<\/td><\/tr><tr><td>Смоляной лак<\/td><td>᛫ Обычный<\/td><td>Смола смоляной ели и тюлений жир<\/td><td>Ученик Горна<\/td><td>Герметик и защита от ржавчины<\/td><\/tr><tr><td>Морозная смазка<\/td><td>᛫ Обычный<\/td><td>Китовый жир и смола<\/td><td>Ученик Горна<\/td><td>Смазка сочленений, не густеет на морозе<\/td><\/tr><tr><td>Выделанная шкура ящера<\/td><td>◦ Продвинутый<\/td><td>Шкура термального ящера<\/td><td>Кователь<\/td><td>Фартуки и жаростойкие прокладки<\/td><\/tr><tr><td>Змеиная кожа<\/td><td>○ Редкий<\/td><td>Шкура морского змея<\/td><td>Кователь<\/td><td>Уплотнения и ремни<\/td><\/tr><tr><td>Костяные пластины<\/td><td>᛫ Обычный<\/td><td>Кость мамонта или кита, распил и полировка<\/td><td>Ученик Горна<\/td><td>Рукояти, накладки, лёгкие детали<\/td><\/tr><tr><td>Закалочные соли<\/td><td>᛫ Обычный<\/td><td>Помёт летучих мышей и соль<\/td><td>Ученик Горна<\/td><td>Закалка во льду<\/td><\/tr><tr><td>Шлифованные линзы<\/td><td>◦ Продвинутый<\/td><td>Горный хрусталь<\/td><td>Железный Жрец<\/td><td>Ауспексы и глаза автоматонов<\/td><\/tr><tr><td>Очищенный прометий<\/td><td>◦ Продвинутый<\/td><td>Прометий, перегонка<\/td><td>Железный Жрец<\/td><td>Горны и резаки<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"iron1-5\">Заготовки<\/h2><p>Заготовки — детали, из которых собирают всё остальное. Их делают заранее и хранят в Кузне, чтобы в нужный час собрать оружие или автоматона за дни, а не за месяцы.<\/p><h3 id=\"iron1-6\">Каркасы и броня<\/h3><div class=\"tbl\"><table><thead><tr><th>Заготовка<\/th><th>Редкость<\/th><th>Из чего<\/th><th>Кто делает<\/th><\/tr><\/thead><tbody><tr><td>Малый каркас<\/td><td>◦ Продвинутый<\/td><td>Пласталевые листы, костяные пластины<\/td><td>Кователь<\/td><\/tr><tr><td>Большой каркас<\/td><td>○ Редкий<\/td><td>Сталь Фенриса, пласталевые листы<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Броневая пластина<\/td><td>◦ Продвинутый<\/td><td>Керамитовые пластины или сталь Фенриса, закалка во льду<\/td><td>Кователь<\/td><\/tr><tr><td>Сочленение<\/td><td>᛫ Обычный<\/td><td>Сталь Фенриса, морозная смазка, уплотнение из змеиной кожи<\/td><td>Кователь<\/td><\/tr><tr><td>Серво-мышца<\/td><td>○ Редкий<\/td><td>Медная проволока, пласталевые листы, силовой кабель<\/td><td>Железный Жрец<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-7\">Сила<\/h3><div class=\"tbl\"><table><thead><tr><th>Заготовка<\/th><th>Редкость<\/th><th>Из чего<\/th><th>Кто делает<\/th><\/tr><\/thead><tbody><tr><td>Силовой кабель<\/td><td>᛫ Обычный<\/td><td>Медная проволока в оплётке из змеиной кожи<\/td><td>Ученик Горна<\/td><\/tr><tr><td>Малый силовой узел<\/td><td>◦ Продвинутый<\/td><td>Силовая ячейка, медная проволока, пласталевый корпус<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Большой силовой узел<\/td><td>○ Редкий<\/td><td>Несколько силовых ячеек, медная проволока, корпус из стали Фенриса<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Сердце поля<\/td><td>⭘ Престижный<\/td><td>Адамантий или небесная сталь, медная проволока, малый силовой узел<\/td><td>Мастер Кузни, перенос из старого оружия — Железный Жрец<\/td><\/tr><tr><td>Сердце Хельфроста<\/td><td>◎ Раритетный<\/td><td>Криогенная камера, слизь полярного болотожора, холод ледоцвета<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Антиграв<\/td><td>⭘ Престижный<\/td><td>Небесная сталь, малый силовой узел<\/td><td>Железный Жрец<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-8\">Разум и чувства<\/h3><div class=\"tbl\"><table><thead><tr><th>Заготовка<\/th><th>Редкость<\/th><th>Из чего<\/th><th>Кто делает<\/th><\/tr><\/thead><tbody><tr><td>Малое ядро когитатора<\/td><td>○ Редкий<\/td><td>Пласталевый корпус, медная проволока, шлифованные линзы<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Большое ядро когитатора<\/td><td>⭘ Престижный<\/td><td>Корпус из стали Фенриса, медная проволока, шлифованные линзы, малый силовой узел<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Око<\/td><td>◦ Продвинутый<\/td><td>Шлифованные линзы, медная проволока<\/td><td>Кователь<\/td><\/tr><tr><td>Вокс-узел<\/td><td>◦ Продвинутый<\/td><td>Медная проволока, малый силовой узел<\/td><td>Кователь<\/td><\/tr><tr><td>Ауспекс-блок<\/td><td>○ Редкий<\/td><td>Шлифованные линзы, малое ядро когитатора<\/td><td>Железный Жрец<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-9\">Руки и инструменты<\/h3><div class=\"tbl\"><table><thead><tr><th>Заготовка<\/th><th>Редкость<\/th><th>Из чего<\/th><th>Кто делает<\/th><\/tr><\/thead><tbody><tr><td>Манипулятор<\/td><td>◦ Продвинутый<\/td><td>Сталь Фенриса, сочленения, серво-мышца<\/td><td>Кователь<\/td><\/tr><tr><td>Грузовой захват<\/td><td>◦ Продвинутый<\/td><td>Сталь Фенриса, серво-мышцы<\/td><td>Кователь<\/td><\/tr><tr><td>Буровой коготь<\/td><td>○ Редкий<\/td><td>Сталь Фенриса, закалённая с толчёными наростами круглорога<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Плазменный резак<\/td><td>○ Редкий<\/td><td>Медная проволока, очищенный прометий, малый силовой узел<\/td><td>Железный Жрец<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-10\">Оружейные части<\/h3><div class=\"tbl\"><table><thead><tr><th>Заготовка<\/th><th>Редкость<\/th><th>Из чего<\/th><th>Кто делает<\/th><\/tr><\/thead><tbody><tr><td>Клинок<\/td><td>᛫ Обычный<\/td><td>Сталь Фенриса, закалка во льду<\/td><td>Кователь<\/td><\/tr><tr><td>Ледяная кромка<\/td><td>⭘ Престижный, из костей ледяного кракена ◎ Раритетный<\/td><td>Зубы кракена, кости ледяного кракена или энергизированный алмаз<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Боёк молота<\/td><td>◦ Продвинутый, из небесной стали ⭘ Престижный<\/td><td>Сталь Фенриса или небесная сталь<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Древко<\/td><td>᛫ Обычный<\/td><td>Полая сталь Фенриса или кость кита<\/td><td>Кователь<\/td><\/tr><tr><td>Рукоять<\/td><td>᛫ Обычный<\/td><td>Моржовый клык или костяные пластины, обмотка из жил лося<\/td><td>Ученик Горна<\/td><\/tr><tr><td>Ствол и затвор<\/td><td>◦ Продвинутый<\/td><td>Пласталевые листы, сталь Фенриса<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Волкитная камера<\/td><td>◎ Раритетный<\/td><td>Медная проволока, шлифованные линзы, большой силовой узел<\/td><td>Мастер Кузни<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"iron1-11\">Схемы сборки<\/h2><p>Из каких заготовок собирают готовые изделия. Как именно идёт сборка, сказано в работах ниже: в Ковке, Силовом оружии, Ледяном оружии, Бионике и Автоматонах.<\/p><h3 id=\"iron1-12\">Автоматоны<\/h3><div class=\"tbl\"><table><thead><tr><th>Изделие<\/th><th>Редкость<\/th><th>Заготовки<\/th><th>Кто собирает<\/th><\/tr><\/thead><tbody><tr><td>Летучий Череп<\/td><td>○ Редкий<\/td><td>Череп фенрисийского волка, малый каркас, антиграв, малый силовой узел, око, манипулятор, малое ядро когитатора<\/td><td>Кователь<\/td><\/tr><tr><td>Железный Кабан<\/td><td>⭘ Престижный<\/td><td>Большой каркас, броневые пластины, две пары клыков-таранов из стали Фенриса, сочленения, серво-мышцы, око, большой силовой узел, малое ядро когитатора<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Кастелакс<\/td><td>◎ Раритетный<\/td><td>Большой каркас, керамитовые броневые пластины, ствол и затвор болт-пушки, два силовых кулака с сердцами поля, серво-мышцы, ауспекс-блок, большой силовой узел, большое ядро когитатора<\/td><td>Мастер Кузни<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-13\">Оружие<\/h3><div class=\"tbl\"><table><thead><tr><th>Изделие<\/th><th>Редкость<\/th><th>Заготовки<\/th><th>Кто собирает<\/th><\/tr><\/thead><tbody><tr><td>Силовой топор или меч<\/td><td>○ Редкий<\/td><td>Клинок, рукоять, сердце поля, силовой кабель<\/td><td>Кователь куёт, Железный Жрец ставит сердце<\/td><\/tr><tr><td>Громовой молот<\/td><td>⭘ Престижный<\/td><td>Боёк молота, древко, сердце поля особой силы, силовой кабель<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Смидёкс<\/td><td>⭘ Престижный<\/td><td>Полое древко, клинок, боёк молота, сердце поля, силовой кабель<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Ледяной клинок<\/td><td>◎ Раритетный, из костей ледяного кракена ⓪ Абсолютный<\/td><td>Клинок, ледяная кромка, сердце поля, рукоять<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Хельфрост-пистолет<\/td><td>◎ Раритетный<\/td><td>Ствол и затвор, Сердце Хельфроста, рукоять<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Волкитное орудие<\/td><td>◎ Раритетный<\/td><td>Волкитная камера, ствол и затвор, силовой кабель, крепление к механодендриту<\/td><td>Мастер Кузни<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-14\">Доспехи, бионика и прочее<\/h3><div class=\"tbl\"><table><thead><tr><th>Изделие<\/th><th>Редкость<\/th><th>Заготовки<\/th><th>Кто собирает<\/th><\/tr><\/thead><tbody><tr><td>Силовой доспех<\/td><td>⭘ Престижный<\/td><td>Броневые пластины, сочленения, серво-мышцы, большой силовой узел для ранца, вокс-узел, око для шлема, уплотнения из змеиной кожи, смоляной лак<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Бионическая рука или нога<\/td><td>○ Редкий<\/td><td>Малый каркас, сочленения, серво-мышцы, броневая пластина, силовой кабель<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Бионическая кисть<\/td><td>◦ Продвинутый<\/td><td>Сочленения, серво-мышца, броневая пластина, силовой кабель<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Аугметический сустав<\/td><td>◦ Продвинутый<\/td><td>Сочленение, сталь Фенриса, морозная смазка<\/td><td>Кователь<\/td><\/tr><tr><td>Аугметический глаз<\/td><td>◦ Продвинутый<\/td><td>Око, медная проволока, силовой кабель<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Аугметическое ухо<\/td><td>○ Редкий<\/td><td>Вокс-узел, медная проволока, малое ядро когитатора<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Аугметическая челюсть<\/td><td>○ Редкий<\/td><td>Сталь Фенриса, сочленения, серво-мышца, силовой кабель, при утрате языка ещё вокс-узел<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Вокс-горло<\/td><td>◦ Продвинутый<\/td><td>Вокс-узел, медная проволока, пласталевые листы<\/td><td>Кователь<\/td><\/tr><tr><td>Нюхач<\/td><td>⭘ Престижный<\/td><td>Ауспекс-блок, медная проволока, малое ядро когитатора<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Черепная пластина<\/td><td>◦ Продвинутый<\/td><td>Броневая пластина, заклёпки из стали Фенриса<\/td><td>Кователь<\/td><\/tr><tr><td>Стальные рёбра<\/td><td>○ Редкий, из адамантия ◎ Раритетный<\/td><td>Сталь Фенриса или адамантий, броневые пластины<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Стальные позвонки<\/td><td>⭘ Престижный<\/td><td>Сталь Фенриса или небесная сталь, сочленения, силовой кабель, малое ядро когитатора<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Аугметическое чрево<\/td><td>○ Редкий<\/td><td>Пласталевые листы, медная проволока, малый силовой узел, смоляной лак<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Аугметическое лёгкое<\/td><td>○ Редкий<\/td><td>Пласталевые листы, серво-мышца, медная проволока, змеиная кожа<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Аугметическое сердце<\/td><td>⭘ Престижный<\/td><td>Пласталевые листы, серво-мышцы, малый силовой узел, малое ядро когитатора<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Механодендрит<\/td><td>⭘ Престижный<\/td><td>Малый каркас, сочленения, серво-мышцы, манипулятор, голова волка из стали Фенриса, силовой кабель<\/td><td>Мастер Кузни<\/td><\/tr><tr><td>Детали кибер-волка<\/td><td>○ Редкий<\/td><td>Сочленения, броневые пластины, серво-мышцы, око<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Детали техно-ворона<\/td><td>○ Редкий<\/td><td>Стальные когти и клюв из стали Фенриса, сочленения, око, вокс-узел<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Аугметика техно-трелла<\/td><td>◦ Продвинутый<\/td><td>Сочленения, манипулятор или грузовой захват, малое ядро когитатора<\/td><td>Железный Жрец<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"iron1-15\">Кузня<\/h2><p>Работы у горна, от руды до готового оружия в руке воина.<\/p><h3 id=\"iron1-16\">Выплавка из Жил<\/h3><ul><li><b>Проводит:<\/b> Кователь, Ученик Горна помогает<\/li><li><b>Когда:<\/b> Кузне нужен металл<\/li><li><b>Что нужно:<\/b> Руда, наросты круглорога, прометий, огненный мох<\/li><li><b>Ход работы:<\/b> Руду берут там, где гуще всего растёт железная трава, а перед добычей жрец просит у Спящего позволения. Горн разжигают огненным мхом и держат на прометии. В расплав добавляют толчёные наросты круглорога, чтобы металл стал вязким и не колол.<\/li><li><b>Литания:<\/b> Литания Огня<\/li><li><b>Последствия:<\/b> Металл из жил Спящего считается живым. Его не продают и не отдают чужакам, даже союзникам.<\/li><\/ul><h3 id=\"iron1-17\">Ковка Клинка<\/h3><ul><li><b>Проводит:<\/b> Кователь<\/li><li><b>Когда:<\/b> Воину нужен новый топор, клинок или молот<\/li><li><b>Что нужно:<\/b> Металл из жил, молот, наковальня, моржовый клык для рукояти<\/li><li><b>Ход работы:<\/b> Воин стоит рядом всё время ковки. Жрец смотрит, как он держит руку и как дышит в бою, и подгоняет вес и баланс оружия под него одного. Каждый удар молота жрец считает клятвой.<\/li><li><b>Литания:<\/b> Литания Ковки<\/li><li><b>Последствия:<\/b> Оружие, выкованное под воина, в чужой руке бьёт хуже. Так говорят Волки, а жрецы не спорят.<\/li><\/ul><h3 id=\"iron1-18\">Ковка Доспеха<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец, Кователи куют отдельные пластины<\/li><li><b>Когда:<\/b> Новому воину после Чёрного панциря нужен доспех, или старый разбит так, что чинить нечего<\/li><li><b>Что нужно:<\/b> Металл и керамит, молот, резак, смола смоляной ели, когитаторные провода<\/li><li><b>Ход работы:<\/b><ol><li>Жрец снимает мерки с воина и проверяет порты Чёрного панциря.<\/li><li>Кователи куют пластины, Железный Жрец собирает силовые узлы и сочленения.<\/li><li>Швы проливают смолой, чтобы доспех держал вакуум и лёд.<\/li><li>Жрец подключается к доспеху проводами и знакомит его духа с новым хозяином.<\/li><\/ol><\/li><li><b>Литания:<\/b> Литания Ковки, затем Литания Сбора<\/li><li><b>Последствия:<\/b> Доспех служит воину всю жизнь, а часто и после смерти переходит к другому. Каждая вмятина на нём — строка саги, и без нужды её не выправляют.<\/li><\/ul><h3 id=\"iron1-19\">Закалка Льдом<\/h3><ul><li><b>Проводит:<\/b> Кователь<\/li><li><b>Когда:<\/b> После ковки клинка или пластины<\/li><li><b>Что нужно:<\/b> Ледниковая вода, закалочные соли, снег<\/li><li><b>Ход работы:<\/b> Раскалённый металл опускают в ледниковую воду, набранную на Асахейме в самую лютую ночь. Лучшие клинки закаляют под открытым небом прямо во льду ледника, пока над ним воет ветер.<\/li><li><b>Литания:<\/b> Литания Закалки Металла<\/li><li><b>Последствия:<\/b> Металл, закалённый во льдах Фенриса, не трескается от мороза на других мирах.<\/li><\/ul><h3 id=\"iron1-20\">Нанесение Рун<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Оружие или доспех готовы, и воин выбрал для них имя<\/li><li><b>Что нужно:<\/b> Яд виверны, костяной резец, кровь владельца<\/li><li><b>Ход работы:<\/b> Руны выбирает владелец, а жрец только проверяет, что они не спорят друг с другом. Жрец режет руны резцом и вытравливает их ядом виверны. Последнюю руну он заполняет каплей крови владельца.<\/li><li><b>Литания:<\/b> Литания Рун<\/li><li><b>Последствия:<\/b> Руны становятся прозвищем оружия. Оружие с именем считается живым: его сжигают вместе с хозяином или передают по его слову.<\/li><\/ul><h3 id=\"iron1-21\">Вручение<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Оружие или доспех передают воину<\/li><li><b>Что нужно:<\/b> Готовое оружие или доспех<\/li><li><b>Ход работы:<\/b> Жрец держит оружие на ладонях, воин кладёт на него руку. Жрец читает литанию, и воин отвечает на последнюю строку. С этого момента жрец в ответе за оружие, а воин за то, как он им распорядится.<\/li><li><b>Литания:<\/b> Литания Благословения Орудий или Литания Благословения Доспехов<\/li><li><b>Последствия:<\/b> Если оружие подведёт в бою, на Суде Саг спросят с того, кто его вручил.<\/li><\/ul><h2 id=\"iron1-22\">Силовое оружие<\/h2><p>Силовое оружие окутано полем, которое разрывает всё, чего касается кромка: плоть, керамит, броню машин. Самое трудное в нём не клинок, а сердце поля — генератор. Новые сердца жрецы делают редко и берегут каждое.<\/p><h3 id=\"iron1-23\">Сердце Поля<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец, новое сердце собирает только Мастер Кузни<\/li><li><b>Когда:<\/b> Для нового силового оружия нужен генератор поля<\/li><li><b>Что нужно:<\/b> Генератор силового поля, металл из жил, когитаторные провода<\/li><li><b>Ход работы:<\/b> Чаще всего сердце не делают заново, а берут из сломанного оружия павшего брата или из трофея. Жрец вынимает его, чистит, проверяет и будит его духа. Новое сердце Мастер Кузни собирает в Кузне под Клыком, и на это уходят месяцы.<\/li><li><b>Литания:<\/b> Литания Огня<\/li><li><b>Последствия:<\/b> Сердце поля переживает много клинков. Волки говорят, что старое сердце помнит всех, кто держал его оружие.<\/li><\/ul><h3 id=\"iron1-24\">Силовой Клинок<\/h3><ul><li><b>Проводит:<\/b> Кователь куёт клинок, Железный Жрец ставит сердце<\/li><li><b>Когда:<\/b> Ветерану или вожаку стаи нужен силовой топор или меч<\/li><li><b>Что нужно:<\/b> Металл из жил, сердце поля, силовые кабели, моржовый клык для рукояти<\/li><li><b>Ход работы:<\/b><ol><li>Кователь куёт клинок без единой трещины и закаляет его во льду. Поле найдёт любую трещину и разорвёт клинок по ней.<\/li><li>Железный Жрец ставит сердце поля в рукоять и проводит кабели к кромке.<\/li><li>Клинок соединяют с доспехом владельца, от которого оружие питается.<\/li><li>Руны вытравливают ядом виверны, как при Нанесении Рун.<\/li><\/ol><\/li><li><b>Литания:<\/b> Литания Ковки, затем Литания Сбора<\/li><li><b>Последствия:<\/b> Если клинок треснет под полем в бою, за жизнь воина отвечают оба: и тот, кто ковал, и тот, кто ставил сердце.<\/li><\/ul><h3 id=\"iron1-25\">Громовой Молот<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни, благословляет элдинг-годи<\/li><li><b>Когда:<\/b> Для Железного Жреца, для героя или для воина, которому Эйнхерьяр доверил молот<\/li><li><b>Что нужно:<\/b> Металл из жил, сердце поля особой силы, силовые кабели<\/li><li><b>Ход работы:<\/b> Мастер Кузни куёт тяжёлую голову молота и ставит в неё сердце, которое копит силу и выпускает её всю в миг удара. Перед первым боем элдинг-годи этта Элдинг вкладывает в молот гальдр грома.<\/li><li><b>Литания:<\/b> Литания Ковки, Литания Огня<\/li><li><b>Последствия:<\/b> Удар громового молота звучит как раскат грома и разносит броню, кости и стены. Молот Железного Жреца — главный знак его сана наравне с механодендритами.<\/li><\/ul><h3 id=\"iron1-26\">Силовой Кулак и Когти<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Воину нужна силовая перчатка или силовые когти<\/li><li><b>Что нужно:<\/b> Перчатка доспеха, сердце поля, силовые кабели, когитаторные провода<\/li><li><b>Ход работы:<\/b> Жрец встраивает сердце поля прямо в перчатку и соединяет его с силовыми узлами доспеха. Для когтей он куёт лезвия и проводит поле к каждому из них. Потом жрец связывает перчатку с нервами воина через Чёрный панцирь.<\/li><li><b>Литания:<\/b> Литания Сбора, затем Литания Благословения Орудий<\/li><li><b>Последствия:<\/b> Силовой кулак рвёт броню машин голыми руками. Его дух привыкает к одной руке, и в чужом доспехе он слушается плохо.<\/li><\/ul><h3 id=\"iron1-27\">Пробуждение Поля<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Перед первым боем нового силового оружия<\/li><li><b>Что нужно:<\/b> Готовое оружие, глыба льда или старая пластина брони<\/li><li><b>Ход работы:<\/b> Жрец впервые включает поле и смотрит, ровно ли оно ложится на кромку. Затем владелец рубит глыбу льда или старую пластину брони. Если кромка прошла без звука и без искр, поле живо и ровно.<\/li><li><b>Литания:<\/b> Литания Огня<\/li><li><b>Последствия:<\/b> Если поле рвётся, искрит или гудит, оружие возвращают в кузню. С неровным полем в бой не выходят.<\/li><\/ul><h2 id=\"iron1-28\">Ледяное оружие<\/h2><p>Ледяное оружие — гордость Железных Жрецов, и такого нет ни у одного другого легиона. Оно бывает двух родов. <b>Ледяные клинки<\/b> — это силовые топоры, мечи и когти, кромка которых сделана из энергизированного алмаза или из зубов кракена и выглядит как чистый лёд. <b>Хельфрост<\/b> — это оружие, которое бьёт лучом холода: плоть от него чернеет от обморожения, броня трескается, а цель вмерзает в лёд холоднее пустоты.<\/p><h3 id=\"iron1-29\">Ледяной Клинок<\/h3><ul><li><b>Проводит:<\/b> Только Мастер Кузни. Кователи куют основу.<\/li><li><b>Когда:<\/b> Великий воин заслужил ледяное оружие перед Эйнхерьяром, или стая добыла кракена<\/li><li><b>Что нужно:<\/b> Металл из жил, зубы кракена или энергизированный алмаз, генератор силового поля, ледниковая вода, яд виверны<\/li><li><b>Ход работы:<\/b><ol><li><b>Добыча.<\/b> Зубы берут у кракена, которого убил сам будущий владелец или его стая. Для величайших клинков берут осколки костей ледяного кракена с Кракеновой Шпоры.<\/li><li><b>Основа.<\/b> Кователи куют топор, меч или когти из металла жил и закаляют их во льду.<\/li><li><b>Кромка.<\/b> Мастер Кузни сажает зубы или алмазы по кромке по одному, и над каждым читает строку литании.<\/li><li><b>Поле.<\/b> В рукоять ставят генератор силового поля. Жрец настраивает его так, чтобы по кромке шёл холод и лезвие покрывалось инеем.<\/li><li><b>Имя.<\/b> Руны вытравливают ядом виверны, как при Нанесении Рун.<\/li><\/ol><\/li><li><b>Литания:<\/b> Литания Ковки, Литания Закалки Металла, Литания Рун<\/li><li><b>Последствия:<\/b> Каждый ледяной клинок — реликвия. Его не сжигают с хозяином, а передают достойному по слову Эйнхерьяра. Волки говорят, что клинок с зубами кракена помнит холод глубин и сам тянется к горлу врага.<\/li><\/ul><p><b>Образцы ледяного оружия:<\/b><\/p><div class=\"tbl\"><table><thead><tr><th>Образец<\/th><th>Какой<\/th><th>Для кого<\/th><\/tr><\/thead><tbody><tr><td>Ледяной топор<\/td><td>Одноручный топор с ледяной кромкой<\/td><td>Самый частый образец, для вожаков стай и ветеранов<\/td><\/tr><tr><td>Ледяной клинок<\/td><td>Меч с ледяной кромкой<\/td><td>Для тех, кто бьётся в паре со щитом<\/td><\/tr><tr><td>Ледяные когти<\/td><td>Когти на силовой перчатке<\/td><td>Для тех, кто дерётся в рукопашной, как зверь<\/td><\/tr><tr><td>Великанобой<\/td><td>Огромный двуручный топор<\/td><td>Против ётунов, чудовищ и боевых машин<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-30\">Рунный Ледяной Клинок<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни вместе с фрост-годи этта Ис<\/li><li><b>Когда:<\/b> Ледяной клинок нужно наполнить силой гальдра, а не только именем<\/li><li><b>Что нужно:<\/b> Готовый ледяной клинок, ледниковая вода, ветвь хельвинтерской омелы<\/li><li><b>Ход работы:<\/b> Мастер Кузни оставляет на клинке пустые руны. В ночь хельской зимы фрост-годи вкладывает в них гальдр Ис, а жрец держит клинок в ледниковой воде, пока руны не засветятся холодом.<\/li><li><b>Литания:<\/b> Литания Рун<\/li><li><b>Последствия:<\/b> Рунный клинок сильнее простого, но признаёт только одного хозяина. Говорят, в чужих руках он покрывает пальцы инеем до самой кости.<\/li><\/ul><h3 id=\"iron1-31\">Сердце Хельфроста<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни<\/li><li><b>Когда:<\/b> Нужен хельфрост-пистолет для Железного Жреца или хельфрост-пушка для дредноута<\/li><li><b>Что нужно:<\/b> Криогенная камера, слизь полярного болотожора, ледоцвет, ледниковый лёд, когитаторные провода<\/li><li><b>Ход работы:<\/b><ol><li>Жрец собирает криогенную камеру и заливает её охладителем из слизи полярного болотожора. Эта слизь не схватывается на любом морозе и течёт там, где замерзает всё.<\/li><li>На леднике жрец растапливает во рту ледоцвет и выдыхает его холод в сердце камеры. Холод ледоцвета не уходит днями, и в камере он не уходит никогда. Это и есть Сердце Хельфроста.<\/li><li>Камеру вставляют в оружие и будят её духа.<\/li><\/ol><\/li><li><b>Литания:<\/b> Литания Закалки Металла, затем Литания Сбора<\/li><li><b>Последствия:<\/b> Оружие бьёт сфокусированным лучом или широким потоком холода. Если камера треснет, холод уйдёт в того, кто держит оружие, поэтому Железный Жрец проверяет её перед каждым боем.<\/li><\/ul><h3 id=\"iron1-32\">Хельфрост-болты<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни, тайну знают единицы<\/li><li><b>Когда:<\/b> Для особых болтеров и особых врагов<\/li><li><b>Что нужно:<\/b> Болт-снаряды, крохотные сердца хельфроста, когитаторные провода<\/li><li><b>Ход работы:<\/b> Мастер Кузни заменяет боеголовку болта крохотным сердцем хельфроста. При попадании снаряд вмораживает цель изнутри.<\/li><li><b>Литания:<\/b> Литания Битвы<\/li><li><b>Последствия:<\/b> Таких снарядов делают мало, и секрет их изготовления легко потерять. Волки берегут их для врагов, которых не берёт ничто другое.<\/li><\/ul><h3 id=\"iron1-33\">Уход за Ледяным Оружием<\/h3><ul><li><b>Проводит:<\/b> Кователь, у реликвий Железный Жрец<\/li><li><b>Когда:<\/b> После каждого боя и перед каждым походом<\/li><li><b>Что нужно:<\/b> Когитаторные провода, запасные зубы кракена, снег<\/li><li><b>Ход работы:<\/b> Жрец проверяет силовое поле и криогенный контур, меняет выкрошившиеся зубы на кромке и проверяет камеры хельфроста на трещины. Между боями ледяное оружие держат в холоде.<\/li><li><b>Литания:<\/b> Литания Диагностики<\/li><li><b>Последствия:<\/b> Волки верят, что ледяное оружие, долго пролежавшее в тепле, засыпает. Поэтому перед боем клинок суют в снег, чтобы он проснулся.<\/li><\/ul><h2 id=\"iron1-34\">Машинные духи<\/h2><p>В каждом механизме живёт малый дух, а все они живут в жилах Спящего. Дух можно разбудить, разозлить, приручить и испортить, как и зверя.<\/p><h3 id=\"iron1-35\">Чтение Металла<\/h3><ul><li><b>Проводит:<\/b> Кователь и выше<\/li><li><b>Когда:<\/b> Перед боем, после боя и всякий раз, когда механизм ведёт себя странно<\/li><li><b>Что нужно:<\/b> Когитаторные провода, ауспекс, молот<\/li><li><b>Ход работы:<\/b> Жрец подключается проводами и читает код механизма. Потом он простукивает корпус молотом и слушает: трещина звучит иначе, чем цельный металл. Изъяны он находит дважды, проводами и слухом, и верит только тогда, когда они совпали.<\/li><li><b>Литания:<\/b> Литания Диагностики<\/li><li><b>Последствия:<\/b> Жрец выносит вердикт: служит, чинить или переплавить. Вердикт записывают, и за него жрец отвечает.<\/li><\/ul><h3 id=\"iron1-36\">Пробуждение Духа<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Новый механизм собран, или старый долго спал в хранилищах Клыка<\/li><li><b>Что нужно:<\/b> Когитаторные провода, смола смоляной ели, молот<\/li><li><b>Ход работы:<\/b> Жрец смазывает сочленения смолой и подключается к механизму. Он вводит первые коды и трижды бьёт молотом по корпусу, чтобы дух услышал. Затем жрец ждёт, пока механизм не отзовётся сам.<\/li><li><b>Литания:<\/b> Литания Железного Волка<\/li><li><b>Последствия:<\/b> Дух помнит того, кто его разбудил. С этим жрецом механизм потом ладит лучше, чем с остальными.<\/li><\/ul><h3 id=\"iron1-37\">Усмирение Буйного Духа<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Механизм дичает: оружие клинит снова и снова, машина борется с водителем, доспех не слушается хозяина. Чаще всего это случается после тяжёлых ран или долгой войны без ухода.<\/li><li><b>Что нужно:<\/b> Когитаторные провода, ауспекс, инструменты для починки<\/li><li><b>Ход работы:<\/b> Жрец отключает механизм от воина и говорит с духом через провода, как Волчий жрец говорит с братом, в котором проснулся зверь. Он ищет, где духу больно: трещину, обожжённый узел, порванный провод. Сначала жрец чинит рану, потом переписывает спутанные коды.<\/li><li><b>Литания:<\/b> Литания Программирования<\/li><li><b>Последствия:<\/b> Усмирённый дух служит верно. Если дух не усмирился и после починки, механизм отправляют в Кузню под Клыком.<\/li><\/ul><h3 id=\"iron1-38\">Новые Команды<\/h3><ul><li><b>Проводит:<\/b> Кователь и выше<\/li><li><b>Когда:<\/b> Механизму нужны новые приказы: другие цели, сигналы, режим работы<\/li><li><b>Что нужно:<\/b> Когитаторные провода, инфопланшет<\/li><li><b>Ход работы:<\/b> Жрец подключается, стирает старые команды и вводит новые, после чего проверяет механизм в деле.<\/li><li><b>Литания:<\/b> Литания Программирования<\/li><li><b>Последствия:<\/b> Ошибка в коде на поле боя стоит жизней, поэтому Кователь программирует боевые машины только под присмотром Железного Жреца.<\/li><\/ul><h3 id=\"iron1-39\">Очищение Металла<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни, при сильной порче вместе с рунным жрецом<\/li><li><b>Когда:<\/b> Механизм тронут порчей: враг заразил его код, или металл коснулось колдовство<\/li><li><b>Что нужно:<\/b> Когитаторные провода, корень плакун-травы, Кузня под Клыком<\/li><li><b>Ход работы:<\/b> Механизм отключают от всего. Жрец держит у корпуса корень плакун-травы: если корень ноет, порча в металле, а не только в коде. Испорченный код стирают до основания. Испорченный металл переплавляют в Кузне под Клыком в огне, что горит над сердцем Спящего.<\/li><li><b>Литания:<\/b> Литания Разбора, затем Литания Огня<\/li><li><b>Последствия:<\/b> Стёртый до основания дух умирает, и механизм просыпается новым. Если порча не уходит и из металла, его бросают в самое жерло вулкана, а имя механизма вычёркивают.<\/li><\/ul><h3 id=\"iron1-40\">Приручение Трофея<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец, о технике ксеносов решает Мастер Кузни<\/li><li><b>Когда:<\/b> Стая взяла чужое оружие, машину или механизм<\/li><li><b>Что нужно:<\/b> Инструменты, когитаторные провода, корень плакун-травы<\/li><li><b>Ход работы:<\/b><ol><li>Трофей разбирают до последней детали и ищут в нём ловушки и порчу.<\/li><li>Что чисто, чистят и собирают заново.<\/li><li>Жрец будит духа и знакомит его с Железным Волком: теперь он служит стае.<\/li><\/ol><\/li><li><b>Литания:<\/b> Литания Разбора, затем Литания Сбора<\/li><li><b>Последствия:<\/b> Технику людей жрецы приручают охотно. Технику ксеносов чаще всего сжигают, а то немногое, что оставляют, хранят под замком в Кузне.<\/li><\/ul><h2 id=\"iron1-41\">Полевая работа<\/h2><p>Работы, которые жрец делает на поле боя, часто под огнём. Для них и нужно волкитное орудие на ранце.<\/p><h3 id=\"iron1-42\">Расклинивание<\/h3><ul><li><b>Проводит:<\/b> Ученик Горна и выше<\/li><li><b>Когда:<\/b> Болтер или другое оружие заклинило в бою<\/li><li><b>Что нужно:<\/b> Молот, механодендриты, смола смоляной ели<\/li><li><b>Ход работы:<\/b> Жрец бьёт молотом по затвору в нужное место, и чаще всего этого хватает. Если нет, он выним
