ает застрявший снаряд механодендритами, смазывает затвор смолой и возвращает оружие хозяину.<\/li><li><b>Литания:<\/b> Первая строка Литании Диагностики, на большее в бою нет времени<\/li><li><b>Последствия:<\/b> Если оружие заклинило трижды за бой, после боя его ждёт Усмирение Буйного Духа.<\/li><\/ul><h3 id=\"iron1-43\">Латание Брони<\/h3><ul><li><b>Проводит:<\/b> Кователь и выше<\/li><li><b>Когда:<\/b> Доспех пробит, но воин может сражаться<\/li><li><b>Что нужно:<\/b> Резак, запасные пластины, смола смоляной ели<\/li><li><b>Ход работы:<\/b> Жрец срезает рваные края пробоины, приваривает поверх пластину и проливает шов смолой. Если пробит силовой узел, он переключает доспех на запасные цепи.<\/li><li><b>Литания:<\/b> Литания Благословения Доспехов, коротко<\/li><li><b>Последствия:<\/b> Заплата держит до конца боя, потом доспех идёт в кузню.<\/li><\/ul><h3 id=\"iron1-44\">Запечатывание<\/h3><ul><li><b>Проводит:<\/b> Кователь и выше<\/li><li><b>Когда:<\/b> Доспех пробит в вакууме, в ядовитой атмосфере или под водой. Счёт идёт на секунды.<\/li><li><b>Что нужно:<\/b> Герметик, смола смоляной ели, резак<\/li><li><b>Ход работы:<\/b> Жрец закрывает пробоину ладонью или механодендритом и одновременно заливает её герметиком. Когда шов схватился, он проверяет давление в доспехе. Если воин уже задыхается, жрец зовёт Творца плоти, чтобы тот разбудил его Третье лёгкое.<\/li><li><b>Литания:<\/b> Не читается, пока шов не схватился. Потом Литания Благословения Доспехов.<\/li><li><b>Последствия:<\/b> Жрец, промедливший с Запечатыванием, отвечает за жизнь брата на Суде Саг.<\/li><\/ul><h3 id=\"iron1-45\">Вскрытие Доспеха<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец вместе с Творцом плоти<\/li><li><b>Когда:<\/b> Тяжелораненого нужно вынуть из доспеха для операции, а сочленения смяты или заклинили<\/li><li><b>Что нужно:<\/b> Резак, механодендриты, когитаторные провода<\/li><li><b>Ход работы:<\/b> Жрец подключается к доспеху и отключает его силовые узлы, чтобы тот не сжал раненого. Затем он режет пластины по швам, а Творец плоти держит руку на ране и говорит, где резать нельзя.<\/li><li><b>Литания:<\/b> Литания Разбора<\/li><li><b>Последствия:<\/b> Разрезанный доспех потом собирают заново. Его дух помнит, что его резали ради хозяина, и не держит зла.<\/li><\/ul><h3 id=\"iron1-46\">Подъём Машины<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Боевая машина обездвижена в бою: разбиты гусеницы, заглох двигатель, она завязла<\/li><li><b>Что нужно:<\/b> Механодендриты, тросы, запасные части, сервиторы при наличии<\/li><li><b>Ход работы:<\/b> Стая прикрывает жреца, пока он работает. Жрец меняет разбитое, что можно поменять на месте, и будит заглохший двигатель. Если машина завязла, её вытягивают тросами другой машиной.<\/li><li><b>Литания:<\/b> Литания Сбора<\/li><li><b>Последствия:<\/b> Машину, поднятую под огнём, Волки зовут «вставшей из мёртвых», и её имя поют в саге стаи.<\/li><\/ul><h3 id=\"iron1-47\">Последний Удар<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Машину не спасти, а оставлять её врагу нельзя<\/li><li><b>Что нужно:<\/b> Когитаторные провода, молот, подрывные заряды<\/li><li><b>Ход работы:<\/b> Жрец подключается к машине и прощается с её духом. Он вынимает сердце машины, то есть ядро её когитатора с памятью духа, так же как Волчий жрец забирает семя павшего брата. Затем он ставит заряды, и машину взрывают.<\/li><li><b>Литания:<\/b> Литания Разбора<\/li><li><b>Последствия:<\/b> Сердце машины везут в Кузню под Клыком. Там его ставят в новую машину, и дух продолжает служить под новым корпусом.<\/li><\/ul><h2 id=\"iron1-48\">Боевые машины и дредноуты<\/h2><p>Работы с машинами роты и с героями, которые продолжают сражаться в железе после смерти.<\/p><h3 id=\"iron1-49\">Уход за Машиной<\/h3><ul><li><b>Проводит:<\/b> Кователь<\/li><li><b>Когда:<\/b> После каждого похода и раз в луну между походами<\/li><li><b>Что нужно:<\/b> Когитаторные провода, смола смоляной ели, инструменты, запасные части<\/li><li><b>Ход работы:<\/b> Жрец осматривает машину от гусениц до орудий, чистит, смазывает сочленения смолой и меняет изношенное. Затем он проверяет духа: отзывается ли машина сразу и нет ли в её коде лишнего.<\/li><li><b>Литания:<\/b> Литания Диагностики, затем Литания Сбора<\/li><li><b>Последствия:<\/b> Машина, за которой ухаживают, в бою не подводит. А подвела, значит, спросят с того, кто ухаживал.<\/li><\/ul><h3 id=\"iron1-50\">Благословение Машины<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Перед битвой, пока Волчий жрец проводит Злую Клятву для стаи<\/li><li><b>Что нужно:<\/b> Краска, молот<\/li><li><b>Ход работы:<\/b> Жрец обходит машины роты и на каждой рисует руну Железного Волка и руну стаи, которую она повезёт. Затем он трижды бьёт молотом по броне машины, чтобы дух проснулся злым.<\/li><li><b>Литания:<\/b> Литания Битвы<\/li><li><b>Последствия:<\/b> Волки верят, что машина без руны стаи не знает, кого защищать.<\/li><\/ul><h3 id=\"iron1-51\">Погребение в Железе<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни вместе со Старшим Волчьим жрецом<\/li><li><b>Когда:<\/b> Великий воин смертельно ранен, и Эйнхерьяр решил, что его сага не должна кончаться<\/li><li><b>Что нужно:<\/b> Саркофаг дредноута, когитаторные провода, Бальзам «Железный Сон», Отвар «Взор Моркаи»<\/li><li><b>Ход работы:<\/b><ol><li>Волчий жрец держит умирающего на этом свете Мнимой Смертью.<\/li><li>Творцы плоти отделяют от тела всё, что уже не нужно.<\/li><li>Мастер Кузни помещает то, что осталось, в саркофаг и соединяет нервы воина с машиной.<\/li><li>Пока идёт работа, стая поёт его сагу от начала до конца, чтобы воин не забыл себя.<\/li><li>На саркофаге вырезают имя воина и руны всех его подвигов.<\/li><\/ol><\/li><li><b>Литания:<\/b> Литания Железного Волка<\/li><li><b>Последствия:<\/b> О таком воине Волки говорят, что он «спит в железе». Моркаи ждёт его, но не торопит.<\/li><\/ul><h3 id=\"iron1-52\">Долгий Сон<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни<\/li><li><b>Когда:<\/b> Война кончилась, и дредноут возвращается в Клык до следующей<\/li><li><b>Что нужно:<\/b> Холодный зал в глубине Клыка, когитаторные провода<\/li><li><b>Ход работы:<\/b> Жрец медленно отключает дредноут от оружия, потом от движения и в последнюю очередь от сознания. Саркофаг остужают до сна. Рядом с ним вешают бирку с его сагой, чтобы тот, кто будет будить, знал, что петь.<\/li><li><b>Литания:<\/b> Литания Разбора, только первые две строки: дредноут не разбирают, его укладывают<\/li><li><b>Последствия:<\/b> Дредноут может проспать сотни лет. Чем дольше сон, тем труднее пробуждение.<\/li><\/ul><h3 id=\"iron1-53\">Пробуждение Древнего<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни вместе с Волчьим жрецом<\/li><li><b>Когда:<\/b> Ярл просит героя в бой, или Клыку грозит беда<\/li><li><b>Что нужно:<\/b> Когитаторные провода, цепи, бирка с сагой дредноута, Препарат «Волчий Поцелуй»<\/li><li><b>Ход работы:<\/b> Дредноут сковывают цепями. Мастер Кузни будит его медленно, в обратном порядке: сначала сознание, затем движение. Волчий жрец поёт его сагу, ведь проснувшийся часто думает, что всё ещё стоит в своём последнем бою. Оружие подключают, только когда дредноут сам назовёт своё имя и год, в котором проснулся.<\/li><li><b>Литания:<\/b> Литания Железного Волка<\/li><li><b>Последствия:<\/b> Иногда в железе просыпается зверь, и это страшнее любого Вульфена. Такого дредноута оставляют в цепях в самом глубоком зале Клыка, и жрецы спускаются к нему петь его сагу.<\/li><\/ul><h3 id=\"iron1-54\">Проводы Машины<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Машина погибла, и её сердце не удалось спасти, или она отслужила своё<\/li><li><b>Что нужно:<\/b> Пластина с её брони, резец<\/li><li><b>Ход работы:<\/b> Жрец срезает с машины пластину с её именем и руной. Пластину везут в Кузню под Клыком и вешают в Зале Корпусов, где висят тысячи таких же. Имя машины вписывают в сагу роты рядом с теми, кого она возила.<\/li><li><b>Литания:<\/b> Литания Разбора<\/li><li><b>Последствия:<\/b> Волки верят, что дух машины без сердца уходит в жилы Спящего и однажды вернётся в новом металле.<\/li><\/ul><h2 id=\"iron1-55\">Бионика, кибер-волки и связь<\/h2><p>Работы, где сталь соединяется с живым: с воином, со зверем или с самим жрецом.<\/p><h3 id=\"iron1-56\">Ковка Бионики<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Воин или слуга легиона потерял часть тела, которую плоть уже не вернёт, и Волчий жрец или Творец плоти подготовил рану<\/li><li><b>Что нужно:<\/b> Металл из жил, когитаторные провода, мерки с уцелевшей конечности<\/li><li><b>Ход работы:<\/b> Жрец снимает мерку с уцелевшей руки или ноги и куёт бионику ей под пару. Бионика должна быть не сильнее и не легче утраченного, а такой же, ведь сталь — продолжение плоти, а не замена ей. Потом жрец вживляет её вместе с Волчьим жрецом или Творцом плоти. Для каждой аугметики своя операция, все они собраны в разделе «Аугметика» документа «Операции Волчьих Жрецов».<\/li><li><b>Литания:<\/b> Литания Ковки, затем Литания Сбора<\/li><li><b>Последствия:<\/b> Здоровую плоть Железный Жрец не заменит никогда, даже если воин сам попросит. Тех, кто рубит себя ради стали, Волки считают глупцами.<\/li><\/ul><h3 id=\"iron1-57\">Кибер-волк<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец вместе с Творцом плоти<\/li><li><b>Когда:<\/b> Фенрисийский волк, спутник жреца или стаи, тяжело ранен, но ещё жив<\/li><li><b>Что нужно:<\/b> Металл из жил, механодендриты, когитаторные провода, Бальзам «Железный Сон»<\/li><li><b>Ход работы:<\/b> Творец плоти держит зверя на этом свете, а Железный Жрец заменяет сталью то, что разбито: лапы, челюсть, рёбра, глаза. После этого жрец несколько дней кормит волка с руки, пока зверь не примет новое тело.<\/li><li><b>Литания:<\/b> Литания Сбора, затем Литания Железного Волка<\/li><li><b>Последствия:<\/b> Кибер-волк привязан к жрецу, который его собрал. Когда жрец умирает, волк ложится у его погребального костра, и прогнать его не может никто.<\/li><\/ul><h3 id=\"iron1-58\">Техно-ворон<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец, при тяжёлых ранах птицы вместе с Творцом плоти<\/li><li><b>Когда:<\/b> Жрецу нужен разведчик и вестник, или ворон, живущий при кузне, тяжело ранен<\/li><li><b>Что нужно:<\/b> Стальные когти и клюв, сочленения, око, вокс-узел<\/li><li><b>Ход работы:<\/b> Жрец заменяет сталью когти и клюв ворона, а в одну из глазниц вставляет око. Под перья, у самого сердца, он прячет крошечный вокс-узел, чтобы ворон мог передавать жрецу то, что видит. Потом жрец несколько дней кормит его с руки и учит садиться на голову механодендрита.<\/li><li><b>Литания:<\/b> Литания Сбора, затем Литания Железного Волка<\/li><li><b>Последствия:<\/b> Техно-ворон летает над полем боя и шлёт жрецу всё, что видит. Как всякий ворон, он годами помнит обидчиков своего жреца. А стальным клювом он не может склевать сердце павшего вождя, поэтому вальравном техно-ворон не станет никогда.<\/li><\/ul><h3 id=\"iron1-59\">Механодендрит<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни вместе с Творцом плоти<\/li><li><b>Когда:<\/b> Жрец поднимается в ранге: Кователь получает первый механодендрит, Железный Жрец второй, Мастер Кузни третий<\/li><li><b>Что нужно:<\/b> Механодендрит, когитаторные провода, сшиватель<\/li><li><b>Ход работы:<\/b> Голову механодендрита куют по образу волка, которого жрец знал: своего спутника, зверя с испытания или волка из его саги. Творец плоти соединяет механодендрит с нервами через порт у позвоночника, а Мастер Кузни будит его духа.<\/li><li><b>Литания:<\/b> Литания Ковки, затем Литания Сбора<\/li><li><b>Последствия:<\/b> Первые месяцы разум путается в лишней руке, и механодендрит хватает то, чего жрец не хотел. Ученики над этим смеются, пока не придёт их очередь.<\/li><\/ul><h3 id=\"iron1-60\">Наполнение Рога<\/h3><ul><li><b>Проводит:<\/b> Ученик Горна, и это почётная обязанность<\/li><li><b>Когда:<\/b> После каждого похода и после каждого пира<\/li><li><b>Что нужно:<\/b> Мьод, когитаторные провода<\/li><li><b>Ход работы:<\/b> Ученик чистит систему подачи мьода в доспехе наставника, проверяет иглы и трубки и наполняет запас свежим мьодом. Затем он выставляет долю, чтобы наставник мог работать и после глотка.<\/li><li><b>Литания:<\/b> Не читается. Мьод благословляет Эльгра, а Железный Волк в чужие дела не лезет.<\/li><li><b>Последствия:<\/b> Ученик, перепутавший долю, становится героем пира. Наставник, получивший её, становится героем саги.<\/li><\/ul><h3 id=\"iron1-61\">Голос Стаи<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Перед походом роты и перед каждой большой битвой<\/li><li><b>Что нужно:<\/b> Вокс-узлы, когитаторные провода, инфопланшет<\/li><li><b>Ход работы:<\/b> Жрец настраивает вокс-связь роты, от ярла до последнего Кровавого Когтя. Сигналы он шифрует рунами на фенрисийском, ведь враг может перехватить слово, но не поймёт его.<\/li><li><b>Литания:<\/b> Литания Программирования<\/li><li><b>Последствия:<\/b> Когда связь рвётся посреди боя, стая ищет глазами не ярла, а Железного Жреца.<\/li><\/ul><h2 id=\"iron1-62\">Техно-треллы<\/h2><p>Техно-треллы — основа работы Железных Жрецов. Без них не работает ни одна кузня, ни один корабль роты. Треллы носят грузы, стоят у горнов, наводят орудия и помогают Творцам плоти, а у каждого Железного Жреца их десятки. Делают их только из слуг легиона, и заповедь «Сталь — продолжение плоти» этому не противоречит: учение говорит о воинах, а трелл — это служба слуги, продолженная в стали.<\/p><h3 id=\"iron1-63\">Избрание Трелла<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Кузне, кораблю роты или апотекариону нужны руки<\/li><li><b>Что нужно:<\/b> Слуга легиона, костяная бирка<\/li><li><b>Ход работы:<\/b> Треллами становятся только смертные слуги легиона: кэрлы, кузнечные подручные, корабельная челядь. Чаще всего это те, кто состарился, искалечен или умирает от ран, но может служить дальше. Никого со стороны треллом не делают: ни пленника, ни чужака, ни Волка, ни ребёнка. Перед работой Железный Жрец вырезает имя слуги на бирке, а прядь его волос сжигает в горне: человек ушёл, а служба осталась.<\/li><li><b>Литания:<\/b> Литания Железного Волка<\/li><li><b>Последствия:<\/b> Бирки треллов висят в Зале Корпусов рядом с пластинами павших машин, а их имена называют на Тризне Павших.<\/li><\/ul><h3 id=\"iron1-64\">Стирание<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> После Избрания<\/li><li><b>Что нужно:<\/b> Нейроглушитель, лазерный резак, когитаторные провода<\/li><li><b>Ход работы:<\/b> Жрец отключает сознание слуги нейроглушителем. Он вскрывает череп и резаком и кодом убирает из мозга волю и память, оставляя то, что нужно телу, чтобы дышать, двигаться и слушаться.<\/li><li><b>Литания:<\/b> Литания Программирования<\/li><li><b>Последствия:<\/b> Если жрец стёр не всё, в трелле может остаться обрывок прежнего человека. Жрецы рассказывают о треллах, которые вдруг начинали напевать сагу своего рода, и таких сразу отправляют на Упокоение.<\/li><\/ul><h3 id=\"iron1-65\">Сборка Трелла<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец, Кователь помогает<\/li><li><b>Когда:<\/b> После Стирания<\/li><li><b>Что нужно:<\/b> Аугметика под задачу трелла, когитатор для черепа, когитаторные провода, сшиватель<\/li><li><b>Ход работы:<\/b> Жрец ставит в череп когитатор и вживляет то, что нужно для работы: молот вместо руки, грузовые захваты, орудие или инструменты. Затем он будит когитатор и знакомит его с Железным Волком.<\/li><li><b>Литания:<\/b> Литания Сбора<\/li><li><b>Последствия:<\/b> Трелл служит, пока не износится, а кормят и чинят его Ученики Горна.<\/li><\/ul><p><b>Виды треллов:<\/b><\/p><div class=\"tbl\"><table><thead><tr><th>Трелл<\/th><th>Что делает<\/th><\/tr><\/thead><tbody><tr><td>Горновой<\/td><td>Стоит у горна, держит заготовки, качает меха. Вместо одной руки у него клещи.<\/td><\/tr><tr><td>Носильщик<\/td><td>Носит руду, пластины, снаряды и раненых. Грузовые захваты вместо рук.<\/td><\/tr><tr><td>Орудийный<\/td><td>Наводит и заряжает орудия кораблей и укреплений<\/td><\/tr><tr><td>Трелл-лекарь<\/td><td>Помогает Творцам плоти: держит раненых, подаёт инструменты, носит снадобья<\/td><\/tr><tr><td>Счетовод<\/td><td>Ведёт учёт кузни: металл, оружие, снаряды. Петь саги ему запрещено.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-66\">Наказ Треллу<\/h3><ul><li><b>Проводит:<\/b> Кователь и выше<\/li><li><b>Когда:<\/b> Треллу нужна новая работа<\/li><li><b>Что нужно:<\/b> Когитаторные провода, инфопланшет<\/li><li><b>Ход работы:<\/b> Жрец подключается к когитатору трелла, стирает прежний наказ и вводит новый, после чего проверяет трелла в работе.<\/li><li><b>Литания:<\/b> Литания Программирования<\/li><li><b>Последствия:<\/b> Трелл делает ровно то, что ему велели, и ничего больше. Если стая забыла об этом, винить некого.<\/li><\/ul><h3 id=\"iron1-67\">Упокоение<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Трелл износился, сломан или в нём проснулся обрывок прежнего человека<\/li><li><b>Что нужно:<\/b> Когитаторные провода, горн<\/li><li><b>Ход работы:<\/b> Жрец отключает когитатор трелла и вынимает его аугметику, чтобы поставить её следующему. Тело сжигают в горне Кузни, а жрец называет над ним прежнее имя с бирки.<\/li><li><b>Литания:<\/b> Литания Разбора<\/li><li><b>Последствия:<\/b> Трелла, честно отслужившего стае, вписывают в сагу роты. Говорят, Моркаи принимает его как воина, ведь тот служил стае до конца.<\/li><\/ul><h2 id=\"iron1-68\">Автоматоны<\/h2><p>Автоматон — это машина, в которой нет живой плоти, только сталь и дух. Этим он отличается от техно-трелла, в котором живёт тело слуги легиона. Духи автоматонов — малые духи из жил Спящего, и Железные Жрецы делают их сами, в Кузне под Клыком.<\/p><p>У автоматонов Волков есть один нерушимый закон, Запрет Мыслящей Стали: дух автоматона слушает, но не думает. Он исполняет наказ жреца и не решает ничего сам. Автоматон, который начал выбирать, считается порченым, и его отправляют на Очищение Металла.<\/p><h3 id=\"iron1-69\">Виды автоматонов<\/h3><div class=\"tbl\"><table><thead><tr><th>Автоматон<\/th><th>Редкость<\/th><th>Для чего<\/th><th>Облик<\/th><th>Кто создаёт<\/th><\/tr><\/thead><tbody><tr><td>Летучий Череп<\/td><td>○ Редкий<\/td><td>Свет, ауспекс и инструменты рядом с жрецом<\/td><td>Череп фенрисийского волка с антигравом, фонарём из светляка и маленькими манипуляторами<\/td><td>Кователь<\/td><\/tr><tr><td>Железный Кабан<\/td><td>⭘ Престижный<\/td><td>Таранит строй и ворота, тащит грузы и орудия там, где не пройдёт машина<\/td><td>Приземистый автоматон в виде фенрисийского вепря, закованный в броню, с двумя парами клыков-таранов и рылом-вентиляцией, которое свистит на бегу<\/td><td>Железный Жрец<\/td><\/tr><tr><td>Кастелакс<\/td><td>◎ Раритетный<\/td><td>Тяжёлый боевой автоматон, идёт в бой рядом со жрецом<\/td><td>Массивный автоматон по образцу Механикума: болт-пушка, силовые клинки в кулаках, тяжёлая броня. Волки покрывают его рунами и вешают на него волчьи шкуры<\/td><td>Мастер Кузни<\/td><\/tr><\/tbody><\/table><\/div><p>Кастелакс — единственный автоматон, чей образец пришёл в легион от Механикума: с трофеями и с союзниками. Железные Жрецы переделали его на свой лад, переписали его ядро и, как у всех своих автоматонов, вписали в него Запрет Мыслящей Стали. Без жреца рядом Кастелакс в бой не выходит: в одиночку его дух легко дичает.<\/p><h3 id=\"iron1-70\">Сборка Автоматона<\/h3><ul><li><b>Проводит:<\/b> Ранг по виду автоматона, указанному в таблице выше<\/li><li><b>Когда:<\/b> Кузне, роте или Клыку нужен автоматон<\/li><li><b>Что нужно:<\/b> Металл из жил, ядро когитатора, силовой узел, инструменты и оружие под задачу<\/li><li><b>Ход работы:<\/b><ol><li><b>Каркас.<\/b> Кователи куют каркас и броневые пластины по образу выбранного вида.<\/li><li><b>Сила.<\/b> Жрец ставит силовой узел и проводит кабели к суставам.<\/li><li><b>Сердце.<\/b> В грудь ставят ядро когитатора. Если в Кузне есть сердце павшей машины, его берут первым, и дух продолжает служить в новом теле.<\/li><li><b>Руки.<\/b> Жрец ставит инструменты или оружие под задачу.<\/li><li><b>Пробуждение.<\/b> Жрец будит духа и вводит первый наказ.<\/li><li><b>Испытание.<\/b> Автоматон выполняет работу под присмотром жреца, прежде чем его отпустят служить.<\/li><\/ol><\/li><li><b>Литания:<\/b> Литания Ковки, Литания Сбора, затем Литания Железного Волка<\/li><li><b>Последствия:<\/b> Автоматон служит, пока не износится, и слушается того, кто его разбудил, лучше, чем других.<\/li><\/ul><h3 id=\"iron1-71\">Наказ Автоматону<\/h3><ul><li><b>Проводит:<\/b> Кователь и выше, боевому автоматону — только Железный Жрец<\/li><li><b>Когда:<\/b> Автоматону нужна новая работа или новый хозяин<\/li><li><b>Что нужно:<\/b> Когитаторные провода, инфопланшет<\/li><li><b>Ход работы:<\/b> Жрец подключается к ядру, стирает прежний наказ и вводит новый. Каждый наказ кончается одной и той же строкой кода, Запретом Мыслящей Стали.<\/li><li><b>Литания:<\/b> Литания Программирования<\/li><li><b>Последствия:<\/b> Автоматон с наказом без Запрета жрецы считают бедой, ждущей своего часа. Пропустивший Запрет отвечает на Суде Наковальни.<\/li><\/ul><h3 id=\"iron1-72\">Уход за Автоматоном<\/h3><ul><li><b>Проводит:<\/b> Кователь, за боевыми автоматонами следит Железный Жрец<\/li><li><b>Когда:<\/b> После каждой работы или боя и раз в луну между ними<\/li><li><b>Что нужно:<\/b> Смола смоляной ели, запасные части, когитаторные провода<\/li><li><b>Ход работы:<\/b> Жрец смазывает суставы смолой, меняет изношенные части, проверяет силовой узел и читает ядро. Особое внимание он уделяет тому, не появилось ли в коде лишнего.<\/li><li><b>Литания:<\/b> Литания Диагностики<\/li><li><b>Последствия:<\/b> Автоматон без ухода начинает дичать, как всякий машинный дух. Тогда его ждёт Усмирение Буйного Духа.<\/li><\/ul><h3 id=\"iron1-73\">Упокоение Автоматона<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Автоматон износился, сломан или нарушил Запрет Мыслящей Стали<\/li><li><b>Что нужно:<\/b> Когитаторные провода, горн<\/li><li><b>Ход работы:<\/b> Жрец отключает автоматона и вынимает его ядро. Сердце честно служившего автоматона уходит в Кузню для новой машины, а сердце нарушившего Запрет переплавляют вместе с корпусом. Корпус разбирают на части, металл возвращается в горн.<\/li><li><b>Литания:<\/b> Литания Разбора<\/li><li><b>Последствия:<\/b> С честно служивших автоматонов срезают пластину с именем и вешают в Зале Корпусов рядом с пластинами павших машин.<\/li><\/ul><h2 id=\"iron1-74\">Техническое оборудование<\/h2><p>Кроме оружия, брони и машин, на Железных Жрецах держится всё, без чего Клык и корабли не проживут и дня: тепло, воздух, свет, связь, щиты и хранилища генного семени. Это оборудование не идёт в бой, но, если оно откажет, стая погибнет без всякого врага.<\/p><h3 id=\"iron1-75\">Виды оборудования<\/h3><div class=\"tbl\"><table><thead><tr><th>Оборудование<\/th><th>Что делает<\/th><th>Где стоит<\/th><\/tr><\/thead><tbody><tr><td>Сердце Клыка<\/td><td>Плазменные реакторы, которые дают Клыку тепло и силу<\/td><td>В самых глубоких залах горы<\/td><\/tr><tr><td>Генераторы<\/td><td>Питают кузни, лагеря и малые корабли<\/td><td>Везде, где нужна сила<\/td><\/tr><tr><td>Воздуховоды и фильтры<\/td><td>Дают воздух глубинам Клыка и кораблям, чистят его от вулканических испарений<\/td><td>В стенах Клыка, в недрах кораблей<\/td><\/tr><tr><td>Обогрев<\/td><td>Греющие трубы в длинных залах и казармах<\/td><td>По всему Клыку<\/td><\/tr><tr><td>Вокс-станции<\/td><td>Связь роты, Клыка и флота<\/td><td>В Клыке, на кораблях, в лагерях<\/td><\/tr><tr><td>Когитаторы и ауспексы<\/td><td>Расчёты, карты, поиск врага<\/td><td>На мостиках, в штабах ярлов<\/td><\/tr><tr><td>Подъёмники и врата<\/td><td>Двери Клыка, грузовые подъёмники, ворота доков<\/td><td>По всему Клыку<\/td><\/tr><tr><td>Пустотные щиты<\/td><td>Защищают укрепления и корабли от огня<\/td><td>На стенах Клыка, на кораблях<\/td><\/tr><tr><td>Стазис-хранилища<\/td><td>Хранят генное семя павших<\/td><td>В апотекарионе Клыка<\/td><\/tr><tr><td>Оборудование апотекариона<\/td><td>Операционные столы, лампы, сшиватели<\/td><td>В апотекарионе, вместе с Творцами плоти<\/td><\/tr><tr><td>Огни Стоянки<\/td><td>Прожекторы, которые держат ночных тварей подальше от лагеря<\/td><td>В походных лагерях<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron1-76\">Установка Оборудования<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец, Сердце Клыка и пустотные щиты — Мастер Кузни<\/li><li><b>Когда:<\/b> Клыку, кораблю или лагерю нужно новое оборудование<\/li><li><b>Что нужно:<\/b> Оборудование, силовые кабели, когитаторные провода, техно-треллы<\/li><li><b>Ход работы:<\/b> Жрец проверяет место: выдержит ли камень или палуба вес и тряску. Треллы ставят оборудование, жрец проводит кабели и подключает его к силе. Затем он будит духа и даёт оборудованию поработать под полной нагрузкой целые сутки, прежде чем доверить ему жизни.<\/li><li><b>Литания:<\/b> Литания Сбора, затем Литания Железного Волка<\/li><li><b>Последствия:<\/b> Оборудование, которое не выдержало суток под нагрузкой, разбирают и собирают заново.<\/li><\/ul><h3 id=\"iron1-77\">Обход<\/h3><ul><li><b>Проводит:<\/b> Кователь, с ним Ученики Горна<\/li><li><b>Когда:<\/b> Каждую смену, без исключений<\/li><li><b>Что нужно:<\/b> Ауспекс, смола смоляной ели, запасные фильтры, журнал обхода<\/li><li><b>Ход работы:<\/b> Кователь проходит один и тот же путь по Клыку или кораблю. Он читает каждый механизм ауспексом, слушает, как гудят генераторы и воздуховоды, меняет забитые фильтры и смазывает подъёмники. Всё, что нашёл, он записывает в журнал обхода.<\/li><li><b>Литания:<\/b> Литания Диагностики<\/li><li><b>Последствия:<\/b> Обход нельзя пропускать даже в Ночь Молотов: от него зависит, чем дышит стая. Пропустивший обход отвечает на Суде Наковальни.<\/li><\/ul><h3 id=\"iron1-78\">Ремонт под Нагрузкой<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Сломалось то, что нельзя отключить: воздух корабля, щиты в бою, стазис-хранилище<\/li><li><b>Что нужно:<\/b> Запасные цепи, резак, когитаторные провода, техно-треллы<\/li><li><b>Ход работы:<\/b> Жрец переключает оборудование на запасные цепи, если они есть, и чинит основные, не отключая их. Треллы держат то, что нельзя отпустить, а жрец работает под током. Литанию он читает шёпотом, чтобы не сбиться.<\/li><li><b>Литания:<\/b> Литания Диагностики, шёпотом<\/li><li><b>Последствия:<\/b> Ремонт под нагрузкой — одна из самых опасных работ Железного Жреца. Многие шрамы на их руках — от него, а не от боя.<\/li><\/ul><h3 id=\"iron1-79\">Хранение Семени<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец вместе с Волчьим Жрецом<\/li><li><b>Когда:<\/b> Всегда. Стазис-хранилища проверяют каждый день.<\/li><li><b>Что нужно:<\/b> Стазис-хранилища, ауспекс, запасной силовой узел<\/li><li><b>Ход работы:<\/b> Железный Жрец следит, чтобы стазис ни на миг не прерывался, а Волчий Жрец проверяет, цело ли семя. У каждого хранилища два запасных силовых узла, и их проверяют наравне с основным.<\/li><li><b>Литания:<\/b> Литания Железного Волка<\/li><li><b>Последствия:<\/b> Если хранилище откажет, за семя ответят оба жреца. Это единственная работа, где Ответственность делят Железные и Волчьи Жрецы.<\/li><\/ul><h3 id=\"iron1-80\">Огни Стоянки<\/h3><ul><li><b>Проводит:<\/b> Кователь<\/li><li><b>Когда:<\/b> Стая разбивает лагерь на ночь, особенно на Фенрисе и на мирах с ночными тварями<\/li><li><b>Что нужно:<\/b> Походный генератор, прожекторы, кабели<\/li><li><b>Ход работы:<\/b> Кователь ставит генератор в центре лагеря и прожекторы кольцом по краю, лучами наружу. Свет не гаснет до утра.<\/li><li><b>Литания:<\/b> Литания Огня<\/li><li><b>Последствия:<\/b> По бестиарию нетопыри не залетают туда, где светло, а туманники боятся чистого света. Огни Стоянки делают для лагеря то же, что костры у дверей длинного дома.<\/li><\/ul><h3 id=\"iron1-81\">Сердце Клыка<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни<\/li><li><b>Когда:<\/b> Всегда. Мастер Кузни спускается к Сердцу Клыка раз в день.<\/li><li><b>Что нужно:<\/b> Когитаторные провода, ауспекс, треллы Сердца<\/li><li><b>Ход работы:<\/b> Мастер Кузни читает реакторы, проверяет охлаждение и слушает, ровно ли гудит Сердце. Рядом с ним всегда дежурят техно-треллы, которые не покидают глубины никогда.<\/li><li><b>Литания:<\/b> Литания Огня, затем Литания Железного Волка<\/li><li><b>Последствия:<\/b> Сердце Клыка — единственный огонь, который не гасят даже в Ночь Молотов. Говорят, его гул сливается с сердцем самого Спящего.<\/li><\/ul>","toc":[{"id":"iron1-1","title":"О чём этот свиток?","level":2},{"id":"iron1-2","title":"Инструменты жреца","level":3},{"id":"iron1-3","title":"Сырьё","level":3},{"id":"iron1-4","title":"Переработка","level":2},{"id":"iron1-5","title":"Заготовки","level":2},{"id":"iron1-6","title":"Каркасы и броня","level":3},{"id":"iron1-7","title":"Сила","level":3},{"id":"iron1-8","title":"Разум и чувства","level":3},{"id":"iron1-9","title":"Руки и инструменты","level":3},{"id":"iron1-10","title":"Оружейные части","level":3},{"id":"iron1-11","title":"Схемы сборки","level":2},{"id":"iron1-12","title":"Автоматоны","level":3},{"id":"iron1-13","title":"Оружие","level":3},{"id":"iron1-14","title":"Доспехи, бионика и прочее","level":3},{"id":"iron1-15","title":"Кузня","level":2},{"id":"iron1-16","title":"Выплавка из Жил","level":3},{"id":"iron1-17","title":"Ковка Клинка","level":3},{"id":"iron1-18","title":"Ковка Доспеха","level":3},{"id":"iron1-19","title":"Закалка Льдом","level":3},{"id":"iron1-20","title":"Нанесение Рун","level":3},{"id":"iron1-21","title":"Вручение","level":3},{"id":"iron1-22","title":"Силовое оружие","level":2},{"id":"iron1-23","title":"Сердце Поля","level":3},{"id":"iron1-24","title":"Силовой Клинок","level":3},{"id":"iron1-25","title":"Громовой Молот","level":3},{"id":"iron1-26","title":"Силовой Кулак и Когти","level":3},{"id":"iron1-27","title":"Пробуждение Поля","level":3},{"id":"iron1-28","title":"Ледяное оружие","level":2},{"id":"iron1-29","title":"Ледяной Клинок","level":3},{"id":"iron1-30","title":"Рунный Ледяной Клинок","level":3},{"id":"iron1-31","title":"Сердце Хельфроста","level":3},{"id":"iron1-32","title":"Хельфрост-болты","level":3},{"id":"iron1-33","title":"Уход за Ледяным Оружием","level":3},{"id":"iron1-34","title":"Машинные духи","level":2},{"id":"iron1-35","title":"Чтение Металла","level":3},{"id":"iron1-36","title":"Пробуждение Духа","level":3},{"id":"iron1-37","title":"Усмирение Буйного Духа","level":3},{"id":"iron1-38","title":"Новые Команды","level":3},{"id":"iron1-39","title":"Очищение Металла","level":3},{"id":"iron1-40","title":"Приручение Трофея","level":3},{"id":"iron1-41","title":"Полевая работа","level":2},{"id":"iron1-42","title":"Расклинивание","level":3},{"id":"iron1-43","title":"Латание Брони","level":3},{"id":"iron1-44","title":"Запечатывание","level":3},{"id":"iron1-45","title":"Вскрытие Доспеха","level":3},{"id":"iron1-46","title":"Подъём Машины","level":3},{"id":"iron1-47","title":"Последний Удар","level":3},{"id":"iron1-48","title":"Боевые машины и дредноуты","level":2},{"id":"iron1-49","title":"Уход за Машиной","level":3},{"id":"iron1-50","title":"Благословение Машины","level":3},{"id":"iron1-51","title":"Погребение в Железе","level":3},{"id":"iron1-52","title":"Долгий Сон","level":3},{"id":"iron1-53","title":"Пробуждение Древнего","level":3},{"id":"iron1-54","title":"Проводы Машины","level":3},{"id":"iron1-55","title":"Бионика, кибер-волки и связь","level":2},{"id":"iron1-56","title":"Ковка Бионики","level":3},{"id":"iron1-57","title":"Кибер-волк","level":3},{"id":"iron1-58","title":"Техно-ворон","level":3},{"id":"iron1-59","title":"Механодендрит","level":3},{"id":"iron1-60","title":"Наполнение Рога","level":3},{"id":"iron1-61","title":"Голос Стаи","level":3},{"id":"iron1-62","title":"Техно-треллы","level":2},{"id":"iron1-63","title":"Избрание Трелла","level":3},{"id":"iron1-64","title":"Стирание","level":3},{"id":"iron1-65","title":"Сборка Трелла","level":3},{"id":"iron1-66","title":"Наказ Треллу","level":3},{"id":"iron1-67","title":"Упокоение","level":3},{"id":"iron1-68","title":"Автоматоны","level":2},{"id":"iron1-69","title":"Виды автоматонов","level":3},{"id":"iron1-70","title":"Сборка Автоматона","level":3},{"id":"iron1-71","title":"Наказ Автоматону","level":3},{"id":"iron1-72","title":"Уход за Автоматоном","level":3},{"id":"iron1-73","title":"Упокоение Автоматона","level":3},{"id":"iron1-74","title":"Техническое оборудование","level":2},{"id":"iron1-75","title":"Виды оборудования","level":3},{"id":"iron1-76","title":"Установка Оборудования","level":3},{"id":"iron1-77","title":"Обход","level":3},{"id":"iron1-78","title":"Ремонт под Нагрузкой","level":3},{"id":"iron1-79","title":"Хранение Семени","level":3},{"id":"iron1-80","title":"Огни Стоянки","level":3},{"id":"iron1-81","title":"Сердце Клыка","level":3}]},{"id":"iron2","title":"Литании и Обряды Железных Жрецов","short":"Литании и обряды","rune":"ᛊ","html":"<h2 id=\"iron2-1\">О чём этот свиток?<\/h2><p>Железный Волк — покровитель всех Железных Жрецов, хранителей тайн металла и огня. Именно они, избранные духом гор, следят за каждым орудием, каждым доспехом и каждым механизмом Фенриса. Они знают: без благословения Железного Волка даже самый искусно выкованный клинок сломается в решающий миг, а надёжная броня даст трещину под первым ударом врага. Поэтому ниже представлены литании и обряды, которые помогут заручиться поддержкой и благословением Железного Волка в военном деле.<\/p><h2 id=\"iron2-2\">Железный Волк<\/h2><p>Колоссальный дух, спящий под Асахеймом. Горные хребты — это шкура на его спине, а залежи руды — его железные вены. Несмотря на свой сон, он наблюдает за всеми Жрецами, что работают с духами железа в его обителях.<\/p><p>Он учит своих последователей простым учениям:<\/p><ul><li><b>Сталь — продолжение Плоти.<\/b> Металл должен усиливать воина, а не заменять его.<\/li><li><b>Единство Ярости и Расчёта.<\/b> Гнев должен быть направлен, а холодный разум должен иметь стальную волю.<\/li><li><b>Ответственность.<\/b> Тот, кто даёт оружие или чинит доспех, в ответе за жизнь того, кто будет их использовать.<\/li><\/ul><h3 id=\"iron2-3\">Вера<\/h3><p>Железные Жрецы поклоняются лишь Железному Волку, хоть и верят в духов машин. Каждый механизм для них — малый дух, живущий в жилах Спящего. Омниссию Механикума они считают тем же Железным Волком, увиденным чужими глазами, но не славят её: славы достоин только сам Спящий.<\/p><p>На Марс Железные Жрецы не летают. Они учатся там, где спит их бог, — в Кузне под Клыком, в корнях Асахейма, и слушают железо, а не чужих магосов.<\/p><p><b>Ранги:<\/b> Ученик Горна → Кователь → Железный Жрец → Мастер Кузни.<\/p><h2 id=\"iron2-4\">Литании<\/h2><h3 id=\"iron2-5\">Литания Огня<\/h3><p><b>Когда читают:<\/b> При разжигании горна и выплавке металла, при пробуждении сердца поля, при очищении металла от порчи, у Сердца Клыка и при установке Огней Стоянки.<\/p><blockquote><p>Проснись, дикое сердце пламени.<\/p><p>Воспрянь ото сна.<\/p><p>Обрати своим огнём наши орудия.<\/p><p>Даруй нам свою ярость, а мы дадим тебе цель!<\/p><\/blockquote><h3 id=\"iron2-6\">Литания Ковки<\/h3><p><b>Когда читают:<\/b> При ковке клинков, доспехов, молотов, бионики, каркасов и заготовок. По строке на каждую серию ударов.<\/p><blockquote><p>Услышь мой молот, Дух Железного Волка.<\/p><p>Услышь звук моих ударов.<\/p><p>Пусть каждый удар будет клятвой, а каждый звон словом твоей саги.<\/p><p>Прими форму и будь остриём моей воли!<\/p><\/blockquote><h3 id=\"iron2-7\">Литания Закалки Металла<\/h3><p><b>Когда читают:<\/b> При закалке во льду, при создании ледяного оружия и Сердца Хельфроста.<\/p><blockquote><p>Встреть дыхание зимы, дитя огня и стали.<\/p><p>Окутай металл своей силой и храбростью.<\/p><p>Пусть твоё сердце останется пылающим, а зубы станут острее горного льда.<\/p><p>Закались и стань нерушимым.<\/p><\/blockquote><h3 id=\"iron2-8\">Литания Благословения Доспехов<\/h3><p><b>Когда читают:<\/b> При вручении доспеха воину, при латании брони в бою и после запечатывания пробоины.<\/p><blockquote><p>Стань второй шкурой для воина, Железный Дух.<\/p><p>Стань непробиваемым доспехом.<\/p><p>Стань скалой, о которую сломаются когти врага.<\/p><p>Защищай его плоть и будь спутником в его вьюрде.<\/p><\/blockquote><h3 id=\"iron2-9\">Литания Благословения Орудий<\/h3><p><b>Когда читают:<\/b> При вручении оружия, силового кулака или когтей.<\/p><blockquote><p>Стань продолжением руки для воина, Железный Дух.<\/p><p>Стань верным слугой и помощником в бою.<\/p><p>Стань воплощением духа воина.<\/p><p>Защищай его плоть и будь спутником в его вьюрде.<\/p><\/blockquote><h3 id=\"iron2-10\">Литания Железного Волка<\/h3><p><b>Когда читают:<\/b> При пробуждении машинного духа, автоматона, дредноута, кибер-волка, техно-ворона и трелла, при установке оборудования и при погребении воина в железе. Это главная литания Железных Жрецов.<\/p><blockquote><p>Слава Духу Железного Волка, что спит в сердце мира.<\/p><p>Пусть его ярость направляет наши руки.<\/p><p>Пусть его стальная воля укрепляет наши творения.<\/p><p>От огня к стали, от стали к победе.<\/p><\/blockquote><h3 id=\"iron2-11\">Литания Битвы<\/h3><p><b>Когда читают:<\/b> Перед боем, при благословении машин роты и боевых автоматонов.<\/p><blockquote><p>Железный Дух, стань нашим щитом и орудием.<\/p><p>Пусть враги падут от наших рук.<\/p><p>Благослови нас, Железный Волк, на битву.<\/p><p>И пусть наше снаряжение будет полезно в бою.<\/p><\/blockquote><h3 id=\"iron2-12\">Литания Рун<\/h3><p><b>Когда читают:<\/b> При нанесении рун на оружие и доспех.<\/p><blockquote><p>О Железный Дух, позволь нанести священные руны на снаряжение.<\/p><p>Пусть они станут его прозвищем.<\/p><p>Пусть они станут источником его силы.<\/p><p>Благослови эти руны и их владельца.<\/p><\/blockquote><h3 id=\"iron2-13\">Литания Сбора<\/h3><p><b>Когда читают:<\/b> При сборке доспехов, машин, трофеев, бионики, треллов, автоматонов, техно-воронов и оборудования.<\/p><blockquote><p>Сойдитесь, оси, в синхронной точности.<\/p><p>Пусть каждая часть механизма будет исправной.<\/p><p>Благослови, Железный Дух, этот механизм.<\/p><p>Да будет он цел и велик, как слава Железного Волка.<\/p><\/blockquote><h3 id=\"iron2-14\">Литания Диагностики<\/h3><p><b>Когда читают:<\/b> При чтении металла, на Обходе, при уходе за оружием, машинами и автоматонами. В бою читают только первую строку.<\/p><blockquote><p>Всмотрись в металл, Дух огня и стали.<\/p><p>Прочти изъяны, как строки саги.<\/p><p>Яви, где таится сила и слабость.<\/p><p>Да будет вердикт твой точен и свят.<\/p><\/blockquote><h3 id=\"iron2-15\">Литания Разбора<\/h3><p><b>Когда читают:<\/b> При разборе трофеев и сломанных механизмов, при Последнем Ударе, проводах машины, упокоении трелла и автоматона.<\/p><blockquote><p>Милостью Железного Волка.<\/p><p>Пусть все оси разойдутся.<\/p><p>Пусть все крепления будут сняты.<\/p><p>Да будет каждая деталь разобрана.<\/p><\/blockquote><h3 id=\"iron2-16\">Литания Программирования<\/h3><p><b>Когда читают:<\/b> При вводе новых команд, наказе треллу и автоматону, усмирении буйного духа, стирании трелла и настройке связи. Каждый наказ автоматону кончается Запретом Мыслящей Стали.<\/p><blockquote><p>Пусть все твои коды будут переписаны.<\/p><p>Пусть новые команды войдут в твою память.<\/p><p>Да благословит твой код Дух Железа.<\/p><p>И пусть твоя работа будет верной и точной.<\/p><\/blockquote><h2 id=\"iron2-17\">Древние слова<\/h2><p>Четыре главные литании Железные Жрецы читают вслух на древнем языке Фенриса: у горна, над машиной и перед боем. Перевод близок к литаниям выше, но не дословен.<\/p><p><b>Как читать древнескандинавский:<\/b><\/p><div class=\"tbl\"><table><thead><tr><th>Буква<\/th><th>Как читать<\/th><th>Пример<\/th><\/tr><\/thead><tbody><tr><td>þ<\/td><td>Глухое «с» с языком между зубами, как английское th в think<\/td><td>þú — «сы»<\/td><\/tr><tr><td>ð<\/td><td>Звонкое «з» с языком между зубами, как th в this<\/td><td>Smíðarljóð — «смизарльоуз»<\/td><\/tr><tr><td>á, é, í, ó, ú<\/td><td>Долгие гласные: звук тянется<\/td><td>Járnúlfr — «йаарн-уульвр»<\/td><\/tr><tr><td>æ<\/td><td>Широкое «э»<\/td><td>sæll — «сээлль»<\/td><\/tr><tr><td>ö<\/td><td>«Ё» без «й» в начале, как в слове «мёд»<\/td><td>högg — «хёгг»<\/td><\/tr><tr><td>y, ý<\/td><td>«Ю» без «й», губы трубочкой<\/td><td>stýri — «стюри»<\/td><\/tr><tr><td>r в конце слова<\/td><td>Отчётливое раскатистое «р»<\/td><td>eiðr — «эйзр»<\/td><\/tr><tr><td>f между гласными<\/td><td>«В»<\/td><td>gefum — «гевум»<\/td><\/tr><tr><td>hv<\/td><td>«Хв»<\/td><td>hvert — «хверт»<\/td><\/tr><\/tbody><\/table><\/div><p>Ударение всегда падает на первый слог.<\/p><h3 id=\"iron2-18\">Elds-ljóð — Литания Огня<\/h3><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Vakna þú, villt hjarta elds.<\/td><td>Проснись, дикое сердце пламени.<\/td><\/tr><tr><td>Rís þú ór svefni.<\/td><td>Воспрянь ото сна.<\/td><\/tr><tr><td>Herð þú vápn vár í eldi þínum.<\/td><td>Закали наши орудия своим огнём.<\/td><\/tr><tr><td>Gef oss reiði þína,<\/td><td>Даруй нам свою ярость,<\/td><\/tr><tr><td>en vér gefum þér mark!<\/td><td>а мы дадим тебе цель!<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron2-19\">Smíðarljóð — Литания Ковки<\/h3><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Heyr hamar minn, andi Járnúlfs.<\/td><td>Услышь мой молот, Дух Железного Волка.<\/td><\/tr><tr><td>Heyr högg mín.<\/td><td>Услышь мои удары.<\/td><\/tr><tr><td>Hvert högg sé eiðr,<\/td><td>Пусть каждый удар будет клятвой,<\/td><\/tr><tr><td>hverr hljómr orð í sögu þinni.<\/td><td>а каждый звон — словом твоей саги.<\/td><\/tr><tr><td>Tak mynd ok ver oddr vilja míns!<\/td><td>Прими форму и будь остриём моей воли!<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron2-20\">Járnúlfsljóð — Литания Железного Волка<\/h3><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Heill sé Járnúlfi,<\/td><td>Слава Железному Волку,<\/td><\/tr><tr><td>er sefr í hjarta heims.<\/td><td>что спит в сердце мира.<\/td><\/tr><tr><td>Reiði hans stýri höndum várum.<\/td><td>Пусть его ярость направляет наши руки.<\/td><\/tr><tr><td>Stálvili hans styrki smíðir várar.<\/td><td>Пусть его стальная воля укрепляет наши творения.<\/td><\/tr><tr><td>Frá eldi til stáls, frá stáli til sigrs.<\/td><td>От огня к стали, от стали к победе.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron2-21\">Bardagaljóð — Литания Битвы<\/h3><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Járnandi, ver oss skjöldr ok vápn.<\/td><td>Железный Дух, будь нам щитом и оружием.<\/td><\/tr><tr><td>Falli fjándr fyrir höndum várum.<\/td><td>Пусть враги падут от наших рук.<\/td><\/tr><tr><td>Gef oss sigr, Járnúlfr, í bardaga.<\/td><td>Даруй нам победу в битве, Железный Волк.<\/td><\/tr><tr><td>Ok bregðisk eigi vápn vár.<\/td><td>И пусть наше оружие не подведёт.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"iron2-22\">Обряды пути<\/h2><p>Обряды, которые делают из Волка Железного Жреца.<\/p><h3 id=\"iron2-23\">Испытание Железной Рукавицы<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни<\/li><li><b>Когда:<\/b> Волк, чаще всего родом из Железных Мастеров, просит допустить его к горну<\/li><li><b>Что нужно:<\/b> Руда, горн, молот, ночь<\/li><li><b>Ход обряда:<\/b> Кандидата оставляют одного в кузне с рудой и горном. За одну ночь он должен сам выплавить металл и выковать себе боевую рукавицу. На рассвете он надевает её, кладёт руку на наковальню, и Мастер Кузни бьёт по рукавице своим молотом. Если рукавица выдержала, кандидат принят. Если треснула, но кандидат не отдёрнул руку, его зовут снова через год. Если отдёрнул, к горну он больше не подойдёт.<\/li><li><b>Слова:<\/b> «Твоя рука держала оружие. Теперь пусть она его даёт.»<\/li><li><b>Смысл:<\/b> Первый урок Ответственности: жрец сам встаёт под удар, который должна выдержать его работа.<\/li><\/ul><h3 id=\"iron2-24\">Клятва Горна<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни<\/li><li><b>Когда:<\/b> Сразу после Испытания Железной Рукавицы<\/li><li><b>Что нужно:<\/b> Горн Кузни под Клыком<\/li><li><b>Ход обряда:<\/b> Новый Ученик держит открытую правую ладонь над огнём горна, пока произносит клятву, и не отводит её до последнего слова. Ожог на ладони остаётся на всю жизнь. Поэтому Железные Жрецы при встрече не кланяются, а показывают друг другу правую ладонь.<\/li><li><b>Слова:<\/b> «За каждый клинок, что я дам, я отвечу. За каждый доспех, что я починю, я отвечу. Если моя работа подведёт брата, пусть Спящий спросит с меня.»<\/li><li><b>Смысл:<\/b> Ответственность Железного Жреца записана у него на ладони.<\/li><\/ul><h3 id=\"iron2-25\">Посвящение в ранги<\/h3><ul><li><b>Проводит:<\/b> Жрец рангом выше посвящаемого, Мастера Кузни посвящают другие Мастера Кузни<\/li><li><b>Когда:<\/b> Когда наставник решит, что ученик готов<\/li><li><b>Что нужно:<\/b> Механодендриты, молот, руны Спящего<\/li><li><b>Ход обряда:<\/b><ol><li><b>Ученик Горна.<\/b> После Клятвы Горна Ученик получает кузнечный фартук из шкуры термального ящера и первые когитаторные провода. На его доспехе вырезают руну Железного Волка.<\/li><li><b>Кователь.<\/b> Ученик в одиночку куёт оружие для воина, и тот уходит с ним в бой. Если воин вернулся, а оружие выдержало, Ученику ставят первый механодендрит, голову которого куют по образу знакомого ему волка.<\/li><li><b>Железный Жрец.<\/b> Кователь должен разбудить машину, которую не смогли разбудить другие, а потом пройти Слушание Спящего. После этого он сам куёт себе громовой молот, ему ставят второй механодендрит и волкитное орудие.<\/li><li><b>Мастер Кузни.<\/b> Ранг даётся за великие дела по слову Мастеров Кузни и с согласия ярла. Посвящаемый впервые куёт ледяной клинок. Ему ставят третий механодендрит, вырезают руны Спящего на доспехе и дают место в Эйнхерьяре.<\/li><\/ol><\/li><li><b>Слова:<\/b> «Огонь принял тебя. Теперь прими его ношу.»<\/li><li><b>Смысл:<\/b> Каждый ранг жрец получает за работу, которая выдержала проверку боем, а не за годы у горна.<\/li><\/ul><h2 id=\"iron2-26\">Обряды кузни и горы<\/h2><p>Обряды, которыми Железные Жрецы просят у Спящего металл, слушают его и чтят огонь.<\/p><h3 id=\"iron2-27\">Благословение Руды<\/h3><ul><li><b>Проводит:<\/b> Железный Жрец<\/li><li><b>Когда:<\/b> Перед тем как открыть новую жилу или новую штольню<\/li><li><b>Что нужно:<\/b> Рог мьода, разрыв-трава, кирка<\/li><li><b>Ход обряда:<\/b> Жрец находит место, где гуще всего растёт железная трава. Он читает над ней молитву и только потом срывает пучок, ведь это шерсть Спящего. У входа в штольню кладут разрыв-траву, чтобы гора легче отдавала руду. Первый кусок руды жрец выбивает сам, руками, и выливает в трещину рог мьода как плату.<\/li><li><b>Слова:<\/b> «Мы не крадём у тебя, Спящий. Мы просим, и мы платим.»<\/li><li><b>Смысл:<\/b> Руда — это вены Железного Волка. Взять её без спроса значит ранить бога, и такая штольня рано или поздно обрушится.<\/li><\/ul><h3 id=\"iron2-28\">Слушание Спящего<\/h3><ul><li><b>Проводит:<\/b> Сам жрец, в одиночку<\/li><li><b>Когда:<\/b> Перед посвящением в Железные Жрецы, а потом всякий раз, когда жрец ищет ответа<\/li><li><b>Что нужно:<\/b> Самый глубокий зал под Клыком, тишина<\/li><li><b>Ход обряда:<\/b> Жрец спускается в глубины под Клыком, где камень тёплый на ощупь. Он гасит весь свет, отключает провода и механодендриты и ложится, прижав ухо к камню. Всю ночь он слушает гору. Раз в несколько часов камень гудит низко и долго: так бьётся сердце Спящего. Утром жрец рассказывает Мастеру Кузни, что услышал.<\/li><li><b>Слова:<\/b> Не говорятся. Говорит Спящий.<\/li><li><b>Смысл:<\/b> Большинство слышит только гул. Но некоторые возвращаются со словом, и Мастера Кузни считают такое слово вьюрдом жреца и держат его в тайне.<\/li><\/ul><h3 id=\"iron2-29\">Ночь Молотов<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни, участвуют все Железные Жрецы, Кователи и Ученики<\/li><li><b>Когда:<\/b> Раз в год, в первую ночь Поры Огня, когда Волчье Око приближается к Фенрису<\/li><li><b>Что нужно:<\/b> Уголь из жерла вулкана, мьод, все наковальни Клыка<\/li><li><b>Ход обряда:<\/b><ol><li>На сутки все горны Клыка гасят. Это единственный день в году, когда Кузня холодна.<\/li><li>В ночь Мастер Кузни приносит уголь из жерла вулкана и зажигает от него главный горн, а от главного зажигают все остальные.<\/li><li>Каждый жрец бьёт молотом по наковальне по разу за каждое оружие, которое он дал в этом году и которое вернулось с воином.<\/li><li>Затем каждый кладёт молот на наковальню беззвучно, по разу за каждое оружие, которое подвело.<\/li><li>После этого Кузня пирует до утра.<\/li><\/ol><\/li><li><b>Слова:<\/b> Литания Огня на древнем языке, хором<\/li><li><b>Смысл:<\/b> Перед лицом Спящего жрецы считают и свою славу, и свою вину. Беззвучные удары не обсуждают и над ними не смеются.<\/li><\/ul><h2 id=\"iron2-30\">Обряды суда и смерти<\/h2><p>Обряды, в которых Железные Жрецы отвечают за свою работу и провожают своих.<\/p><h3 id=\"iron2-31\">Суд Наковальни<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни. Если из-за подведшего оружия пал брат, присутствует Волчий жрец.<\/li><li><b>Когда:<\/b> Оружие, доспех или машина подвели в бою<\/li><li><b>Что нужно:<\/b> Подведшее оружие, наковальня, когитаторные провода<\/li><li><b>Ход обряда:<\/b> Оружие кладут на наковальню, а рядом встаёт жрец, который его ковал или чинил. Мастер Кузни читает металл и ищет причину. Причин может быть три:<ol><li>Металл встретил удар, которого не выдержал бы никакой металл. Вины нет.<\/li><li>Воин обращался с оружием не так, как его учили. Вина на воине.<\/li><li>В работе был изъян. Вина на жреце.<\/li><\/ol><\/li><\/ul><p>Виновный жрец перековывает оружие своими руками и снова держит правую ладонь над горном, повторяя Клятву Горна. Если из-за изъяна пал брат, жреца отдают на Суд Саг, а к горну он не подходит год.<\/p><ul><li><b>Слова:<\/b> «Металл не лжёт. Послушаем, что он скажет.»<\/li><li><b>Смысл:<\/b> Это Ответственность в действии. Жрецы не прячут своих ошибок, ведь спрятанная ошибка убьёт следующего брата.<\/li><\/ul><h3 id=\"iron2-32\">Проводы Железного Жреца<\/h3><ul><li><b>Проводит:<\/b> Мастер Кузни, Обряд Моркаи над телом проводит Волчий жрец<\/li><li><b>Когда:<\/b> Железный Жрец пал<\/li><li><b>Что нужно:<\/b> Погребальный костёр, угли из его горна, его молот<\/li><li><b>Ход обряда:<\/b><ol><li>Волчий жрец забирает генное семя павшего.<\/li><li>Мастер Кузни снимает с павшего механодендриты и отдаёт их лучшему из его учеников. Головы волков на них не перековывают.<\/li><li>Павшего кладут на костёр, а на грудь ему кладут его молот. Костёр разжигают углями из его собственного горна.<\/li><li>Его кибер-волк ложится у костра, и прогнать его не может никто.<\/li><li>Каждый Железный Жрец, кто стоит у костра, раз бьёт молотом по наковальне павшего. Потом его наковальня молчит год.<\/li><\/ol><\/li><li><b>Слова:<\/b> «Твой горн остыл. Твоя сталь ещё служит.»<\/li><li><b>Смысл:<\/b> Железный Жрец живёт дальше в каждом клинке, который он дал. Пока его оружие в руках братьев, о нём не говорят как о мёртвом.<\/li><\/ul>","toc":[{"id":"iron2-1","title":"О чём этот свиток?","level":2},{"id":"iron2-2","title":"Железный Волк","level":2},{"id":"iron2-3","title":"Вера","level":3},{"id":"iron2-4","title":"Литании","level":2},{"id":"iron2-5","title":"Литания Огня","level":3},{"id":"iron2-6","title":"Литания Ковки","level":3},{"id":"iron2-7","title":"Литания Закалки Металла","level":3},{"id":"iron2-8","title":"Литания Благословения Доспехов","level":3},{"id":"iron2-9","title":"Литания Благословения Орудий","level":3},{"id":"iron2-10","title":"Литания Железного Волка","level":3},{"id":"iron2-11","title":"Литания Битвы","level":3},{"id":"iron2-12","title":"Литания Рун","level":3},{"id":"iron2-13","title":"Литания Сбора","level":3},{"id":"iron2-14","title":"Литания Диагностики","level":3},{"id":"iron2-15","title":"Литания Разбора","level":3},{"id":"iron2-16","title":"Литания Программирования","level":3},{"id":"iron2-17","title":"Древние слова","level":2},{"id":"iron2-18","title":"Elds-ljóð — Литания Огня","level":3},{"id":"iron2-19","title":"Smíðarljóð — Литания Ковки","level":3},{"id":"iron2-20","title":"Járnúlfsljóð — Литания Железного Волка","level":3},{"id":"iron2-21","title":"Bardagaljóð — Литания Битвы","level":3},{"id":"iron2-22","title":"Обряды пути","level":2},{"id":"iron2-23","title":"Испытание Железной Рукавицы","level":3},{"id":"iron2-24","title":"Клятва Горна","level":3},{"id":"iron2-25","title":"Посвящение в ранги","level":3},{"id":"iron2-26","title":"Обряды кузни и горы","level":2},{"id":"iron2-27","title":"Благословение Руды","level":3},{"id":"iron2-28","title":"Слушание Спящего","level":3},{"id":"iron2-29","title":"Ночь Молотов","level":3},{"id":"iron2-30","title":"Обряды суда и смерти","level":2},{"id":"iron2-31","title":"Суд Наковальни","level":3},{"id":"iron2-32","title":"Проводы Железного Жреца","level":3}]},{"id":"iron3","title":"Снаряжение Железных Жрецов","short":"Снаряжение","rune":"ᛗ","html":"<h2 id=\"iron3-1\">О чём этот свиток?<\/h2><p>Железный Жрец уходит в бой не только воином, но и кузней на собственной спине. Его доспех полон инструментов, его ранец держит руки-волков, а рядом с ним идут звери из стали и треллы, готовые нести и чинить. Железные Жрецы не являются бойцами в полном смысле, и всё их снаряжение служит одному: чтобы сталь стаи не подвела в бою.<\/p><p>Здесь описано снаряжение Железных Жрецов. Список пополняется.<\/p><h2 id=\"iron3-2\">Устройство брони Железных Жрецов<\/h2><h3 id=\"iron3-3\">Когитаторные провода<\/h3><p>С ранца Железного Жреца свисает пачка проводов, которые он может подключить в порт любого когитатора или любого механизма. Так он просматривает внутренний код и в случае нужды программирует его с помощью инфопланшета или ауспекса на левой руке. Подключившись к любому экранному когитатору, жрец может просматривать и техническое состояние своего доспеха.<\/p><h3 id=\"iron3-4\">Механодендриты<\/h3><p>Бионические роботизированные руки, закреплённые на ранце доспеха. Жрец управляет ими напрямую через нервную систему, поэтому их движения всегда точны и аккуратны, но пользоваться ими всё равно нужно уметь. У Железных Жрецов VI легиона механодендриты, как правило, сделаны в виде волчьих голов, но бывают и исключения. Голову каждого механодендрита куют по образу волка, которого жрец знал.<\/p><h3 id=\"iron3-5\">Система подачи мьода<\/h3><p>Наверное, одна из лучших систем в доспехе Железного Жреца. По голосовой команде или по нажатию кнопки на ауспексе броня вводит мьод носителю прямо в вену. Продолжать работу после этого не советуется, но мастерство и навыки Жрецов преодолевают все связанные с этим риски. Следит за системой и наполняет её Ученик Горна.<\/p><h3 id=\"iron3-6\">Ауспекс и инфопланшет<\/h3><p>Закреплены на левой руке жреца. Ауспекс видит сквозь броню и камень, находит трещины в металле, сбои в коде и живое тепло за стеной. Инфопланшет служит для чтения и переписывания кода машин.<\/p><h3 id=\"iron3-7\">Усиленный ранец<\/h3><p>Ранец Железного Жреца мощнее обычного. Он питает механодендриты, резак, когитаторные провода и волкитное орудие одновременно, а в крайнем случае может отдать заряд обездвиженной машине или доспеху брата.<\/p><h3 id=\"iron3-8\">Кузнечный фартук<\/h3><p>Фартук из шкуры термального ящера поверх брони. Он не горит и не пропускает жар, поэтому жрец может работать у горна и под огнём в доспехе. Фартук жрец получает при посвящении в Ученики Горна и носит всю жизнь.<\/p><h3 id=\"iron3-9\">Руны и окалина<\/h3><p>Доспех Железного Жреца покрыт следами ковки и окалины, которые никогда не счищают. На нём вырезаны руны Железного Волка, а у Мастеров Кузни — руны Спящего, знак их сана. Правая латная перчатка всегда снимается легко, чтобы жрец мог показать при встрече обожжённую ладонь.<\/p><h2 id=\"iron3-10\">Оружие<\/h2><h3 id=\"iron3-11\">Громовой молот<\/h3><p>Главное оружие и главный знак Железного Жреца. Молот он куёт себе сам при посвящении в Железные Жрецы, и им же работает у наковальни. В голове молота стоит сердце поля, которое копит силу и выпускает её всю в миг удара. Удар звучит как раскат грома и разносит броню, кости и стены. Молот жреца никогда не переходит к другому: после смерти хозяина его кладут ему на грудь на погребальном костре.<\/p><h3 id=\"iron3-12\">Топор-молот<\/h3><p>Древковое оружие длиннее, чем Астартес ростом, — у Волков его зовут Смидёкс, «кузнечная секира». На вершине древка с одной стороны стоит широкое лезвие топора, а с другой — тяжёлый боёк молота. Навершие кончается шипом, а нижний конец древка окован железом, чтобы им можно было упереться в землю или ударить назад.<\/p><p>Древко куют из металла жил, полым внутри: в нём идут силовые кабели от ранца к сердцу поля в голове оружия. Поле окутывает и лезвие, и боёк, поэтому топором жрец рассекает броню, а молотом дробит её. Длина даёт ему достать врага раньше, чем тот подойдёт к брату, которого жрец чинит.<\/p><p>Вне боя Смидёкс служит жрецу рычагом, чтобы поддеть смятую броню машины, и посохом на обрядах. Носят его Железные Жрецы и Мастера Кузни, чаще всего вместе с громовым молотом: Смидёкс в руках, молот на поясе. Его куют на заказ под рост и руку хозяина, и после смерти жреца он, как и молот, уходит на костёр вместе с ним.<\/p><h3 id=\"iron3-13\">Волкитное орудие<\/h3><p>У Железных Жрецов чаще всего идёт в комплекте с волчьими механодендритами. Управление и наводка тоже происходят напрямую через нервную систему носителя. Железные Жрецы не являются бойцами в полном смысле, но им всё равно нужно дальнобойное орудие, чтобы защитить себя или боевого брата на поле боя, где навредить может любая мелочь. Волкитное орудие жрец получает вместе со вторым механодендритом.<\/p><h3 id=\"iron3-14\">Хельфрост-пистолет<\/h3><p>Личное оружие многих Железных Жрецов. В рукояти стоит Сердце Хельфроста: криогенная камера с охладителем из слизи полярного болотожора и холодом ледоцвета. Пистолет бьёт сфокусированным лучом холода или широким потоком. Плоть от него чернеет от обморожения, броня трескается, а цель вмерзает в лёд холоднее пустоты. Перед каждым боем жрец проверяет камеру на трещины: если она лопнет, холод уйдёт в того, кто держит пистолет.<\/p><h3 id=\"iron3-15\">Резак в бою<\/h3><p>Плазменный резак — инструмент, но в упор он прожигает броню не хуже мельты. Жрецы не любят тратить на врага заряд, нужный для починки, поэтому берутся за резак только тогда, когда молот уже не достать.<\/p><h2 id=\"iron3-16\">Инструменты<\/h2><h3 id=\"iron3-17\">Плазменный резак<\/h3><p>Закреплён на одном из механодендритов или на поясе. Им варят и режут броню, латают пробоины, вскрывают смятые доспехи раненых и прожигают двери. Пламя резака настраивается от тонкой иглы для сварки швов до широкого языка для резки брони машин.<\/p><h3 id=\"iron3-18\">Нейроглушитель<\/h3><p>Отключает сознание через нервный порт. Нужен при Стирании, когда из слуги легиона делают техно-трелла, и для того, чтобы утихомирить трелла, в котором проснулся обрывок прежнего человека.<\/p><h3 id=\"iron3-19\">Резец и яд<\/h3><p>Костяной резец для рун и флакон с ядом виверны, которым руны вытравливают в металле. Резец Железный Жрец режет сам из кости зверя, убитого в первом его бою.<\/p><h3 id=\"iron3-20\">Сумка мастера<\/h3><p>Всё, что нужно для починки в поле:<\/p><ul><li>запасные пластины и скобы;<\/li><li>герметик и горшочек смолы смоляной ели;<\/li><li>запасные зубы кракена для ледяных клинков стаи;<\/li><li>силовые кабели и запасные узлы;<\/li><li>рог мьода, чтобы заплатить Спящему, если придётся брать руду на чужой земле.<\/li><\/ul><h3 id=\"iron3-21\">Походная кузня<\/h3><p>Горн, наковальня и меха, которые стоят на корабле роты и разбираются для высадки. Горн держат на прометии, а разжигают огненным мхом с Фенриса, который всегда есть в запасе. Походная кузня не заменит Кузню под Клыком, но выковать клинок, закалить пластину и заменить сердце поля в ней можно.<\/p><h2 id=\"iron3-22\">Спутники<\/h2><h3 id=\"iron3-23\">Кибер-волки<\/h3><p>Фенрисийские волки, которых жрец собрал заново после тяжёлых ран: со стальными лапами, челюстями, рёбрами или глазами. Кибер-волк привязан к жрецу, который его собрал, слушается его и охраняет его, пока тот работает под огнём. Когда жрец умирает, волк ложится у его погребального костра, и прогнать его не может никто.<\/p><h3 id=\"iron3-24\">Техно-вороны<\/h3><p>Вороны, живущие при кузне, которым жрец заменил когти и клюв сталью, вставил в глазницу око, а под перья спрятал вокс-узел. Техно-ворон сидит на голове механодендрита, а в бою летает над полем и шлёт жрецу всё, что видит. Как всякий ворон, он годами помнит обидчиков своего жреца.<\/p><h3 id=\"iron3-25\">Летучий Череп<\/h3><p>Автоматон из черепа фенрисийского волка, павшего своей смертью. Он парит у плеча жреца на антиграве, светит фонарём из светляка, читает металл ауспексом и подаёт мелкий инструмент маленькими манипуляторами. Летучий Череп жрецы делают с ранга Кователя.<\/p><h3 id=\"iron3-26\">Боевые автоматоны<\/h3><p>Железный Кабан — бронированный автоматон в виде вепря с двумя парами клыков-таранов. Он таранит строй и ворота, а в походе тащит грузы и орудия туда, где не пройдёт машина. Его водят Железные Жрецы.<\/p><p>Кастелакс — тяжёлый боевой автоматон по образцу Механикума, с болт-пушкой и силовыми клинками в кулаках, весь в рунах и волчьих шкурах. В бой он выходит только рядом с Мастером Кузни, ведь без жреца его дух легко дичает.<\/p><p>Все автоматоны подчиняются Запрету Мыслящей Стали: они слушают, но не думают.<\/p><h3 id=\"iron3-27\">Треллы свиты<\/h3><p>У каждого Железного Жреца десятки техно-треллов, и самые нужные идут за ним в поход:<\/p><ul><li><b>носильщики<\/b> тащат сумку мастера, запасные пластины и снаряды;<\/li><li><b>горновые<\/b> держат походную кузню;<\/li><li><b>орудийные<\/b> охраняют жреца, пока он чинит машину под огнём.<\/li><\/ul><p>Треллы свиты носят на себе руну своего жреца, чтобы стая знала, чьи они.<\/p><h2 id=\"iron3-28\">Знаки ранга<\/h2><div class=\"tbl\"><table><thead><tr><th>Ранг<\/th><th>Механодендриты<\/th><th>Оружие<\/th><th>Спутники<\/th><th>Прочие знаки<\/th><\/tr><\/thead><tbody><tr><td>Ученик Горна<\/td><td>Нет<\/td><td>Оружие воина стаи<\/td><td>Нет<\/td><td>Кузнечный фартук, когитаторные провода, ауспекс, руна Железного Волка, обожжённая ладонь<\/td><\/tr><tr><td>Кователь<\/td><td>Один<\/td><td>Оружие воина стаи<\/td><td>Летучий Череп<\/td><td>Резец и яд, сумка мастера<\/td><\/tr><tr><td>Железный Жрец<\/td><td>Два<\/td><td>Громовой молот, волкитное орудие, часто хельфрост-пистолет и Смидёкс<\/td><td>Свита техно-треллов, часто кибер-волк или техно-ворон, Железный Кабан<\/td><td>Походная кузня<\/td><\/tr><tr><td>Мастер Кузни<\/td><td>Три<\/td><td>Громовой молот, Смидёкс, волкитное орудие<\/td><td>Всё, что у Железного Жреца, и Кастелакс<\/td><td>Руны Спящего на доспехе, место в Эйнхерьяре<\/td><\/tr><\/tbody><\/table><\/div>","toc":[{"id":"iron3-1","title":"О чём этот свиток?","level":2},{"id":"iron3-2","title":"Устройство брони Железных Жрецов","level":2},{"id":"iron3-3","title":"Когитаторные провода","level":3},{"id":"iron3-4","title":"Механодендриты","level":3},{"id":"iron3-5","title":"Система подачи мьода","level":3},{"id":"iron3-6","title":"Ауспекс и инфопланшет","level":3},{"id":"iron3-7","title":"Усиленный ранец","level":3},{"id":"iron3-8","title":"Кузнечный фартук","level":3},{"id":"iron3-9","title":"Руны и окалина","level":3},{"id":"iron3-10","title":"Оружие","level":2},{"id":"iron3-11","title":"Громовой молот","level":3},{"id":"iron3-12","title":"Топор-молот","level":3},{"id":"iron3-13","title":"Волкитное орудие","level":3},{"id":"iron3-14","title":"Хельфрост-пистолет","level":3},{"id":"iron3-15","title":"Резак в бою","level":3},{"id":"iron3-16","title":"Инструменты","level":2},{"id":"iron3-17","title":"Плазменный резак","level":3},{"id":"iron3-18","title":"Нейроглушитель","level":3},{"id":"iron3-19","title":"Резец и яд","level":3},{"id":"iron3-20","title":"Сумка мастера","level":3},{"id":"iron3-21","title":"Походная кузня","level":3},{"id":"iron3-22","title":"Спутники","level":2},{"id":"iron3-23","title":"Кибер-волки","level":3},{"id":"iron3-24","title":"Техно-вороны","level":3},{"id":"iron3-25","title":"Летучий Череп","level":3},{"id":"iron3-26","title":"Боевые автоматоны","level":3},{"id":"iron3-27","title":"Треллы свиты","level":3},{"id":"iron3-28","title":"Знаки ранга","level":2}]},{"id":"iron4","title":"Песни и Саги Железных Жрецов","short":"Песни и саги","rune":"ᚨ","html":"<h2 id=\"iron4-1\">О чём этот свиток?<\/h2><p>Волчьи жрецы поют о павших, а Железные — о работе. Их песни рождаются у наковальни, и ритм у них тот же, что у молота. Поют их на древнем языке Фенриса, ведь на нём говорит со своими детьми Спящий. Саги Железных Жрецов почти всегда рассказывают о цене: о клинке, который подвёл, о руке, которую пришлось отдать, о слове, которое жрец дал над горном.<\/p><p>Здесь собраны песни и саги Железных Жрецов. Список пополняется.<\/p><p><b>Как читать древнескандинавский:<\/b><\/p><div class=\"tbl\"><table><thead><tr><th>Буква<\/th><th>Как читать<\/th><th>Пример<\/th><\/tr><\/thead><tbody><tr><td>þ<\/td><td>Глухое «с» с языком между зубами, как английское th в think<\/td><td>þú — «сы»<\/td><\/tr><tr><td>ð<\/td><td>Звонкое «з» с языком между зубами, как th в this<\/td><td>bróður — «броузур»<\/td><\/tr><tr><td>á, é, í, ó, ú<\/td><td>Долгие гласные: звук тянется<\/td><td>Járnúlfr — «йаарн-уульвр»<\/td><\/tr><tr><td>æ<\/td><td>Широкое «э»<\/td><td>bæti — «бээти»<\/td><\/tr><tr><td>ö<\/td><td>«Ё» без «й» в начале, как в слове «мёд»<\/td><td>högg — «хёгг»<\/td><\/tr><tr><td>y, ý<\/td><td>«Ю» без «й», губы трубочкой<\/td><td>spyrji — «спюрьи»<\/td><\/tr><tr><td>r в конце слова<\/td><td>Отчётливое раскатистое «р»<\/td><td>eldr — «эльдр»<\/td><\/tr><tr><td>f между гласными<\/td><td>«В»<\/td><td>gefum — «гевум»<\/td><\/tr><tr><td>hv<\/td><td>«Хв»<\/td><td>hvert — «хверт»<\/td><\/tr><\/tbody><\/table><\/div><p>Ударение всегда падает на первый слог.<\/p><h2 id=\"iron4-2\">Песни<\/h2><h3 id=\"iron4-3\">Hamarsöngr — Песнь Молота<\/h3><p><b>Когда поют:<\/b> У наковальни, за работой. Каждая строка — серия ударов, и Ученики учатся ковать под неё.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Högg ok högg,<\/td><td>Удар и удар,<\/td><\/tr><tr><td>eldr ok járn,<\/td><td>огонь и железо,<\/td><\/tr><tr><td>hvert högg eiðr,<\/td><td>каждый удар — клятва,<\/td><\/tr><tr><td>hverr neisti saga.<\/td><td>каждая искра — сага.<\/td><\/tr><tr><td>Slá þú, hamarr,<\/td><td>Бей, молот,<\/td><\/tr><tr><td>Sofandi heyrir.<\/td><td>Спящий слышит.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron4-4\">Aflseiðr — Клятва Горна<\/h3><p><b>Когда поют:<\/b> В обряде Клятвы Горна. Ученик поёт её, держа правую ладонь над огнём, и не отводит руку до последнего слова.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Fyrir hvert sverð, er ek gef,<\/td><td>За каждый меч, что я дам,<\/td><\/tr><tr><td>svara ek.<\/td><td>я отвечу.<\/td><\/tr><tr><td>Fyrir hverja brynju, er ek bæti,<\/td><td>За каждый доспех, что я починю,<\/td><\/tr><tr><td>svara ek.<\/td><td>я отвечу.<\/td><\/tr><tr><td>Bregðisk verk mitt bróður,<\/td><td>Если моя работа подведёт брата,<\/td><\/tr><tr><td>spyrji Sofandi mik.<\/td><td>пусть Спящий спросит с меня.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron4-5\">Svefnljóð Járnúlfs — Колыбельная Спящего<\/h3><p><b>Когда поют:<\/b> Когда жрецы спускаются в глубины под Клыком: перед Слушанием Спящего и перед тем, как открыть новую штольню.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Sof þú, Járnúlfr, undir fjöllum.<\/td><td>Спи, Железный Волк, под горами.<\/td><\/tr><tr><td>Fjöll eru feldr þinn,<\/td><td>Горы — твоя шкура,<\/td><\/tr><tr><td>málmr er blóð þitt.<\/td><td>руда — твоя кровь.<\/td><\/tr><tr><td>Vér tökum lítt ok gjöldum.<\/td><td>Мы берём мало и платим.<\/td><\/tr><tr><td>Vakna eigi, fyrr en þörf er.<\/td><td>Не просыпайся, пока нет нужды.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron4-6\">Vakningarljóð — Песнь Пробуждения Духа<\/h3><p><b>Когда поют:<\/b> При Пробуждении Духа, между тремя ударами молота по корпусу машины.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Vakna þú, andi í járni,<\/td><td>Проснись, дух в железе,<\/td><\/tr><tr><td>heyr hamar minn þrisvar.<\/td><td>услышь мой молот трижды.<\/td><\/tr><tr><td>Ek gaf þér líf,<\/td><td>Я дал тебе жизнь,<\/td><\/tr><tr><td>gef þú bræðrum mínum sigr.<\/td><td>дай моим братьям победу.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron4-7\">Steðjaljóð — Песнь Наковальни<\/h3><p><b>Когда поют:<\/b> В Ночь Молотов. Первые три строки поют над каждым оружием, которое вернулось с воином, и бьют по наковальне. Последнюю строку шепчут над тем, что подвело, и кладут молот беззвучно.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Aptr kom öxin,<\/td><td>Вернулся топор,<\/td><\/tr><tr><td>aptr kom maðrinn.<\/td><td>вернулся воин.<\/td><\/tr><tr><td>Eitt högg fyrir hvárt.<\/td><td>По удару за каждого.<\/td><\/tr><tr><td><i>Шёпотом:<\/i> Ekki kom aptr.<\/td><td><i>Шёпотом:<\/i> Не вернулся.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"iron4-8\">Bálfararljóð smiðs — Проводы Кузнеца<\/h3><p><b>Когда поют:<\/b> На Проводах Железного Жреца, пока каждый жрец бьёт молотом по наковальне павшего.<\/p><div class=\"tbl\"><table><thead><tr><th>Древнескандинавский<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td>Kaldr er afl þinn,<\/td><td>Остыл твой горн,<\/td><\/tr><tr><td>heitt er stál þitt.<\/td><td>горяча твоя сталь.<\/td><\/tr><tr><td>Í hverju sverði<\/td><td>В каждом мече<\/td><\/tr><tr><td>lifir þú enn.<\/td><td>ты живёшь до сих пор.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"iron4-9\">Саги<\/h2><h3 id=\"iron4-10\">Saga hins fyrsta afls — Сага о Первом Горне<\/h3><p>Когда Всеотец дал воинам Русса доспехи со звёзд, первая же зима Фенриса оказалась им не по зубам. Сочленения схватывал лёд, уплотнения трескались, а воины застывали посреди боя, как статуи. Чужие мастера, прилетевшие со Всеотцом, сказали, что починить броню можно лишь на их красной планете, далеко за звёздами.<\/p><p>Тогда к Руссу пришёл Торбьёрн Глухой из Железных Мастеров. Глухим его прозвали за то, что в кузне он никого не слышал, кроме металла. Он попросил ночь и спустился в самые глубины под Клыком, туда, где камень тёплый. Там он лёг, прижав ухо к скале, и пролежал до утра.<\/p><p>Вернувшись, он ничего не стал объяснять. Он разобрал доспех, закалил новые сочленения во льду ледника, пролил швы смолой смоляной ели и собрал всё снова. Доспех, сделанный Торбьёрном, не замёрз ни в ту зиму, ни в одну из следующих.<\/p><p>Русс спросил, где он этому научился. Торбьёрн ответил: «Гора рассказала». Чужие мастера звали его с собой на красную планету учиться их тайнам. Торбьёрн отказался: «Зачем мне чужое небо, если со мной говорит собственная гора?»<\/p><p>С тех пор Железные Жрецы не летают учиться к чужим мастерам, а перед посвящением спускаются под Клык и слушают Спящего.<\/p><h3 id=\"iron4-11\">Saga hljóðs höggs — Сага о Беззвучном Ударе<\/h3><p>Железный Жрец Хальвард выковал топор для молодого Кровавого Когтя по имени Улль. В первом же бою топорище треснуло, и Улль пал. На Суде Наковальни Мастер Кузни прочёл металл, и вина оказалась на Хальварде: в металле был пузырь, которого он не заметил.<\/p><p>Хальвард не стал спорить. Он снова держал ладонь над горном, пока не прочёл всю Клятву, а потом год не подходил к наковальне. Когда год кончился, он выковал новый топор и поклялся не отдавать его никому, пока не найдёт воина, достойного носить его вместо Улля.<\/p><p>Каждую Ночь Молотов Хальвард клал молот на наковальню беззвучно, за топор Улля. Так прошло много зим. Однажды к нему пришёл аспирант, который только что вернулся из Испытания Моркаи, и сказал, что он из того же рода, что и Улль. Хальвард отдал ему топор.<\/p><p>В следующую Ночь Молотов топор вернулся вместе с воином. В ту ночь Хальвард впервые за много лет ударил по наковальне громко, и вся Кузня встала и ударила вместе с ним.<\/p><h3 id=\"iron4-12\">Saga ísblaðs jarls — Сага о Ледяном Клинке Ярла<\/h3><p>Один ярл пришёл к Мастеру Кузни за ледяным клинком и принёс мешок зубов кракена, купленных у островитян. Мастер Кузни высыпал зубы на пол и сказал: «Этим кракенам ты ничего не должен. Клинок из них тебя не узнает».<\/p><p>Ярл разозлился, но вышел в море сам. Он вернулся через месяц на разбитом драккаре, с зубами кракена в сумке и без левой руки, которую кракен забрал в уплату.<\/p><p>Мастер Кузни выковал ему ледяной топор из этих зубов. Потом он снял мерку с правой руки ярла и выковал ему левую из стали, ровно такую же: не сильнее и не легче той, что была. Ярл спросил, почему не сделать руку сильнее, раз уж её всё равно куют. Мастер ответил: «Сталь — продолжение плоти. Я верну тебе твою руку, а не дам чужую».<\/p><p>Говорят, ярл носил тот топор до самой смерти. А в Кузне с тех пор не принимают купленных зубов.<\/p><h3 id=\"iron4-13\">Saga þræls er söng — Сага о Трелле, что Пел<\/h3><p>Старого кэрла Гуннстейна сделали треллом, когда раны больше не позволили ему служить. Много лет он носил руду в Кузне, не говоря ни слова. Однажды Ученик Горна услышал, что трелл напевает. Это была сага о битве, которую рота проиграла задолго до рождения Ученика.<\/p><p>По обычаю такого трелла сразу отправляют на Упокоение. Но Железный Жрец Асгейр, хозяин трелла, сначала велел дать ему допеть. В саге была строка о дредноуте, который пал в той битве и остался во льдах. Где он пал, не знал никто из живых.<\/p><p>Асгейр записал сагу до последнего слова, и рота пошла туда, куда указала песня. Во льдах нашли дредноут, и в нём ещё теплилась жизнь. Героя разбудили, и он назвал своё имя.<\/p><p>Гуннстейна упокоили со всеми почестями. На Тризне его имя назвали первым, а Асгейр сам вырезал его бирку заново. С тех пор жрецы, прежде чем упокоить запевшего трелла, дают ему допеть.<\/p>","toc":[{"id":"iron4-1","title":"О чём этот свиток?","level":2},{"id":"iron4-2","title":"Песни","level":2},{"id":"iron4-3","title":"Hamarsöngr — Песнь Молота","level":3},{"id":"iron4-4","title":"Aflseiðr — Клятва Горна","level":3},{"id":"iron4-5","title":"Svefnljóð Járnúlfs — Колыбельная Спящего","level":3},{"id":"iron4-6","title":"Vakningarljóð — Песнь Пробуждения Духа","level":3},{"id":"iron4-7","title":"Steðjaljóð — Песнь Наковальни","level":3},{"id":"iron4-8","title":"Bálfararljóð smiðs — Проводы Кузнеца","level":3},{"id":"iron4-9","title":"Саги","level":2},{"id":"iron4-10","title":"Saga hins fyrsta afls — Сага о Первом Горне","level":3},{"id":"iron4-11","title":"Saga hljóðs höggs — Сага о Беззвучном Ударе","level":3},{"id":"iron4-12","title":"Saga ísblaðs jarls — Сага о Ледяном Клинке Ярла","level":3},{"id":"iron4-13","title":"Saga þræls er söng — Сага о Трелле, что Пел","level":3}]}],"litanies":[{"title":"Литания Огня","when":"При разжигании горна и выплавке металла, при пробуждении сердца поля, при очищении металла от порчи, у Сердца Клыка и при установке Огней Стоянки.","lines":["Проснись, дикое сердце пламени.","Воспрянь ото сна.","Обрати своим огнём наши орудия.","Даруй нам свою ярость, а мы дадим тебе цель!"]},{"title":"Литания Ковки","when":"При ковке клинков, доспехов, молотов, бионики, каркасов и заготовок. По строке на каждую серию ударов.","lines":["Услышь мой молот, Дух Железного Волка.","Услышь звук моих ударов.","Пусть каждый удар будет клятвой, а каждый звон словом твоей саги.","Прими форму и будь остриём моей воли!"]},{"title":"Литания Закалки Металла","when":"При закалке во льду, при создании ледяного оружия и Сердца Хельфроста.","lines":["Встреть дыхание зимы, дитя огня и стали.","Окутай металл своей силой и храбростью.","Пусть твоё сердце останется пылающим, а зубы станут острее горного льда.","Закались и стань нерушимым."]},{"title":"Литания Благословения Доспехов","when":"При вручении доспеха воину, при латании брони в бою и после запечатывания пробоины.","lines":["Стань второй шкурой для воина, Железный Дух.","Стань непробиваемым доспехом.","Стань скалой, о которую сломаются когти врага.","Защищай его плоть и будь спутником в его вьюрде."]},{"title":"Литания Благословения Орудий","when":"При вручении оружия, силового кулака или когтей.","lines":["Стань продолжением руки для воина, Железный Дух.","Стань верным слугой и помощником в бою.","Стань воплощением духа воина.","Защищай его плоть и будь спутником в его вьюрде."]},{"title":"Литания Железного Волка","when":"При пробуждении машинного духа, автоматона, дредноута, кибер-волка, техно-ворона и трелла, при установке оборудования и при погребении воина в железе. Это главная литания Железных Жрецов.","lines":["Слава Духу Железного Волка, что спит в сердце мира.","Пусть его ярость направляет наши руки.","Пусть его стальная воля укрепляет наши творения.","От огня к стали, от стали к победе."]},{"title":"Литания Битвы","when":"Перед боем, при благословении машин роты и боевых автоматонов.","lines":["Железный Дух, стань нашим щитом и орудием.","Пусть враги падут от наших рук.","Благослови нас, Железный Волк, на битву.","И пусть наше снаряжение будет полезно в бою."]},{"title":"Литания Рун","when":"При нанесении рун на оружие и доспех.","lines":["О Железный Дух, позволь нанести священные руны на снаряжение.","Пусть они станут его прозвищем.","Пусть они станут источником его силы.","Благослови эти руны и их владельца."]},{"title":"Литания Сбора","when":"При сборке доспехов, машин, трофеев, бионики, треллов, автоматонов, техно-воронов и оборудования.","lines":["Сойдитесь, оси, в синхронной точности.","Пусть каждая часть механизма будет исправной.","Благослови, Железный Дух, этот механизм.","Да будет он цел и велик, как слава Железного Волка."]},{"title":"Литания Диагностики","when":"При чтении металла, на Обходе, при уходе за оружием, машинами и автоматонами. В бою читают только первую строку.","lines":["Всмотрись в металл, Дух огня и стали.","Прочти изъяны, как строки саги.","Яви, где таится сила и слабость.","Да будет вердикт твой точен и свят."]},{"title":"Литания Разбора","when":"При разборе трофеев и сломанных механизмов, при Последнем Ударе, проводах машины, упокоении трелла и автоматона.","lines":["Милостью Железного Волка.","Пусть все оси разойдутся.","Пусть все крепления будут сняты.","Да будет каждая деталь разобрана."]},{"title":"Литания Программирования","when":"При вводе новых команд, наказе треллу и автоматону, усмирении буйного духа, стирании трелла и настройке связи. Каждый наказ автоматону кончается Запретом Мыслящей Стали.","lines":["Пусть все твои коды будут переписаны.","Пусть новые команды войдут в твою память.","Да благословит твой код Дух Железа.","И пусть твоя работа будет верной и точной."]}],"ancient":[{"orig":"Литания Огня\n\n**Когда читают:** При разжигании горна и выплавке металла, при пробуждении сердца поля, при очищении металла от порчи, у Сердца Клыка и при установке Огней Стоянки.\n\n> Проснись, дикое сердце пламени.\n>\n> Воспрянь ото сна.\n>\n> Обрати своим огнём наши орудия.\n>\n> Даруй нам свою ярость, а мы дадим тебе цель!\n\n### Литания Ковки\n\n**Когда читают:** При ковке клинков, доспехов, молотов, бионики, каркасов и заготовок. По строке на каждую серию ударов.\n\n> Услышь мой молот, Дух Железного Волка.\n>\n> Услышь звук моих ударов.\n>\n> Пусть каждый удар будет клятвой, а каждый звон словом твоей саги.\n>\n> Прими форму и будь остриём моей воли!\n\n### Литания Закалки Металла\n\n**Когда читают:** При закалке во льду, при создании ледяного оружия и Сердца Хельфроста.\n\n> Встреть дыхание зимы, дитя огня и стали.\n>\n> Окутай металл своей силой и храбростью.\n>\n> Пусть твоё сердце останется пылающим, а зубы станут острее горного льда.\n>\n> Закались и стань нерушимым.\n\n### Литания Благословения Доспехов\n\n**Когда читают:** При вручении доспеха в
