оину, при латании брони в бою и после запечатывания пробоины.\n\n> Стань второй шкурой для воина, Железный Дух.\n>\n> Стань непробиваемым доспехом.\n>\n> Стань скалой, о которую сломаются когти врага.\n>\n> Защищай его плоть и будь спутником в его вьюрде.\n\n### Литания Благословения Орудий\n\n**Когда читают:** При вручении оружия, силового кулака или когтей.\n\n> Стань продолжением руки для воина, Железный Дух.\n>\n> Стань верным слугой и помощником в бою.\n>\n> Стань воплощением духа воина.\n>\n> Защищай его плоть и будь спутником в его вьюрде.\n\n### Литания Железного Волка\n\n**Когда читают:** При пробуждении машинного духа, автоматона, дредноута, кибер-волка, техно-ворона и трелла, при установке оборудования и при погребении воина в железе. Это главная литания Железных Жрецов.\n\n> Слава Духу Железного Волка, что спит в сердце мира.\n>\n> Пусть его ярость направляет наши руки.\n>\n> Пусть его стальная воля укрепляет наши творения.\n>\n> От огня к стали, от стали к победе.\n\n### Литания Битвы\n\n**Когда читают:** Перед боем, при благословении машин роты и боевых автоматонов.\n\n> Железный Дух, стань нашим щитом и орудием.\n>\n> Пусть враги падут от наших рук.\n>\n> Благослови нас, Железный Волк, на битву.\n>\n> И пусть наше снаряжение будет полезно в бою.\n\n### Литания Рун\n\n**Когда читают:** При нанесении рун на оружие и доспех.\n\n> О Железный Дух, позволь нанести священные руны на снаряжение.\n>\n> Пусть они станут его прозвищем.\n>\n> Пусть они станут источником его силы.\n>\n> Благослови эти руны и их владельца.\n\n### Литания Сбора\n\n**Когда читают:** При сборке доспехов, машин, трофеев, бионики, треллов, автоматонов, техно-воронов и оборудования.\n\n> Сойдитесь, оси, в синхронной точности.\n>\n> Пусть каждая часть механизма будет исправной.\n>\n> Благослови, Железный Дух, этот механизм.\n>\n> Да будет он цел и велик, как слава Железного Волка.\n\n### Литания Диагностики\n\n**Когда читают:** При чтении металла, на Обходе, при уходе за оружием, машинами и автоматонами. В бою читают только первую строку.\n\n> Всмотрись в металл, Дух огня и стали.\n>\n> Прочти изъяны, как строки саги.\n>\n> Яви, где таится сила и слабость.\n>\n> Да будет вердикт твой точен и свят.\n\n### Литания Разбора\n\n**Когда читают:** При разборе трофеев и сломанных механизмов, при Последнем Ударе, проводах машины, упокоении трелла и автоматона.\n\n> Милостью Железного Волка.\n>\n> Пусть все оси разойдутся.\n>\n> Пусть все крепления будут сняты.\n>\n> Да будет каждая деталь разобрана.\n\n### Литания Программирования\n\n**Когда читают:** При вводе новых команд, наказе треллу и автоматону, усмирении буйного духа, стирании трелла и настройке связи. Каждый наказ автоматону кончается Запретом Мыслящей Стали.\n\n> Пусть все твои коды будут переписаны.\n>\n> Пусть новые команды войдут в твою память.\n>\n> Да благословит твой код Дух Железа.\n>\n> И пусть твоя работа будет верной и точной.\n\n## Древние слова\n\nЧетыре главные литании Железные Жрецы читают вслух на древнем языке Фенриса: у горна, над машиной и перед боем. Перевод близок к литаниям выше, но не дословен.\n\n**Как читать древнескандинавский:**\n\n| Буква | Как читать | Пример |\n| --- | --- | --- |\n| þ | Глухое «с» с языком между зубами, как английское th в think | þú","title":"«сы» |","when":"","lines":[["ð","Звонкое «з» с языком между зубами, как th в this | Smíðarljóð — «смизарльоуз»"],["á, é, í, ó, ú","Долгие гласные: звук тянется | Járnúlfr — «йаарн-уульвр»"],["æ","Широкое «э» | sæll — «сээлль»"],["ö","«Ё» без «й» в начале, как в слове «мёд» | högg — «хёгг»"],["y, ý","«Ю» без «й», губы трубочкой | stýri — «стюри»"],["r в конце слова","Отчётливое раскатистое «р» | eiðr — «эйзр»"],["f между гласными","«В» | gefum — «гевум»"],["hv","«Хв» | hvert — «хверт»"]]},{"orig":"Elds-ljóð","title":"Литания Огня","when":"","lines":[["Vakna þú, villt hjarta elds.","Проснись, дикое сердце пламени."],["Rís þú ór svefni.","Воспрянь ото сна."],["Herð þú vápn vár í eldi þínum.","Закали наши орудия своим огнём."],["Gef oss reiði þína,","Даруй нам свою ярость,"],["en vér gefum þér mark!","а мы дадим тебе цель!"]]},{"orig":"Smíðarljóð","title":"Литания Ковки","when":"","lines":[["Heyr hamar minn, andi Járnúlfs.","Услышь мой молот, Дух Железного Волка."],["Heyr högg mín.","Услышь мои удары."],["Hvert högg sé eiðr,","Пусть каждый удар будет клятвой,"],["hverr hljómr orð í sögu þinni.","а каждый звон — словом твоей саги."],["Tak mynd ok ver oddr vilja míns!","Прими форму и будь остриём моей воли!"]]},{"orig":"Járnúlfsljóð","title":"Литания Железного Волка","when":"","lines":[["Heill sé Járnúlfi,","Слава Железному Волку,"],["er sefr í hjarta heims.","что спит в сердце мира."],["Reiði hans stýri höndum várum.","Пусть его ярость направляет наши руки."],["Stálvili hans styrki smíðir várar.","Пусть его стальная воля укрепляет наши творения."],["Frá eldi til stáls, frá stáli til sigrs.","От огня к стали, от стали к победе."]]},{"orig":"Bardagaljóð","title":"Литания Битвы","when":"","lines":[["Járnandi, ver oss skjöldr ok vápn.","Железный Дух, будь нам щитом и оружием."],["Falli fjándr fyrir höndum várum.","Пусть враги падут от наших рук."],["Gef oss sigr, Járnúlfr, í bardaga.","Даруй нам победу в битве, Железный Волк."],["Ok bregðisk eigi vápn vár.","И пусть наше оружие не подведёт."]]}],"songs":[{"orig":"Hamarsöngr","title":"Песнь Молота","when":"У наковальни, за работой. Каждая строка — серия ударов, и Ученики учатся ковать под неё.","lines":[["Högg ok högg,","Удар и удар,"],["eldr ok járn,","огонь и железо,"],["hvert högg eiðr,","каждый удар — клятва,"],["hverr neisti saga.","каждая искра — сага."],["Slá þú, hamarr,","Бей, молот,"],["Sofandi heyrir.","Спящий слышит."]]},{"orig":"Aflseiðr","title":"Клятва Горна","when":"В обряде Клятвы Горна. Ученик поёт её, держа правую ладонь над огнём, и не отводит руку до последнего слова.","lines":[["Fyrir hvert sverð, er ek gef,","За каждый меч, что я дам,"],["svara ek.","я отвечу."],["Fyrir hverja brynju, er ek bæti,","За каждый доспех, что я починю,"],["svara ek.","я отвечу."],["Bregðisk verk mitt bróður,","Если моя работа подведёт брата,"],["spyrji Sofandi mik.","пусть Спящий спросит с меня."]]},{"orig":"Svefnljóð Járnúlfs","title":"Колыбельная Спящего","when":"Когда жрецы спускаются в глубины под Клыком: перед Слушанием Спящего и перед тем, как открыть новую штольню.","lines":[["Sof þú, Járnúlfr, undir fjöllum.","Спи, Железный Волк, под горами."],["Fjöll eru feldr þinn,","Горы — твоя шкура,"],["málmr er blóð þitt.","руда — твоя кровь."],["Vér tökum lítt ok gjöldum.","Мы берём мало и платим."],["Vakna eigi, fyrr en þörf er.","Не просыпайся, пока нет нужды."]]},{"orig":"Vakningarljóð","title":"Песнь Пробуждения Духа","when":"При Пробуждении Духа, между тремя ударами молота по корпусу машины.","lines":[["Vakna þú, andi í járni,","Проснись, дух в железе,"],["heyr hamar minn þrisvar.","услышь мой молот трижды."],["Ek gaf þér líf,","Я дал тебе жизнь,"],["gef þú bræðrum mínum sigr.","дай моим братьям победу."]]},{"orig":"Steðjaljóð","title":"Песнь Наковальни","when":"В Ночь Молотов. Первые три строки поют над каждым оружием, которое вернулось с воином, и бьют по наковальне. Последнюю строку шепчут над тем, что подвело, и кладут молот беззвучно.","lines":[["Aptr kom öxin,","Вернулся топор,"],["aptr kom maðrinn.","вернулся воин."],["Eitt högg fyrir hvárt.","По удару за каждого."],["*Шёпотом:* Ekki kom aptr.","*Шёпотом:* Не вернулся."]]},{"orig":"Bálfararljóð smiðs","title":"Проводы Кузнеца","when":"На Проводах Железного Жреца, пока каждый жрец бьёт молотом по наковальне павшего.","lines":[["Kaldr er afl þinn,","Остыл твой горн,"],["heitt er stál þitt.","горяча твоя сталь."],["Í hverju sverði","В каждом мече"],["lifir þú enn.","ты живёшь до сих пор."]]}],"sagas":[{"orig":"Saga hins fyrsta afls","title":"Сага о Первом Горне","text":["Когда Всеотец дал воинам Русса доспехи со звёзд, первая же зима Фенриса оказалась им не по зубам. Сочленения схватывал лёд, уплотнения трескались, а воины застывали посреди боя, как статуи. Чужие мастера, прилетевшие со Всеотцом, сказали, что починить броню можно лишь на их красной планете, далеко за звёздами.","Тогда к Руссу пришёл Торбьёрн Глухой из Железных Мастеров. Глухим его прозвали за то, что в кузне он никого не слышал, кроме металла. Он попросил ночь и спустился в самые глубины под Клыком, туда, где камень тёплый. Там он лёг, прижав ухо к скале, и пролежал до утра.","Вернувшись, он ничего не стал объяснять. Он разобрал доспех, закалил новые сочленения во льду ледника, пролил швы смолой смоляной ели и собрал всё снова. Доспех, сделанный Торбьёрном, не замёрз ни в ту зиму, ни в одну из следующих.","Русс спросил, где он этому научился. Торбьёрн ответил: «Гора рассказала». Чужие мастера звали его с собой на красную планету учиться их тайнам. Торбьёрн отказался: «Зачем мне чужое небо, если со мной говорит собственная гора?»","С тех пор Железные Жрецы не летают учиться к чужим мастерам, а перед посвящением спускаются под Клык и слушают Спящего."]},{"orig":"Saga hljóðs höggs","title":"Сага о Беззвучном Ударе","text":["Железный Жрец Хальвард выковал топор для молодого Кровавого Когтя по имени Улль. В первом же бою топорище треснуло, и Улль пал. На Суде Наковальни Мастер Кузни прочёл металл, и вина оказалась на Хальварде: в металле был пузырь, которого он не заметил.","Хальвард не стал спорить. Он снова держал ладонь над горном, пока не прочёл всю Клятву, а потом год не подходил к наковальне. Когда год кончился, он выковал новый топор и поклялся не отдавать его никому, пока не найдёт воина, достойного носить его вместо Улля.","Каждую Ночь Молотов Хальвард клал молот на наковальню беззвучно, за топор Улля. Так прошло много зим. Однажды к нему пришёл аспирант, который только что вернулся из Испытания Моркаи, и сказал, что он из того же рода, что и Улль. Хальвард отдал ему топор.","В следующую Ночь Молотов топор вернулся вместе с воином. В ту ночь Хальвард впервые за много лет ударил по наковальне громко, и вся Кузня встала и ударила вместе с ним."]},{"orig":"Saga ísblaðs jarls","title":"Сага о Ледяном Клинке Ярла","text":["Один ярл пришёл к Мастеру Кузни за ледяным клинком и принёс мешок зубов кракена, купленных у островитян. Мастер Кузни высыпал зубы на пол и сказал: «Этим кракенам ты ничего не должен. Клинок из них тебя не узнает».","Ярл разозлился, но вышел в море сам. Он вернулся через месяц на разбитом драккаре, с зубами кракена в сумке и без левой руки, которую кракен забрал в уплату.","Мастер Кузни выковал ему ледяной топор из этих зубов. Потом он снял мерку с правой руки ярла и выковал ему левую из стали, ровно такую же: не сильнее и не легче той, что была. Ярл спросил, почему не сделать руку сильнее, раз уж её всё равно куют. Мастер ответил: «Сталь — продолжение плоти. Я верну тебе твою руку, а не дам чужую».","Говорят, ярл носил тот топор до самой смерти. А в Кузне с тех пор не принимают купленных зубов."]},{"orig":"Saga þræls er söng","title":"Сага о Трелле, что Пел","text":["Старого кэрла Гуннстейна сделали треллом, когда раны больше не позволили ему служить. Много лет он носил руду в Кузне, не говоря ни слова. Однажды Ученик Горна услышал, что трелл напевает. Это была сага о битве, которую рота проиграла задолго до рождения Ученика.","По обычаю такого трелла сразу отправляют на Упокоение. Но Железный Жрец Асгейр, хозяин трелла, сначала велел дать ему допеть. В саге была строка о дредноуте, который пал в той битве и остался во льдах. Где он пал, не знал никто из живых.","Асгейр записал сагу до последнего слова, и рота пошла туда, куда указала песня. Во льдах нашли дредноут, и в нём ещё теплилась жизнь. Героя разбудили, и он назвал своё имя.","Гуннстейна упокоили со всеми почестями. На Тризне его имя назвали первым, а Асгейр сам вырезал его бирку заново. С тех пор жрецы, прежде чем упокоить запевшего трелла, дают ему допеть."]}],"materials":[{"name":"Руда","rarity":1,"use":"Металл для всего. Жилы ищут по пятнам железной травы."},{"name":"Наросты круглорога","rarity":2,"use":"Каменные инзы для ауспексов и глаз автоматонов"},{"name":"Кость мамонта и бивни","rarity":1,"use":"Рукояти, накладки, лёгкие детали. Бивни идут на рычаги."},{"name":"Кость кита","rarity":2,"use":"Длинные упругие детали: древки, пружины, рёбра крыльев"},{"name":"Жилы лося","rarity":1,"use":"Нити для сшивания кожи и обмотки рукоятей"},{"name":"Шкура морского змея","rarity":3,"use":"Лучшая кожа, какую можно добыть без железа. Идёт на уплотнения и ремни доспехов."},{"name":"Панцирь телифона и хитин аракаса","rarity":2,"use":"Лёгкие пластины и изоляция"},{"name":"Китовый и тюлений жир","rarity":1,"use":"Смазка, которая не густеет на морозе"},{"name":"Волокна пепельника","rarity":1,"use":"Грубые верёвки и обмотка"},{"name":"Светляк","rarity":1,"use":"Грибной свет для штолен и для глаз Летучих Черепов"},{"name":"Череп фенрисийского волка","rarity":2,"use":"Основа Летучего Черепа. Берут только у волков, павших своей смертью."},{"name":"Керамит","rarity":2,"use":"Броня доспехов и автоматонов. Приходит со складов легиона и с трофеями."},{"name":"Пласталь","rarity":2,"use":"Корпуса, каркасы и механизмы. Со складов легиона и с трофеев."},{"name":"Адамантий","rarity":5,"use":"Редкий металл для сердец поля и лучших клинков. Почти только трофейный."},{"name":"Силовые ячейки","rarity":3,"use":"Сила для силовых узлов. Со складов легиона и с трофеев."}],"weapons":[{"name":"Силовой топор или меч","rarity":"○ Редкий","parts":"Клинок, рукоять, сердце поля, силовой кабель","who":"Кователь куёт, Железный Жрец ставит сердце"},{"name":"Громовой молот","rarity":"⭘ Престижный","parts":"Боёк молота, древко, сердце поля особой силы, силовой кабель","who":"Мастер Кузни"},{"name":"Смидёкс","rarity":"⭘ Престижный","parts":"Полое древко, клинок, боёк молота, сердце поля, силовой кабель","who":"Железный Жрец"},{"name":"Ледяной клинок","rarity":"◎ Раритетный, из костей ледяного кракена ⓪ Абсолютный","parts":"Клинок, ледяная кромка, сердце поля, рукоять","who":"Мастер Кузни"},{"name":"Хельфрост-пистолет","rarity":"◎ Раритетный","parts":"Ствол и затвор, Сердце Хельфроста, рукоять","who":"Мастер Кузни"},{"name":"Волкитное орудие","rarity":"◎ Раритетный","parts":"Волкитная камера, ствол и затвор, силовой кабель, крепление к механодендриту","who":"Мастер Кузни"}],"ice":[]}};

function hallToast(small, big, ms = 3000) {
  let t = hall.querySelector('.hall-toast');
  if (!t) { t = document.createElement('div'); t.className = 'hall-toast'; hall.appendChild(t); }
  t.style.setProperty('--bd', ms / 1000 + 's');
  t.innerHTML = `<small>${esc(small)}</small><b>${esc(big)}</b>`;
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(() => { t.classList.remove('on'); t.innerHTML = ''; }, ms + 100);
}
function openHall(kind) {
  const intro = $('#intro'), H = HALLS[kind];
  if (intro.classList.contains('opening')) return;
  intro.classList.add('opening');
  intro.querySelector(`.scroll[data-hall="${kind}"]`)?.classList.add('chosen');
  if (kind === 'wolf') soundWolfHall(); else soundIronHall();
  veilFlash(H.color, false);
  setTimeout(() => {
    intro.classList.add('gone');
    buildHall(kind);
    hall.hidden = false;
    requestAnimationFrame(() => hall.classList.add('shown'));
    startBed(H.bed);
  }, reduceMotion ? 0 : 320);
  setTimeout(() => { intro.hidden = true; intro.classList.remove('opening'); intro.querySelectorAll('.scroll').forEach(b => b.classList.remove('chosen')); }, 1000);
}
function closeHall(silent) {
  if (hall.hidden) return;
  closeHallGame();
  hall.classList.remove('shown');
  clearInterval(quoteTimer); cancelAnimationFrame(hallRaf); hallRaf = 0;
  setTimeout(() => { hall.hidden = true; hallShell.innerHTML = ''; hallKind = null; }, 500);

}

async function start() {

  sizeCosmos();
  sizeFx();
  sizeAmb();
  sizeTrans();
  resetAmb();
  makeFloaters();
  requestAnimationFrame(frame);
  addEventListener('resize', () => { sizeCosmos(); sizeFx(); sizeAmb(); sizeTrans(); if (reduceMotion) requestAnimationFrame(frame); });
  makeNodes();
  makePaths();
  paint();
  fitAll(false);
  await tick();
  scenes.tree.rendered = true;
  await renderTree();
}
